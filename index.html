    if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
  });

  // ============== ARCHIVE (admin) ==============
  document.getElementById('archiveBtn').addEventListener('click', async () => {
    if (!isAdmin) return;
    if (!confirm('Archive ALL current portfolios and homework artifacts and clear the live galleries? Old work stays accessible in Firestore as a snapshot and viewable from the Archives button.')) return;
    const note = (prompt('Optional cohort label (e.g. "April 2026 cohort"). Leave blank to skip.', '') || '').trim();
    try {
      const archiveId = new Date().toISOString().replace(/[:.]/g, '-');
      // Portfolios
      const pfSnap = await getDocs(collection(db, 'portfolios'));
      const artSnap = await getDocs(collection(db, 'artifacts'));
      if (pfSnap.empty && artSnap.empty) { alert('Nothing to archive.'); return; }

      const copies = [];
      pfSnap.forEach(d => copies.push(setDoc(doc(db, 'archives', archiveId, 'portfolios', d.id), d.data())));
      artSnap.forEach(d => copies.push(setDoc(doc(db, 'archives', archiveId, 'artifacts', d.id), d.data())));
      await Promise.all(copies);

      // Write parent metadata doc — used by the archive viewer's list page.
      const studentNames = new Set();
      pfSnap.forEach(d => { const n = d.data().studentName; if (n) studentNames.add(n.trim().toLowerCase()); });
      artSnap.forEach(d => { const n = d.data().studentName; if (n) studentNames.add(n.trim().toLowerCase()); });
      await setDoc(doc(db, 'archives', archiveId), {
        archivedAt: serverTimestamp(),
        portfolioCount: pfSnap.size,
        artifactCount: artSnap.size,
        studentCount: studentNames.size,
        note: note || ''
      });

      const deletes = [];
      pfSnap.forEach(d => {
        const data = d.data();
        const slots = data.slots || {};
        Object.values(slots).forEach(s => {
          if (s && s.mode === 'file' && s.filePath) {
            deletes.push(deleteObject(storageRef(storage, s.filePath)).catch(() => {}));
          }
        });
        deletes.push(deleteDoc(doc(db, 'portfolios', d.id)));
      });
      artSnap.forEach(d => {
        const data = d.data();
        if (data.filePath) {
          deletes.push(deleteObject(storageRef(storage, data.filePath)).catch(() => {}));
        }
        deletes.push(deleteDoc(doc(db, 'artifacts', d.id)));
      });
      await Promise.all(deletes);
      // Refresh visible count badges (now zero for everything).
      Object.keys(countEls).forEach(bid => updateCountBadge(bid, 0));
      alert(`Archived ${pfSnap.size} portfolios and ${artSnap.size} homework artifacts to archives/${archiveId}.`);
    } catch (err) {
      console.error(err);
      alert('Archive failed. Check console.');
    }
  });

  // ============== ARCHIVE VIEWER (admin) ==============
  // Per-session cache so re-opening an archive doesn't re-fetch.
  const _archiveCache = new Map(); // archiveId -> { portfolios: [...], meta: {...} }

  function fmtArchiveDate(d) {
    if (!d) return '';
    try {
      const dt = (d.toDate && d.toDate()) || d;
      return dt.toISOString().slice(0, 10);
    } catch (_) { return String(d); }
  }
  function archiveTitleFor(meta, archiveId) {
    if (meta?.note) return meta.note;
    // Fall back to the readable date portion of the archiveId
    return `Archive ${archiveId.slice(0, 10)}`;
  }

  async function openArchivesList() {
    if (!isAdmin) return;
    currentBenchmark = null;
    modalTitle.textContent = 'Class Archives';
    modalPoints.style.display = 'none';
    modalBody.classList.remove('is-hw');
    modalBody.innerHTML = `
      <div class="modal-section">
        <p style="color:var(--paper-ink-mid);font-size:14px;margin-bottom:18px;">
          Read-only snapshots from previous cohorts. Click any archive to browse it.
        </p>
        <div class="archive-list" id="archiveList">
          <div class="archive-list-empty">Loading archives…</div>
        </div>
      </div>
    `;
    // Tear down any open live listeners first.
    if (unsubscribeGallery) { unsubscribeGallery(); unsubscribeGallery = null; }
    if (unsubscribePortfolios) { unsubscribePortfolios(); unsubscribePortfolios = null; }
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';

    const listEl = document.getElementById('archiveList');
    try {
      // Fetch parent docs only — no subcollection scans.
      const archivesSnap = await getDocs(collection(db, 'archives'));
      const items = [];
      archivesSnap.forEach(d => {
        const data = d.data() || {};
        // Only include docs that look like a metadata doc (has archivedAt).
        // Older archives may not have a parent doc — surface them too with a synthetic stub.
        items.push({ id: d.id, ...data });
      });
      // Sort newest first by archiveId (ISO-ish string sorts naturally).
      items.sort((a, b) => (b.id || '').localeCompare(a.id || ''));

      if (!items.length) {
        listEl.innerHTML = `<div class="archive-list-empty">No archives yet.</div>`;
        return;
      }

      listEl.innerHTML = '';
      items.forEach(item => {
        const date = item.archivedAt ? fmtArchiveDate(item.archivedAt) : item.id.slice(0, 10);
        const title = archiveTitleFor(item, item.id);
        const meta = [
          item.studentCount != null ? `${item.studentCount} students` : null,
          item.portfolioCount != null ? `${item.portfolioCount} portfolios` : null,
          item.artifactCount != null ? `${item.artifactCount} homework` : null
        ].filter(Boolean).join(' · ');
        const row = document.createElement('div');
        row.className = 'archive-list-item';
        row.innerHTML = `
          <div class="archive-info">
            <div class="archive-title">${escapeHtml(title)}</div>
            <div class="archive-meta">archived ${escapeHtml(date)}${meta ? ' — ' + escapeHtml(meta) : ''}</div>
          </div>
          <span class="archive-caret">▶</span>
        `;
        row.addEventListener('click', () => openArchiveDetail(item.id, item));
        listEl.appendChild(row);
      });
    } catch (err) {
      console.error('archive list failed', err);
      listEl.innerHTML = `<div class="archive-list-empty">Could not load archives.</div>`;
    }
  }

  async function openArchiveDetail(archiveId, metaHint) {
    if (!isAdmin) return;
    currentBenchmark = null;
    modalTitle.textContent = archiveTitleFor(metaHint || {}, archiveId);
    modalPoints.style.display = 'none';
    modalBody.classList.remove('is-hw');
    modalBody.innerHTML = `
      <div class="modal-section">
        <div class="archive-banner">
          <span class="archive-banner-tag">Archive</span>
          <span>Read-only snapshot. ${escapeHtml(fmtArchiveDate(metaHint?.archivedAt) || archiveId.slice(0, 10))}</span>
          <div class="archive-banner-actions">
            <button type="button" data-archive-back>← All archives</button>
            <button type="button" class="btn-restore" data-archive-restore>Restore to live</button>
          </div>
        </div>
        <div id="archiveDetail">
          <div class="pf-gallery-empty">Loading…</div>
        </div>
      </div>
    `;
    // Update URL deep link.
    try {
      const sp = new URLSearchParams(location.search);
      sp.set('admin', ADMIN_TOKEN);
      sp.set('archive', archiveId);
      history.replaceState(null, '', `${location.pathname}?${sp.toString()}`);
    } catch (_) {}

    modalBody.querySelector('[data-archive-back]').addEventListener('click', () => {
      // Clear the deep link param when going back to the list.
      try {
        const sp = new URLSearchParams(location.search);
        sp.delete('archive');
        history.replaceState(null, '', `${location.pathname}?${sp.toString()}`);
      } catch (_) {}
      openArchivesList();
    });
    modalBody.querySelector('[data-archive-restore]').addEventListener('click', () => restoreArchive(archiveId));

    if (!modal.classList.contains('open')) {
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    const detailEl = document.getElementById('archiveDetail');
    try {
      let cached = _archiveCache.get(archiveId);
      if (!cached) {
        // One-time getDocs — no live listener for archives.
        const pfSnap = await getDocs(collection(db, 'archives', archiveId, 'portfolios'));
        const portfolios = [];
        pfSnap.forEach(d => portfolios.push({ id: d.id, ...d.data() }));
        cached = { portfolios, meta: metaHint || null };
        _archiveCache.set(archiveId, cached);
      }
      const portfolios = cached.portfolios;

      detailEl.innerHTML = '';
      // Group archived portfolios by benchmarkId, render in PROJECTS order.
      const byBenchmark = {};
      portfolios.forEach(p => {
        const bid = p.benchmarkId || '_unbound';
        (byBenchmark[bid] = byBenchmark[bid] || []).push(p);
      });

      let renderedAny = false;
      PROJECTS.forEach(project => {
        const projHasContent = project.benchmarks.some(b => byBenchmark[b.id]?.length);
        if (!projHasContent) return;
        renderedAny = true;
        const projSec = document.createElement('section');
        projSec.className = 'project';
        projSec.style.marginBottom = '32px';
        projSec.innerHTML = `<h2 class="project-title">${escapeHtml(project.title)}</h2>`;
        const benchWrap = document.createElement('div');
        benchWrap.className = 'benchmarks';
        project.benchmarks.forEach(b => {
          const bucket = byBenchmark[b.id] || [];
          if (!bucket.length) return;
          const wrapper = document.createElement('div');
          wrapper.style.cssText = 'display:flex;flex-direction:column;gap:8px;margin-bottom:18px;';
          wrapper.innerHTML = `
            <div style="font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-mid);">
              ${escapeHtml(b.title)} — ${bucket.length} portfolio${bucket.length === 1 ? '' : 's'}
            </div>
            <div class="pf-gallery"></div>
          `;
          const grid = wrapper.querySelector('.pf-gallery');
          // Sort alphabetically as in the live view.
          bucket.sort((a, b) => (a.studentName || '').localeCompare(b.studentName || '', undefined, { sensitivity: 'base' }));
          renderPortfolioGallery(grid, bucket, { readOnly: true });
          benchWrap.appendChild(wrapper);
        });
        projSec.appendChild(benchWrap);
        detailEl.appendChild(projSec);
      });

      if (!renderedAny) {
        detailEl.innerHTML = `<div class="pf-gallery-empty">This archive has no portfolios.</div>`;
      }
    } catch (err) {
      console.error('archive detail failed', err);
      detailEl.innerHTML = `<div class="pf-gallery-empty">Could not load this archive.</div>`;
    }
  }

  async function restoreArchive(archiveId) {
    if (!isAdmin) return;
    if (!confirm(
      'Restore this archive\'s portfolios to the LIVE collection? This is for accidental archives only — it copies docs back to /portfolios. Proceed?'
    )) return;
    try {
      const cached = _archiveCache.get(archiveId);
      let portfolios = cached?.portfolios;
      if (!portfolios) {
        const pfSnap = await getDocs(collection(db, 'archives', archiveId, 'portfolios'));
        portfolios = [];
        pfSnap.forEach(d => portfolios.push({ id: d.id, ...d.data() }));
      }
      if (!portfolios.length) { alert('Nothing to restore.'); return; }

      // Strip the archive doc id and write a fresh doc in /portfolios with a
      // new server timestamp. We DO preserve all slot data including the
      // existing fileUrl pointers (Storage objects were left in place since
      // archive doesn't move blobs — they were deleted on archive though, so
      // file-mode slots may now be broken; the read-side renders a friendly
      // placeholder for those).
      const writes = [];
      portfolios.forEach(p => {
        const { id, createdAt, ...rest } = p;
        writes.push(addDoc(collection(db, 'portfolios'), {
          ...rest,
          createdAt: serverTimestamp()
        }));
      });
      await Promise.all(writes);
      // Refresh count badges so admin sees the restore reflected.
      const benchIds = new Set(portfolios.map(p => p.benchmarkId).filter(Boolean));
      benchIds.forEach(bid => refreshCountBadge(bid));
      alert(`Restored ${portfolios.length} portfolios to live. Note: archived files (storage blobs) were deleted at archive time, so file-mode slots may show "(file unavailable)".`);
    } catch (err) {
      console.error('restore failed', err);
      alert('Restore failed. Check console.');
    }
  }

  if (isAdmin) {
    document.getElementById('archivesViewBtn').addEventListener('click', openArchivesList);
  }

  // ============== VIBE CODING TOOL ==============
  // Two-panel chat-driven Arduino code workbench. Talks to /api/vibe-code
  // (Anthropic proxy with class-code gate). Right panel is a CodeMirror
  // editor + Web Serial monitor. Pass 2: copy-to-clipboard upload flow.

  const VIBE_CHAT_KEY = 'd4sg-vibe-chat-v1';
  const VIBE_EDITOR_KEY = 'd4sg-vibe-editor-v1';
  const VIBE_CLASSCODE_KEY = 'd4sg-vibe-classcode-v1';
  const VIBE_DEFAULT_CODE = '// Your Arduino code will appear here.\n// Ask the assistant on the left for help, then click "Copy to Editor".\n\nvoid setup() {\n  Serial.begin(9600);\n}\n\nvoid loop() {\n}\n';

  let _vibeChat = [];         // [{ role: 'user'|'assistant'|'error', content: string }]

      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch (_) { return []; }
  }

    try { localStorage.setItem(VIBE_CHAT_KEY, JSON.stringify(_vibeChat)); } catch (_) {}

  function vibeLoadEditorText() {

  function vibeLoadCodeMirror() {
    if (window.CodeMirror) return Promise.resolve();
    const cssHref = 'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css';
    if (!document.querySelector('link[data-vibe-cm]')) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = cssHref;
      link.setAttribute('data-vibe-cm', '1');
      document.head.appendChild(link);
    }
    const loadScript = (src) => new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('Failed to load ' + src));
      document.head.appendChild(s);
    });
    return loadScript('https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js')
      .then(() => loadScript('https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/clike/clike.min.js'));
  }

  // Lazy-load jsPDF on first export.
  function vibeLoadJsPdf() {
    if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('Failed to load jsPDF'));
      document.head.appendChild(s);
    });
  }

  // Build the jsPDF doc from current editor text. Throws if editor is empty.
  // Used by the "+ Save to..." popover to drop a PDF into a benchmark slot.
  async function vibeBuildPdfDoc() {
    const txt = vibeGetEditorText();
    if (!txt || !txt.trim()) throw new Error('empty');
    await vibeLoadJsPdf();
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'letter' });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const marginX = 48;
    const marginY = 56;
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(14);
    doc.text('Arduino Sketch', marginX, marginY);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(120);
    const stamp = new Date().toLocaleString();
    doc.text(stamp, pageW - marginX, marginY, { align: 'right' });
    doc.setTextColor(0);
    doc.setFont('courier', 'normal');
    doc.setFontSize(10);
    const lineHeight = 13;
    const wrappedLines = [];
    txt.split('\n').forEach(line => {
      const fitted = doc.splitTextToSize(line || ' ', pageW - marginX * 2);
      fitted.forEach(l => wrappedLines.push(l));
    });
    let y = marginY + 28;
    wrappedLines.forEach(line => {
      if (y + lineHeight > pageH - marginY) {
        doc.addPage();
        y = marginY;
      }
      doc.text(line, marginX, y);
      y += lineHeight;
    });
    return doc;
  }

  async function vibeBuildPdfBlob() {
    const doc = await vibeBuildPdfDoc();
    return doc.output('blob');
  }

  function vibeRenderChat() {
    const scroll = document.getElementById('vibeChatScroll');
    if (!scroll) return;
    if (!_vibeChat.length && !_vibeBusy) {
      scroll.innerHTML = `
        <div class="vibe-chat-empty">
          <strong>Pick a template below, then type your request.</strong>
        </div>
      `;
      return;
    }
    scroll.innerHTML = '';
    const _row = (avatarKind, msgClass) => {
      const row = document.createElement('div');
      row.className = `vibe-msg-row is-${avatarKind}`;
      const av = document.createElement('div');
      av.className = `vibe-msg-avatar is-${avatarKind}`;
      av.textContent = avatarKind === 'user' ? 'You' : 'AI';
      const msg = document.createElement('div');
      msg.className = `vibe-msg ${msgClass}`;
      row.appendChild(av);
      row.appendChild(msg);
      return { row, msg };
    };

    _vibeChat.forEach((msg) => {
      if (msg.role === 'user') {
        const { row, msg: el } = _row('user', 'vibe-msg-user');
        el.textContent = msg.content;
        scroll.appendChild(row);
      } else if (msg.role === 'assistant') {
        const { row, msg: el } = _row('ai', 'vibe-msg-ai');
        const intro = document.createElement('div');
        intro.style.fontSize = '13px';
        intro.style.color = 'var(--ink-mid)';
        intro.textContent = 'Loaded into your editor.';
        const pre = document.createElement('pre');
        pre.className = 'vibe-msg-codepreview';
        pre.textContent = msg.content;
        el.appendChild(intro);
        el.appendChild(pre);
        scroll.appendChild(row);
      } else if (msg.role === 'error') {
        const { row, msg: el } = _row('ai', 'vibe-msg-error');
        el.textContent = msg.content;
        scroll.appendChild(row);
      }
    });
    if (_vibeBusy) {
      const { row, msg: el } = _row('ai', 'vibe-msg-loading');
      el.textContent = 'Generating...';
      row.classList.add('is-loading');
      scroll.appendChild(row);
    }
    scroll.scrollTop = scroll.scrollHeight;

  // ----- Prompt starters -----

  function vibeRenderStems() {
    const wrap = document.getElementById('vibeStems');
    if (!wrap) return;
    wrap.innerHTML = '';
    VIBE_STEMS.forEach(stem => {
      const btn = document.createElement('button');
      btn.className = 'vibe-stem' + (stem.primary ? ' vibe-stem--primary' : '');
      btn.type = 'button';
      btn.innerHTML = `<span class="vibe-stem-icon">✦</span><span>${stem.label}</span>`;
      btn.title = stem.text.length > 80 ? stem.text.slice(0, 77) + '...' : stem.text;

  function vibeApplyStem(stem) {
    const inp = document.getElementById('vibeInput');
    if (!inp) return;
    // Build innerHTML with two spans: template scaffold (muted/italic) and
    // user-input portion (accent color, bold). The placeholder text starts
    // selected so the student types over it; their characters land inside
    // the .vibe-input-user span and inherit its styling.
    const placeholder = stem.placeholder || '';
    const text = stem.text || '';
    const idx = placeholder ? text.indexOf(placeholder) : -1;
    inp.innerHTML = '';
    const escape = (s) => s
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    if (idx >= 0) {
      const before = text.slice(0, idx);
      const after = text.slice(idx + placeholder.length);
      inp.innerHTML =
        `<span class="vibe-input-template">${escape(before)}</span>` +
        `<span class="vibe-input-user">${escape(placeholder)}</span>` +
        `<span class="vibe-input-template">${escape(after)}</span>`;
    } else {
      inp.innerHTML = `<span class="vibe-input-template">${escape(text)}</span>`;
    }
    inp.focus();
    // Select the user-input span's text so the student types over it cleanly.
    const userSpan = inp.querySelector('.vibe-input-user');
    if (userSpan) {
      const range = document.createRange();
      range.selectNodeContents(userSpan);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }

  // ----- Libraries strip + status bar -----
  const VIBE_QUICK_LIBS = ['Keyboard.h', 'Mouse.h', 'Joystick.h', 'Servo.h'];

  function vibeDetectIncludes() {
    const txt = vibeGetEditorText();
    const found = [];
    const re = /^\s*#\s*include\s*[<"]([^>"]+)[>"]/gm;
    let m;
    while ((m = re.exec(txt)) !== null) {
      const lib = m[1].trim();
      if (lib && !found.includes(lib)) found.push(lib);
    }
    return found;
  }

  function vibeUpdateLibraries() {
    const active = document.getElementById('vibeLibsActive');
    if (!active) return;
    const includes = vibeDetectIncludes();
    active.innerHTML = '';
    if (!includes.length) {
      const empty = document.createElement('span');
      empty.className = 'vibe-libs-chip is-empty';
      empty.textContent = 'no libraries included';
      active.appendChild(empty);
    } else {
      includes.forEach(lib => {
        const chip = document.createElement('span');
        chip.className = 'vibe-libs-chip';
        chip.textContent = `<${lib}>`;
        active.appendChild(chip);
      });
    }
    document.querySelectorAll('.vibe-libs-add button').forEach(btn => {
      btn.disabled = includes.includes(btn.dataset.lib);
    });
  }

  function vibeAddLibrary(lib) {
    const txt = vibeGetEditorText();
    if (new RegExp(`#\\s*include\\s*[<"]${lib.replace(/\./g, '\\.')}[>"]`).test(txt)) return;
    const inc = `#include <${lib}>\n`;
    // Insert after any existing #include block, otherwise at the very top.
    const lines = txt.split('\n');
    let lastInclude = -1;
    for (let i = 0; i < lines.length; i++) {
      if (/^\s*#\s*include/.test(lines[i])) lastInclude = i;
    }
    if (lastInclude >= 0) {
      lines.splice(lastInclude + 1, 0, `#include <${lib}>`);
    } else {
      lines.unshift(`#include <${lib}>`);
    }
    const next = lines.join('\n');
    vibeSetEditorText(next);
    vibeSaveEditorText(next);
    vibeUpdateLibraries();
  }

  function vibeSend() {
    if (_vibeBusy) return;
    const inputEl = document.getElementById('vibeInput');
    // Read plain text from the contenteditable (was a textarea before).
    const txt = ((inputEl.textContent != null ? inputEl.textContent : inputEl.value) || '').trim();
    if (!txt) return;

    _vibeChat.push({ role: 'user', content: txt });
    vibeSaveChat();
    inputEl.innerHTML = '';
    inputEl.textContent = '';
    _vibeBusy = true;
    document.getElementById('vibeSend').disabled = true;
    vibeRenderChat();

    // Build a short history (last 6 messages, excluding errors).
    const history = _vibeChat
      .filter(m => m.role === 'user' || m.role === 'assistant')
      .slice(-7, -1) // exclude the just-added user message
      .map(m => ({ role: m.role, content: m.content }));

    fetch('/api/vibe-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt: txt,
        history
      })
    }).then(async (r) => {
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        const errMsg = data.error || ('Server error ' + r.status);
        _vibeChat.push({ role: 'error', content: 'Something went wrong, try again. (' + errMsg + ')' });
      } else {
        const code = (data.code || '').trim();
        if (code) {
          _vibeChat.push({ role: 'assistant', content: code });
          // Auto-paste the latest response into the IDE every time, so the
          // editor always reflects the freshest generation. Detect libraries
          // for the strip too.
          vibeSetEditorText(code);
          vibeSaveEditorText(code);
          vibeUpdateLibraries();
        } else {
          _vibeChat.push({ role: 'error', content: 'The assistant did not return any code.' });
        }
      }
      vibeSaveChat();
      _vibeBusy = false;
      document.getElementById('vibeSend').disabled = false;
      vibeRenderChat();
    }).catch((err) => {
      _vibeChat.push({ role: 'error', content: 'Something went wrong, try again. (' + (err.message || err) + ')' });
      vibeSaveChat();
      _vibeBusy = false;
      const sendBtn = document.getElementById('vibeSend');
      if (sendBtn) sendBtn.disabled = false;
      vibeRenderChat();

  // ============== Verify + Upload (Arduino IDE-style) ==============
  // Verify: POST sketch to /api/compile (Wokwi hexi proxy) — show stdout/stderr
  //   in the serial monitor, like Arduino IDE's bottom pane.
  // Upload: compile the same way, parse the resulting Intel HEX, then flash
  //   it to a connected Leonardo / Micro using AVR109 (Caterina bootloader)
  //   over Web Serial. The 1200-baud "knock" reboots the board into the
  //   bootloader, which appears as a NEW USB serial port; we wait for that
  //   port via the navigator.serial 'connect' event, open it, and stream
  //   pages of flash. After flashing we 'L' (leave) and 'E' (exit), the
  //   sketch port reappears, and we can reconnect the monitor.
  //
  //   Web Serial requires user permission once per port. First time a
  //   student uploads, the bootloader port may need a manual pick from the
  //   browser's port picker. Subsequent uploads find it via getPorts().

  // Arduino USB vendor ID (used for picker filters and getPorts matching).
  const ARDUINO_USB_VID = 0x2341;
  // Tracks whether the user had the monitor open before we started flashing,
  // so we can auto-reconnect after the upload finishes.
  let _vibeWasMonitoring = false;

  function vibeMonitorLine(text, kind) {
    const m = document.getElementById('vibeMonitor');
    if (!m) return;
    const empty = m.querySelector('.vibe-monitor-empty');
    if (empty) empty.remove();
    const line = document.createElement('div');
    line.style.whiteSpace = 'pre-wrap';
    if (kind === 'ok')   line.style.color = '#4ade80';
    if (kind === 'err')  line.style.color = '#f87171';
    if (kind === 'info') line.style.color = '#93c5fd';
    if (kind === 'dim')  line.style.color = '#94a3b8';
    line.textContent = text;
    m.appendChild(line);
    m.scrollTop = m.scrollHeight;
  }

  async function vibeCompileSketch(sketch) {
    const r = await fetch('/api/compile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sketch, board: 'leonardo' })
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      throw new Error(data.error || ('compile HTTP ' + r.status));
    }
    return data; // { hex, stdout, stderr, board }
  }

  async function vibeVerifyCode() {
    const sketch = vibeGetEditorText();
    if (!sketch || !sketch.trim()) {
      schemToast('Editor is empty. Generate or paste code first.', 2400);
      return;

    const btn = document.getElementById('vibeVerify');

      if (data.stdout) vibeMonitorLine(data.stdout.trimEnd(), 'dim');
      if (data.hex) {
        vibeMonitorLine('[ ✓ Compile succeeded ]', 'ok');
      } else {
        if (data.stderr) vibeMonitorLine(data.stderr.trimEnd(), 'err');
        vibeMonitorLine('[ ✗ Verify failed ]', 'err');
      }
    } catch (err) {
      vibeMonitorLine('[ Verify error: ' + (err.message || err) + ' ]', 'err');
    } finally {

      btn.classList.remove('is-active');

  async function vibeUploadToArduino() {
    const sketch = vibeGetEditorText();
    if (!sketch || !sketch.trim()) {
      schemToast('Editor is empty. Generate or paste code first.', 2400);
      return;
    }
    if (!('serial' in navigator)) {
      vibeMonitorLine('Web Serial not supported. Use Chrome or Edge on a desktop.', 'err');
      return;
    }
    const btn = document.getElementById('vibeUpload');
    btn.disabled = true;
    btn.classList.add('is-active');

    // 1. Compile.
    let hexText;
    vibeMonitorLine('[ Compiling… ]', 'info');
    try {
      const data = await vibeCompileSketch(sketch);
      if (data.stdout) vibeMonitorLine(data.stdout.trimEnd(), 'dim');
      if (!data.hex) {
        if (data.stderr) vibeMonitorLine(data.stderr.trimEnd(), 'err');
        vibeMonitorLine('[ ✗ Compile failed — fix errors above and try again ]', 'err');
        return;
      }
      hexText = data.hex;
    } catch (err) {
      vibeMonitorLine('[ Compile error: ' + (err.message || err) + ' ]', 'err');
      return;
    } finally {
      // Reactivated after the upload step (or on early return).
      if (btn.disabled === false) { btn.classList.remove('is-active'); }
    }

    vibeMonitorLine('[ ✓ Compiled. Resetting board into bootloader… ]', 'info');

    // 2. Flash.
    try {
      _vibeWasMonitoring = !!_vibeSerialPort;
      const hexBytes = parseIntelHex(hexText);
      await vibeFlashHexToArduino(hexBytes);
      vibeMonitorLine('[ ✓ Upload complete ]', 'ok');
      // Reopen the serial monitor for sketch output.
      setTimeout(() => {
        if (_vibeWasMonitoring) {
          vibeReconnectSketchPort();
        } else {
          vibeMonitorLine('Click the monitor icon to watch Serial output.', 'dim');
        }
      }, 1500);
    } catch (err) {
      vibeMonitorLine('[ Upload error: ' + (err.message || err) + ' ]', 'err');
      vibeMonitorLine('Tip: unplug + replug the board and try again. Make sure no other app (like Arduino IDE) has the port open.', 'dim');
    } finally {
      btn.disabled = false;
      btn.classList.remove('is-active');
    }
  }

  // ---- Intel HEX parser ----
  // Parses standard Intel HEX (the format Arduino .hex files use). Returns a
  // Uint8Array with bytes laid out at their flash addresses, padded with 0xFF.
  function parseIntelHex(hexText) {
    const lines = hexText.split(/\r?\n/);
    const recs = [];
    let extAddr = 0;
    let maxAddr = 0;
    for (const line of lines) {
      if (!line.startsWith(':')) continue;
      const len  = parseInt(line.substr(1, 2), 16);
      const addr = parseInt(line.substr(3, 4), 16);
      const type = parseInt(line.substr(7, 2), 16);
      if (type === 0x00) {
        const data = new Uint8Array(len);
        for (let i = 0; i < len; i++) data[i] = parseInt(line.substr(9 + i * 2, 2), 16);
        const fullAddr = extAddr + addr;
        recs.push({ addr: fullAddr, data });
        if (fullAddr + len > maxAddr) maxAddr = fullAddr + len;
      } else if (type === 0x02) {
        extAddr = parseInt(line.substr(9, 4), 16) << 4;
      } else if (type === 0x04) {
        extAddr = parseInt(line.substr(9, 4), 16) << 16;
      } else if (type === 0x01) {
        break;
      }
    }
    const buf = new Uint8Array(maxAddr);
    buf.fill(0xFF);
    for (const rec of recs) buf.set(rec.data, rec.addr);
    return buf;
  }

  // ---- Web Serial AVR109 (Caterina) flash ----
  // Procedure (Leonardo/Micro):
  //   1. Open the currently-known sketch port at 1200 baud and immediately
  //      close it. The Caterina sketch USB stack sees this and triggers a
  //      watchdog reset, jumping into the bootloader. The bootloader then
  //      enumerates as a NEW USB CDC device (different VID/PID).
  //   2. Wait for navigator.serial 'connect' to fire with the new port (or
  //      poll getPorts as a fallback). If we've never seen it, prompt the
  //      user with requestPort() filtered to the Arduino vendor.
  //   3. Open the bootloader port and run AVR109:
  //        S — programmer ID (7 bytes, "CATERIN")
  //        T 0x44 — select device (m32u4)
  //        P — enter programming mode
  //        e — chip erase
  //        for each 128-byte page:
  //          A addrH addrL — set word address
  //          B 0x00 0x80 0x46 + 128 bytes — write block (memtype 'F' = flash)
  //        L — leave programming mode
  //        E — exit bootloader (board reboots back into the new sketch)
  async function vibeFlashHexToArduino(hexBytes) {
    // Snapshot the ports we already had access to so we can spot the new
    // bootloader port that appears after the 1200-baud knock.
    const beforePorts = await navigator.serial.getPorts();

    // Knock the current sketch port down to the bootloader.
    let knockedPort = _vibeSerialPort;
    if (!knockedPort) {
      // No active connection. Try a previously-granted Arduino port; if none,
      // ask the user to pick one (so we can knock it).
      const prior = beforePorts.find(p => (p.getInfo() || {}).usbVendorId === ARDUINO_USB_VID);
      if (prior) {
        knockedPort = prior;
      } else {
        try {
          knockedPort = await navigator.serial.requestPort({
            filters: [{ usbVendorId: ARDUINO_USB_VID }]
          });
        } catch (_) {
          throw new Error('No Arduino selected.');
        }
      }
    } else {
      // Stop the read loop and release the port before we touch it.
      await vibeDisconnectSerial();
    }

    // Open at 1200 then close — that's the magic reset signal.
    try {
      await knockedPort.open({ baudRate: 1200 });
      // Tiny delay so the host sees the open before we close.
      await new Promise(r => setTimeout(r, 50));
      await knockedPort.close();
    } catch (err) {
      // If the port was already closed by the disconnect above, that's fine.
      if (!String(err).includes('closed')) {
        throw new Error('Could not reset board: ' + (err.message || err));
      }
    }

    // 2. Wait for the bootloader port to appear.
    const beforeKey = (p) => {
      const i = p.getInfo() || {};
      return (i.usbVendorId || 0) + ':' + (i.usbProductId || 0);
    };
    const beforeKeys = new Set(beforePorts.map(beforeKey));

    const bootloaderPort = await new Promise((resolve, reject) => {
      let resolved = false;
      const onConnect = (ev) => {
        if (resolved) return;
        const p = ev.target || ev.port;
        if (!p) return;
        const info = p.getInfo() || {};
        if (info.usbVendorId !== ARDUINO_USB_VID) return;
        resolved = true;
        cleanup();
        resolve(p);
      };
      const cleanup = () => {
        navigator.serial.removeEventListener('connect', onConnect);
        clearInterval(poll);
        clearTimeout(timeout);
      };
      // Poll getPorts() in parallel — 'connect' only fires for ports the
      // user previously authorized. On first upload the new bootloader VID/PID
      // hasn't been authorized, so we fall back to manual requestPort below.
      const poll = setInterval(async () => {
        if (resolved) return;
        const ports = await navigator.serial.getPorts();
        for (const p of ports) {
          const info = p.getInfo() || {};
          if (info.usbVendorId !== ARDUINO_USB_VID) continue;
          if (!beforeKeys.has(beforeKey(p))) {
            resolved = true;
            cleanup();
            resolve(p);
            return;
          }
        }
      }, 250);
      navigator.serial.addEventListener('connect', onConnect);
      const timeout = setTimeout(async () => {
        if (resolved) return;
        cleanup();
        // Last resort: ask the user to pick the bootloader port.
        try {
          vibeMonitorLine('Pick the Arduino bootloader port (it usually shows up as "Arduino Leonardo bootloader" or similar).', 'info');
          const p = await navigator.serial.requestPort({
            filters: [{ usbVendorId: ARDUINO_USB_VID }]
          });
          resolve(p);
        } catch (e) {
          reject(new Error('Bootloader port did not appear within 6s.'));
        }
      }, 6000);
    });

    // Caterina runs USB CDC; baud rate is ignored. 57600 is conventional.
    await bootloaderPort.open({ baudRate: 57600 });
    try {
      await avr109WriteFlash(bootloaderPort, hexBytes, (msg, kind) => vibeMonitorLine(msg, kind));
    } finally {
      try { await bootloaderPort.close(); } catch (_) {}
    }
  }

  // Talk AVR109 (Atmel butterfly bootloader protocol) over the open port.
  async function avr109WriteFlash(port, hexBytes, log) {
    const writer = port.writable.getWriter();
    const reader = port.readable.getReader();
    let leftover = new Uint8Array(0);

    const writeBytes = async (data) => {
      const arr = (data instanceof Uint8Array) ? data
                : (typeof data === 'string') ? new TextEncoder().encode(data)
                : new Uint8Array(data);
      await writer.write(arr);
    };
    const readN = async (n, timeoutMs = 4000) => {
      if (leftover.length >= n) {
        const out = leftover.slice(0, n);
        leftover = leftover.slice(n);
        return out;
      }
      const out = new Uint8Array(n);
      let read = 0;
      if (leftover.length) {
        out.set(leftover, 0);
        read = leftover.length;
        leftover = new Uint8Array(0);
      }
      const deadline = Date.now() + timeoutMs;
      while (read < n) {
        const remaining = deadline - Date.now();
        if (remaining <= 0) throw new Error('AVR109 read timeout');
        const result = await Promise.race([
          reader.read(),
          new Promise((res) => setTimeout(() => res({ value: null, done: false }), remaining))
        ]);
        if (result.done) throw new Error('AVR109 stream closed');
        if (!result.value) throw new Error('AVR109 read timeout');
        const v = result.value;
        const need = n - read;
        if (v.length <= need) {
          out.set(v, read);
          read += v.length;
        } else {
          out.set(v.subarray(0, need), read);
          leftover = v.slice(need);
          read = n;
        }
      }
      return out;
    };
    const expectAck = async () => {
      const r = await readN(1, 4000);
      if (r[0] !== 0x0D) throw new Error('AVR109 NAK (got 0x' + r[0].toString(16) + ')');
    };

    try {
      // Identify the bootloader (sanity check).
      await writeBytes('S');
      const id = new TextDecoder().decode(await readN(7, 2000));
      log('bootloader: ' + id, 'dim');
      await writeBytes('V');
      const ver = new TextDecoder().decode(await readN(2, 2000));
      log('caterina v' + ver, 'dim');

      // Select device — 0x44 = ATmega32U4.
      await writeBytes(new Uint8Array([0x54, 0x44])); // 'T'
      await expectAck();
      // Enter programming mode.
      await writeBytes('P');
      await expectAck();
      // Chip erase.
      log('erasing flash…', 'dim');
      await writeBytes('e');
      await expectAck();

      // 128-byte pages for ATmega32U4.
      const PAGE = 128;
      const total = hexBytes.length;
      const totalPages = Math.ceil(total / PAGE);
      log('writing ' + total + ' bytes in ' + totalPages + ' pages…', 'dim');

      for (let addr = 0; addr < total; addr += PAGE) {
        // AVR109 'A' takes a WORD address (byte address >> 1).
        const wordAddr = addr >> 1;
        await writeBytes(new Uint8Array([0x41, (wordAddr >> 8) & 0xFF, wordAddr & 0xFF]));
        await expectAck();

        const len = Math.min(PAGE, total - addr);
        let block = hexBytes.subarray(addr, addr + len);
        if (block.length < PAGE) {
          const padded = new Uint8Array(PAGE);
          padded.fill(0xFF);
          padded.set(block);
          block = padded;
        }
        const header = new Uint8Array([0x42, 0x00, PAGE, 0x46]); // 'B' sizeH sizeL 'F'
        const packet = new Uint8Array(header.length + PAGE);
        packet.set(header, 0);
        packet.set(block, header.length);
        await writeBytes(packet);
        await expectAck();
      }

      // Leave programming mode and exit bootloader (reboot into new sketch).
      await writeBytes('L');
      await expectAck();
      await writeBytes('E');
      await expectAck();
    } finally {
      try { reader.releaseLock(); } catch (_) {}
      try { writer.releaseLock(); } catch (_) {}
    }
  }

  // After upload, the sketch port reappears under the original (sketch) VID/PID.
  // Try to reopen it for the serial monitor without prompting the user.
  async function vibeReconnectSketchPort() {
    try {
      const ports = await navigator.serial.getPorts();
      const sketchPort = ports.find(p => {
        const info = p.getInfo() || {};
        // Sketch port is the Arduino vendor entry that's not still in bootloader
        // VID/PID. Caterina's bootloader uses 0x0036/0x0037; sketches usually
        // use 0x8036/0x8037 or higher.
        return info.usbVendorId === ARDUINO_USB_VID && (info.usbProductId & 0x8000);
      }) || ports.find(p => (p.getInfo() || {}).usbVendorId === ARDUINO_USB_VID);
      if (!sketchPort) return;
      const baud = parseInt(document.getElementById('vibeBaudRate').value, 10) || 9600;
      await sketchPort.open({ baudRate: baud });
      _vibeSerialPort = sketchPort;
      _vibeSerialKeepReading = true;
      const btn = document.getElementById('vibeConnect');
      if (btn) {
        btn.classList.remove('is-primary');
        btn.classList.add('is-active');
        vibeSetTooltip(btn, 'Disconnect serial monitor');
      }
      vibeMonitorLine('[ reconnected at ' + baud + ' baud ]', 'info');
      vibeSetStatus('connected', `Connected at ${baud} baud.`);
      vibeReadLoop();
    } catch (err) {
      vibeMonitorLine('Could not reopen serial monitor — click the monitor icon to reconnect.', 'dim');
    }
  }

  // ---- Web Serial ----
  async function vibeConnectSerial() {
    const monitor = document.getElementById('vibeMonitor');
    if (!('serial' in navigator)) {
      monitor.innerHTML = '';
      vibeAppendMonitor('Web Serial not supported in this browser. Use Chrome or Edge on a desktop, then reload this page.\n');
      return;
    }
    try {
      const port = await navigator.serial.requestPort();
      const baud = parseInt(document.getElementById('vibeBaudRate').value, 10) || 9600;
      await port.open({ baudRate: baud });
      _vibeSerialPort = port;
      _vibeSerialKeepReading = true;
      const btn = document.getElementById('vibeConnect');
      btn.classList.remove('is-primary');
      btn.classList.add('is-active');
      vibeSetTooltip(btn, 'Disconnect serial monitor');
      monitor.innerHTML = '';
      vibeAppendMonitor('[ connected at ' + baud + ' baud ]\n');
      vibeSetStatus('connected', `Connected at ${baud} baud. Upload your sketch in the desktop Arduino IDE; output streams here.`);
      vibeReadLoop();
    } catch (err) {
      // User cancelled the picker, or open failed.
      if (err && err.name !== 'NotFoundError') {
        vibeAppendMonitor('[ connection error: ' + (err.message || err) + ' ]\n');
      }
    }
  }

  async function vibeReadLoop() {
    if (!_vibeSerialPort) return;
    const decoder = new TextDecoderStream();
    const inputDone = _vibeSerialPort.readable.pipeTo(decoder.writable).catch(() => {});
    const reader = decoder.readable.getReader();
    _vibeSerialReader = reader;
    try {
      while (_vibeSerialKeepReading) {
        const { value, done } = await reader.read();
        if (done) break;
        if (value) vibeAppendMonitor(value);
      }
    } catch (err) {
      vibeAppendMonitor('[ read error: ' + (err.message || err) + ' ]\n');
    }
  }

  async function vibeDisconnectSerial() {
    _vibeSerialKeepReading = false;
    try {
      if (_vibeSerialReader) {
        await _vibeSerialReader.cancel().catch(() => {});
        _vibeSerialReader = null;
      }
      if (_vibeSerialPort) {
        await _vibeSerialPort.close().catch(() => {});
      }
    } catch (_) {}
    _vibeSerialPort = null;
    const btn = document.getElementById('vibeConnect');
    if (btn) {
      btn.classList.add('is-primary');
      btn.classList.remove('is-active');
      vibeSetTooltip(btn, 'Open Serial Monitor');
    }
    vibeAppendMonitor('[ disconnected ]\n');
    vibeSetStatus('disconnected', 'Disconnected. Choose your Leonardo or Micro after clicking Connect Arduino.');
  }

  function vibeStopReading() {
    if (_vibeSerialPort) {
      vibeDisconnectSerial();
    }
  }

  function vibeAppendMonitor(text) {
    const m = document.getElementById('vibeMonitor');
    if (!m) return;
    // Clear empty placeholder
    const empty = m.querySelector('.vibe-monitor-empty');
    if (empty) m.innerHTML = '';
    m.appendChild(document.createTextNode(text));
    if (_vibeMonitorAutoScroll) {
      m.scrollTop = m.scrollHeight;
    }
  }

  // ============== UTIL ==============
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // ============== NAME PICKER ==============
  // Mobile-first roster picker. Native <select> for the wheel-spinner UX on
  // iOS, an inline "+ I'm new — add me" fallback that grows the live roster.
  // Returns { element, getName(), setName(name), destroy() }.
  function renderNamePicker(opts = {}) {
    const wrap = document.createElement('div');
    wrap.className = 'name-picker';
    wrap.innerHTML = `
      <label class="name-picker-label">${escapeHtml(opts.label || "Who's adding this?")}</label>
      <select class="name-picker-select" data-name-select aria-label="Pick your name"></select>
    `;
    const select = wrap.querySelector('[data-name-select]');

    let currentName = opts.initial || localStorage.getItem(LAST_PICK_KEY) || '';

    function rebuildOptions(names) {
      const seen = new Set(names.map(n => n.toLowerCase()));
      // If the current pick isn't in the live roster yet (just added, not
      // round-tripped through Firestore), keep it visible.
      if (currentName && !seen.has(currentName.toLowerCase())) {
        names = [...names, currentName].sort((a, b) =>
          a.localeCompare(b, undefined, { sensitivity: 'base' })
        );
      }
      const opts = [`<option value="">Pick your name…</option>`];
      for (const n of names) {
        const sel = (n === currentName) ? ' selected' : '';
        opts.push(`<option value="${escapeHtml(n)}"${sel}>${escapeHtml(n)}</option>`);
      }
      select.innerHTML = opts.join('');
    }

    const unsub = subscribeRoster(rebuildOptions);

    select.addEventListener('change', () => {
      currentName = select.value;
      if (currentName) localStorage.setItem(LAST_PICK_KEY, currentName);
      if (typeof opts.onChange === 'function') opts.onChange(currentName);
    });

    return {
      element: wrap,
      getName: () => currentName,
      setName: (n) => {
        currentName = n || '';
        if (currentName) localStorage.setItem(LAST_PICK_KEY, currentName);
        // Trigger rebuild so the new selection actually shows in the <select>.
        rebuildOptions(_liveRoster);
      },
      destroy: () => { unsub(); }
    };
  }

  // ============== STUDENT DRAFTS ==============
  // Per-student per-benchmark drafts persisted to Firestore so the student
  // can leave, switch devices, come back, and find their stuff. Doc path:
  //   drafts/${nameSlug}__${benchmarkId}
  // Storage path for files:
  //   drafts/${nameSlug}__${benchmarkId}/${stamp}-${fileName}
  function draftDocId(name, benchmarkId) {
    const slug = nameSlug(name);
    return slug && benchmarkId ? `${slug}__${benchmarkId}` : '';
  }
  async function loadDraft(name, benchmarkId) {
    const id = draftDocId(name, benchmarkId);
    if (!id) return null;
    try {
      const snap = await getDoc(doc(db, 'drafts', id));
      return snap.exists() ? snap.data() : null;
    } catch (e) {
      console.warn('loadDraft failed', e);
      return null;
    }
  }
  async function saveDraft(name, benchmarkId, partial) {
    const id = draftDocId(name, benchmarkId);
    if (!id) return;
    try {
      await setDoc(
        doc(db, 'drafts', id),
        {
          studentName: name,
          nameSlug: nameSlug(name),
          benchmarkId,
          ...partial,
          updatedAt: serverTimestamp(),
        },
        { merge: true }
      );
    } catch (e) {
      console.warn('saveDraft failed', e);
    }
  }
  async function clearDraft(name, benchmarkId) {
    const id = draftDocId(name, benchmarkId);
    if (!id) return;
    try { await deleteDoc(doc(db, 'drafts', id)); } catch (e) {}
  }
  // Debounce helper for keystroke autosave.
  function debounce(fn, ms) {
    let t = null;
    return function (...args) {
      if (t) clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), ms);
    };
  }

  // Small inline-markup formatter for benchmark step text. Order matters:
  // 1) escape, 2) link tokens, 3) bold, 4) italic.
  function formatStepMarkup(text) {
    let s = escapeHtml(text);
    // [label](href) — internal tool links resolve to data-tool-link, others to <a target=_blank>.
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, label, href) => {
      const internal = href.match(/^tools#(vibe|schematic|idea-board)$/);
      if (internal) {
        return `<a href="#" class="cp-step-tool" data-tool-link="${internal[1]}">${label}</a>`;
      }
      const safeHref = href.replace(/"/g, '');
      return `<a href="${safeHref}" target="_blank" rel="noopener">${label}</a>`;
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    return s;
  }

    // --- Build the Konva stage in the frame ---
    const frame = document.getElementById('ideaFrame');
    const rect0 = frame.getBoundingClientRect();
    _ideaStage = new Konva.Stage({
      container: frame,
      width: Math.max(300, Math.round(rect0.width)),
      height: Math.max(300, Math.round(rect0.height))
    });
    _ideaBgLayer = new Konva.Layer({ listening: false });
    const bg = new Konva.Rect({
      x: 0, y: 0,
      width: _ideaStage.width(),
      height: _ideaStage.height(),
      fill: '#ffffff',
      name: 'idea-bg'
    });
    _ideaBgLayer.add(bg);
    _ideaStage.add(_ideaBgLayer);

    _ideaLayer = new Konva.Layer();
    _ideaStage.add(_ideaLayer);

    _ideaTransformer = new Konva.Transformer({
      rotateEnabled: true,
      anchorSize: 9,
      borderStroke: '#4f46e5',
      anchorStroke: '#4f46e5',
      anchorFill: 'white',
      borderDash: [4, 3]
    });
    _ideaLayer.add(_ideaTransformer);

    // --- Restore saved state (if any) ---
    ideaRestoreFromStorage();

    // --- Responsive resize: stretch stage + bg rect to frame ---
    const doResize = () => {
      if (!_ideaStage) return;
      const r = frame.getBoundingClientRect();
      const w = Math.max(300, Math.round(r.width));
      const h = Math.max(300, Math.round(r.height));
      if (w === _ideaStage.width() && h === _ideaStage.height()) return;
      _ideaStage.width(w);
      _ideaStage.height(h);
      bg.width(w);
      bg.height(h);
      _ideaBgLayer.batchDraw();
    };
    _ideaResizeObs = new ResizeObserver(doResize);
    _ideaResizeObs.observe(frame);
    _ideaCleanup.push(() => { try { _ideaResizeObs.disconnect(); } catch (e) {} });

    // --- Stage event wiring ---
    _ideaStage.on('mousedown touchstart', ideaOnStageDown);

      const file = e.target.files && e.target.files[0];
      if (file) ideaAddImageFromFile(file);
      e.target.value = '';
    });

    // Drag-and-drop image onto canvas — covers OS files, webpage images, and
    // pasted clipboard images. Drop targets attach to both the frame and the
    // outer wrap so the user can land anywhere on the card.
    const dropWrap = frame.closest('.idea-canvas-wrap') || frame;
    const onDragOver = (e) => {
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
      frame.classList.add('is-dropping');
    };
    const onDragLeave = (e) => {
      if (e.relatedTarget && dropWrap.contains(e.relatedTarget)) return;
      frame.classList.remove('is-dropping');
    };
    const onDrop = (e) => {
      e.preventDefault();
      e.stopPropagation();
      frame.classList.remove('is-dropping');
      const dt = e.dataTransfer;
      if (!dt) return;
      if (dt.files && dt.files.length) {
        const file = Array.from(dt.files).find(f => f.type && f.type.startsWith('image/'));
        if (file) { ideaAddImageFromFile(file); return; }
      }
      if (dt.items) {
        for (const item of dt.items) {
          if (item.kind === 'file' && item.type && item.type.startsWith('image/')) {
            const file = item.getAsFile();
            if (file) { ideaAddImageFromFile(file); return; }
          }
        }
      }
    };
    [frame, dropWrap].forEach(el => {
      el.addEventListener('dragover', onDragOver);
      el.addEventListener('dragleave', onDragLeave);
      el.addEventListener('drop', onDrop);
    });
    // Paste-from-clipboard: when the Idea Board is the active tool, ⌘V/Ctrl+V
    // anywhere on the page imports a clipboard image.
    const onPaste = (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (const item of items) {
        if (item.kind === 'file' && item.type && item.type.startsWith('image/')) {
          const file = item.getAsFile();
          if (file) {
            e.preventDefault();
            ideaAddImageFromFile(file);
            return;
          }
        }
      }
    };
    document.addEventListener('paste', onPaste);
    _ideaCleanup.push(() => {
      [frame, dropWrap].forEach(el => {
        el.removeEventListener('dragover', onDragOver);
        el.removeEventListener('dragleave', onDragLeave);
        el.removeEventListener('drop', onDrop);
      });
      document.removeEventListener('paste', onPaste);
    });

    document.getElementById('ideaUndo').addEventListener('click', ideaUndo);
    document.getElementById('ideaClear').addEventListener('click', () => {
      if (_ideaLayer.getChildren(n => n !== _ideaTransformer).length === 0) {

        return;
      }

      ideaPushHistory();
      _ideaTransformer.nodes([]);
      _ideaLayer.getChildren(n => n !== _ideaTransformer).forEach(n => n.destroy());
      _ideaSelected = null;
      _ideaLayer.batchDraw();
      ideaScheduleSave();
      schemToast('Canvas cleared.');
    });

    const saveBtn = document.getElementById('ideaSaveTo');
    saveBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (_saveToPopOpen && _saveToPopOpen.anchorEl === saveBtn) {
        closeSaveToPop();
        return;
      }
      const buildBlob = () => ideaBuildPngBlob();
      openSaveToPop(saveBtn, 'idea-board', buildBlob);
    });

    document.getElementById('ideaDownload').addEventListener('click', async () => {
      try {
        const blob = await ideaBuildPngBlob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
        a.href = url;
        a.download = `idea-board-${stamp}.png`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 500);
      } catch (err) {
        console.warn('idea download failed', err);
        schemToast('Could not export image.');
      }
    });

    // --- Keyboard: undo + delete selection ---
    const onKey = (e) => {
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return;
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
        e.preventDefault();
        ideaUndo();
        return;
      }
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if ((e.key === 'Delete' || e.key === 'Backspace') && _ideaTransformer && _ideaTransformer.nodes().length) {
        e.preventDefault();
        ideaPushHistory();
        // Detach the Transformer BEFORE destroying its anchored nodes — otherwise
        // Konva tries to redraw handles for nodes that no longer exist.
        const sel = _ideaTransformer.nodes().slice();
        _ideaTransformer.nodes([]);
        sel.forEach(n => { try { n.destroy(); } catch (err) {} });
        _ideaSelected = null;
        _ideaLayer.batchDraw();
        ideaScheduleSave();
      }
    };
    document.addEventListener('keydown', onKey);
    _ideaCleanup.push(() => document.removeEventListener('keydown', onKey));

    // Backlink: leaving the tool tears down listeners.
    backBtn.addEventListener('click', () => {
      _ideaCleanup.forEach(fn => { try { fn(); } catch (e) {} });
      _ideaCleanup = [];
      if (_ideaTextEditor && _ideaTextEditor.parentNode) {
        _ideaTextEditor.parentNode.removeChild(_ideaTextEditor);
        _ideaTextEditor = null;
      }
    });
  }

  function renderIdeaColors() {
    const row = document.getElementById('ideaColors');
    if (!row) return;
    row.innerHTML = '';
    Object.entries(IDEA_COLORS).forEach(([name, hex]) => {
      const btn = document.createElement('button');
      btn.className = 'idea-color' + (name === _ideaColor ? ' is-active' : '');
      btn.style.background = hex;
      btn.title = name;
      btn.setAttribute('aria-label', `Color: ${name}`);
      btn.addEventListener('click', () => {
        _ideaColor = name;
        renderIdeaColors();
        // If something is selected, recolor its stroke (and fill if it had one).
        const nodes = _ideaTransformer.nodes();
        if (nodes.length) {
          ideaPushHistory();
          nodes.forEach(n => {
            if (n.stroke) n.stroke(IDEA_COLORS[name]);
            // Don't auto-fill a transparent shape; only update existing solid fills.
            if (n.getClassName && n.getClassName() === 'Text') n.fill(IDEA_COLORS[name]);
          });
          _ideaLayer.batchDraw();
          ideaScheduleSave();
        }
      });
      row.appendChild(btn);
    });
  }

  function renderIdeaWidths() {
    const row = document.getElementById('ideaWidths');
    if (!row) return;
    row.innerHTML = '';
    Object.entries(IDEA_WIDTHS).forEach(([name, px]) => {
      const btn = document.createElement('button');
      btn.className = 'idea-width' + (name === _ideaWidth ? ' is-active' : '');
      btn.title = `${name} stroke`;
      btn.setAttribute('aria-label', `Stroke width: ${name}`);
      // Visible bar — height scales with width.
      const bar = document.createElement('span');
      bar.style.height = Math.max(2, Math.min(8, px)) + 'px';
      btn.appendChild(bar);
      btn.addEventListener('click', () => {
        _ideaWidth = name;
        renderIdeaWidths();
        const nodes = _ideaTransformer.nodes();
        if (nodes.length) {
          ideaPushHistory();
          nodes.forEach(n => { if (typeof n.strokeWidth === 'function') n.strokeWidth(IDEA_WIDTHS[name]); });
          _ideaLayer.batchDraw();
          ideaScheduleSave();
        }
      });
      row.appendChild(btn);
    });
  }

  function ideaSetTool(tool) {
    _ideaTool = tool;
    // Deselect when switching off Select.
    if (tool !== 'select') {
      _ideaTransformer.nodes([]);
      _ideaSelected = null;
      _ideaLayer.batchDraw();
    }
    ideaUpdateToolHighlight();
    // Cursor hint on the stage container.
    const frame = document.getElementById('ideaFrame');
    if (frame) {
      const cursor = ({
        select: 'default',
        pen: 'crosshair',
        highlight: 'crosshair',
        eraser: 'pointer',
        callout: 'text',
        rect: 'crosshair',
        ellipse: 'crosshair',
        line: 'crosshair',
        arrow: 'crosshair'
      })[tool] || 'default';
      frame.style.cursor = cursor;
    }
  }

  function ideaUpdateToolHighlight() {
    document.querySelectorAll('[data-idea-tool]').forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.ideaTool === _ideaTool);
    });
  }

  // --- Drawing handlers ---
  function ideaOnStageDown(e) {
    // Ignore mousedown on the transformer itself or on a selected node when in Select.
    if (_ideaTool === 'select') return;
    if (_ideaTool === 'eraser') return;     // handled in click handler
    if (_ideaTool === 'callout') return;    // handled in click handler

    const pos = _ideaStage.getPointerPosition();
    if (!pos) return;
    _ideaDrawing = true;
    ideaPushHistory();

    if (_ideaTool === 'pen' || _ideaTool === 'highlight') {
      const isHi = _ideaTool === 'highlight';
      _ideaCurrentLine = new Konva.Line({
        stroke: ideaPalette(),
        strokeWidth: isHi ? Math.max(12, ideaStroke() * 4) : ideaStroke(),
        opacity: isHi ? 0.35 : 1,
        lineCap: 'round',
        lineJoin: 'round',
        tension: 0.5,
        bezier: true,
        points: [pos.x, pos.y, pos.x, pos.y],
        globalCompositeOperation: 'source-over',
        draggable: false
      });
      _ideaLayer.add(_ideaCurrentLine);
      return;
    }

    if (_ideaTool === 'rect') {
      _ideaCurrentShape = new Konva.Rect({
        x: pos.x, y: pos.y, width: 1, height: 1,
        stroke: ideaPalette(), strokeWidth: ideaStroke(),
        fill: 'transparent', draggable: true
      });
      _ideaLayer.add(_ideaCurrentShape);
      return;
    }
    if (_ideaTool === 'ellipse') {
      _ideaCurrentShape = new Konva.Ellipse({
        x: pos.x, y: pos.y, radiusX: 1, radiusY: 1,
        stroke: ideaPalette(), strokeWidth: ideaStroke(),
        fill: 'transparent', draggable: true
      });
      _ideaCurrentShape._startX = pos.x;
      _ideaCurrentShape._startY = pos.y;
      _ideaLayer.add(_ideaCurrentShape);
      return;
    }
    if (_ideaTool === 'line') {
      _ideaCurrentShape = new Konva.Line({
        points: [pos.x, pos.y, pos.x, pos.y],
        stroke: ideaPalette(), strokeWidth: ideaStroke(),
        lineCap: 'round', draggable: true
      });
      _ideaLayer.add(_ideaCurrentShape);
      return;
    }
    if (_ideaTool === 'arrow') {
      _ideaCurrentShape = new Konva.Arrow({
        points: [pos.x, pos.y, pos.x, pos.y],
        stroke: ideaPalette(), strokeWidth: ideaStroke(),
        fill: ideaPalette(),
        pointerLength: 12, pointerWidth: 10, draggable: true
      });
      _ideaLayer.add(_ideaCurrentShape);
      return;
    }
  }

  function ideaOnStageMove() {
    if (!_ideaDrawing) return;
    const pos = _ideaStage.getPointerPosition();
    if (!pos) return;

    if (_ideaCurrentLine) {
      const pts = _ideaCurrentLine.points().concat([pos.x, pos.y]);
      _ideaCurrentLine.points(pts);
      _ideaLayer.batchDraw();
      return;
    }
    if (_ideaCurrentShape) {
      const cls = _ideaCurrentShape.getClassName();
      if (cls === 'Rect') {
        const x0 = _ideaCurrentShape.x();
        const y0 = _ideaCurrentShape.y();
        _ideaCurrentShape.width(pos.x - x0);
        _ideaCurrentShape.height(pos.y - y0);
      } else if (cls === 'Ellipse') {
        const cx = _ideaCurrentShape._startX;
        const cy = _ideaCurrentShape._startY;
        _ideaCurrentShape.x((cx + pos.x) / 2);
        _ideaCurrentShape.y((cy + pos.y) / 2);
        _ideaCurrentShape.radiusX(Math.abs(pos.x - cx) / 2);
        _ideaCurrentShape.radiusY(Math.abs(pos.y - cy) / 2);
      } else if (cls === 'Line' || cls === 'Arrow') {
        const pts = _ideaCurrentShape.points();
        _ideaCurrentShape.points([pts[0], pts[1], pos.x, pos.y]);
      }
      _ideaLayer.batchDraw();
    }
  }

  function ideaOnStageUp() {
    if (!_ideaDrawing) return;
    _ideaDrawing = false;

    // Reject tiny accidental shapes (single-click on a shape tool shouldn't
    // litter the canvas with a 0-px Rect).
    if (_ideaCurrentShape) {
      const cls = _ideaCurrentShape.getClassName();
      let isTiny = false;
      if (cls === 'Rect') isTiny = Math.abs(_ideaCurrentShape.width()) < 4 || Math.abs(_ideaCurrentShape.height()) < 4;
      else if (cls === 'Ellipse') isTiny = _ideaCurrentShape.radiusX() < 3 || _ideaCurrentShape.radiusY() < 3;
      else if (cls === 'Line' || cls === 'Arrow') {
        const p = _ideaCurrentShape.points();
        const dx = p[2] - p[0]; const dy = p[3] - p[1];
        isTiny = Math.hypot(dx, dy) < 4;
      }
      if (isTiny) _ideaCurrentShape.destroy();
      else {
        // Normalize negative-width rects so they're easier to select/resize.
        if (cls === 'Rect') {
          if (_ideaCurrentShape.width() < 0) {
            _ideaCurrentShape.x(_ideaCurrentShape.x() + _ideaCurrentShape.width());
            _ideaCurrentShape.width(-_ideaCurrentShape.width());
          }
          if (_ideaCurrentShape.height() < 0) {
            _ideaCurrentShape.y(_ideaCurrentShape.y() + _ideaCurrentShape.height());
            _ideaCurrentShape.height(-_ideaCurrentShape.height());
          }
        }
      }
      _ideaCurrentShape = null;
    }
    _ideaCurrentLine = null;
    _ideaLayer.batchDraw();
    ideaScheduleSave();
  }

  function ideaOnStageClick(e) {
    const target = e.target;
    // Eraser: any click on an actual shape deletes it (object-level delete,
    // not pixel erase). Background hits do nothing.
    if (_ideaTool === 'eraser') {
      if (target && target !== _ideaStage && target.name && target.name() !== 'idea-bg') {
        ideaPushHistory();
        if (_ideaTransformer.nodes().includes(target)) _ideaTransformer.nodes([]);
        // For a child of a group (e.g. callout text or rect), destroy the group.
        const parent = target.getParent && target.getParent();
        if (parent && parent.getClassName && parent.getClassName() === 'Group' && parent !== _ideaLayer) {
          parent.destroy();
        } else if (target !== _ideaTransformer) {
          target.destroy();
        }
        _ideaLayer.batchDraw();
        ideaScheduleSave();
      } else if (target && target.getParent && target.getParent().getClassName && target.getParent().getClassName() === 'Group') {
        // Group children (callout pieces) don't always have a name.
        ideaPushHistory();
        target.getParent().destroy();
        _ideaLayer.batchDraw();
        ideaScheduleSave();
      }
      return;
    }

    // Callout: click on empty canvas creates a new callout there.
    if (_ideaTool === 'callout') {
      // Only create if the click landed on the stage / background, not on an
      // existing shape — let the kid keep selecting existing callouts.
      const isBg = target === _ideaStage || (target.name && target.name() === 'idea-bg');
      if (isBg) {
        const pos = _ideaStage.getPointerPosition();
        if (pos) ideaCreateCallout(pos.x, pos.y);
        return;
      }
    }

    // Select tool: click selects a shape; click on background clears.
    if (_ideaTool === 'select') {
      if (target === _ideaStage || (target.name && target.name() === 'idea-bg')) {
        _ideaTransformer.nodes([]);
        _ideaSelected = null;
        _ideaLayer.batchDraw();
        return;
      }
      // Walk up to the top-level layer child (so clicking inside a Group
      // selects the Group, not its inner Rect).
      let node = target;
      while (node && node.getParent && node.getParent() !== _ideaLayer) {
        node = node.getParent();
        if (!node || node === _ideaStage) break;
      }
      if (!node || node === _ideaTransformer || node === _ideaStage) return;
      node.draggable(true);
      _ideaTransformer.nodes([node]);
      _ideaSelected = node._id;
      _ideaLayer.batchDraw();
    }
  }

  function ideaOnStageDblClick(e) {
    // Double-click a callout to edit its text in an overlaid textarea.
    const target = e.target;
    let group = target;
    while (group && group.getParent && group.getParent() !== _ideaLayer) group = group.getParent();
    if (!group || !group.getAttr || group.getAttr('ideaKind') !== 'callout') return;
    const textNode = group.findOne('Text');
    if (textNode) ideaOpenTextEditor(group, textNode);
  }

  // --- Callout creation + inline edit ---
  function ideaCreateCallout(x, y) {
    ideaPushHistory();
    const group = new Konva.Group({
      x, y,
      draggable: true,
      ideaKind: 'callout'
    });
    const text = new Konva.Text({
      text: 'Label',
      fontSize: 16,
      fontFamily: 'system-ui, -apple-system, sans-serif',
      fill: ideaPalette(),
      padding: 8,
      lineHeight: 1.35
    });
    const w = Math.max(60, text.width());
    const h = Math.max(28, text.height());
    const bg = new Konva.Rect({
      x: 0, y: 0,
      width: w, height: h,
      fill: 'white',
      stroke: ideaPalette(),
      strokeWidth: 1.5,
      cornerRadius: 6
    });
    group.add(bg);
    group.add(text);
    _ideaLayer.add(group);
    _ideaLayer.batchDraw();
    ideaScheduleSave();
    // Drop the user straight into the edit textarea.
    ideaOpenTextEditor(group, text);
  }

  function ideaOpenTextEditor(group, textNode) {
    if (_ideaTextEditor && _ideaTextEditor.parentNode) {
      _ideaTextEditor.parentNode.removeChild(_ideaTextEditor);
      _ideaTextEditor = null;
    }
    const frame = document.getElementById('ideaFrame');
    const stageBox = frame.getBoundingClientRect();
    const containerBox = frame.parentElement.getBoundingClientRect();
    const absPos = group.getAbsolutePosition();

    const ta = document.createElement('textarea');
    ta.className = 'idea-text-edit';
    ta.value = textNode.text();
    // Position relative to the wrap (which is positioned).
    ta.style.left = (stageBox.left - containerBox.left + absPos.x) + 'px';
    ta.style.top = (stageBox.top - containerBox.top + absPos.y) + 'px';
    ta.style.minWidth = Math.max(80, textNode.width()) + 'px';
    ta.style.minHeight = Math.max(24, textNode.height()) + 'px';
    ta.style.color = textNode.fill();
    frame.parentElement.appendChild(ta);
    ta.focus();
    ta.select();
    _ideaTextEditor = ta;

    const commit = () => {
      if (_ideaTextEditor !== ta) return;
      ideaPushHistory();
      const val = ta.value.trim() || 'Label';
      textNode.text(val);
      const newW = Math.max(60, textNode.width());
      const newH = Math.max(28, textNode.height());
      const bg = group.findOne('Rect');
      if (bg) { bg.width(newW); bg.height(newH); }
      _ideaLayer.batchDraw();
      ideaScheduleSave();
      if (ta.parentNode) ta.parentNode.removeChild(ta);
      _ideaTextEditor = null;
      document.removeEventListener('mousedown', onOutside, true);
    };
    const onOutside = (ev) => {
      if (ev.target !== ta) commit();
    };
    ta.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') { ev.preventDefault(); commit(); }
      if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); commit(); }
    });
    // Defer so the dblclick doesn't trip it.
    setTimeout(() => document.addEventListener('mousedown', onOutside, true), 0);
  }

  // --- Image upload (file picker or drag-drop) ---
  function ideaAddImageFromFile(file) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const dataUrl = ev.target.result;
      const img = new Image();
      img.onload = () => {
        ideaPushHistory();
        const stageW = _ideaStage.width();
        const targetW = stageW * 0.5;
        const scale = targetW / img.width;
        const w = img.width * scale;
        const h = img.height * scale;
        const kImg = new Konva.Image({
          image: img,
          x: (_ideaStage.width() - w) / 2,
          y: (_ideaStage.height() - h) / 2,
          width: w,
          height: h,
          draggable: true,
          ideaImageSrc: dataUrl   // persisted so we can re-hydrate from JSON
        });
        // Drop images behind drawn marks (but above bg).
        kImg.moveToBottom();
        _ideaLayer.add(kImg);
        _ideaLayer.batchDraw();
        ideaScheduleSave();
      };
      img.src = dataUrl;
    };
    reader.readAsDataURL(file);
  }

  // --- History (undo) ---
  // Strip the Transformer before snapshotting so each undo cycle doesn't
  // accrue an orphan handle node in the rebuilt layer.
  function ideaPushHistory() {
    try {
      const layerJson = JSON.parse(_ideaLayer.toJSON());
      if (layerJson.children) {
        layerJson.children = layerJson.children.filter(c => c.className !== 'Transformer');
      }
      _ideaHistory.push(layerJson);
      if (_ideaHistory.length > 30) _ideaHistory.shift();
    } catch (e) {}
  }
  function ideaUndo() {
    if (!_ideaHistory.length) { schemToast('Nothing to undo.'); return; }
    const snap = _ideaHistory.pop();
    ideaRestoreLayerFromJSON(snap);
    ideaScheduleSave();
  }

  function ideaRestoreLayerFromJSON(json) {
    // Tear down the current layer and rebuild from JSON. Preserve images by
    // matching saved data URLs back to HTMLImageElements. The Transformer
    // is destroyed by destroyChildren(), so recreate it fresh — reusing a
    // destroyed Konva node leaves it visually attached but functionally dead
    // (Delete-key + drag handles silently no-op).
    if (!_ideaLayer) return;
    let parsed;
    try { parsed = typeof json === 'string' ? JSON.parse(json) : json; } catch (e) { return; }
    _ideaLayer.destroyChildren();
    if (parsed && parsed.children) {
      parsed.children.forEach(childJson => {
        if (childJson.className === 'Transformer') return; // never restore stale handles
        try {
          const node = Konva.Node.create(childJson);
          _ideaLayer.add(node);
          if (node.getClassName && node.getClassName() === 'Image') {
            const src = node.getAttr('ideaImageSrc');
            if (src) {
              const img = new Image();
              img.onload = () => { node.image(img); _ideaLayer.batchDraw(); };
              img.src = src;
            }
          }
        } catch (e) { /* skip broken node */ }
      });
    }
    _ideaTransformer = new Konva.Transformer({
      rotateEnabled: true,
      anchorSize: 9,
      borderStroke: '#4f46e5',
      anchorStroke: '#4f46e5',
      anchorFill: 'white',
      borderDash: [4, 3]
    });
    _ideaLayer.add(_ideaTransformer);
    _ideaSelected = null;
    _ideaLayer.batchDraw();
  }

  function ideaScheduleSave() {
    if (_ideaSaveTimer) clearTimeout(_ideaSaveTimer);
    _ideaSaveTimer = setTimeout(ideaSaveToStorage, 350);
  }
  function ideaSaveToStorage() {
    try {
      // Strip the transformer from the snapshot so we don't re-create handles on load.
      const layerJson = JSON.parse(_ideaLayer.toJSON());
      if (layerJson.children) {
        layerJson.children = layerJson.children.filter(c => c.className !== 'Transformer');
      }
      localStorage.setItem(IDEA_STORAGE_KEY, JSON.stringify({
        version: 1,
        layer: layerJson
      }));
    } catch (e) { /* quota, etc — ignore */ }
  }
  function ideaRestoreFromStorage() {
    try {
      const raw = localStorage.getItem(IDEA_STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (!data || !data.layer) return;
      ideaRestoreLayerFromJSON(data.layer);
    } catch (e) {}
  }

  // --- PNG export (white background under everything) ---
  function ideaBuildPngBlob() {
    return new Promise((resolve, reject) => {
      if (!_ideaStage) { reject(new Error('no stage')); return; }
      // Temporarily detach transformer for a clean export, then restore.
      const nodes = _ideaTransformer.nodes();
      _ideaTransformer.nodes([]);
      _ideaTransformer.visible(false);
      _ideaLayer.batchDraw();
      // Swap the cream background to white so the export reads as a clean
      // sketch on paper, not on a colored card.
      const bg = _ideaBgLayer.findOne('.idea-bg');
      const prevFill = bg ? bg.fill() : null;
      if (bg) { bg.fill('#ffffff'); _ideaBgLayer.batchDraw(); }
      try {
        const dataUrl = _ideaStage.toDataURL({ pixelRatio: 2, mimeType: 'image/png' });
        fetch(dataUrl).then(r => r.blob()).then(b => {
          if (bg) { bg.fill(prevFill || '#FAF6EE'); _ideaBgLayer.batchDraw(); }
          _ideaTransformer.visible(true);
          _ideaTransformer.nodes(nodes);
          _ideaLayer.batchDraw();
          resolve(b);
        }).catch(err => {
          if (bg) { bg.fill(prevFill || '#FAF6EE'); _ideaBgLayer.batchDraw(); }
          _ideaTransformer.visible(true);
          _ideaTransformer.nodes(nodes);
          _ideaLayer.batchDraw();
          reject(err);
        });
      } catch (err) {
        if (bg) { bg.fill(prevFill || '#FAF6EE'); _ideaBgLayer.batchDraw(); }
        _ideaTransformer.visible(true);
        _ideaTransformer.nodes(nodes);
        _ideaLayer.batchDraw();
        reject(err);
      }
    });
  }

  // ============== INIT ==============
  // Smooth in-page route switching via pushState; no full reload between
  // Tools / Homework / Progress / Home, so nav doesn't flicker.
  function applyRoute(path) {
    const r = (path || '').replace(/\/+$/, '');
    document.body.classList.remove('view-home', 'view-hw', 'view-progress', 'view-tools', 'view-tools-detail');
    if (r === '/hw') {
      document.body.classList.add('view-hw');
      renderHomework();
    } else if (r === '/progress') {
      document.body.classList.add('view-progress');
      renderProgress();
    } else if (r === '/tools/vibe') {
      document.body.classList.add('view-tools');
      initVibeCodingTool();
    } else if (r === '/tools/schematic') {
      document.body.classList.add('view-tools');
      initSchematicTool();
    } else if (r === '/tools/idea-board') {
      document.body.classList.add('view-tools');
      initIdeaBoardTool();
    } else if (r === '/tools') {
      document.body.classList.add('view-tools');
      renderTools();
    } else {
      document.body.classList.add('view-home');
      renderProjects();
    }
    window.scrollTo(0, 0);
  }

  // Intercept top-nav links so navigation feels instant. Only intercept
  // same-origin internal routes; external/admin links go through normal
  // navigation.
  document.addEventListener('click', (e) => {
    const a = e.target && e.target.closest && e.target.closest('a');
    if (!a) return;
    if (!(a.classList.contains('nav-link') || a.classList.contains('header-title-link'))) return;
    const href = a.getAttribute('href') || '';
    if (!href.startsWith('/')) return;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
    e.preventDefault();
    if (location.pathname !== href) history.pushState({}, '', href);
    applyRoute(href);
  });
  window.addEventListener('popstate', () => applyRoute(location.pathname));

  applyRoute(location.pathname);
  // Pull initial counts via getCountFromServer (1 read per benchmark).
  loadInitialCounts();
  // Deep link to an archive: ?admin=ramsey-d4sg&archive=2026-04-15T12-34-56
  if (isAdmin) {
    const archiveDeepLink = urlParams.get('archive');
    if (archiveDeepLink) {
      // Defer slightly so projects render first.
      setTimeout(() => openArchiveDetail(archiveDeepLink, null), 50);
    }
  }
</script>
