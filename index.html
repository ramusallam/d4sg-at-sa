  .pf-view-tile.is-expanded {
    grid-column: 1 / -1;
    cursor: default;
  }
  .pf-view-tile.is-expanded:hover { transform: none; }
  .pf-view-head {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pf-view-head .pf-view-icon {
    font-size: 16px;
    line-height: 1;
    color: var(--accent);
  }
  .pf-view-head .pf-view-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--ink-low);
    flex: 1;
  }
  .pf-view-thumb {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 8px;
    overflow: hidden;
    background: white;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 28px;
    position: relative;
  }
  .pf-view-thumb img,
  .pf-view-thumb video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .pf-view-thumb .play-badge {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 30px;
    height: 30px;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 50%;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    pointer-events: none;
  }
  .pf-view-tile.is-expanded .pf-view-thumb {
    aspect-ratio: auto;
    max-height: 60vh;
  }
  .pf-view-tile.is-expanded .pf-view-thumb img {
    object-fit: contain;
    max-height: 60vh;
  }
  .pf-view-tile.is-expanded .pf-view-thumb video {
    object-fit: contain;
    max-height: 60vh;
  }
  .pf-view-filename {
    font-size: 12px;
    color: var(--paper-ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
  }
  .pf-view-open {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--accent);
    color: white;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    transition: background 0.15s ease;
    align-self: flex-start;
  }
  .pf-view-open:hover { background: var(--accent-hover); }
  .pf-view-summary {
    font-size: 13px;
    color: var(--paper-ink);
    line-height: 1.5;
    white-space: pre-wrap;
    overflow: hidden;
    flex: 1;
  }
  .pf-view-summary.is-collapsed {
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
  }
  .pf-view-readmore {
    background: transparent;
    border: none;
    color: var(--accent);
    padding: 0;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    align-self: flex-start;
  }
  .pf-view-readmore:hover { text-decoration: underline; }
  .pf-view-slot-delete {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    color: white;
    border: none;
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.15s ease;
    z-index: 1;
  }
  body.is-admin .pf-view-slot-delete { display: flex; }
  .pf-view-slot-delete:hover { background: #ef4444; transform: scale(1.05); }

  /* ============== ARCHIVE VIEWER ============== */
  .archive-banner {
    background: #fef3c7;
    border: 1px solid #fcd34d;
    color: #78350f;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .archive-banner .archive-banner-tag {
    background: #d97706;
    color: white;
    font-size: 10px;
    letter-spacing: 1.5px;
    padding: 3px 8px;
    border-radius: 5px;
    text-transform: uppercase;
  }
  .archive-banner .archive-banner-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
  }
  .archive-banner button {
    background: white;
    border: 1px solid #d97706;
    color: #78350f;
    padding: 6px 12px;
    border-radius: 7px;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .archive-banner button:hover { background: #d97706; color: white; }
  .archive-banner button.btn-restore { border-color: var(--success); color: #166534; }
  .archive-banner button.btn-restore:hover { background: var(--success); color: white; }

  .archive-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .archive-list-empty {
    text-align: center;
    color: var(--ink-low);
    font-size: 14px;
    padding: 28px 0;
  }
  .archive-list-item {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    cursor: pointer;
    transition: border-color 0.15s ease, box-shadow 0.18s ease, transform 0.12s ease;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .archive-list-item:hover {
    border-color: var(--accent);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
    transform: translateY(-1px);
  }
  .archive-list-item .archive-info { flex: 1; min-width: 0; }
  .archive-list-item .archive-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--paper-ink);
    margin-bottom: 3px;
  }
  .archive-list-item .archive-meta {
    font-size: 12px;
    color: var(--ink-mid);
  }
  .archive-list-item .archive-caret { color: var(--ink-low); font-size: 14px; }

  /* "Show next 50" pager */
  .pf-pager {
    display: flex;
    justify-content: center;
    padding: 14px 0 4px;
  }
  .pf-pager button {
    background: white;
    border: 1px solid var(--border-strong);
    color: var(--paper-ink);
    padding: 9px 18px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    transition: all 0.15s ease;
  }
  .pf-pager button:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .pf-pager button:disabled { opacity: 0.5; cursor: default; }

  /* Friendly file-unavailable placeholder */
  .pf-broken {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg-2);
    color: var(--ink-low);
    font-size: 11px;
    font-weight: 600;
    text-align: center;
    padding: 8px;
    gap: 4px;
  }
  .pf-broken .pf-broken-icon { font-size: 20px; opacity: 0.6; }

  /* Soft warning under upload (large file) */
  .pf-soft-warn {
    background: #fef3c7;
    border: 1px solid #fcd34d;
    color: #78350f;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.4;
    margin-top: 6px;
  }

  /* Retry button surfaced after upload failures */
  .pf-retry-btn {
    background: white;
    border: 1px solid #ef4444;
    color: #ef4444;
    padding: 6px 12px;
    border-radius: 7px;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    margin-left: 8px;
    transition: all 0.15s ease;
  }
  .pf-retry-btn:hover { background: #ef4444; color: white; }

  /* Bound thumbnail sizes so the browser doesn't decode at full res */
  .pf-row-chip img,
  .pf-slot-thumb img,
  .pf-fp-thumb img {
    max-width: 120px;
    max-height: 120px;
  }

  /* ============== TABLET ============== */
  @media (max-width: 900px) and (min-width: 641px) {
    .pf-slots { grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .pf-slot-tile { min-height: 110px; padding: 12px 6px; }
    .pf-slot-icon { font-size: 22px; }
    .pf-slot-label { font-size: 11px; letter-spacing: 1px; }
    .pf-slot-status { font-size: 10px; }
  }

  /* ============== REDUCED MOTION ============== */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ============== MOBILE ============== */
  @media (max-width: 640px) {
    .header-inner { padding: 14px 18px; gap: 8px; flex-wrap: wrap; }
    main { padding: 28px 20px 80px; }
    .benchmark { padding: 14px 16px; gap: 12px; }
    .points { font-size: 12px; padding: 4px 10px; }
    .artifact-count { font-size: 11px; padding: 4px 8px; }
    .modal {
      width: 100vw;
      height: 100vh;
      max-height: 100vh;
      border-radius: 0;
    }
    .modal-header { padding: 20px 22px 16px; }
    .modal-body { padding: 20px 22px 32px; }
    .gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pf-slots { grid-template-columns: repeat(3, 1fr); }
    .pf-slot.is-open { grid-column: 1 / -1; }
    .pf-row-body-inner { grid-template-columns: repeat(2, 1fr); }
    .pf-slot-tile { min-height: 100px; padding: 14px 8px; }
    .pf-slot-icon { font-size: 22px; }
  }

  /* ============== TOOLS PAGE ============== */
  .tools-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    margin-bottom: 36px;
  }
  @media (max-width: 760px) {
    .tools-grid { grid-template-columns: 1fr; }
  }
  .tool-card {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 2px 6px rgba(17, 17, 17, 0.04);
    padding: 18px 20px 16px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.15s ease;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 140px;
  }
  .tool-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
  }
  .tool-card.is-disabled {
    cursor: not-allowed;
    opacity: 0.78;
  }
  .tool-card.is-disabled:hover {
    transform: none;
    border-color: var(--border);
    box-shadow: 0 2px 6px rgba(17, 17, 17, 0.04);
  }
  .tool-card-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0;
  }
  .tool-card.is-disabled .tool-card-eyebrow {
    color: var(--ink-low);
  }
  .tool-card-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink-hi);
    margin: 0;
  }
  .tool-card-blurb {
    font-size: 14px;
    color: var(--ink-mid);
    margin: 0;
    line-height: 1.55;
  }
  .tool-card-footer {
    margin-top: auto;
    padding-top: 12px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .tool-card.is-disabled .tool-card-footer {
    color: var(--ink-low);
  }

  .tools-section-title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-mid);
    margin: 12px 0 14px;
  }
  .tools-refs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  @media (max-width: 900px) {
    .tools-refs { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 480px) {
    .tools-refs { grid-template-columns: 1fr; }
  }
  .tool-ref-card {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px 14px;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.18s ease;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
  }
  .tool-ref-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.06);
  }
  .tool-ref-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-hi);
    margin: 0;
    letter-spacing: -0.01em;
  }
  .tool-ref-blurb {
    font-size: 12.5px;
    color: var(--ink-mid);
    margin: 0;
    line-height: 1.45;
  }
  .tool-ref-host {
    font-size: 11px;
    color: var(--ink-low);
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  /* ============== SCHEMATIC TOOL ============== */
  .schem-wrap {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .schem-toolbar {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 14px 18px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    scrollbar-width: thin;
  }
  .schem-toolbar::-webkit-scrollbar { height: 6px; }
  .schem-toolbar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
  .schem-toolbar::-webkit-scrollbar-track { background: transparent; }
  .schem-toolbar > * { flex-shrink: 0; }
  .schem-toolbar-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .schem-toolbar-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-low);
  }
  .schem-color-row {
    display: flex;
    gap: 6px;
  }
  /* Zoom readout sits as a segment inside the toolbar pill, with dividers
     matching the buttons on either side. */
  .schem-zoom-readout {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 50px;
    height: 32px;
    padding: 0 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-mid);
    border-left: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
    user-select: none;
  }
  .schem-zoom-readout + .vibe-tool-btn { border-left: 1px solid var(--border); }
  .schem-color {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    padding: 0;
  }
  .schem-color:hover { transform: scale(1.08); }
  .schem-color.is-active {
    border-color: var(--ink-hi);
    box-shadow: 0 0 0 2px var(--bg-1), 0 0 0 4px var(--ink-hi);
  }
  .schem-btn {
    background: var(--bg-1);
    border: 1px solid var(--border);
    color: var(--ink-mid);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .schem-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .schem-btn.is-primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .schem-btn.is-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: white;
  }
  .schem-btn.is-danger:hover {
    border-color: #dc2626;
    color: #dc2626;
    background: #fef2f2;
  }
  /* Big, foolproof "Back to Tools" pill at the top of every tool detail page.
     Visually a real button so ADHD students never lose the way out. */
  .schem-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: white;
    border: 1.5px solid var(--border);
    color: var(--ink-hi);
    cursor: pointer;
    padding: 9px 18px 9px 14px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 0.4px;
    margin-bottom: 18px;
    transition: all 0.15s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .schem-back:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
    transform: translateX(-2px);
  }
  .schem-back-arrow {
    font-size: 16px;
    line-height: 1;
  }

  .schem-stage {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 16px;
  }
  @media (max-width: 820px) {
    .schem-stage { grid-template-columns: 1fr; }
  }

  .schem-palette {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 640px;
    overflow-y: auto;
  }
  .schem-palette-group {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-low);
    margin: 8px 4px 4px;
  }
  .schem-palette-group:first-child { margin-top: 2px; }
  .schem-palette-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-2);
    cursor: pointer;
    transition: all 0.12s ease;
    font-size: 13px;
    color: var(--ink-hi);
    text-align: left;
    width: 100%;
  }
  .schem-palette-item:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }
  .schem-palette-thumb {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .schem-canvas-wrap {
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    overflow: auto;
    max-height: 640px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
  }
  .schem-canvas {
    display: block;
    background: #FFFFFF;
    border-radius: 8px;
    user-select: none;
  }
  .schem-pin {
    cursor: crosshair;
    transition: fill 0.1s ease, filter 0.1s ease;
  }
  .schem-pin:hover {
    fill: #fbbf24 !important;
    filter: drop-shadow(0 0 4px rgba(251, 191, 36, 0.6));
  }
  /* Breadboard sockets stay invisible until hovered, then gently tint without
     resizing — resizing causes the click target to shrink under the cursor,
     which produces a flickering enter/leave loop ("shake"). */
  .schem-socket:hover {
    fill: rgba(251, 191, 36, 0.22) !important;
    filter: none;
  }
  .schem-pin.is-pending {
    fill: #f59e0b !important;
    stroke: #b45309;
    stroke-width: 2;
  }
  .schem-socket.is-pending {
    fill: rgba(245, 158, 11, 0.35) !important;
    stroke: none;
  }
  .schem-pin-tooltip {
    pointer-events: none;
    font-size: 10px;
    font-weight: 700;
    font-family: system-ui, -apple-system, sans-serif;
    fill: #1f2937;
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3;
    stroke-linejoin: round;
  }
  .schem-component {
    cursor: grab;
  }
  .schem-component.is-dragging { cursor: grabbing; }
  .schem-selection-halo {
    pointer-events: none;
  }
  .schem-palette-ghost {
    position: fixed;
    pointer-events: none;
    opacity: 0.7;
    z-index: 1000;
    filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.25));
  }
  .schem-wire-preview {
    pointer-events: none;
  }
  .schem-wire {
    fill: none;
    stroke-linecap: round;
    pointer-events: stroke;
    cursor: pointer;
  }
  .schem-wire:hover { opacity: 0.7; }
  .schem-solder {
    pointer-events: none;
  }

  .schem-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink-hi);
    color: white;
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    z-index: 200;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
  }
  .schem-toast.is-visible {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px);
  }

  .schem-hint {
    font-size: 12.5px;
    color: var(--ink-mid);
    line-height: 1.55;
    padding: 10px 14px;
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
  }

  /* ============== VIBE CODING TOOL ============== */
  /* Companion layout: AI chat lives in a persistent left pane, the Arduino
     editor + serial monitor in the right pane — both visible at once, like
     ChatGPT next to the Arduino IDE. Stacks vertically on narrow screens. */
  .vibe-wrap {
    display: grid;
    grid-template-columns: minmax(340px, 40%) 1fr;
    gap: 16px;
    margin-top: 8px;
    height: calc(100vh - 190px);
    min-height: 560px;
  }
  @media (max-width: 900px) {
    .vibe-wrap {
      grid-template-columns: 1fr;
      height: auto;
      min-height: 0;
    }
    .vibe-left { height: 70vh; min-height: 460px; }
    .vibe-right { min-height: 520px; }
  }

  /* ----- Left pane: the AI chat companion ----- */
  .vibe-left {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .vibe-left-head {
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--bg-2);
  }
  .vibe-left-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2px;
    color: var(--ink-hi);
    margin: 0;
    display: inline-flex;
    align-items: center;
    gap: 9px;
  }
  .vibe-left-title-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, #14b8a6, var(--accent));
    box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.16);
  }
  .vibe-left-clear {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-low);
    border-radius: 8px;
    padding: 5px 11px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .vibe-left-clear:hover { border-color: var(--ink-mid); color: var(--ink-mid); }

  /* Floating Ask AI button — gradient pill, fixed bottom-right. */
  .vibe-ai-fab {
    position: fixed;
    bottom: 28px;
    right: 28px;
    z-index: 90;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, #14b8a6 0%, #0ea5e9 55%, var(--accent) 100%);
    color: white;
    border: none;
    border-radius: 999px;
    padding: 14px 22px 14px 18px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.4px;
    cursor: pointer;
    box-shadow: 0 14px 34px rgba(59, 130, 246, 0.30), 0 2px 6px rgba(0, 0, 0, 0.08);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .vibe-ai-fab:hover {
    transform: translateY(-2px);
    box-shadow: 0 20px 48px rgba(59, 130, 246, 0.36), 0 2px 6px rgba(0, 0, 0, 0.10);
  }
  .vibe-ai-fab .vibe-ai-fab-icon {
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    flex-shrink: 0;
  }
  .vibe-ai-fab .vibe-ai-fab-icon svg { width: 14px; height: 14px; }

  .vibe-drawer-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
  }
  .vibe-drawer-backdrop.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  .vibe-drawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(540px, 92vw);
    z-index: 101;
    background: var(--bg-1);
    box-shadow: -16px 0 48px rgba(15, 23, 42, 0.18);
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.32, 0.72, 0.4, 1);
    display: flex;
    flex-direction: column;
  }
  .vibe-drawer.is-open { transform: translateX(0); }

  .vibe-drawer-head {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    background: white;
  }
  .vibe-drawer-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink-hi);
    margin: 0;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .vibe-drawer-title-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, #14b8a6, var(--accent));
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
  }
  .vibe-drawer-close {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-mid);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .vibe-drawer-close:hover { border-color: var(--ink-mid); color: var(--ink-hi); }

  /* The role / "stem" card — frames the conversation as if the student
     is talking to an assistive-technology engineer. Read-only context. */
  .vibe-role-card {
    margin: 16px 18px 0;
    padding: 16px 18px;
    background: linear-gradient(135deg, rgba(20, 184, 166, 0.09) 0%, rgba(59, 130, 246, 0.08) 100%);
    border: 1px solid rgba(59, 130, 246, 0.22);
    border-radius: 14px;
    color: var(--ink-hi);
    line-height: 1.55;
  }
  .vibe-role-card-eyebrow {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }
  .vibe-role-card-body {
    font-size: 13.5px;
    color: var(--ink-mid);
    margin: 0;
  }
  .vibe-role-card-body strong { color: var(--ink-hi); font-weight: 600; }

  @media (max-width: 980px) {
    .vibe-wrap { height: auto; }
  }
  .vibe-panel {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .vibe-panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--bg-2);
  }
  .vibe-panel-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-mid);
    margin: 0;
  }
  .vibe-panel-actions {
    display: flex;
    gap: 5px;
    align-items: center;
    flex-wrap: wrap;
  }

  /* Chat panel */
  .vibe-chat-scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }
  .vibe-chat-empty {
    color: var(--ink-low);
    font-size: 13.5px;
    text-align: center;
    padding: 32px 18px;
    line-height: 1.6;
  }
  .vibe-chat-empty strong {
    color: var(--ink-mid);
    display: block;
    margin-bottom: 8px;
    font-size: 14.5px;
  }
  .vibe-msg {
    max-width: 92%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .vibe-msg-user {
    align-self: flex-end;
    background: var(--accent);
    color: white;
    border: none;
  }
  .vibe-msg-ai {
    align-self: flex-start;
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--ink-hi);
  }
  .vibe-msg-error {
    align-self: flex-start;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    font-size: 13.5px;
  }
  .vibe-msg-loading {
    align-self: flex-start;
    color: var(--ink-mid);
    font-size: 13.5px;
    font-style: italic;
    animation: vibePulse 1.4s ease-in-out infinite;
  }
  @keyframes vibePulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  .vibe-msg-codepreview {
    margin-top: 8px;
    background: #1e293b;
    color: #e2e8f0;
    border-radius: 8px;
    padding: 10px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    font-size: 12px;
    line-height: 1.5;
    max-height: 180px;
    overflow: auto;
    white-space: pre;
  }
  .vibe-msg-copybtn {
    margin-top: 8px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .vibe-msg-copybtn:hover { background: var(--accent-hover); }
  .vibe-msg-copybtn.is-copied { background: var(--success); }

  .vibe-stems-wrap {
    border-top: 1px solid var(--border);
    background: var(--bg-2);
    padding: 9px 14px 0;
  }
  .vibe-stems {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .vibe-stem {
    background: white;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-mid);
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .vibe-stem:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .vibe-stem--primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 3px 10px rgba(59, 130, 246, 0.22);
  }
  .vibe-stem--primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: #fff;
  }
  .vibe-stem--primary .vibe-stem-icon { opacity: 1; }
  .vibe-stem-icon { font-size: 10.5px; opacity: 0.7; }

  /* The composer card — textarea + send button share one rounded card that
     lifts on focus (the signature premium moment). */
  .vibe-input-row {
    border-top: 1px solid var(--border);
    padding: 12px 14px 14px;
    background: var(--bg-2);
  }
  .vibe-composer {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px 8px 8px 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .vibe-composer:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15), 0 6px 18px rgba(59, 130, 246, 0.10);
  }
  /* The textarea sits transparently on top of a mirror layer that re-renders
     the same text. The mirror is what's actually visible — it lets us paint
     the <FILL-IN> tokens blue, which a bare textarea can't do. The two share
     identical box metrics so the caret lands exactly on the painted glyphs. */
  .vibe-input-wrap {
    flex: 1 1 auto;
    position: relative;
    display: flex;
    min-width: 0;
  }
  .vibe-input,
  .vibe-input-mirror {
    font: inherit;
    font-size: 14.5px;
    line-height: 1.5;
    padding: 7px 0;
    letter-spacing: normal;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .vibe-input {
    position: relative;
    z-index: 1;
    flex: 1 1 auto;
    width: 100%;
    border: none;
    background: transparent;
    min-height: 76px;
    max-height: 220px;
    overflow-y: auto;
    color: transparent;
    caret-color: var(--ink-hi);
    resize: none;
    outline: none;
  }
  .vibe-input-mirror {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow-y: auto;
    pointer-events: none;
    color: var(--ink-hi);
    margin: 0;
  }
  /* Empty mirror shows nothing; the textarea's own ::placeholder handles the
     hint so we don't double up. */
  .vibe-input-mirror:empty { display: none; }
  .vibe-fillin {
    color: var(--accent);
    font-weight: 600;
    background: var(--accent-soft);
    border-radius: 4px;
    padding: 0 2px;
  }
  .vibe-input::placeholder { color: var(--ink-low); }
  /* When a stem auto-selects the fill-in token, keep that selection blue too. */
  .vibe-input::selection { background: rgba(99, 102, 241, 0.22); }

  /* Empty state: no conversation yet. Collapse the blank chat scroll and let
     the composer grow to fill the panel as one big writing box. */
  .vibe-left.is-empty .vibe-chat-scroll {
    flex: 0 0 0;
    min-height: 0;
    padding: 0;
    overflow: hidden;
  }
  .vibe-left.is-empty .vibe-input-row {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
  }
  .vibe-left.is-empty .vibe-composer {
    flex: 1 1 auto;
    align-items: stretch;
  }
  .vibe-left.is-empty .vibe-input-wrap { height: 100%; }
  .vibe-left.is-empty .vibe-input {
    max-height: none;
    height: 100%;
  }
  .vibe-left.is-empty .vibe-send-btn { align-self: flex-end; }

  .vibe-send-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 11px;
    padding: 0;
    width: 40px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.12s ease, opacity 0.15s ease;
    flex-shrink: 0;
  }
  .vibe-send-btn:hover:not(:disabled) { transform: translateY(-1px); background: var(--accent-hover); }
  .vibe-send-btn:disabled {
    background: var(--border);
    color: var(--ink-low);
    cursor: not-allowed;
  }
  /* Markdown rendering inside assistant chat bubbles. */
  .vibe-md p { margin: 0 0 8px; }
  .vibe-md p:last-child { margin-bottom: 0; }
  .vibe-md ul, .vibe-md ol { margin: 4px 0 8px; padding-left: 20px; }
  .vibe-md li { margin: 2px 0; }
  .vibe-md strong { font-weight: 700; color: var(--ink-hi); }
  .vibe-md code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    font-size: 12.5px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 5px;
  }
  /* A generated-code block in chat, with its own action bar. */
  .vibe-codeblock {
    margin: 10px 0 6px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #1e293b;
  }
  .vibe-codeblock-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: #0f172a;
    padding: 6px 10px;
  }
  .vibe-codeblock-lang {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #94a3b8;
  }
  .vibe-codeblock-actions { display: flex; gap: 6px; }
  .vibe-codeblock-btn {
    background: #1e293b;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 7px;
    padding: 4px 10px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.14s ease, border-color 0.14s ease;
  }
  .vibe-codeblock-btn:hover { background: #334155; }
  .vibe-codeblock-btn.is-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .vibe-codeblock-btn.is-primary:hover { background: var(--accent-hover); }
  .vibe-codeblock-btn.is-done { background: var(--success); border-color: var(--success); color: #fff; }
  .vibe-codeblock pre {
    margin: 0;
    background: #1e293b;
    color: #e2e8f0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    font-size: 12px;
    line-height: 1.5;
    padding: 11px 12px;
    max-height: 260px;
    overflow: auto;
    white-space: pre;
  }

  /* Editor panel: takes full page width now. Editor expands, monitor docks
     at bottom. */
  .vibe-right {
    display: grid;
    grid-template-rows: auto auto 1fr auto auto auto;
    min-height: 0;
    flex: 1 1 auto;
  }
  .vibe-editor-wrap {
    flex: 1 1 auto;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 240px;
  }
  .vibe-editor-wrap .CodeMirror {
    height: 100%;
    font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
  }
  .vibe-editor-fallback {
    flex: 1 1 auto;
    width: 100%;
    border: none;
    padding: 14px 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    font-size: 13px;
    line-height: 1.55;
    background: var(--bg-1);
    color: var(--ink-hi);
    resize: none;
    outline: none;
  }
  .vibe-monitor-header {
    background: #0f172a;
    color: #cbd5e1;
    padding: 7px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-top: 1px solid var(--border);
  }
  .vibe-monitor-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: #94a3b8;
    margin: 0;
  }
  .vibe-monitor-controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .vibe-monitor-controls select,
  .vibe-monitor-controls .vibe-mini-btn {
    background: #1e293b;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 5px 11px;
    font-size: 11.5px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .vibe-monitor-controls .vibe-mini-btn:hover {
    background: #334155;
  }
  .vibe-monitor {
    background: #0b1220;
    color: #4ade80;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    font-size: 12px;
    line-height: 1.5;
    padding: 8px 14px;
    height: 68px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .vibe-monitor::-webkit-scrollbar { width: 10px; }
  .vibe-monitor::-webkit-scrollbar-track { background: #0b1220; }
  .vibe-monitor::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  .vibe-monitor::-webkit-scrollbar-thumb:hover { background: #334155; }
  .vibe-monitor-empty {
    color: #475569;
    font-style: italic;
  }
  .vibe-monitor-send {
    display: flex;
    align-items: stretch;
    gap: 6px;
    padding: 6px 8px;
    background: #0b1220;
    border-top: 1px solid #1e293b;
  }
  .vibe-monitor-input {
    flex: 1 1 auto;
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 6px;
    color: #e2e8f0;
    padding: 5px 9px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    font-size: 12px;
    outline: none;
    transition: border-color 0.12s ease;
  }
  .vibe-monitor-input:focus { border-color: var(--accent); }
  .vibe-monitor-input::placeholder { color: #475569; }
  .vibe-monitor-input:disabled { opacity: 0.5; }
  .vibe-monitor-ending {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 6px;
    color: #cbd5e1;
    font-size: 11px;
    padding: 4px 6px;
    cursor: pointer;
  }
  .vibe-monitor-send-btn {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    padding: 5px 14px;
    font-weight: 600;
  }
  .vibe-monitor-send-btn:hover:not(:disabled) {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }
  .vibe-monitor-send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .vibe-monitor-fix-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: white;
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 4px 12px;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    margin: 4px 0;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .vibe-monitor-fix-btn:hover { background: var(--accent-hover); }
  .vibe-monitor-fix-btn:active { transform: translateY(1px); }
  /* Secondary "Explain this error" button — outline, sits beside the fix button.
     Explaining first (instead of auto-fixing) is the pedagogical default. */
  .vibe-monitor-explain-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    color: #93c5fd;
    border: 1px solid #3b557a;
    border-radius: 6px;
    padding: 4px 12px;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    margin: 4px 0 4px 8px;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .vibe-monitor-explain-btn:hover { background: rgba(147,197,253,0.12); border-color: #93c5fd; }
  .vibe-monitor-explain-btn:active { transform: translateY(1px); }

  .vibe-btn {
    background: var(--bg-1);
    border: 1px solid var(--border);
    color: var(--ink-mid);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  /* Icon-only segmented toolbar: each button is a 34x34 square with the
     icon centered. Buttons within a group share a soft container with
     internal dividers. Hover lifts to white + indigo icon; active state
     fills indigo. Reads as a deliberate, slick toolbar component. */
  .vibe-toolbar-group {
    display: inline-flex;
    align-items: stretch;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    padding: 0;
    box-shadow: 0 1px 0 rgba(17, 17, 17, 0.02);
  }
  .vibe-tool-btn {
    background: transparent;
    border: none;
    color: var(--ink-mid);
    width: 36px;
    height: 32px;
    padding: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.14s ease, color 0.14s ease, transform 0.12s ease;
    line-height: 1;
    font-family: inherit;
  }
  .vibe-tool-btn + .vibe-tool-btn { border-left: 1px solid var(--border); }
  .vibe-tool-btn svg {
    color: var(--ink-mid);
    transition: color 0.14s ease, transform 0.12s ease;
    display: block;
  }
  .vibe-tool-btn:hover {
    background: white;
  }
  .vibe-tool-btn:hover svg {
    color: var(--accent);
    transform: scale(1.08);
  }
  .vibe-tool-btn:active svg { transform: scale(0.94); }
  .vibe-tool-btn.is-active,
  .vibe-tool-btn.is-copied {
    background: var(--accent);
  }
  .vibe-tool-btn.is-active svg,
  .vibe-tool-btn.is-copied svg { color: white; }

  /* Floating hover tooltip for tool buttons. Body-mounted so the toolbar
     group's overflow:hidden can't clip it. */
  .tt-tooltip {
    position: fixed;
    z-index: 1300;
    background: #111827;
    color: #f9fafb;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.2;
    padding: 6px 10px;
    border-radius: 6px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity 0.12s ease, transform 0.12s ease;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.18), 0 1px 3px rgba(15, 23, 42, 0.08);
    letter-spacing: 0;
    text-transform: none;
  }
  .tt-tooltip.is-visible {
    opacity: 1;
    transform: translateY(0);
  }
  .vibe-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .vibe-btn.is-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .vibe-btn.is-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: white;
  }
  .vibe-btn.is-active {
    background: var(--success);
    border-color: var(--success);
    color: white;
  }
  .vibe-btn.is-copied {
    background: var(--success);
    border-color: var(--success);
    color: white;
  }

  /* "+ Save to..." popover (shared by Schematic + Vibe Coding tools). */
  .save-to-anchor {
    position: relative;
    display: inline-block;
  }
  .save-to-pop {
    position: fixed;
    z-index: 1200;
    width: 320px;
    max-height: 460px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 12px 32px rgba(15, 23, 42, 0.14), 0 2px 6px rgba(15, 23, 42, 0.06);
    padding: 6px 0;
    text-align: left;
  }
  .save-to-section {
    border-top: 1px solid var(--border);
    padding: 8px 0 6px;
  }
  .save-to-section:first-child { border-top: none; }
  .save-to-eyebrow {
    display: block;
    padding: 6px 14px 4px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--ink-mid);
  }
  .save-to-item {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 38px;
    padding: 8px 14px;
    background: transparent;
    border: 0;
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
    letter-spacing: 0;
    text-transform: none;
  }
  .save-to-item:hover:not(:disabled) {
    background: var(--bg-2);
    color: var(--accent);
  }
  .save-to-item:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .save-to-item.is-portfolio {
    font-weight: 600;
    color: var(--accent);
  }
  .save-to-item.is-portfolio:hover:not(:disabled) {
    background: var(--accent-soft);
  }
  .save-to-item .save-to-arrow {
    margin-right: 4px;
    opacity: 0.6;
  }

  /* Chat avatars — ChatGPT-style "AI" / "You" mini circles next to each
     message. Keeps the conversation legible at a glance. */
  .vibe-msg-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .vibe-msg-row.is-user { flex-direction: row-reverse; }
  .vibe-msg-row.is-loading { gap: 10px; }
  .vibe-msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.4px;
    color: white;
    margin-top: 2px;
  }
  .vibe-msg-avatar.is-ai {
    background: linear-gradient(135deg, #14b8a6, #0d9488);
  }
  .vibe-msg-avatar.is-user {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
  }
  .vibe-msg-row .vibe-msg { max-width: 100%; flex: 1 1 auto; }

  /* Libraries strip — sits above the editor, mimics Arduino IDE's
     "library inclusions" visibility. Auto-detects #include lines from the
     editor and surfaces quick-add buttons for the libraries the class uses. */
  .vibe-libs {
    background: var(--bg-2);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 9px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 12px;
  }
  .vibe-libs-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--ink-low);
    flex-shrink: 0;
  }
  .vibe-libs-active {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1 1 auto;
    min-width: 0;
  }
  .vibe-libs-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    font-size: 11.5px;
    color: var(--paper-ink);
  }
  .vibe-libs-chip.is-empty {
    background: transparent;
    border-style: dashed;
    color: var(--ink-low);
    font-family: inherit;
    font-style: italic;
  }
  .vibe-libs-add {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .vibe-libs-add button {
    background: white;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    font-size: 11.5px;
    color: var(--accent);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .vibe-libs-add button:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .vibe-libs-add button:disabled {
    color: var(--ink-low);
    cursor: not-allowed;
    opacity: 0.6;
  }

  /* Connection status strip at the very bottom of the right panel. */
  .vibe-status {
    background: var(--bg-2);
    border-top: 1px solid var(--border);
    padding: 7px 14px;
    font-size: 11.5px;
    color: var(--ink-mid);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .vibe-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ink-low);
  }
  .vibe-status.is-connected .vibe-status-dot { background: var(--success); }
  .vibe-status.is-connected { color: var(--paper-ink); }

  /* Class code modal */
  .vibe-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(17, 17, 17, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 250;
    padding: 20px;
  }
  .vibe-modal {
    background: var(--bg-1);
    border-radius: 14px;
    padding: 28px 28px 24px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
  }
  .vibe-modal h3 {
    margin: 0 0 6px;
    font-size: 18px;
    font-weight: 700;
    color: var(--ink-hi);
  }
  .vibe-modal p {
    margin: 0 0 16px;
    font-size: 13.5px;
    color: var(--ink-mid);
    line-height: 1.5;
  }
  .vibe-modal input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    box-sizing: border-box;
    margin-bottom: 12px;
    color: var(--ink-hi);
  }
  .vibe-modal input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }
  .vibe-modal-error {
    color: #b91c1c;
    font-size: 12.5px;
    margin: 0 0 10px;
    min-height: 16px;
  }
  .vibe-modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  /* ============== IDEA BOARD TOOL ==============
     Free-form prototype sketch surface (Konva). Mirrors .schem-* chrome 1:1
     so it reads as a sibling to Wiring Schematic — same toolbar, same pill
     buttons, same icon style, same stage frame. All state in
     d4sg-idea-board-v1 (localStorage), no autosave to cloud. */
  .idea-wrap {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  /* One continuous toolbar across the top — never wraps to a second line.
     If the viewport is too narrow to hold every group, the bar scrolls
     horizontally (slim styled scrollbar) instead of stacking. */
  /* ====== Idea Board v2 (Excalidraw embedded) ====== */
  .idea-pro-wrap {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    height: calc(100vh - 150px);
    min-height: 760px;
  }
  .idea-pro-wrap .schem-back { align-self: flex-start; }
  /* Horizontal strip of one-click AT component stamps above the canvas. */
  .idea-pro-stamps {
    display: flex;
    flex-wrap: nowrap;           /* stay on ONE line — never spill to a 2nd row */
    gap: 5px;
    padding: 8px 10px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow-x: auto;            /* if the chips don't fit, scroll sideways */
    overflow-y: hidden;
    scrollbar-width: thin;
  }
  .idea-pro-stamps::-webkit-scrollbar { height: 6px; }
  .idea-pro-stamps::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .idea-stamp-btn {
    flex: 0 0 auto;              /* keep natural width; don't squish */
    white-space: nowrap;
    background: white;
    border: 1px solid var(--border);
    color: var(--ink-mid);
    padding: 4px 9px;
    border-radius: 7px;
    font: inherit;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease, transform 0.1s ease;
  }
  .idea-stamp-btn:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .idea-stamp-btn:active { transform: translateY(1px); }
  /* Export = secondary (outline). Saving straight into a benchmark is the
     primary path, so file download is de-emphasized. */
  .idea-stamp-btn--export {
    background: transparent;
    color: var(--accent);
    border-color: var(--accent);
  }
  .idea-stamp-btn--export:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  /* Save to Benchmark / Portfolio = the primary call to action. */
  .idea-stamp-btn--save {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 700;
    box-shadow: 0 1px 6px rgba(79, 70, 229, 0.28);
  }
  .idea-stamp-btn--save:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: #fff;
  }
  .idea-stamp-divider {
    width: 1px;
    align-self: stretch;
    background: var(--border-strong);
    margin: 0 4px;
  }
  .idea-pro-frame {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(17, 17, 17, 0.04);
  }
  .idea-pro-canvas {
    position: absolute;
    inset: 0;
    background: #ffffff;
  }
  /* We drive Excalidraw entirely from our own docked toolbar (.idea-toolbar),
     so hide ALL of its built-in chrome. Excalidraw puts that chrome in
     different direct children of .excalidraw depending on width — desktop uses
     .layer-ui__wrapper; the narrow/compact layout uses .App-top-bar +
     .App-bottom-bar. Rather than chase class names per breakpoint, hide every
     direct-child UI div and allowlist only the functional overlays we need:
     the canvas wrapper, the text-edit container, the right-click context menu,
     the eyedropper, and the laser overlay. The interactive <canvas> is a direct
     child too but it's a <canvas> (not a div), so this never touches it. */
  .idea-pro-canvas .excalidraw > div:not(.excalidraw__canvas-wrapper):not(.excalidraw-textEditorContainer):not(.excalidraw-contextMenuContainer):not(.excalidraw-eye-dropper-container):not(.LaserToolOverlay) {
    display: none !important;
  }

  /* ---- Unified docked drawing toolbar (replaces Excalidraw's floating UI) ---- */
  .idea-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    padding: 8px 10px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .idea-tb-group { display: flex; align-items: center; gap: 4px; }
  .idea-tb-colors { gap: 7px; padding: 0 2px; }
  .idea-tb-div {
    width: 1px;
    align-self: stretch;
    background: var(--border-strong);
    margin: 3px 7px;
  }
  .idea-tool-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    padding: 0;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--ink-mid);
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease, transform 0.08s ease;
  }
  .idea-tool-btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .idea-tool-btn:active { transform: translateY(1px); }
  .idea-tool-btn.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .idea-tool-btn--danger:hover { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }
  .idea-color-swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px var(--border);
    padding: 0;
    transition: transform 0.08s ease, box-shadow 0.12s ease;
  }
  .idea-color-swatch:hover { transform: scale(1.14); }
  .idea-color-swatch.is-active { box-shadow: 0 0 0 2px var(--accent); }
  /* Fill swatches are SQUARES to read differently from the round stroke swatches. */
  .idea-fill-swatch {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    cursor: pointer;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px var(--border);
    padding: 0;
    transition: transform 0.08s ease, box-shadow 0.12s ease;
  }
  .idea-fill-swatch:hover { transform: scale(1.14); }
  .idea-fill-swatch.is-active { box-shadow: 0 0 0 2px var(--accent); }
  /* "No fill" chip: white with a red diagonal slash. */
  .idea-fill-clear {
    background: #fff;
    background-image: linear-gradient(45deg, transparent 44%, #ef4444 44%, #ef4444 56%, transparent 56%);
  }
  .idea-tb-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--ink-mid);
    opacity: 0.7;
    margin-right: 3px;
  }
  .idea-zoom-label {
    min-width: 44px;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-mid);
    font-variant-numeric: tabular-nums;
  }

  /* "New version available" banner — surfaced when the loaded index.html no
     longer matches what the server is serving (single-page app can't see new
     deploys without a full reload). */
  #updateBanner {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--accent);
    color: #fff;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.20);
  }
  #updateBannerBtn {
    background: #fff;
    color: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 6px 14px;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  #updateBannerBtn:hover { background: #eef2ff; }
  /* Excalidraw root mounts inside .idea-pro-canvas; the library renders its
     own toolbar, hand-drawn shapes, palette, etc. We only constrain it to fit
     the working area. */
  .idea-pro-canvas .excalidraw {
    height: 100%;
    width: 100%;
  }
  .idea-pro-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-direction: column;
    color: var(--ink-mid);
    font-size: 13.5px;
    pointer-events: none;
  }
  .idea-pro-loading .spin {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2.5px solid var(--border-strong);
    border-top-color: var(--accent);
    animation: cadSpin 0.9s linear infinite;
  }
  .idea-pro-error {
    color: #b91c1c;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 10px;
    padding: 14px 18px;
    max-width: 480px;
    text-align: center;
    font-size: 13.5px;
    line-height: 1.55;
    pointer-events: auto;
  }

  .idea-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 8px 12px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    scrollbar-width: thin;
  }
  .idea-toolbar::-webkit-scrollbar { height: 6px; }
  .idea-toolbar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
  .idea-toolbar::-webkit-scrollbar-track { background: transparent; }
  .idea-toolbar > * { flex-shrink: 0; }
  .idea-toolbar-group {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-left: 10px;
    border-left: 1px solid var(--border);
  }
  .idea-toolbar-label { display: none; }
  .idea-color-row {
    display: flex;
    gap: 4px;
  }
  .idea-color {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    padding: 0;
  }
  .idea-color:hover { transform: scale(1.08); }
  .idea-color.is-active {
    border-color: var(--ink-hi);
    box-shadow: 0 0 0 2px var(--bg-1), 0 0 0 4px var(--ink-hi);
  }
  /* Stroke-width chip row — three pills with a visible bar inside. */
  .idea-width-row {
    display: flex;
    gap: 4px;
  }
  .idea-width {
    width: 26px;
    height: 22px;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    background: var(--bg-1);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: all 0.15s ease;
  }
  .idea-width:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .idea-width.is-active {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .idea-width span {
    display: block;
    width: 18px;
    background: var(--ink-hi);
    border-radius: 999px;
  }
  .idea-stage {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .idea-canvas-wrap {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    position: relative;
  }
  .idea-canvas-frame {
    background: #FFFFFF;
    border-radius: 8px;
    overflow: hidden;
    width: 100%;
    height: 620px;
    position: relative;
  }
  .idea-canvas-frame.is-dropping {
    outline: 2px dashed var(--accent);
    outline-offset: -4px;
  }
  /* Textarea overlay shown when a callout text node is double-clicked. */
  .idea-text-edit {
    position: absolute;
    background: white;
    border: 1.5px solid var(--accent);
    border-radius: 6px;
    padding: 4px 6px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink-hi);
    box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    outline: none;
    resize: none;
    z-index: 30;
    line-height: 1.35;
  }
  .idea-hint {
    font-size: 12.5px;
    color: var(--ink-mid);
    line-height: 1.55;
    padding: 10px 14px;
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
  }

  /* =================================================================
     CAD TOOL — Wizard / AI Build / Code, sharing one JSCAD + Three.js
     engine. Lazy-loaded on first open so the rest of the hub stays
     light. Lives inside the standard /tools/* shell. */
  /* Tinkercad-style layout: viewport-bounded canvas takes the main area, a
     thin right rail holds Shapes + AI tabs that scroll independently. */
  .cad-wrap {
    display: flex;
    flex-direction: column;
    gap: 14px;
    /* Lock the whole working area to the visible viewport so scrolling inside
       the sidebar never moves the canvas (or the page). */
    height: calc(100vh - 200px);
    min-height: 540px;
  }
  .cad-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 14px;
    align-items: stretch;
    flex: 1 1 auto;
    min-height: 0;
  }
  .cad-side {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .cad-side-tabs {
    display: flex;
    padding: 6px;
    gap: 4px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
  }
  .cad-side-tab {
    flex: 1 1 0;
    background: transparent;
    border: none;
    padding: 6px 0;
    font: inherit;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.4px;
    color: var(--ink-mid);
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .cad-side-tab:hover { color: var(--ink-hi); }
  .cad-side-tab.is-active {
    background: var(--accent);
    color: white;
    box-shadow: 0 2px 5px rgba(99, 102, 241, 0.22);
  }
  .cad-side-head {
    padding: 9px 14px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-low);
    border-bottom: 1px solid var(--border);
    background: var(--bg-1);
  }
  .cad-side-body {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    scrollbar-width: thin;
  }
  .cad-side-body::-webkit-scrollbar { width: 6px; }
  .cad-side-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
  .cad-side-body::-webkit-scrollbar-track { background: transparent; }
  .cad-panel {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .cad-panel-head {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-2);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--ink-low);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .cad-panel-body {
    flex: 1 1 auto;
    overflow: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  /* ---- Viewer (right panel) ---- */
  .cad-viewer-wrap {
    position: relative;
    flex: 1 1 auto;
    min-height: 420px;
    background: linear-gradient(180deg, #f4f3ee 0%, #e8e7e2 100%);
    border-bottom: 1px solid var(--border);
  }
  .cad-viewer {
    position: absolute;
    inset: 0;
  }
  .cad-viewer canvas { display: block; width: 100% !important; height: 100% !important; }
  .cad-viewer-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: var(--ink-mid);
    font-size: 13.5px;
    pointer-events: none;
  }
  .cad-viewer-loading .spin {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2.5px solid var(--border-strong);
    border-top-color: var(--accent);
    animation: cadSpin 0.9s linear infinite;
  }
  @keyframes cadSpin { to { transform: rotate(360deg); } }
  .cad-viewer-error {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 12px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    max-height: 40%;
    overflow: auto;
  }
  /* Top-of-viewer command strip: every action button + status, no bottom bar. */
  .cad-viewer-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .cad-viewer-head .cad-btn { padding: 6px 12px; font-size: 12.5px; }
  .cad-viewer-head .cad-status { margin-left: auto; }
  .cad-btn--icon {
    padding: 6px 8px !important;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  /* Bottom-corner reminder of the mouse controls. Pointer-none so it never
     intercepts a drag aimed at the canvas. */
  .cad-viewer-hint {
    position: absolute;
    left: 12px;
    bottom: 10px;
    font-size: 11px;
    color: var(--ink-low);
    background: rgba(255, 255, 255, 0.75);
    padding: 4px 8px;
    border-radius: 6px;
    pointer-events: none;
    z-index: 4;
    letter-spacing: 0.2px;
  }
  /* In-app maximize: the panel pins itself to the viewport so the viewer fills
     the working area, but the browser stays put (no native fullscreen handoff,
     no OS chrome flicker, no crash on rapid toggles). Toggling the class
     alone does the work; cadToggleFullscreen forces a renderer resize next
     frame. */
  .cad-panel.is-maximized {
    position: fixed;
    inset: 0;
    z-index: 9999;
    width: 100vw;
    height: 100vh;
    border-radius: 0;
    background: var(--bg-1);
    box-shadow: 0 0 0 9999px rgba(17, 17, 17, 0.35);
  }
  .cad-panel.is-maximized .cad-viewer-wrap {
    min-height: 0;
    height: calc(100vh - 52px);
  }
  /* When maximized, the fullscreen button flips meaning: it's now an exit. */
  .cad-panel.is-maximized #cadBtnFullscreen { color: var(--accent); border-color: var(--accent); }
  .cad-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--ink-hi);
    border-radius: 9px;
    padding: 8px 14px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }
  .cad-btn:hover { background: white; border-color: var(--border-strong); }
  .cad-btn:active { transform: translateY(1px); }
  .cad-btn--primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .cad-btn--primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: white; }
  .cad-btn[disabled] { opacity: 0.55; cursor: not-allowed; }
  .cad-status {
    font-size: 12px;
    color: var(--ink-low);
    margin-left: auto;
  }
  .cad-status.is-error { color: #b91c1c; font-weight: 600; }
  .cad-status.is-good { color: #047857; font-weight: 600; }

  /* ---- Shapes panel (dense, sidebar-friendly) ---- */
  .cad-wiz-templates {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
  }
  .cad-wiz-template {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    text-align: left;
    cursor: pointer;
    font: inherit;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    min-height: 44px;
    display: flex;
    align-items: center;
  }
  .cad-wiz-template:hover { background: white; border-color: var(--accent); }
  .cad-wiz-template.is-active {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .cad-wiz-template-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-hi);
    line-height: 1.25;
  }
  /* The blurb still lives in the DOM (for accessibility and as a tooltip via
     `title`), but it doesn't show in the dense layout. */
  .cad-wiz-template-blurb {
    display: none;
  }
  .cad-wiz-form {
    display: flex;
    flex-direction: column;
    gap: 9px;
    border-top: 1px dashed var(--border);
    padding-top: 12px;
    margin-top: 4px;
  }
  .cad-wiz-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 14px;
  }
  .cad-wiz-row label {
    font-size: 12.5px;
    color: var(--ink-mid);
    font-weight: 500;
  }
  .cad-wiz-row input[type="number"],
  .cad-wiz-row select {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 6px 8px;
    font: inherit;
    font-size: 13px;
    color: var(--ink-hi);
    width: 90px;
    text-align: right;
  }
  .cad-wiz-row select { width: auto; text-align: left; }
  .cad-wiz-row input[type="number"]:focus,
  .cad-wiz-row select:focus { outline: none; border-color: var(--accent); }

  /* ---- AI Build mode ---- */
  .cad-ai-stems {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .cad-ai-stem {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-mid);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .cad-ai-stem:hover { background: white; color: var(--ink-hi); border-color: var(--border-strong); }
  .cad-ai-stem.is-primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .cad-ai-stem.is-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: white; }
  .cad-ai-composer {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .cad-ai-composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
  .cad-ai-input {
    border: none;
    background: transparent;
    font: inherit;
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink-hi);
    resize: none;
    outline: none;
    min-height: 80px;
  }
  .cad-ai-composer-actions {
    display: flex;
    justify-content: flex-end;
  }
  .cad-ai-log {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .cad-ai-msg {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.55;
    color: var(--paper-ink);
    white-space: pre-wrap;
  }
  .cad-ai-msg.is-user {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink-hi);
  }

  /* ---- Inspector (shown above the palette when a shape is selected) ---- */
  .cad-insp {
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 10px 11px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .cad-insp--empty {
    background: var(--bg-2);
    border: 1px dashed var(--border-strong);
  }
  .cad-insp-hint {
    margin: 0;
    font-size: 12px;
    color: var(--ink-mid);
    line-height: 1.45;
  }
  .cad-insp-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .cad-insp-head strong {
    font-size: 13px;
    color: var(--ink-hi);
    letter-spacing: -0.01em;
  }
  .cad-insp-head-actions { display: inline-flex; gap: 4px; }
  .cad-insp-toggle {
    background: white;
    border: 1px solid var(--border);
    color: var(--ink-mid);
    border-radius: 6px;
    padding: 3px 8px;
    font: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .cad-insp-toggle:hover { color: var(--ink-hi); border-color: var(--border-strong); }
  .cad-insp-toggle.is-hole {
    background: #fef2f2;
    border-color: #fca5a5;
    color: #b91c1c;
  }
  .cad-insp-delete {
    background: white;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 8px;
    font: inherit;
    font-size: 14px;
    line-height: 1;
    color: var(--ink-low);
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .cad-insp-delete:hover { background: #fef2f2; color: #b91c1c; border-color: #fca5a5; }
  .cad-insp-section {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .cad-insp-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--ink-low);
  }
  .cad-insp-section .cad-wiz-row { gap: 8px; }
  .cad-insp-section .cad-wiz-row input { width: 72px; }
  .cad-insp-triplet {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 5px;
  }
  .cad-insp-triplet input {
    width: 100%;
    background: white;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 6px;
    font: inherit;
    font-size: 12px;
    color: var(--ink-hi);
    text-align: right;
  }
  .cad-insp-triplet input:focus { outline: none; border-color: var(--accent); }
  .cad-insp-triplet-axes {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 5px;
    text-align: center;
    font-size: 9px;
    font-weight: 700;
    color: var(--ink-low);
    letter-spacing: 1px;
  }

  /* ---- Template category heading inside the Templates panel ---- */
  .cad-wiz-cat {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--ink-low);
    margin: 14px 0 -2px;
  }
  .cad-wiz-cat:first-child { margin-top: 0; }

  /* ---- Floating View Pad (Tinkercad-style face snapper) ---- */
  .cad-view-pad {
    position: absolute;
    top: 10px;
    right: 10px;
    display: grid;
    grid-template-columns: 32px 32px 32px;
    gap: 4px;
    z-index: 5;
    pointer-events: none;
  }
  .cad-view-pad button {
    width: 32px;
    height: 32px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.95);
    color: var(--ink-mid);
    font: 700 10px/1 ui-sans-serif, system-ui, sans-serif;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease, transform 0.1s ease;
    pointer-events: auto;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }
  .cad-view-pad button:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: white;
  }
  .cad-view-pad button:active { transform: translateY(1px); }
  .cad-view-pad .cad-view-pad-fit {
    color: var(--accent);
    border-color: var(--accent);
    font-size: 14px;
  }

  @media (max-width: 980px) {
    .cad-grid { grid-template-columns: 1fr; }
    .cad-viewer-wrap { min-height: 360px; }
  }

  /* ============================================================
     EXHIBIT — a quiet, dedicated wall of past student work.
     Lives on its own route (/exhibit), reached only through a
     soft link under the home hero. Never in the top toolbar.
     ============================================================ */

  /* Soft entry portal under the home hero */
  .exhibit-portal {
    margin-top: 56px;
    padding-top: 34px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
  }
  .exhibit-portal a {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
    text-transform: none;
    color: var(--ink-mid);
    text-decoration: none;
    background: transparent;
    border: 1px solid transparent;
    margin: 0;
    padding: 9px 18px;
    border-radius: 999px;
    transition: color .18s ease, background .18s ease, gap .18s ease;
  }
  .exhibit-portal a:hover {
    color: var(--accent);
    background: var(--accent-soft);
    border-color: transparent;
    gap: 13px;
  }
  .exhibit-portal .ex-spark { color: var(--accent); opacity: .9; }
  .exhibit-portal .ex-arrow { transition: transform .18s ease; }
  .exhibit-portal a:hover .ex-arrow { transform: translateX(2px); }

  /* Exhibit page hero */
  .exhibit-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: normal;
    text-transform: none;
    color: var(--ink-low);
    text-decoration: none;
    background: transparent;
    border: none;
    margin: 0;
    padding: 0;
    transition: color .15s ease, gap .15s ease;
  }
  .exhibit-back:hover { color: var(--accent); gap: 9px; background: transparent; border-color: transparent; }
  .exhibit-hero {
    text-align: center;
    max-width: 660px;
    margin: 26px auto 46px;
  }
  .exhibit-eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 14px;
  }
  .exhibit-title {
    font-size: clamp(30px, 5vw, 46px);
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--ink-hi);
    margin: 0 0 14px;
    line-height: 1.04;
  }
  .exhibit-sub {
    font-size: 14.5px;
    color: var(--ink-mid);
    margin: 0;
    line-height: 1.6;
  }

  /* Card grid */
  .exhibit-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(278px, 1fr));
    gap: 22px;
  }
  .exhibit-card {
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    text-decoration: none;
    box-shadow: var(--shadow-sm);
    transition: transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s ease, border-color .2s ease;
  }
  .exhibit-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
    border-color: var(--border-strong);
  }
  .exhibit-thumb {
    position: relative;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: linear-gradient(135deg, var(--accent-soft), #ffffff 70%);
  }
  .exhibit-thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .45s cubic-bezier(.2,.7,.3,1);
  }
  .exhibit-card:hover .exhibit-thumb img { transform: scale(1.045); }
  .exhibit-thumb .ex-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--accent);
    opacity: .5;
  }
  .exhibit-type {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 2;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--ink-hi);
    background: rgba(255,255,255,.92);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    padding: 5px 11px;
    border-radius: 999px;
    box-shadow: var(--shadow-sm);
  }
  .exhibit-body {
    padding: 15px 17px 17px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
  }
