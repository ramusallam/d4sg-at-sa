<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>T4SG @ SA</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto+Mono:wght@400;500;600;700&family=Roboto+Serif:wght@400;500;600;700;800&display=swap" />
<style>
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  :root {
    /* Spark Learning aesthetic — warm cream page, white cards, indigo accent.
       Mirrors Studio/Companion tokens so T4SG feels like the same world. */
    --bg-0: #F7F3EE;        /* page — warm cream */
    --bg-1: #FFFFFF;        /* cards / panels */
    --bg-2: #FAF7F1;        /* nested surfaces (slightly warm) */
    --ink-hi: #1C1917;      /* primary text — warm stone */
    --ink-mid: #57534E;     /* secondary text — warm gray */
    --ink-low: #A0937B;     /* muted — warm tan */
    --accent: #6366f1;      /* indigo (Spark canonical) */
    --accent-hover: #4f46e5;
    --accent-soft: #EEF2FF;
    --success: #10b981;     /* Spark semantic green */
    --border: #E8E0D2;      /* warm border to match cream */
    --border-strong: #D6CDB8;

    /* Modal: white card on dimmed backdrop */
    --paper: #FFFFFF;
    --paper-soft: #FAF7F1;
    --paper-ink: #1C1917;
    --paper-ink-mid: #57534E;
    --paper-accent: #6366f1;

    /* Elevation tokens — match Spark scale */
    --shadow-sm: 0 1px 2px rgba(17, 17, 17, 0.04), 0 1px 3px rgba(17, 17, 17, 0.06);
    --shadow-md: 0 4px 12px rgba(17, 17, 17, 0.06), 0 2px 4px rgba(17, 17, 17, 0.04);
    --shadow-lg: 0 16px 40px rgba(17, 17, 17, 0.10), 0 4px 12px rgba(17, 17, 17, 0.06);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    background: var(--bg-0);
    color: var(--ink-hi);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
    font-size: 13px;
  }
  /* Display headings — Roboto Serif to match the Spark Companion type system. */
  .header-title,
  .project-title,
  .capstone-title,
  .modal-title,
  .syllabus-title,
  .exhibit-title,
  .cp-brief-challenge {
    font-family: "Roboto Serif", Georgia, "Times New Roman", serif;
  }

  /* ============== STICKY HEADER ============== */
  body > header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(247, 243, 238, 0.85);
    backdrop-filter: saturate(180%) blur(16px);
    -webkit-backdrop-filter: saturate(180%) blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 12px 28px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }
  .header-title {
    font-size: clamp(22px, 3vw, 34px);
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--ink-hi);
    margin: 0;
  }
  .header-title .at {
    color: var(--accent);
    font-weight: 700;
  }
  /* Roboto Serif has no lining-figure alternates; its "4" tops out below cap
     height and dips under the baseline, so lift it to sit flush with the caps. */
  .header-title .fig {
    display: inline-block;
    transform: translateY(-0.063em);
  }
  .header-title-link {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .header-title-link:hover { opacity: 0.7; }
  .header-meta {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-low);
  }

  /* ============== LAYOUT ============== */
  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px 28px 64px;
  }

  .project {
    margin-bottom: 48px;
  }
  .project:last-child { margin-bottom: 0; }

  .project-title .proj-meter {
    display: inline-block;
    margin-left: 12px;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.4px;
    color: var(--ink-low);
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    vertical-align: 4px;
    font-variant-numeric: tabular-nums;
  }
  .project-title .proj-meter.is-full {
    color: var(--success);
    background: rgba(16, 185, 129, 0.08);
    border-color: rgba(16, 185, 129, 0.35);
  }
  .project-title {
    font-size: clamp(17px, 1.9vw, 22px);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink-hi);
    margin: 0 0 14px;
  }
  .project-blurb {
    font-size: 13px;
    color: var(--ink-mid);
    margin: 0 0 18px;
    max-width: 640px;
  }

  /* Final Project — the "Final Project: Instructable" capstone hero.
     Indigo accent + finish-flag glyph mark it as the course milestone. */
  .project.is-standalone {
    margin-top: 40px;
  }
  .capstone-card {
    position: relative;
    border-radius: 18px;
    padding: 26px 30px 22px;
    cursor: pointer;
    border: 1px solid rgba(99, 102, 241, 0.30);
    background: var(--bg-1);
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.08);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .capstone-card:hover {
    border-color: rgba(99, 102, 241, 0.50);
    box-shadow: 0 12px 30px rgba(99, 102, 241, 0.16);
  }
  .capstone-card.done {
    border-color: rgba(99, 102, 241, 0.55);
    background: rgba(99, 102, 241, 0.05);
  }
  .capstone-check {
    position: absolute;
    top: 22px;
    right: 24px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid rgba(99, 102, 241, 0.5);
    background: rgba(255, 255, 255, 0.6);
    cursor: pointer;
    padding: 0;
    transition: all 0.15s ease;
    z-index: 2;
  }
  .capstone-check:hover { border-color: var(--success); }
  .capstone-check.checked {
    background: var(--success);
    border-color: var(--success);
  }
  .capstone-check.checked::after {
    content: "";
    position: absolute;
    left: 10px;
    top: 6px;
    width: 6px;
    height: 11px;
    border: solid #fff;
    border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg);
  }
  .capstone-main {
    display: flex;
    align-items: flex-start;
    gap: 18px;
  }
  .capstone-icon {
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    color: var(--accent);
    background: var(--accent-soft);
  }
  .capstone-title {
    margin: 0;
    font-size: clamp(20px, 2.4vw, 26px);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--ink-hi);
    line-height: 1.15;
  }
  .capstone-footer {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid rgba(99, 102, 241, 0.20);
  }
  .capstone-points {
    font-size: 13px;
    font-weight: 800;
    color: var(--accent);
    background: rgba(99, 102, 241, 0.14);
    border: 1px solid rgba(99, 102, 241, 0.30);
    border-radius: 999px;
    padding: 5px 13px;
  }
  .capstone-cta {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
  }
  .capstone-arrow { transition: transform 0.18s ease; }
  .capstone-card:hover .capstone-arrow { transform: translateX(4px); }
  @media (max-width: 640px) {
    .capstone-card { padding: 22px 20px; }
    .capstone-footer { flex-wrap: wrap; }
    .capstone-cta { margin-left: 0; }
  }

  /* Project 0: grounding-video accordion. Rows match the Projects 1-3
     benchmark look; clicking a row drops down the video + summary. */
  .vid-acc { display: flex; flex-direction: column; }
  .vid-acc-row { cursor: pointer; }
  .vid-acc-row .checkbox { pointer-events: none; }
  .vid-acc.done .checkbox.checked { background: var(--success); border-color: var(--success); }
  .vid-acc-chevron {
    color: var(--ink-low);
    margin-left: 4px;
    flex-shrink: 0;
    transition: transform 0.2s ease;
  }
  .vid-acc.is-open .vid-acc-chevron { transform: rotate(180deg); }
  .vid-acc.is-open .vid-acc-row {
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
  }
  .vid-acc-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: white;
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 14px 14px;
    padding: 16px 18px 18px;
    margin-top: -2px;
  }
  .vid-acc-panel[hidden] { display: none; }
  /* Classmates' work in Project 0 uses the same .pf-gallery component as
     every other benchmark, so it's viewed/perused consistently. */
  .vid-peers { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .vid-peers-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--ink-low);
    margin: 0;
  }
  /* Two-column panel: smaller video on the left, summary on the right, so a
     student can watch and write the summary at the same time without scrolling. */
  .vid-acc-body { display: flex; gap: 16px; align-items: flex-start; }
  .vid-acc-media-col { flex: 0 0 44%; max-width: 44%; }
  .vid-acc-write-col { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  @media (max-width: 720px) {
    .vid-acc-body { flex-direction: column; }
    .vid-acc-media-col { flex: 1 1 auto; max-width: 100%; width: 100%; }
  }
  /* Name picker is the first thing in the write column, styled exactly like
     the benchmark/portfolio submit picker. Let the column gap handle spacing. */
  .vid-name .name-picker { margin-bottom: 0; }
  .vid-card-media {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #0f172a;
    border-radius: 10px;
    overflow: hidden;
  }
  .vid-card-media iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .vid-card-media--empty {
    display: grid;
    place-items: center;
    background: var(--bg-2);
    color: var(--ink-low);
    font-size: 13px;
    font-weight: 600;
  }
  .vid-card-prompt {
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-mid);
    margin: 0;
  }
  .vid-summary {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-1);
    padding: 10px 12px;
    font: inherit;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--ink-hi);
    resize: vertical;
    min-height: 84px;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .vid-summary:focus { border-color: var(--accent); background: white; }
  .vid-summary::placeholder { color: var(--ink-low); }
  .vid-card-actions {
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    gap: 12px;
    flex-wrap: wrap;
  }
  .vid-saved {
    font-size: 12px;
    font-weight: 600;
    color: var(--success);
    margin-right: auto;
  }
  .vid-save {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.12s ease;
  }
  .vid-save:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
  .vid-save:disabled { background: var(--border); color: var(--ink-low); cursor: not-allowed; }

  .benchmarks {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Home page: benchmarks render as a 5-across card grid (same card language
     as the Homework week cards and Tools cards). The archive view still uses
     the plain .benchmarks column stack above. */
  .benchmark-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
  }
  @media (max-width: 760px) {
    .benchmark-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  }

  .benchmark {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    gap: 6px;
    padding: 18px 18px 16px;
    min-height: 100px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 16px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.2s ease;
    user-select: none;
    box-shadow: 0 2px 6px rgba(17, 17, 17, 0.04);
  }
  /* No positional movement on hover/press. The card used to lift on hover and
     bob on click, which read as a "shake" right before the benchmark opened.
     Feedback is now border + shadow only: the card never moves, so a click is
     just click-and-go. */
  .benchmark:hover {
    border-color: var(--accent);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
  }
  .benchmark.done {
    background: rgba(16, 185, 129, 0.06);
    border-color: rgba(16, 185, 129, 0.35);
  }
  .benchmark .checkbox {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 32px;
    height: 32px;
    border-width: 1.5px;
    border-color: var(--border);
    border-radius: 7px;
  }
  .benchmark .checkbox:hover { border-color: var(--accent-hover); }
  .benchmark .checkbox.checked { border-color: var(--success); }
  .benchmark .checkbox.checked::after {
    width: 6px;
    height: 11px;
    transform: rotate(45deg) translate(-1px, -1px);
  }

  .checkbox {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border: 2px solid var(--border-strong);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    transition: background 0.15s ease, border-color 0.15s ease;
    cursor: pointer;
  }
  .checkbox:hover {
    border-color: var(--accent-hover);
  }
  .checkbox.checked {
    background: var(--success);
    border-color: var(--success);
  }
  .checkbox.checked::after {
    content: '';
    width: 6px;
    height: 11px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }

  .benchmark-num {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .benchmark.done .benchmark-num { color: var(--success); }

  .benchmark-label {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink-hi);
    line-height: 1.3;
  }
  .benchmark.done .benchmark-label {
    color: var(--ink-mid);
  }

  /* Footer holds only the paperclip submission count (hidden until work
     exists). Points live in the benchmark modal — repeating "2 pts" across
     25 cards was noise. */
  .benchmark-foot {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: auto;
  }

  /* ============== MODAL ============== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    animation: backdropIn 0.2s ease-out;
  }
  .modal-backdrop.open { display: flex; }
  @keyframes backdropIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  /* Work-tab loads (?b= deep links) paint the modal fully formed on the very
     first frame — no fade. The fade-in on load let the home project list show
     through the translucent backdrop for ~200ms on EVERY card click, which
     read as "it flashes something else, then the benchmark appears." */
  html.deeplink-paint .modal-backdrop,
  html.deeplink-paint .modal { animation: none; }
  /* While the reused work tab is navigating to the NEXT benchmark, hide the
     stale one so the frozen frame during the load is plain cream, not the
     previous page. */
  html.nav-blanking body > * { visibility: hidden; }

  .modal {
    background: var(--paper);
    color: var(--paper-ink);
    border-radius: 16px;
    width: min(1180px, 96vw);
    height: min(94vh, 1240px);
    max-height: 94vh;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 40px 80px rgba(0, 0, 0, 0.55),
      0 0 0 1px rgba(0, 0, 0, 0.05);
    animation: modalIn 0.12s ease-out;
    overflow: hidden;
  }
  /* Plain fade only. The old scale(0.94)->1 + translateY(8px)->0 made the
     panel grow and slide on open, which read as the card "shaking / changing
     position" before the content appeared. Now it just appears in place. */
  @keyframes modalIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal-header {
    flex-shrink: 0;
    padding: 26px 36px 20px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    background: var(--paper-soft);
  }
  .modal-title-wrap { flex: 1; min-width: 0; }
  .modal-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--paper-accent);
    margin: 0 0 6px;
  }
  .modal-title {
    font-size: clamp(22px, 3vw, 30px);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--paper-ink);
    margin: 0;
    line-height: 1.25;
  }
  .modal-points {
    font-size: 12px;
    font-weight: 600;
    color: var(--paper-ink-mid);
    background: rgba(0, 0, 0, 0.05);
    padding: 6px 12px;
    border-radius: 999px;
    margin-top: 8px;
    display: inline-block;
    font-variant-numeric: tabular-nums;
  }
  .close-btn {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.06);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.15s ease;
    color: var(--paper-ink);
    font-size: 22px;
    line-height: 1;
  }
  .close-btn:hover {
    background: rgba(0, 0, 0, 0.12);
    transform: scale(1.05);
  }

  .modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 22px 36px 28px;
  }
  .modal-section {
    margin-bottom: 28px;
  }
  .modal-section:last-child { margin-bottom: 0; }
  .modal-section h3 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--paper-ink);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .modal-section p {
    font-size: 16px;
    line-height: 1.65;
    color: var(--paper-ink);
    margin: 0 0 12px;
  }
  .modal-section ul {
    margin: 0;
    padding-left: 22px;
    color: var(--paper-ink);
  }
  .modal-section ul li {
    margin-bottom: 6px;
    line-height: 1.55;
  }

  /* ===== Name picker (roster dropdown + "+ Add me" fallback) ===== */
  .name-picker {
    margin-bottom: 18px;
  }
  .name-picker-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--ink-mid);
    margin-bottom: 6px;
  }
  .name-picker-select {
    width: 100%;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    color: var(--ink-hi);
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 38px 12px 14px;
    min-height: 44px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path fill='%23555' d='M6 8L0 0h12z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 10px 7px;
  }
  .name-picker-select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .name-picker-add {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .name-picker-input {
    flex: 1;
    font-size: 16px; /* prevents iOS zoom on focus */
    font-family: inherit;
    color: var(--ink-hi);
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    min-height: 44px;
  }
  .name-picker-input:focus {

  }
  .name-picker-add-btn {

    font-weight: 700;
    font-family: inherit;
    color: white;
    background: var(--accent);

    border-radius: 10px;
    min-height: 44px;
    min-width: 72px;

    transition: background 0.15s ease;
  }
  .name-picker-add-btn:hover { background: var(--accent-hover); }
  .name-picker-add-btn:active { transform: scale(0.97); }

  /* ===== Identity strip on Tool views ===== */
  .identity-strip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    margin: 0 0 16px;
    background: var(--accent-soft);

    border-radius: 12px;
    max-width: 520px;
  }
  .identity-strip-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
    flex-shrink: 0;
  }
  .identity-strip-picker {
    flex: 1;
    min-width: 0;
  }
  .identity-strip-picker .name-picker {
    margin-bottom: 0;
  }
  .identity-strip-picker .name-picker-select {
    background-color: white;
    padding-top: 8px;
    padding-bottom: 8px;
    min-height: 38px;
    font-size: 14px;
  }
  .identity-strip-picker .name-picker-input {
    padding-top: 8px;
    padding-bottom: 8px;

  }

  /* ===== Saved-state pill near Submit ===== */
  .pf-saved-pill {
    font-size: 12px;
    font-weight: 600;

    border-radius: 999px;
    background: rgba(34, 197, 94, 0.10);

  }

  .pf-saved-pill::before {
    content: '';

    height: 6px;
    border-radius: 50%;

  /* ===== Product-benchmark brief: story hook + How Might We + persona roster ===== */
  .cp-brief { display: flex; flex-direction: column; gap: 16px; }
  .cp-brief-hook {

    font-weight: 900;

  .cp-persona {

  .cp-persona-name { font-weight: 700; font-size: 14px; color: var(--ink-hi); }
  .cp-persona-cond {

    color: var(--ink-low);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 4px;
  }
  .cp-persona-row { font-size: 12.5px; color: var(--ink-mid); line-height: 1.45; }
  .cp-persona-row strong { color: var(--ink-hi); font-weight: 600; }

  /* ===== Benchmark step instructions — gorgeous, simple, scannable ===== */
  .cp-steps {
    display: flex;
    flex-direction: column;
  }
  .cp-step {
    padding: 14px 0;
  }
  .cp-step + .cp-step {
    border-top: 1px solid rgba(17, 17, 17, 0.06);
  }
  .cp-step-eyebrow {
    font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

    font-weight: 900;

    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .cp-step-body {
    font-size: 15.5px;
    line-height: 1.65;
    color: var(--paper-ink);
  }
  .cp-step-body strong { font-weight: 700; color: var(--paper-ink); }
  .cp-step-body em { font-style: italic; color: var(--paper-ink-mid); }
  .cp-step-body a {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1.5px;
    font-weight: 600;
  }
  .cp-step-body a:hover { color: var(--accent-hover); }
  .cp-step-tool {
    cursor: pointer;
  }

  .video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
  }
  .video-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* Project 0 grounding-video panel: video on the left, writer on the right.
     Right column is sized so it sits next to the video rather than towering
     over it. Stacks below 720px. */
  .vs-panel { padding: 0; background: transparent; border: none; box-shadow: none; }
  .vs-pair {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 16px;
    align-items: start;
  }
  .vs-media {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 16 / 9;
    box-shadow: 0 4px 12px rgba(17, 17, 17, 0.08);
  }
  .vs-media iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .vs-media--empty {
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255, 255, 255, 0.6);
    font-size: 13px;
    aspect-ratio: 16 / 9;
  }
  .vs-write {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .vs-prompt {
    margin: 0;
    font-size: 13px;
    line-height: 1.45;
    color: var(--ink-mid);
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 0 6px 6px 0;
    padding: 7px 11px;
  }
  /* Lightweight grading line under a prompt. One reusable element so every
     benchmark can state how it is scored without a heavy rubric box. */
  .grade-note {
    margin: 7px 0 0;
    font-size: 12px;
    line-height: 1.4;
    color: var(--ink-mid);
    display: flex;
    align-items: baseline;
    gap: 7px;
    flex-wrap: wrap;
  }
  .grade-note__label {
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-size: 10.5px;
  }
  /* Video panel: read-only browse + the single "submitted" area below input. */
  .vs-panel.is-viewonly .vs-textarea,
  .vs-panel.is-viewonly .vs-actions { display: none; }
  .vs-viewbanner { display: none; }
  .vs-panel.is-viewonly .vs-viewbanner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 10px 13px;
    margin: 4px 0 10px;
    border-radius: 10px;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--ink-mid);
  }
  .vs-submitted { margin-top: 12px; }
  .vs-submitted-card {
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--bg-2);
    padding: 11px 14px;
  }
  .vs-submitted-label {
    font-size: 10.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent);
    margin-bottom: 5px;
  }
  .vs-submitted-text {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--ink-mid);
    font-style: italic;
    white-space: pre-wrap;
  }
  .vs-submitted-empty {
    font-size: 12.5px;
    color: var(--ink-low);
    font-style: italic;
    padding: 4px 2px;
  }
  /* Instructable panel: read-only browse + the submitted-links area below. */
  .instructable-panel.is-viewonly .inst-box,
  .instructable-panel.is-viewonly .pf-actions { display: none; }
  /* Submission boxes: clean dashed cards with an icon, portfolio aesthetic. */
  .inst-box {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fff;
    padding: 13px 15px;
    margin-top: 14px;
  }
  .inst-box-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .inst-box-icon { display: inline-flex; font-size: 18px; color: var(--accent); }
  .inst-box-label { font-size: 13px; font-weight: 700; color: var(--paper-ink); }
  .inst-drop {
    border: 1.5px dashed var(--border-strong);
    border-radius: 10px;
    background: var(--bg-2);
    padding: 22px 14px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .inst-drop:hover,
  .inst-drop.is-dragover { border-color: var(--accent); background: var(--accent-soft); }
  .inst-drop-text { font-size: 13px; font-weight: 600; color: var(--ink-mid); }
  .inst-drop-sub { font-size: 11px; color: var(--ink-low); margin-top: 3px; }
  .inst-proof-card { position: relative; display: inline-block; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .inst-proof-card img { display: block; max-width: 100%; max-height: 220px; }
  .inst-proof-remove {
    position: absolute; top: 6px; right: 6px;
    width: 28px; height: 28px; border-radius: 8px; border: none;
    background: rgba(15, 23, 42, 0.6); color: #fff;
    font-size: 18px; line-height: 1; cursor: pointer;
  }
  .inst-sub-prooflink img { display: block; max-width: 220px; max-height: 160px; border-radius: 8px; border: 1px solid var(--border); margin-top: 4px; }
  .inst-viewbanner { display: none; }
  .instructable-panel.is-viewonly .inst-viewbanner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 10px 13px;
    margin: 4px 0 4px;
    border-radius: 10px;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--ink-mid);
  }
  .inst-submitted { margin-top: 14px; }
  .inst-sub-card {
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--bg-2);
    padding: 12px 14px;
  }
  .inst-sub-row {
    display: flex;
    align-items: baseline;
    gap: 9px;
    padding: 4px 0;
    min-width: 0;
  }
  .inst-sub-rowlabel {
    flex: none;
    width: 92px;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-mid);
  }
  .inst-sub-link {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
    word-break: break-all;
  }
  .inst-sub-link:hover { text-decoration: underline; }
  .vs-textarea {
    width: 100%;
    min-height: 130px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink-hi);
    background: white;
    resize: vertical;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .vs-textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }
  .vs-textarea::placeholder { color: var(--ink-low); }
  .vs-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 2px;
  }
  @media (max-width: 720px) {
    .vs-pair { grid-template-columns: 1fr; gap: 12px; }
    .vs-textarea { min-height: 110px; }
  }

  .links a {
    display: inline-block;
    background: rgba(0, 0, 0, 0.05);
    border: 1px solid rgba(0, 0, 0, 0.1);
    color: var(--paper-ink);
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    margin: 0 8px 8px 0;
    transition: background 0.15s ease;
  }
  .links a:hover {
    background: rgba(0, 0, 0, 0.1);
  }

  .rubric {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
  }
  .rubric-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
  }
  .rubric-row:last-child { border-bottom: none; }
  .rubric-criterion { font-weight: 500; color: var(--paper-ink); flex: 1; }
  .rubric-points {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--paper-accent);
    flex-shrink: 0;
  }
  /* Grouped parts rubric (e.g. the Instructable): category headers + subtotals. */
  .rubric-group + .rubric-group { margin-top: 6px; padding-top: 14px; border-top: 1px solid rgba(0,0,0,0.08); }
  .rubric-group-head {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 2px 0 6px;
  }
  .rubric-group-badge {
    flex: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #6366f1);
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .rubric-group-name {
    flex: 1;
    font-size: 13.5px;
    font-weight: 800;
    color: var(--paper-ink);
    letter-spacing: 0.01em;
  }
  .rubric-group-pts {
    flex: none;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 9px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }

  /* ============== HEADER NAV (Homework / Back) ============== */
  .nav-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: white;
    border: 1px solid var(--border);
    color: var(--ink-mid);
    text-decoration: none;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.15s ease;
    margin-right: 10px;
    cursor: pointer;
  }
  .nav-link:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  /* All three nav pills always visible: Home / Tools / Homework.
     The pill for the current view fills indigo so the student sees where
     they are. No layout jumps as they navigate. */
  .nav-to-home, .nav-to-hw, .nav-to-tools { display: inline-flex; }
  body.view-home .nav-to-home,
  body.view-hw .nav-to-hw,
  body.view-tools .nav-to-tools {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  body.view-home .nav-to-home:hover,
  body.view-hw .nav-to-hw:hover,
  body.view-tools .nav-to-tools:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: white;
  }

  /* Syllabus — intentionally NOT a pill. It's informational, not an app
     surface. Rendered as a ghost text link with a small doc icon, tucked
     ahead of the nav pills and separated by a thin divider so the eye
     reads it as "context, not a destination". */
  .nav-syllabus,
  .nav-exhibit {
    background: transparent !important;
    border: none !important;
    color: var(--ink-low);
    padding: 7px 16px 7px 4px;
    border-radius: 0;
    text-transform: none;
    letter-spacing: 0.3px;
    font-size: 12px;
    font-weight: 500;
    font-style: italic;
    gap: 6px;
  }
  .nav-syllabus {
    margin-right: 12px;
    border-right: 1px solid var(--border) !important;
  }
  .nav-exhibit { padding-right: 10px; }
  .nav-syllabus svg,
  .nav-exhibit svg { opacity: 0.7; transition: opacity 0.15s ease; }
  .nav-syllabus:hover,
  .nav-exhibit:hover {
    background: transparent !important;
    color: var(--accent) !important;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .nav-syllabus:hover svg,
  .nav-exhibit:hover svg { opacity: 1; }
  body.view-syllabus .nav-syllabus {
    color: var(--accent) !important;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  body.view-syllabus .nav-syllabus,
  body.view-syllabus .nav-syllabus:hover { background: transparent !important; border-color: transparent var(--border) transparent transparent !important; }

  /* ============== SYLLABUS page ============== */
  /* One column, no card boxes, generous whitespace. Reads like a printed
     handout: title, a lede paragraph, then quietly-titled sections separated
     by hairline rules. Body type is 15.5px with a tall line-height so the
     page breathes. */
  .syllabus {
    max-width: 100%;
    margin: 12px auto 64px;
    padding: 0;
  }
  /* Lead paragraph keeps a readable measure even though the page is wide. */
  .syllabus-lead { max-width: 880px; }
  /* The rest of the syllabus flows as cards that fill the site width, so it
     feels contiguous with the home + Exhibit grids rather than a narrow column. */
  .syllabus-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
    margin-top: 22px;
    align-items: start;
  }
  .syllabus-grid .syllabus-section {
    margin: 0;
    padding: 20px 22px;
    border-top: none;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow-sm);
  }
  /* Instructor sits up top under the title as a flat accent band — deliberately
     NOT a white card, so it reads as a header detail, not one of the sections. */
  .syllabus-instructor {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 14px;
    margin: 4px 0 26px;
    padding: 13px 18px;
    background: var(--accent-soft);
    border-radius: 12px;
  }
  .syllabus-instructor .si-eyebrow {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .syllabus-instructor .si-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-hi);
  }
  .syllabus-instructor .si-meta {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px;
    font-size: 13.5px;
    color: var(--ink-mid);
  }
  .syllabus-instructor a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(99, 102, 241, 0.30);
    transition: border-color 0.15s ease;
  }
  .syllabus-instructor a:hover { border-bottom-color: var(--accent); }
  .syllabus-instructor .si-dot { color: var(--ink-low); }
  .syllabus-head {
    margin-bottom: 8px;
  }
  .syllabus-head-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }
  .syllabus-eyebrow {
    margin: 0 0 14px;
    font-size: clamp(17px, 1.9vw, 22px);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--accent);
    line-height: 1.15;
  }
  .syllabus-title {
    margin: 0 0 16px;
    font-size: clamp(26px, 3vw, 34px);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--ink-hi);
    line-height: 1.1;
  }
  .syllabus-title-at { color: var(--accent); font-style: italic; padding: 0 1px; }

  .syllabus-section {
    padding: 26px 0 4px;
    border-top: 1px solid var(--border);
  }
  .syllabus-section:first-of-type {
    border-top: none;
    padding-top: 8px;
  }
  .syllabus-section-title {
    margin: 0 0 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .syllabus-section p {
    margin: 0;
    font-size: 15.5px;
    line-height: 1.65;
    color: var(--paper-ink);
  }
  .syllabus-section p + p { margin-top: 12px; }
  .syllabus-section strong { color: var(--ink-hi); }
  .syllabus-section em { color: var(--ink-low); font-style: italic; }
  .syllabus-section a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(99, 102, 241, 0.30);
    transition: border-color 0.15s ease;
  }
  .syllabus-section a:hover { border-bottom-color: var(--accent); }

  .syllabus-list {
    margin: 0;
    padding-left: 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 15.5px;
    line-height: 1.6;
    color: var(--paper-ink);
  }
  .syllabus-list strong { color: var(--ink-hi); }
  .syllabus-list--numbered li::marker { color: var(--accent); font-weight: 700; }

  /* Grading: lightweight definition list, two columns. */
  .syllabus-dl {
    margin: 0;
    display: grid;
    gap: 8px 0;
  }
  .syllabus-dl > div {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: baseline;
    padding: 6px 0;
    border-bottom: 1px dashed var(--border);
  }
  .syllabus-dl > div:last-child { border-bottom: none; }
  .syllabus-dl dt {
    margin: 0;
    font-size: 15.5px;
    color: var(--ink-hi);
    font-weight: 600;
  }
  .syllabus-dl dd {
    margin: 0;
    font-size: 15.5px;
    color: var(--accent);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }


  /* Instructable submission panel — single link field, slim like checkpoint */
  .instructable-panel .inst-link-input {
    width: 100%;
    border: 1px solid var(--border-strong);
    border-radius: 11px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 14px;
    color: var(--paper-ink);
    background: var(--bg-1);
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .instructable-panel .inst-link-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  /* ============== HOMEWORK page ============== */
  /* Week cards mirror the Tools-page card language (same bg/border/hover)
     so the hub reads as one system; the week number is the visual anchor. */
  /* Week cards share the benchmark-card anatomy exactly: left-aligned,
     accent eyebrow + bold value, same padding/height/hover chrome. */
  .hw-week-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
    margin-bottom: 36px;
  }
  @media (max-width: 760px) {
    .hw-week-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
  }
  .hw-card {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 2px 6px rgba(17, 17, 17, 0.04);
    padding: 18px 18px 16px;
    min-height: 100px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    gap: 6px;
  }
  .hw-card:hover {
    border-color: var(--accent);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
  }
  .hw-card-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .hw-card-num {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--ink-hi);
  }
  .step-section {
    margin-bottom: 28px;
  }
  .step-section h3 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--paper-ink);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .step-num {
    display: inline-flex;
    width: 24px;
    height: 24px;
    background: var(--accent);
    color: white;
    border-radius: 50%;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(99, 102, 241, 0.25);
  }
  .step-section p {
    font-size: 15px;
    line-height: 1.6;
    color: var(--paper-ink);
    margin: 0 0 14px;
  }
  .tinkercad-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: white;
    text-decoration: none;
    padding: 9px 16px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 14px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .tinkercad-btn:hover { background: var(--accent-hover); }
  .tinkercad-btn:active { transform: translateY(1px); }
  .tinkercad-btn .arrow { font-size: 12px; }

  /* Homework modal: two-column layout (Step 1 left, Step 2 right, no outer scroll) */
  .modal-body.is-hw {
    overflow-y: auto;
    padding: 22px 28px 28px;
  }
  .hw-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    height: 100%;
    align-items: stretch;
  }
  .hw-col {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .hw-col .step-section { margin-bottom: 0; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .hw-col .video-wrap { flex-shrink: 0; max-height: 56vh; aspect-ratio: 16 / 9; }
  .hw-step2-scroll {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    padding-right: 4px;
    margin-right: -4px;
  }
  .hw-col .gallery-grid {
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
  }

  @media (max-width: 720px) {
    .hw-grid { grid-template-columns: 1fr; height: auto; gap: 20px; }
    .modal-body.is-hw { overflow-y: auto; padding: 20px 22px 32px; }
    .hw-col .step-section { flex: 0 0 auto; }
    .hw-step2-scroll { overflow: visible; padding-right: 0; margin-right: 0; }
  }

  /* ============== ARTIFACT COUNT BADGE (on benchmark row) ============== */
  .artifact-count {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid rgba(99, 102, 241, 0.25);
    font-variant-numeric: tabular-nums;
  }
  .artifact-count svg { width: 12px; height: 12px; }

  /* ============== GALLERY (inside modal) ============== */
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  .gallery-tile {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg-2);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.15s ease;
  }
  .gallery-tile:hover {
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.10);
  }
  .gallery-tile img,
  .gallery-tile video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .gallery-tile .play-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 30px;
    height: 30px;
    background: rgba(0, 0, 0, 0.55);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 12px;
    pointer-events: none;
  }
  .gallery-tile .tile-caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 14px 8px 6px;
    background: linear-gradient(to top, rgba(0,0,0,0.82), rgba(0,0,0,0));
    color: white;
    font-size: 10px;
    line-height: 1.25;
  }
  .gallery-tile .tile-caption .tile-name {
    font-weight: 700;
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .gallery-tile .tile-caption .tile-desc {
    display: none;
  }
  /* Hovering (or keyboard-focusing) a tile reveals what the student wrote. */
  .gallery-tile:hover .tile-caption .tile-desc,
  .gallery-tile:focus-visible .tile-caption .tile-desc,
  .gallery-tile:focus-within .tile-caption .tile-desc {
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-top: 2px;
    opacity: 0.95;
  }
  .gallery-tile .tile-delete {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    border: none;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    line-height: 1;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  body.is-admin .gallery-tile .tile-delete { display: flex; }
  .gallery-tile .tile-delete:hover {
    background: #ef4444;
    transform: scale(1.1);
  }

  /* Add tile (dashed) */
  .add-tile {
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    background: transparent;
    border: 1.5px dashed var(--border-strong);
    color: var(--ink-mid);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    font-weight: 600;
    font-size: 10px;
    text-align: center;
    padding: 4px;
  }
  .add-tile:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .add-tile .plus {
    font-size: 22px;
    line-height: 1;
    font-weight: 300;
  }

  /* Upload form */
  .upload-form {
    grid-column: 1 / -1;
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
  }
  .upload-form label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--ink-low);
  }
  .upload-form input[type="text"],
  .upload-form textarea {
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--bg-2);
    color: var(--paper-ink);
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
    resize: vertical;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 400;
  }
  .upload-form input[type="text"]:focus,
  .upload-form textarea:focus {
    border-color: var(--accent);
    background: white;
  }
  .upload-form input[type="file"] { display: none; }

  /* Smart attachment zone */
  .attach {
    position: relative;
    border: 1.5px dashed var(--border-strong);
    border-radius: 12px;
    background: var(--bg-2);
    transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
    overflow: hidden;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .attach.is-dragover {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: scale(1.005);
  }
  .attach.has-content {
    border-style: solid;
    background: white;
    cursor: default;
    min-height: 0;
  }
  .attach-empty {
    width: 100%;
    padding: 22px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    color: var(--ink-mid);
    text-align: center;
  }
  .attach-empty:hover { color: var(--accent); }
  .attach-empty .attach-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: white;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .attach-empty:hover .attach-icon { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.18); }
  .attach-empty .attach-icon svg { width: 18px; height: 18px; }
  .attach-empty .attach-text {
    font-size: 14px;
    font-weight: 600;
    color: var(--paper-ink);
  }
  .attach-empty .attach-sub {
    font-size: 12px;
    color: var(--ink-low);
  }
  .attach-link-toggle {
    margin-top: 4px;
    background: transparent;
    border: none;
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background 0.15s ease;
  }
  .attach-link-toggle:hover { background: var(--accent-soft); }

  .attach-link-entry {
    display: none;
    padding: 14px;
    width: 100%;
    align-items: center;
    gap: 8px;
  }
  .attach.is-link-entry .attach-empty { display: none; }
  .attach.is-link-entry .attach-link-entry { display: flex; }
  .attach-link-entry input {
    flex: 1;
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: white;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .attach-link-entry input:focus { border-color: var(--accent); }
  .attach-link-entry .icon-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-mid);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
    transition: all 0.15s ease;
  }
  .attach-link-entry .icon-btn:hover { border-color: var(--ink-mid); color: var(--paper-ink); }

  /* Preview card (file or link) */
  .attach-preview {
    display: none;
    padding: 12px;
    width: 100%;
    align-items: center;
    gap: 14px;
  }
  .attach.has-content .attach-preview { display: flex; }
  .attach.has-content .attach-empty,
  .attach.has-content .attach-link-entry { display: none; }
  .attach-preview .preview-thumb {
    flex-shrink: 0;
    width: 64px;
    height: 64px;
    border-radius: 9px;
    overflow: hidden;
    background: var(--bg-2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: var(--accent);
  }
  .attach-preview .preview-thumb img,
  .attach-preview .preview-thumb video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .attach-preview .preview-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .attach-preview .preview-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--paper-ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .attach-preview .preview-meta {
    font-size: 12px;
    color: var(--ink-mid);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .attach-preview .preview-remove {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-mid);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .attach-preview .preview-remove:hover {
    border-color: #ef4444;
    color: #ef4444;
  }
  .attach-preview .preview-loading {
    font-size: 13px;
    color: var(--ink-mid);
    font-style: italic;
  }

  .upload-form .actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    align-items: center;
  }
  .upload-form .btn-cancel {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-mid);
    padding: 10px 18px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
    transition: all 0.15s ease;
  }
  .upload-form .btn-cancel:hover { border-color: var(--border-strong); color: var(--paper-ink); }
  .upload-form .btn-submit {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .upload-form .btn-submit:hover { background: var(--accent-hover); }
  .upload-form .btn-submit:active { transform: translateY(1px); }
  .upload-form .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .upload-form .upload-status {
    font-size: 13px;
    color: var(--ink-mid);
    min-height: 18px;
  }
  .upload-form .upload-status.error { color: #ef4444; }
  /* Link tile chrome */
  .gallery-tile.link-tile .link-chip {
    position: absolute;
    top: 4px;
    left: 4px;
    background: rgba(0, 0, 0, 0.65);
    color: white;
    border-radius: 4px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 2px 5px;
    text-transform: uppercase;
    pointer-events: none;
  }
  .gallery-tile.link-tile .link-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: linear-gradient(135deg, var(--accent-soft), white);
    color: var(--accent);
    padding: 6px;
    text-align: center;
  }
  .gallery-tile.link-tile .link-fallback .link-icon {
    font-size: 20px;
    line-height: 1;
    color: var(--ink-mid);
  }
  .link-icon--stl {
    font-weight: 700;
    letter-spacing: 1.2px;
    font-size: 15px;
    color: #92400e;
  }
  .gallery-tile.link-tile .link-fallback .link-domain {
    font-size: 10px;
    font-weight: 600;
    color: var(--ink-mid);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
  }

  .gallery-empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--ink-low);
    font-size: 14px;
    padding: 8px 0 16px;
  }

  /* ============== LIGHTBOX ============== */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0, 0, 0, 0.92);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    flex-direction: column;
    gap: 16px;
  }
  .lightbox.open { display: flex; }
  .lightbox-media {
    max-width: min(1100px, 92vw);
    /* Reserve room for padding + close button + caption so tall images
       never get chopped, including on short mobile viewports. */
    max-height: calc(100dvh - 150px);
    border-radius: 12px;
    overflow: hidden;
    background: black;
  }
  .lightbox-media img,
  .lightbox-media video {
    display: block;
    max-width: 100%;
    max-height: calc(100dvh - 150px);
    object-fit: contain;
  }
  .lightbox-meta {
    color: white;
    text-align: center;
    max-width: min(700px, 90vw);
  }
  .lightbox-meta .lb-name { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .lightbox-meta .lb-desc { font-size: 14px; opacity: 0.85; line-height: 1.5; }
  .lightbox-close {
    position: absolute;
    top: 18px;
    right: 22px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    color: white;
    border: none;
    font-size: 24px;
    cursor: pointer;
    line-height: 1;
  }
  .lightbox-close:hover { background: rgba(255, 255, 255, 0.22); }

  /* ============== ADMIN CONTROLS ============== */
  .admin-bar {
    display: none;
    align-items: center;
    gap: 10px;
  }
  body.is-admin .admin-bar { display: inline-flex; }
  .admin-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 4px 8px;
    border-radius: 5px;
    border: 1px solid rgba(99, 102, 241, 0.25);
  }
  .archive-btn {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--ink-mid);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .archive-btn:hover {
    border-color: #ef4444;
    color: #ef4444;
  }

  /* ============== PORTFOLIO PANEL (drop + expand) ============== */
  .portfolio-panel {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .portfolio-panel .pf-name-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .portfolio-panel .pf-name-row label {

  .portfolio-panel .pf-name-row input {

  .pf-slots {

  /* ===== Unified rubric + drop: criterion rows, with an upload box in the
     final column. Clicking a box expands that row inline (the drawer body). ==== */
  .pf-rubric {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  /* Editable vs read-only browse: toggled by .is-viewonly on the panel. */
  .pf-rubric-panel .pf-viewbanner,
  .pf-rubric-panel .pf-viewonly { display: none; }
  .pf-rubric-panel.is-viewonly .pf-rubric,
  .pf-rubric-panel.is-viewonly .pf-actions { display: none; }
  .pf-rubric-panel.is-viewonly .pf-viewbanner { display: flex; }
  .pf-rubric-panel.is-viewonly .pf-viewonly { display: grid; }
  .pf-viewbanner {
    align-items: center;
    justify-content: space-between;
    gap: 12px;

    padding: 11px 14px;

  }
  .pf-viewbanner-text strong { color: var(--accent); font-weight: 700; }
  .pf-viewbanner-btn {
    flex: none;
    border: 1px solid var(--accent);

    color: var(--accent);
    font-weight: 700;

  .pf-viewonly {
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }
  .pf-rubric-head,
  .pf-rubric-row {
    display: grid;
    grid-template-columns: 1.7fr 1fr 1fr 1fr 122px;
  }
  /* Read-only variant (Instructable): no "Your work" column, 4 columns. */
  .pf-rubric--readonly .pf-rubric-head,
  .pf-rubric--readonly .pf-rubric-row { grid-template-columns: 1.7fr 1fr 1fr 1fr; }
  .pf-rubric--readonly .pf-rubric-row > .prc:last-child { border-right: none; }
  @media (max-width: 620px) {
    .pf-rubric--readonly .pf-rubric-row { grid-template-columns: 1fr 1fr; }
    .pf-rubric--readonly .pf-rubric-row > .prc-crit { grid-column: 1 / -1; }
  }
  .pf-rubric-head {
    background: var(--accent-soft);
    font-size: 10.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent);
  }
  .pf-rubric-head > span {
    padding: 9px 12px;
    border-right: 1px solid var(--border);
  }
  .pf-rubric-head > span:last-child { border-right: none; }
  .pf-rubric-head > span:first-child { color: var(--ink-mid); }
  .pf-rubric-row { border-top: 1px solid var(--border); }
  .pf-rubric-row > .prc {
    padding: 11px 12px;
    border-right: 1px solid var(--border);
    min-width: 0;
  }
  .prc-crit { background: var(--bg-2); }
  .prc-name { display: block; font-size: 13px; font-weight: 800; color: var(--paper-ink); }
  .prc-text { display: block; font-size: 11px; line-height: 1.4; color: var(--ink-mid); margin-top: 3px; }
  .prc-lvl .prc-pts {
    display: block;
    font-size: 12px;
    font-weight: 800;
    color: var(--paper-ink);
    margin-bottom: 4px;
    font-variant-numeric: tabular-nums;
  }
  .pf-rubric-row > .prc-lvl:nth-child(4) .prc-pts { color: var(--success); }
  .prc-lvl .prc-desc { display: block; font-size: 11px; line-height: 1.4; color: var(--ink-mid); }
  .pf-rubric-slotmount {
    display: flex;
    align-items: stretch;
    padding: 8px;
    min-width: 0;
  }
  /* Compact upload tile inside a row's final column. */
  .pf-rubric-slotmount .pf-slot { width: 100%; border-radius: 9px; }
  .pf-rubric-slotmount .pf-slot-number,
  .pf-rubric-slotmount .pf-slot-label { display: none; }
  .pf-rubric-slotmount .pf-slot-tile {
    min-height: 62px;
    padding: 8px 6px;
    gap: 3px;
  }
  .pf-rubric-slotmount .pf-slot-icon { font-size: 19px; }
  .pf-rubric-slotmount .pf-slot-status { font-size: 9.5px; }
  /* Row expands inline: when a slot is open, its upload cell takes the whole
     row width and the criterion/level cells step aside for the drawer. */
  .pf-rubric-row:has(.pf-slot.is-open) > .prc { display: none; }
  .pf-rubric-row:has(.pf-slot.is-open) > .pf-rubric-slotmount {
    grid-column: 1 / -1;
    padding: 12px;
    background: var(--accent-soft);
  }
  @media (max-width: 620px) {
    .pf-rubric-head { display: none; }
    .pf-rubric-row { grid-template-columns: 1fr 1fr; }
    .pf-rubric-row > .prc-crit { grid-column: 1 / -1; }
    .pf-rubric-row > .pf-rubric-slotmount { grid-column: 1 / -1; border-top: 1px solid var(--border); }
  }

  .pf-slot {
    background: var(--bg-2);
    border: 1.5px dashed var(--border-strong);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    display: flex;
    flex-direction: column;
  }
  .pf-slot.is-open {
    border-style: solid;
    border-color: var(--accent);
    background: white;
    box-shadow: 0 6px 18px rgba(99, 102, 241, 0.12);
    grid-column: 1 / -1;
  }
  /* When a slot is open, the small tile of that slot hides (we render the
     full body instead), and every OTHER slot in the row hides too — the
     student focuses on one upload at a time, no clutter. */
  .pf-slot.is-open .pf-slot-tile { display: none; }
  .pf-slots:has(.pf-slot.is-open) .pf-slot:not(.is-open) { display: none; }
  .pf-slot.is-filled:not(.is-open) {
    border-style: solid;
    background: white;

    border-color: var(--accent);

  .pf-slot.is-tile-dragover:not(.is-open) {
    border-color: var(--accent);

    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(99, 102, 241, 0.18);

  .pf-slot-label {

  .pf-slot-thumb {

  .pf-slot-mini-actions {

  .pf-slot-mini-actions button {

    max-height: 0;

  .pf-drop {
