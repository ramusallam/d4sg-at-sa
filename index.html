  .vibe-ai-fab:hover {
    transform: translateY(-2px);
    box-shadow: 0 20px 48px rgba(59, 130, 246, 0.36), 0 2px 6px rgba(0, 0, 0, 0.10);
  }
  .vibe-ai-fab .vibe-ai-fab-icon {
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    flex-shrink: 0;
  }
  .vibe-ai-fab .vibe-ai-fab-icon svg { width: 14px; height: 14px; }

  .vibe-drawer-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
  }
  .vibe-drawer-backdrop.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  .vibe-drawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(540px, 92vw);
    z-index: 101;
    background: var(--bg-1);
    box-shadow: -16px 0 48px rgba(15, 23, 42, 0.18);
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.32, 0.72, 0.4, 1);
    display: flex;
    flex-direction: column;
  }
  .vibe-drawer.is-open { transform: translateX(0); }

  .vibe-drawer-head {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    background: white;
  }
  .vibe-drawer-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink-hi);
    margin: 0;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .vibe-drawer-title-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, #14b8a6, var(--accent));
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
  }
  .vibe-drawer-close {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-mid);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .vibe-drawer-close:hover { border-color: var(--ink-mid); color: var(--ink-hi); }

  /* The role / "stem" card — frames the conversation as if the student
     is talking to an assistive-technology engineer. Read-only context. */
  .vibe-role-card {
    margin: 16px 18px 0;
    padding: 16px 18px;
    background: linear-gradient(135deg, rgba(20, 184, 166, 0.09) 0%, rgba(59, 130, 246, 0.08) 100%);
    border: 1px solid rgba(59, 130, 246, 0.22);
    border-radius: 14px;
    color: var(--ink-hi);
    line-height: 1.55;
  }
  .vibe-role-card-eyebrow {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }
  .vibe-role-card-body {
    font-size: 13.5px;
    color: var(--ink-mid);
    margin: 0;
  }
  .vibe-role-card-body strong { color: var(--ink-hi); font-weight: 600; }

  @media (max-width: 980px) {
    .vibe-wrap { height: auto; }
  }
  .vibe-panel {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .vibe-panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--bg-2);
  }
  .vibe-panel-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-mid);
    margin: 0;
  }
  .vibe-panel-actions {
    display: flex;
    gap: 5px;
    align-items: center;
    flex-wrap: wrap;
  }

  /* Chat panel */
  .vibe-chat-scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }
  .vibe-chat-empty {
    color: var(--ink-low);
    font-size: 13.5px;
    text-align: center;
    padding: 32px 18px;
    line-height: 1.6;
  }
  .vibe-chat-empty strong {
    color: var(--ink-mid);
    display: block;
    margin-bottom: 8px;
    font-size: 14.5px;
  }
  .vibe-msg {
    max-width: 92%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .vibe-msg-user {
    align-self: flex-end;
    background: var(--accent);
    color: white;
    border: none;
  }
  .vibe-msg-ai {
    align-self: flex-start;
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--ink-hi);
  }
  .vibe-msg-error {
    align-self: flex-start;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    font-size: 13.5px;
  }
  .vibe-msg-loading {
    align-self: flex-start;
    color: var(--ink-mid);
    font-size: 13.5px;
    font-style: italic;
    animation: vibePulse 1.4s ease-in-out infinite;
  }
  @keyframes vibePulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  .vibe-msg-codepreview {
    margin-top: 8px;
    background: #1e293b;
    color: #e2e8f0;
    border-radius: 8px;
    padding: 10px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    font-size: 12px;
    line-height: 1.5;
    max-height: 180px;
    overflow: auto;
    white-space: pre;
  }
  .vibe-msg-copybtn {
    margin-top: 8px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .vibe-msg-copybtn:hover { background: var(--accent-hover); }
  .vibe-msg-copybtn.is-copied { background: var(--success); }

  /* Prompt starter chips — quick-fill templates modeled on modern code-prompt
     patterns ("Act like...", "Walk me through...", "Debug this..."). Click a
     chip to drop its scaffold into the input; the cursor lands at the
     customizable portion ready to type. */
  .vibe-stems-wrap {
    border-top: 1px solid var(--border);
    background: var(--bg-2);
    padding: 10px 18px 4px;
  }
  .vibe-stems-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--ink-low);
    margin: 0 0 8px;
  }
  .vibe-stems {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .vibe-stem {
    background: white;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-mid);
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .vibe-stem:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .vibe-stem--primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
  }
  .vibe-stem--primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: #fff;
  }
  .vibe-stem--primary .vibe-stem-icon {
    opacity: 1;
  }
  .vibe-stem-icon {
    font-size: 11px;
    opacity: 0.7;
  }

  .vibe-input-row {
    border-top: 1px solid var(--border);
    padding: 12px 18px 16px;
    background: var(--bg-2);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .vibe-input {
    flex: 1 1 auto;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--bg-1);
    padding: 14px 16px;
    font: inherit;
    font-size: 15px;
    line-height: 1.55;
    min-height: 64px;
    max-height: 220px;
    overflow-y: auto;
    color: var(--ink-hi);
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    white-space: pre-wrap;
    word-break: break-word;
    cursor: text;
  }
  .vibe-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }
  /* Contenteditable placeholder: shown only when the div is empty. */
  .vibe-input:empty::before {
    content: attr(data-placeholder);
    color: var(--ink-low);
    pointer-events: none;
  }
  /* Two-tone styling: template scaffold reads muted/italic; the user's
     filled-in portion (the bit inside <PLACEHOLDER>) renders in the
     accent color so students see the structure they're shaping. */
  .vibe-input-template {
    color: var(--ink-low);
    font-style: italic;
  }
  .vibe-input-user {
    color: var(--accent);
    font-weight: 600;
    font-style: normal;
    background: var(--accent-soft);
    padding: 1px 4px;
    border-radius: 4px;
  }
  .vibe-send-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 0;
    width: 56px;
    height: 56px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.12s ease, opacity 0.15s ease;
    align-self: flex-end;
    flex-shrink: 0;
  }
  .vibe-send-btn:hover { transform: translateY(-1px); }
  .vibe-send-btn:hover { background: var(--accent-hover); }
  .vibe-send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Editor panel: takes full page width now. Editor expands, monitor docks
     at bottom. */
  .vibe-right {
    display: grid;
    grid-template-rows: auto auto 1fr auto auto auto;
    min-height: 0;
    flex: 1 1 auto;
  }
  .vibe-editor-wrap {
    flex: 1 1 auto;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 240px;
  }
  .vibe-editor-wrap .CodeMirror {
    height: 100%;
    font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
  }
  .vibe-editor-fallback {
    flex: 1 1 auto;
    width: 100%;
    border: none;
    padding: 14px 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    font-size: 13px;
    line-height: 1.55;
    background: var(--bg-1);
    color: var(--ink-hi);
    resize: none;
    outline: none;
  }
  .vibe-monitor-header {
    background: #0f172a;
    color: #cbd5e1;
    padding: 7px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-top: 1px solid var(--border);
  }
  .vibe-monitor-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: #94a3b8;
    margin: 0;
  }
  .vibe-monitor-controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .vibe-monitor-controls select,
  .vibe-monitor-controls .vibe-mini-btn {
    background: #1e293b;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 5px 11px;
    font-size: 11.5px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .vibe-monitor-controls .vibe-mini-btn:hover {
    background: #334155;
  }
  .vibe-monitor {
    background: #0b1220;
    color: #4ade80;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    font-size: 12px;
    line-height: 1.5;
    padding: 8px 14px;
    height: 68px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .vibe-monitor::-webkit-scrollbar { width: 10px; }
  .vibe-monitor::-webkit-scrollbar-track { background: #0b1220; }
  .vibe-monitor::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  .vibe-monitor::-webkit-scrollbar-thumb:hover { background: #334155; }
  .vibe-monitor-empty {
    color: #475569;
    font-style: italic;
  }

  .vibe-btn {
    background: var(--bg-1);
    border: 1px solid var(--border);
    color: var(--ink-mid);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  /* Icon-only segmented toolbar: each button is a 34x34 square with the
     icon centered. Buttons within a group share a soft container with
     internal dividers. Hover lifts to white + indigo icon; active state
     fills indigo. Reads as a deliberate, slick toolbar component. */
  .vibe-toolbar-group {
    display: inline-flex;
    align-items: stretch;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    padding: 0;
    box-shadow: 0 1px 0 rgba(17, 17, 17, 0.02);
  }
  .vibe-tool-btn {
    background: transparent;
    border: none;
    color: var(--ink-mid);
    width: 36px;
    height: 32px;
    padding: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.14s ease, color 0.14s ease, transform 0.12s ease;
    line-height: 1;
    font-family: inherit;
  }
  .vibe-tool-btn + .vibe-tool-btn { border-left: 1px solid var(--border); }
  .vibe-tool-btn svg {
    color: var(--ink-mid);
    transition: color 0.14s ease, transform 0.12s ease;
    display: block;
  }
  .vibe-tool-btn:hover {
    background: white;
  }
  .vibe-tool-btn:hover svg {
    color: var(--accent);
    transform: scale(1.08);
  }
  .vibe-tool-btn:active svg { transform: scale(0.94); }
  .vibe-tool-btn.is-active,
  .vibe-tool-btn.is-copied {
    background: var(--accent);
  }
  .vibe-tool-btn.is-active svg,
  .vibe-tool-btn.is-copied svg { color: white; }

  /* Floating hover tooltip for tool buttons. Body-mounted so the toolbar
     group's overflow:hidden can't clip it. */
  .tt-tooltip {
    position: fixed;
    z-index: 1300;
    background: #111827;
    color: #f9fafb;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.2;
    padding: 6px 10px;
    border-radius: 6px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity 0.12s ease, transform 0.12s ease;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.18), 0 1px 3px rgba(15, 23, 42, 0.08);
    letter-spacing: 0;
    text-transform: none;
  }
  .tt-tooltip.is-visible {
    opacity: 1;
    transform: translateY(0);
  }
  .vibe-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .vibe-btn.is-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .vibe-btn.is-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: white;
  }
  .vibe-btn.is-active {
    background: var(--success);
    border-color: var(--success);
    color: white;
  }
  .vibe-btn.is-copied {
    background: var(--success);
    border-color: var(--success);
    color: white;
  }

  /* "+ Save to..." popover (shared by Schematic + Vibe Coding tools). */
  .save-to-anchor {
    position: relative;
    display: inline-block;
  }
  .save-to-pop {
    position: fixed;
    z-index: 1200;
    width: 320px;
    max-height: 460px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 12px 32px rgba(15, 23, 42, 0.14), 0 2px 6px rgba(15, 23, 42, 0.06);
    padding: 6px 0;
    text-align: left;
  }
  .save-to-section {
    border-top: 1px solid var(--border);
    padding: 8px 0 6px;
  }
  .save-to-section:first-child { border-top: none; }
  .save-to-eyebrow {
    display: block;
    padding: 6px 14px 4px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--ink-mid);
  }
  .save-to-item {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 38px;
    padding: 8px 14px;
    background: transparent;
    border: 0;
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
    letter-spacing: 0;
    text-transform: none;
  }
  .save-to-item:hover:not(:disabled) {
    background: var(--bg-2);
    color: var(--accent);
  }
  .save-to-item:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .save-to-item.is-portfolio {
    font-weight: 600;
    color: var(--accent);
  }
  .save-to-item.is-portfolio:hover:not(:disabled) {
    background: var(--accent-soft);
  }
  .save-to-item .save-to-arrow {
    margin-right: 4px;
    opacity: 0.6;
  }

  /* Chat avatars — ChatGPT-style "AI" / "You" mini circles next to each
     message. Keeps the conversation legible at a glance. */
  .vibe-msg-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .vibe-msg-row.is-user { flex-direction: row-reverse; }
  .vibe-msg-row.is-loading { gap: 10px; }
  .vibe-msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.4px;
    color: white;
    margin-top: 2px;
  }
  .vibe-msg-avatar.is-ai {
    background: linear-gradient(135deg, #14b8a6, #0d9488);
  }
  .vibe-msg-avatar.is-user {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
  }
  .vibe-msg-row .vibe-msg { max-width: 100%; flex: 1 1 auto; }

  /* Libraries strip — sits above the editor, mimics Arduino IDE's
     "library inclusions" visibility. Auto-detects #include lines from the
     editor and surfaces quick-add buttons for the libraries the class uses. */
  .vibe-libs {
    background: var(--bg-2);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 9px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 12px;
  }
  .vibe-libs-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--ink-low);
    flex-shrink: 0;
  }
  .vibe-libs-active {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1 1 auto;
    min-width: 0;
  }
  .vibe-libs-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    font-size: 11.5px;
    color: var(--paper-ink);
  }
  .vibe-libs-chip.is-empty {
    background: transparent;
    border-style: dashed;
    color: var(--ink-low);
    font-family: inherit;
    font-style: italic;
  }
  .vibe-libs-add {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .vibe-libs-add button {
    background: white;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;

  function nameSlug(name) {
    return String(name || '')
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  // Subscribes once on load; subsequent reads use _liveRoster.
  let _liveRoster = [...ROSTER];

  function subscribeRoster(cb) {
    _rosterSubs.add(cb);
    cb(_liveRoster);
    return () => _rosterSubs.delete(cb);
  }
  function _setLiveRoster(names) {
    const merged = Array.from(new Set([...ROSTER, ...names])).sort((a, b) =>
      a.localeCompare(b, undefined, { sensitivity: 'base' })

    _liveRoster = merged;
    _rosterSubs.forEach(cb => { try { cb(_liveRoster); } catch (e) {} });

    _setLiveRoster(fromFirestore);

  // Live count badges — SCOPED for scale.
  //
  // Old approach: two unscoped onSnapshot listeners on the full /portfolios
  // and /artifacts collections. At 200 students × ~5 submissions × 20
  // benchmarks that's 20,000+ doc reads on first paint and the listener
  // re-fires on every write.
  //
  // New approach:
  //   1. Initial load: one getCountFromServer() per benchmark (server-side
  //      aggregation, billed as 1 read each — ~30 total instead of 20,000).
  //   2. Live updates: maintain counts locally by listening only to the
  //      currently-OPEN benchmark's gallery (already done in
  //      subscribePortfolios + subscribeGallery). Other badges drift only
  //      while a different benchmark is open; refreshCountBadge() is called
  //      after every submit/delete to re-pull the affected benchmark.
  async function refreshCountBadge(benchmarkId) {
    if (!benchmarkId) return;
    const isHw = benchmarkId.startsWith('hw-');
    const colName = isHw ? 'artifacts' : 'portfolios';
    try {
      const q = query(collection(db, colName), where('benchmarkId', '==', benchmarkId));
      const agg = await getCountFromServer(q);
      updateCountBadge(benchmarkId, agg.data().count);
    } catch (err) {
      console.warn('count refresh failed for', benchmarkId, err);
    }
  }

  async function loadInitialCounts() {
    const ids = Object.keys(countEls);
    // Run in parallel; getCountFromServer is a single read each.
    await Promise.allSettled(ids.map(refreshCountBadge));
  }

  // Default schematic state.

      wires: [],

      // and obvious. The student can still switch to red/yellow/green/blue/

      selectedColor: 'black',
      resistorReminderShown: false,
      _idCounter: 1
    };
  }

  let _schemState = null;
  let _schemPendingPin = null;   // pinId waiting for second click
  let _schemDrag = null;         // { id, startX, startY, originGx, originGy }
  let _schemResize = null;       // { id, startX, startY, startCols, startRows } - perfboard resize
  let _schemSvg = null;          // root <svg>
  let _schemWireDrag = null;     // { fromPinId, startClientX, startClientY, moved }
  let _schemSuppressNextPinClick = false; // skip the click that follows a wire-drag
  let _schemSelectedWire = null; // currently selected wire id, or null
  let _schemSelected = null;     // currently selected component id, or null
  let _schemPaletteDrag = null;  // { type, startX, startY, ghostEl, didMove }
  const _schemHistory = [];      // JSON snapshots of state for undo
  const _SCHEM_HISTORY_MAX = 40;

  function pushSchemHistory() {
    try {
      _schemHistory.push(JSON.stringify(_schemState));
      if (_schemHistory.length > _SCHEM_HISTORY_MAX) _schemHistory.shift();
    } catch (_) {}
  }
  function schemUndo() {
    const snap = _schemHistory.pop();
    if (!snap) {
      schemToast('Nothing to undo.');
      return;
    }
    try {
      _schemState = JSON.parse(snap);
      _schemPendingPin = null;
      _schemSelected = null;
      schemSave();
      renderPerfboard();
    } catch (_) {
      schemToast('Could not undo.');
    }
  }

  function schemLoad() {
    try {
      const raw = localStorage.getItem(SCHEM_STORAGE_KEY);
      if (!raw) return _schemDefaultState();
      const parsed = JSON.parse(raw);
      // Merge defaults so older saves don't crash.
      return Object.assign(_schemDefaultState(), parsed);
    } catch (err) {
      console.warn('schematic load failed', err);
      return _schemDefaultState();
    }
  }

  function schemSave() {
    try {
      localStorage.setItem(SCHEM_STORAGE_KEY, JSON.stringify(_schemState));
    } catch (err) {
      console.warn('schematic save failed', err);
    }
  }

  function schemNewId(prefix) {
    const n = _schemState._idCounter++;
    return `${prefix}_${n}`;
  }

  function schemToast(msg, ms) {
    let el = document.getElementById('schemToast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'schemToast';
      el.className = 'schem-toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    requestAnimationFrame(() => el.classList.add('is-visible'));
    clearTimeout(el._timer);
    el._timer = setTimeout(() => {
      el.classList.remove('is-visible');
    }, ms || 2400);
  }

  // ============== Hover tooltips for tool icons ==============
  // Floats a styled label below the tool button on hover. Lives on
  // document.body so the toolbar group's overflow:hidden can't clip it
  // (same trick as the Save-to popover). Reads its text from the button's
  // title attribute on first hover, then strips it so the OS tooltip
  // doesn't double up. aria-label stays for screen readers.
  let _ttEl = null;
  let _ttActive = null;
  let _ttShowTimer = null;

  function vibeSetTooltip(btn, text) {
    if (!btn) return;
    btn.dataset.tt = text || '';
    if (btn.hasAttribute('title')) btn.removeAttribute('title');
    btn.setAttribute('aria-label', text || btn.getAttribute('aria-label') || '');
    if (_ttActive === btn && _ttEl && _ttEl.classList.contains('is-visible')) {
      _ttEl.textContent = text || '';
    }
  }

  function _ttEnsure() {
    if (_ttEl) return _ttEl;
    _ttEl = document.createElement('div');
    _ttEl.className = 'tt-tooltip';
    document.body.appendChild(_ttEl);
    return _ttEl;
  }

  function _ttShow(btn) {
    const txt = btn.dataset.tt;
    if (!txt) return;
    const el = _ttEnsure();
    el.textContent = txt;
    el.classList.add('is-visible');
    const r = btn.getBoundingClientRect();
    const w = el.offsetWidth;
    let left = r.left + r.width / 2 - w / 2;
    let top = r.bottom + 8;
    if (left < 8) left = 8;
    if (left + w > window.innerWidth - 8) left = window.innerWidth - w - 8;
    el.style.left = left + 'px';
    el.style.top = top + 'px';
  }

  function _ttHide() {
    _ttActive = null;
    clearTimeout(_ttShowTimer);
    if (_ttEl) _ttEl.classList.remove('is-visible');
  }

  function _ttPrep(root) {
    if (!root) return;
    root.querySelectorAll('.vibe-tool-btn[title]').forEach(b => {
      b.dataset.tt = b.getAttribute('title');
      b.removeAttribute('title');
    });
  }

  // Tool buttons render dynamically when initSchematicTool / initVibeCodingTool
  // run, so prep on every DOM mutation. Cheap because the selector is fast.
  (function initToolTooltips() {
    if (typeof window === 'undefined') return;
    _ttPrep(document.body);
    const obs = new MutationObserver(() => _ttPrep(document.body));
    obs.observe(document.body, { childList: true, subtree: true });
    document.addEventListener('mouseover', (e) => {
      const btn = e.target.closest('.vibe-tool-btn');
      if (!btn || _ttActive === btn) return;
      _ttActive = btn;
      clearTimeout(_ttShowTimer);
      _ttShowTimer = setTimeout(() => {
        if (_ttActive === btn) _ttShow(btn);
      }, 350);
    });
    document.addEventListener('mouseout', (e) => {
      const btn = e.target.closest('.vibe-tool-btn');
      if (btn) _ttHide();
    });
    window.addEventListener('scroll', _ttHide, true);
    window.addEventListener('blur', _ttHide);
  })();

    _schemPendingPin = null;

    _schemSelected = null;
    _schemPaletteDrag = null;

    app.innerHTML = '';
    const wrap = document.createElement('section');
    wrap.className = 'project';
    wrap.innerHTML = `
