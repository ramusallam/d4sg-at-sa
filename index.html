          msg.textContent = 'Could not add: ' + (err && err.message || err);
        } finally {
          btn.disabled = false;
        }
      });
    }

    load();
  }

  function applyRoute(path) {
    // Close any open modal first so Back/nav never leaves one stacked over a
    // new view with body scroll locked and stale gallery listeners live.
    try { if (modal && modal.classList.contains('open')) closeModal(); } catch (_) {}
    // Run the leaving view's cleanup (document listeners, Firestore
    // subscriptions, serial port, editor instances) no matter HOW the user
    // left: Back button, top nav, or an in-modal tool link.
    if (_viewTeardown) { try { _viewTeardown(); } catch (_) {} _viewTeardown = null; }
    const r = (path || '').replace(/\/+$/, '');
    document.body.classList.remove('view-home', 'view-hw', 'view-tools', 'view-syllabus', 'view-exhibit', 'view-dayone');
    if (r === '/day-one') {
      document.body.classList.add('view-dayone');
      renderDayOne();
    } else if (r === '/exhibit') {
      document.body.classList.add('view-exhibit');
      renderExhibit();
    } else if (r === '/syllabus') {
      // Legacy route: the syllabus lives in the syllabi app now, so send old
      // bookmarks and QR codes straight there instead of showing a stub.
      location.replace('https://ramsey-syllabi.vercel.app/');
      return;
    } else if (r === '/hw') {
      document.body.classList.add('view-hw');
      renderHomework();
    } else if (r === '/tools/vibe') {
      document.body.classList.add('view-tools');
      initVibeCodingTool();
    } else if (r === '/tools/schematic') {
      document.body.classList.add('view-tools');
      initSchematicTool();
    } else if (r === '/tools/idea-board') {
      document.body.classList.add('view-tools');
      initIdeaBoardTool();
    } else if (r === '/tools') {
      document.body.classList.add('view-tools');
      renderTools();
    } else {
      document.body.classList.add('view-home');
      renderProjects();
    }
    window.scrollTo(0, 0);
    // Every navigation is a cheap moment to notice a new deploy.
    if (typeof checkForUpdate === 'function') checkForUpdate().catch(() => {});
  }

  // Intercept top-nav links so navigation feels instant. Only intercept
  // same-origin internal routes; external/admin links go through normal
  // navigation.
  document.addEventListener('click', (e) => {
    const a = e.target && e.target.closest && e.target.closest('a');
    if (!a) return;
    if (!(a.classList.contains('nav-link') || a.classList.contains('header-title-link'))) return;
    const href = a.getAttribute('href') || '';
    if (!href.startsWith('/')) return;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
    e.preventDefault();
    // Compare path + query so navigating Home from /?b=... actually clears
    // the ?b= deep link instead of leaving a URL that reopens the benchmark.
    if (location.pathname + location.search !== href) history.pushState({}, '', href);
    applyRoute(href);
  });
  window.addEventListener('popstate', () => {
    applyRoute(location.pathname);
    // Re-open a benchmark/homework deep link so Back from a tool lands the
    // student inside the modal they came from, not on a bare home list.
    try {
      const bid = new URLSearchParams(location.search).get('b');
      if (!bid) return;
      const bench = findBenchmarkById(bid);
      const hw = !bench && HOMEWORK.find(w => w.id === bid);
      if (bench) openModal(bench);
      else if (hw) openHomeworkModal(hw);
    } catch (_) {}
  });

  // ---- Stale-tab guard ----
  // The app is a single-page app: navigating inside it never re-downloads
  // index.html, so an open tab can silently run code from an old deploy. We
  // snapshot the served index.html ETag at boot, then re-check on a timer and
  // on every route change; when it differs, a "Refresh now" banner appears.
  // Declared before the first applyRoute() call so checkForUpdate() (invoked
  // from applyRoute) never hits the temporal dead zone.
  let _loadedEtag = null;
  let _updateBannerShown = false;
  async function _fetchIndexEtag() {
    try {
      const r = await fetch('/index.html', { method: 'HEAD', cache: 'no-store' });
      return r.headers.get('etag') || r.headers.get('last-modified') || null;
    } catch (_) { return null; }
  }
  async function checkForUpdate() {
    if (_updateBannerShown) return;
    const cur = await _fetchIndexEtag();
    if (!cur) return;
    if (_loadedEtag == null) { _loadedEtag = cur; return; }
    if (cur !== _loadedEtag) showUpdateBanner();
  }
  function showUpdateBanner() {
    if (_updateBannerShown || document.getElementById('updateBanner')) return;
    _updateBannerShown = true;
    const bar = document.createElement('div');
    bar.id = 'updateBanner';
    bar.innerHTML = '<span>A newer version of this page is available.</span>' +
      '<button type="button" id="updateBannerBtn">Refresh now</button>';
    document.body.appendChild(bar);
    const btn = document.getElementById('updateBannerBtn');
    if (btn) btn.addEventListener('click', () => location.reload());
  }
  try {
    _fetchIndexEtag().then(e => { _loadedEtag = e; });
    setInterval(() => { checkForUpdate().catch(() => {}); }, 90000);
  } catch (_) {}

  applyRoute(location.pathname);
  // Pull initial counts via getCountFromServer (1 read per benchmark).
  loadInitialCounts();
  // Deep link to a benchmark: ?b=<id> opens it straight into the modal. This is
  // what the "open in a dedicated work tab" flow points at — each benchmark now
  // has its own URL, so the home tab can stay put while work happens in one
  // reused tab. Open SYNCHRONOUSLY (no setTimeout) so the modal is already on
  // screen at first paint — the old 50ms defer flashed the home project list
  // first, which read as "it opens the home page, then opens the benchmark."
  const benchDeepLink = urlParams.get('b');
  if (benchDeepLink) {
    const bench = PROJECTS.flatMap(p => p.benchmarks || []).find(x => x.id === benchDeepLink);
    const hw = !bench && HOMEWORK.find(w => w.id === benchDeepLink);
    // No open animation on a work-tab load: the modal should already be there
    // at first paint, not fade in over the home list. closeModal clears this
    // so a later in-page open still animates.
    if (bench || hw) document.documentElement.classList.add('deeplink-paint');
    if (bench) openModal(bench);
    else if (hw) openHomeworkModal(hw);
    else schemToast('That link points to a benchmark that no longer exists.');
  }

  // Keep the home tab honest while work happens in the dedicated work tab:
  // when another tab updates the checked set, re-read it and repaint the
  // checkboxes so a completed benchmark shows up without a manual reload.
  window.addEventListener('storage', (e) => {
    if (e.key === LAST_PICK_KEY) { syncCheckedFromCloud(); return; }
    if (e.key !== STORAGE_KEY) return;
    try {
      const next = new Set(JSON.parse(e.newValue || '[]'));
      checked.clear();
      next.forEach(id => checked.add(id));
      applyCheckedToDom();
    } catch (_) {}
  });

  // Deep link to an archive: ?admin=ramsey-d4sg&archive=2026-04-15T12-34-56
  if (isAdmin) {
    const archiveDeepLink = urlParams.get('archive');
    if (archiveDeepLink) {
      // Defer slightly so projects render first.
      setTimeout(() => openArchiveDetail(archiveDeepLink, null), 50);
    }
  }
</script>

</body>
</html>
