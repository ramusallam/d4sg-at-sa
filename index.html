    // Identity strip so the student picks their name before they wire anything.
    const schemIdentityMount = wrap.querySelector('[data-schem-identity]');
    if (schemIdentityMount) {
      schemIdentityMount.appendChild(renderIdentityStrip({
        onChange: () => { schemSwitchStudent(); }
      }));
    }
    // Pull the student's saved schematic from cloud on first visit on this
    // device (no-op if local already has data).
    schemHydrateFromCloud().catch(() => null).then(() => {
      // After hydrate, reload state in case the cloud seeded localStorage,
      // then repaint so the downloaded board actually appears.
      _schemState = schemLoad();
      if (document.getElementById('schemCanvasWrap')) renderPerfboard();
    });

    wireToolBackButton(document.getElementById('schemBack'));

    renderComponentPalette();
    renderColorRow();
    renderPerfboard();

    document.getElementById('schemUndo').addEventListener('click', schemUndo);
    document.getElementById('schemZoomOut').addEventListener('click', () => schemSetZoom(_schemZoom - 0.15));
    document.getElementById('schemZoomIn').addEventListener('click', () => schemSetZoom(_schemZoom + 0.15));
    document.getElementById('schemZoomFit').addEventListener('click', schemZoomFit);
    // Ctrl/Cmd + scroll zooms the canvas.
    const _zoomWrap = document.getElementById('schemCanvasWrap');
    if (_zoomWrap) {
      _zoomWrap.addEventListener('wheel', (e) => {
        if (!(e.ctrlKey || e.metaKey)) return;
        e.preventDefault();
        schemSetZoom(_schemZoom + (e.deltaY < 0 ? 0.1 : -0.1));
      }, { passive: false });
    }
    // Keyboard shortcut: Cmd/Ctrl+Z to undo, R to rotate selection, Delete/Backspace to remove selection.
    const schemKeyHandler = (e) => {
      // Skip if typing in a real input, or if the schematic view is gone
      // (belt-and-suspenders: teardown removes this handler on route change).
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return;
      if (!document.getElementById('schemCanvasWrap')) return;
      // The Save-to flow opens the benchmark modal OVER the still-mounted
      // canvas. A Backspace/R pressed in the modal must never edit (and
      // silently save) the board hidden behind it.
      if (modal && modal.classList.contains('open')) return;

      if (e.key === 'Escape') {
        // Cancel an in-progress wire and drop any selection.
        if (_schemPendingPin) {
          _schemPendingPin = null;
          _removeWirePreview();
          highlightPendingPin(null);
        }
        if (_schemSelected || _schemSelectedWire) {
          _schemSelected = null;
          _schemSelectedWire = null;
          renderPerfboard();
        }
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
        e.preventDefault();
        schemUndo();
        return;
      }
      if (e.metaKey || e.ctrlKey || e.altKey) return;

      const key = e.key;
      if ((key === 'r' || key === 'R') && _schemSelected) {
        const c = _schemState.components.find(x => x.id === _schemSelected);
        if (!c || _isResizableBoard(c)) return; // boards (perfboard, breadboard) don't rotate
        e.preventDefault();
        pushSchemHistory();
        c.rotation = ((c.rotation || 0) + 90) % 360;
        schemSave();
        renderPerfboard();
        return;
      }
      if ((key === 'Delete' || key === 'Backspace') && _schemSelected) {
        e.preventDefault();
        const id = _schemSelected;
        _schemSelected = null;
        deleteComponent(id);
        return;
      }
      if ((key === 'Delete' || key === 'Backspace') && _schemSelectedWire) {
        e.preventDefault();
        const id = _schemSelectedWire;
        _schemSelectedWire = null;
        deleteWire(id);
        return;
      }
    };
    document.addEventListener('keydown', schemKeyHandler);
    // Palette ghost-drag global listeners.
    document.addEventListener('mousemove', _schemOnPaletteDragMove);
    document.addEventListener('mouseup', _schemOnPaletteDragEnd);
    // Wire-drag global listeners (drag from one pin to another).
    document.addEventListener('mousemove', _schemWireDragMove);
    document.addEventListener('mouseup', _schemWireDragEnd);
    // Component drag/resize global listeners: on document (not the SVG) so a
    // fast drag that leaves the canvas doesn't drop the component mid-motion.
    document.addEventListener('mousemove', _schemOnDragMove);
    document.addEventListener('mouseup', _schemOnDragEnd);
    // Teardown on ANY route change (back button, top nav, tool links) — not
    // just the Back button. applyRoute runs this before rendering a new view.
    setViewTeardown(() => {
      document.removeEventListener('keydown', schemKeyHandler);
      document.removeEventListener('mousemove', _schemOnPaletteDragMove);
      document.removeEventListener('mouseup', _schemOnPaletteDragEnd);
      document.removeEventListener('mousemove', _schemWireDragMove);
      document.removeEventListener('mouseup', _schemWireDragEnd);
      document.removeEventListener('mousemove', _schemOnDragMove);
      document.removeEventListener('mouseup', _schemOnDragEnd);
      _schemCancelPaletteDrag();
      _schemSelected = null;
      _schemSelectedWire = null;
      _schemPendingPin = null;
      cleanupIdentityStrip(schemIdentityMount);
    });

    document.getElementById('schemClear').addEventListener('click', () => {
      if (!_schemState.components.length && !_schemState.wires.length) {
        schemToast('Already empty.');
        return;
      }
      if (!confirm('Clear the whole canvas? Undo brings it back.')) return;
      clearCanvas();
    });

    const schemSaveBtn = document.getElementById('schemSaveTo');
    schemSaveBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      // If popover is already open against this button, toggle closed.
      if (_saveToPopOpen && _saveToPopOpen.anchorEl === schemSaveBtn) {
        closeSaveToPop();
        return;
      }
      const buildBlob = () => new Promise((resolve, reject) => {
        buildSchemPngBlob((blob, err) => {
          if (err || !blob) reject(err || new Error('no blob'));
          else resolve(blob);
        });
      });
      openSaveToPop(schemSaveBtn, 'schematic', buildBlob);
    });

    document.getElementById('schemDownload').addEventListener('click', () => {
      exportPNG();
    });
  }

  function renderColorRow() {
    const row = document.getElementById('schemColors');
    row.innerHTML = '';
    Object.entries(SCHEM_COLORS).forEach(([name, hex]) => {
      const btn = document.createElement('button');
      btn.className = 'schem-color' + (name === _schemState.selectedColor ? ' is-active' : '');
      btn.style.background = hex;
      btn.title = name;
      btn.setAttribute('aria-label', `Wire color: ${name}`);
      btn.addEventListener('click', () => {
        _schemState.selectedColor = name;
        schemSave();
        renderColorRow();
      });
      row.appendChild(btn);
    });
  }

  function renderComponentPalette() {
    const pal = document.getElementById('schemPalette');
    pal.innerHTML = '';
    const groups = { boards: [], components: [] };
    Object.entries(SCHEM_COMPONENTS).forEach(([type, def]) => {
      groups[def.group].push({ type, def });
    });

    const addGroup = (title, items) => {
      const heading = document.createElement('div');
      heading.className = 'schem-palette-group';
      heading.textContent = title;
      pal.appendChild(heading);
      items.forEach(({ type, def }) => {
        const btn = document.createElement('button');
        btn.className = 'schem-palette-item';
        btn.innerHTML = `
          <span class="schem-palette-thumb">
            <svg viewBox="0 0 ${def.w * SCHEM_GRID_PITCH} ${def.h * SCHEM_GRID_PITCH}" width="28" height="${Math.min(28, def.h * 14)}">
              ${def.svg({ ledColor: 'red' })}
            </svg>
          </span>
          <span>${def.label}</span>
        `;
        btn.addEventListener('mousedown', (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          _schemPaletteDrag = {
            type,
            startX: e.clientX,
            startY: e.clientY,
            ghostEl: null,
            didMove: false
          };
        });
        pal.appendChild(btn);
      });
    };

    addGroup('Boards', groups.boards);
    addGroup('Components', groups.components);
  }

  // Resize the canvas grid to fit all currently-placed components, plus a few
  // cells of breathing room on the right and bottom. Generous minimums so the
  // canvas starts off as a real workspace, not a tight box.
  function autoFitCanvas() {
    let maxCol = 50;
    let maxRow = 32;
    _schemState.components.forEach(c => {
      const w = _schemComponentW(c);
      const h = _schemComponentH(c);
      maxCol = Math.max(maxCol, c.x + w + 5);
      maxRow = Math.max(maxRow, c.y + h + 4);
    });
    _schemState.gridCols = maxCol;
    _schemState.gridRows = maxRow;
  }

  // Canvas zoom: scales only the displayed SVG size so you can pull back to
  // see the whole diagram, then zoom in to focus. Coordinates stay 1:1.
  function schemSetZoom(z) {
    _schemZoom = Math.min(2, Math.max(0.3, z));
    if (_schemSvg && _schemBaseW) {
      _schemSvg.setAttribute('width', _schemBaseW * _schemZoom);
      _schemSvg.setAttribute('height', _schemBaseH * _schemZoom);
    }
    const lbl = document.getElementById('schemZoomLabel');
    if (lbl) lbl.textContent = Math.round(_schemZoom * 100) + '%';
  }
  function schemZoomFit() {
    const wrap = document.getElementById('schemCanvasWrap');
    if (!wrap || !_schemBaseW) return;
    const avail = wrap.clientWidth - 30; // account for padding
    schemSetZoom(avail / _schemBaseW);
  }

  function _isResizableBoard(c) {
    return c && (c.type === 'perfboard' || c.type === 'breadboard');
  }
  function _schemComponentW(c) {
    const def = SCHEM_COMPONENTS[c.type];
    if (!def) return 4;
    if (c.type === 'breadboard') return 17; // breadboard width is fixed: 2 rails + label + A-E + channel + F-J + label + 2 rails
    if (_isResizableBoard(c)) return c.cols || def.w;
    return def.w;
  }
  function _schemComponentH(c) {
    const def = SCHEM_COMPONENTS[c.type];
    if (!def) return 4;
    if (_isResizableBoard(c)) return c.rows || def.h;
    return def.h;
  }
  function _schemPerfboardPins(cols, rows) {
    const out = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        out.push({ name: `r${r}c${c}`, gx: c + 0.5, gy: r + 0.5 });
      }
    }
    return out;
  }
  function _schemBreadboardChannelRow(rows) {
    // Channel sits in the middle, so the board mirrors top/bottom.
    // Rows 0 and (rows-1) are column-letter headers; tie rows fill the rest.
    return Math.floor(rows / 2);
  }
  function _schemBreadboardPins(cols, rows) {
    const channelRow = _schemBreadboardChannelRow(rows);
    const out = [];
    const LETTERS_LEFT  = ['A','B','C','D','E'];
    const LETTERS_RIGHT = ['F','G','H','I','J'];
    let tieIdx = 0;
    for (let r = 1; r <= rows - 2; r++) {
      if (r === channelRow) continue;
      tieIdx += 1;
      const y = r + 0.5;
      out.push({ name: `Lp${tieIdx}`, gx: 0.5,  gy: y });
      out.push({ name: `Ln${tieIdx}`, gx: 1.5,  gy: y });
      LETTERS_LEFT.forEach((L, i)  => out.push({ name: `${L}${tieIdx}`, gx: 3.5 + i, gy: y }));
      LETTERS_RIGHT.forEach((L, i) => out.push({ name: `${L}${tieIdx}`, gx: 9.5 + i, gy: y }));
      out.push({ name: `Rn${tieIdx}`, gx: cols - 1.5, gy: y });
      out.push({ name: `Rp${tieIdx}`, gx: cols - 0.5, gy: y });
    }
    return out;
  }
  function _schemBreadboardBodySvg(cw, ch) {
    // Faithful half-size 400-point breadboard. Matches the white boards the
    // class actually uses: 30 numbered tie rows, A-E + F-J columns split by a
    // vertical channel, and FOUR independent power-rail half-segments per
    // side (top + bottom), broken at the channel — wiring across the middle
    // requires a jumper, just like the real board.
    const P = SCHEM_GRID_PITCH;
    const W = cw * P;
    const H = ch * P;
    const channelRow = _schemBreadboardChannelRow(ch);
    const topStart = 1;
    const botEnd = ch - 2;
    const railTopY = (topStart + 0.5) * P;
    const railBotY = (botEnd + 0.5) * P;

    const rail = (col, color, label) => {
      const x = (col + 0.5) * P;
      const stripW = P * 0.72;
      // One continuous rail running the full side of the board, top to bottom,
      // just like a real breadboard power bus. The colored guide line spans the
      // entire tie-point height with no mid-board gap.
      const railStart = railTopY - 0.5 * P;
      const railEnd   = railBotY + 0.5 * P;
      return `
        <rect x="${x - stripW / 2}" y="${railStart}" width="${stripW}" height="${railEnd - railStart}" rx="${stripW / 2}" fill="${color}" opacity="0.32" pointer-events="none"/>
        <line x1="${x}" y1="${railStart + 0.15 * P}" x2="${x}" y2="${railEnd - 0.15 * P}" stroke="${color}" stroke-width="3.5" stroke-linecap="round" pointer-events="none"/>
        <text x="${x}" y="${railTopY - 0.65 * P}" text-anchor="middle" font-size="13" fill="${color}" font-family="system-ui, sans-serif" font-weight="800" pointer-events="none">${label}</text>
        <text x="${x}" y="${railBotY + 0.95 * P}" text-anchor="middle" font-size="13" fill="${color}" font-family="system-ui, sans-serif" font-weight="800" pointer-events="none">${label}</text>
      `;
    };

    // Row numbers in the left and right label margins (cols 2 and cw-3),
    // every row labeled small — matches the printed breadboard silkscreen.
    const rowNumbers = [];
    let tieIdx = 0;
    for (let r = topStart; r <= botEnd; r++) {
      if (r === channelRow) continue;
      tieIdx += 1;
      const y = (r + 0.5) * P + 2.5;
      rowNumbers.push(
        `<text x="${2.5 * P}"        y="${y}" text-anchor="middle" font-size="7" fill="#7a7368" font-family="system-ui, sans-serif" pointer-events="none">${tieIdx}</text>`,
        `<text x="${(cw - 2.5) * P}" y="${y}" text-anchor="middle" font-size="7" fill="#7a7368" font-family="system-ui, sans-serif" pointer-events="none">${tieIdx}</text>`
      );
    }

    // Column letter headers (top row + bottom row), lowercase like the silkscreen.
    const colLetters = [];
    const headerTopY = 0.85 * P;
    const headerBotY = (ch - 0.45) * P;
    ['a','b','c','d','e'].forEach((L, i) => {
      const x = (3.5 + i) * P;
      colLetters.push(
        `<text x="${x}" y="${headerTopY}" text-anchor="middle" font-size="10" fill="#7a7368" font-family="system-ui, sans-serif" font-weight="600" pointer-events="none">${L}</text>`,
        `<text x="${x}" y="${headerBotY}" text-anchor="middle" font-size="10" fill="#7a7368" font-family="system-ui, sans-serif" font-weight="600" pointer-events="none">${L}</text>`
      );
    });
    ['f','g','h','i','j'].forEach((L, i) => {
      const x = (9.5 + i) * P;
      colLetters.push(
        `<text x="${x}" y="${headerTopY}" text-anchor="middle" font-size="10" fill="#7a7368" font-family="system-ui, sans-serif" font-weight="600" pointer-events="none">${L}</text>`,
        `<text x="${x}" y="${headerBotY}" text-anchor="middle" font-size="10" fill="#7a7368" font-family="system-ui, sans-serif" font-weight="600" pointer-events="none">${L}</text>`
      );
    });

    // Center channel — a vertical groove running the full tie-strip height
    // between the E and F columns. The split between left and right tie
    // blocks is real: A-E in a row are tied together, F-J are tied together,
    // but the two blocks are NOT connected across the channel.
    const channelTopY = railTopY - 0.5 * P;
    const channelBotY = railBotY + 0.5 * P;
    return `
      <rect x="0" y="0" width="${W}" height="${H}" rx="6" fill="#ffffff" stroke="#cbc4b3" stroke-width="1.4"/>
      <rect x="1.5" y="1.5" width="${W - 3}" height="${H - 3}" rx="4" fill="none" stroke="rgba(0,0,0,0.03)" stroke-width="0.8" pointer-events="none"/>
      ${rail(0,      '#dc2626', '+')}
      ${rail(1,      '#1d4ed8', '-')}
      ${rail(cw - 2, '#1d4ed8', '-')}
      ${rail(cw - 1, '#dc2626', '+')}
      <rect x="${8 * P + P * 0.14}" y="${channelTopY}" width="${P * 0.72}" height="${channelBotY - channelTopY}" rx="2" fill="#f1ece1" stroke="#cbc4b3" stroke-width="0.5" pointer-events="none"/>
      <line x1="${8.5 * P}" y1="${channelTopY}" x2="${8.5 * P}" y2="${channelBotY}" stroke="rgba(0,0,0,0.08)" stroke-width="1" pointer-events="none"/>
      ${rowNumbers.join('')}
      ${colLetters.join('')}
    `;
  }

  function renderPerfboard() {
    const wrap = document.getElementById('schemCanvasWrap');
    if (!wrap) return;
    autoFitCanvas();
    wrap.innerHTML = '';

    const cols = _schemState.gridCols;
    const rows = _schemState.gridRows;
    const W = (cols + 1) * SCHEM_GRID_PITCH;
    const H = (rows + 1) * SCHEM_GRID_PITCH;

    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', 'schem-canvas');
    // viewBox stays at native 1:1 so all coordinates, clicks, and wiring are
    // unaffected; zoom only scales the displayed width/height.
    _schemBaseW = W;
    _schemBaseH = H;
    svg.setAttribute('width', W * _schemZoom);
    svg.setAttribute('height', H * _schemZoom);
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('xmlns', svgNS);
    _schemSvg = svg;

    // Workspace background, baked into the SVG so PNG export keeps it.
    const bg = document.createElementNS(svgNS, 'rect');
    bg.setAttribute('x', 0);
    bg.setAttribute('y', 0);
    bg.setAttribute('width', W);
    bg.setAttribute('height', H);
    bg.setAttribute('fill', '#FFFFFF');
    bg.setAttribute('rx', 8);
    svg.appendChild(bg);

    // Components layer.
    const layerComponents = document.createElementNS(svgNS, 'g');
    layerComponents.setAttribute('id', 'schemLayerComponents');
    svg.appendChild(layerComponents);

    // Wires layer (drawn ABOVE components so they're visible).
    const layerWires = document.createElementNS(svgNS, 'g');
    layerWires.setAttribute('id', 'schemLayerWires');
    svg.appendChild(layerWires);

    _schemState.components.forEach(c => drawComponent(c));
    _schemState.wires.forEach(w => drawWire(w));

    // Cancel pending wire on background click. Also deselect any selected component.
    svg.addEventListener('click', (e) => {
      if (e.target === svg || e.target === bg) {
        if (_schemPendingPin) {
          _schemPendingPin = null;
          highlightPendingPin(null);
          _removeWirePreview();
        }
        if (_schemSelected) {
          _schemSelected = null;
          renderPerfboard();
        }
        if (_schemSelectedWire) {
          _schemSelectedWire = null;
          redrawWires();
        }
      }
    });

    // Component drag/resize listen at the document level (attached once in
    // initSchematicTool) so leaving the canvas mid-drag doesn't drop the part.
    // Only the wire preview tracker stays SVG-local.
    svg.addEventListener('mousemove', _schemOnWirePreviewMove);

    wrap.appendChild(svg);

    // If a pending pin survived a re-render, redraw its preview line so it stays live.
    if (_schemPendingPin) {
      const a = pinIdToCoords(_schemPendingPin);
      if (a) _ensureWirePreview(a.x, a.y);
    }
  }

  function drawComponent(c) {
    const def = SCHEM_COMPONENTS[c.type];
    if (!def) return;
    const svgNS = 'http://www.w3.org/2000/svg';
    const layer = _schemSvg.querySelector('#schemLayerComponents');

    const isPerfboard = c.type === 'perfboard';
    const isBreadboard = c.type === 'breadboard';
    const cw = _schemComponentW(c);
    const ch = _schemComponentH(c);

    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', 'schem-component component-svg');
    g.setAttribute('data-component', c.type);
    g.setAttribute('data-component-id', c.id);
    const rot = c.rotation || 0;
    const cxLocal = cw * SCHEM_GRID_PITCH / 2;
    const cyLocal = ch * SCHEM_GRID_PITCH / 2;
    const transform = rot
      ? `translate(${(c.x + 0.5) * SCHEM_GRID_PITCH}, ${(c.y + 0.5) * SCHEM_GRID_PITCH}) rotate(${rot} ${cxLocal} ${cyLocal})`
      : `translate(${(c.x + 0.5) * SCHEM_GRID_PITCH}, ${(c.y + 0.5) * SCHEM_GRID_PITCH})`;
    g.setAttribute('transform', transform);

    // Body (innerSVG from definition). Pins drawn separately below.
    const body = document.createElementNS(svgNS, 'g');
    body.setAttribute('class', 'schem-component-body');
    if (isPerfboard) {
      const W = cw * SCHEM_GRID_PITCH;
      const H = ch * SCHEM_GRID_PITCH;
      body.innerHTML = `
        <rect x="0" y="0" width="${W}" height="${H}" rx="6" fill="#1f6f3e" stroke="#0c3a1f" stroke-width="2"/>
        <rect x="2" y="2" width="${W - 4}" height="${H - 4}" rx="4" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
        <circle cx="${W*0.04}" cy="${H*0.06}" r="3.5" fill="#0c3a1f"/>
        <circle cx="${W*0.96}" cy="${H*0.06}" r="3.5" fill="#0c3a1f"/>
        <circle cx="${W*0.04}" cy="${H*0.94}" r="3.5" fill="#0c3a1f"/>
        <circle cx="${W*0.96}" cy="${H*0.94}" r="3.5" fill="#0c3a1f"/>
      `;
    } else if (isBreadboard) {
      body.innerHTML = _schemBreadboardBodySvg(cw, ch);
    } else {
      body.innerHTML = def.svg({ ledColor: c.ledColor || 'red' });
    }
    g.appendChild(body);

    // Pins: dynamic for both perfboard (full grid) and breadboard
    // (grid minus the channel row), static for everything else.
    const pins = isPerfboard
      ? _schemPerfboardPins(cw, ch)
      : isBreadboard
        ? _schemBreadboardPins(cw, ch)
        : def.pins;
    pins.forEach(pin => {
      const px = pin.gx * SCHEM_GRID_PITCH;
      const py = pin.gy * SCHEM_GRID_PITCH;
      const pinG = document.createElementNS(svgNS, 'g');
      pinG.setAttribute('class', 'schem-pin-group');

      const pinId = `${c.id}:${pin.name}`;

      if (def.pinStyle === 'pad') {
        // Perfboard copper ring: outer copper donut + dark hole + transparent click target.
        const ring = document.createElementNS(svgNS, 'circle');
        ring.setAttribute('cx', px);
        ring.setAttribute('cy', py);
        ring.setAttribute('r', 5.5);
        ring.setAttribute('fill', '#d4a851');
        ring.setAttribute('stroke', '#7a5c1c');
        ring.setAttribute('stroke-width', '0.7');
        ring.setAttribute('pointer-events', 'none');
        pinG.appendChild(ring);

        const hole = document.createElementNS(svgNS, 'circle');
        hole.setAttribute('cx', px);
        hole.setAttribute('cy', py);
        hole.setAttribute('r', 1.8);
        hole.setAttribute('fill', '#0c0c0c');
        hole.setAttribute('pointer-events', 'none');
        pinG.appendChild(hole);

        // Click target overlay (transparent), uses the same .schem-pin styling for hover affordance.
        const click = document.createElementNS(svgNS, 'circle');
        click.setAttribute('class', 'schem-pin schem-pad');
        click.setAttribute('cx', px);
        click.setAttribute('cy', py);
        click.setAttribute('r', 6.5);
        click.setAttribute('fill', 'transparent');
        click.setAttribute('stroke', 'transparent');
        click.setAttribute('data-pin', pinId);
        pinG.appendChild(click);

        click.addEventListener('click', (e) => {
          e.stopPropagation();
          if (_schemSuppressNextPinClick) {
            _schemSuppressNextPinClick = false;
            return;
          }
          handlePinClick(pinId);
        });
        click.addEventListener('mousedown', (e) => {
          if (e.button !== 0) return;
          e.stopPropagation();
          _schemWireDragStartPin(pinId, e);
        });
        _attachPinTooltipHandlers(click, pin.name);

        g.appendChild(pinG);
        return;
      }

      if (def.pinStyle === 'socket') {
        // Breadboard tie-point: small dark square hole with a thin rim, plus
        // a transparent click target sized for comfortable wire-dragging.
        const hole = document.createElementNS(svgNS, 'rect');
        hole.setAttribute('x', px - 2.2);
        hole.setAttribute('y', py - 2.2);
        hole.setAttribute('width', 4.4);
        hole.setAttribute('height', 4.4);
        hole.setAttribute('rx', 0.6);
        hole.setAttribute('fill', '#1c1c1c');
        hole.setAttribute('stroke', '#a8a08e');
        hole.setAttribute('stroke-width', '0.6');
        hole.setAttribute('pointer-events', 'none');
        pinG.appendChild(hole);

        const click = document.createElementNS(svgNS, 'circle');
        click.setAttribute('class', 'schem-pin schem-socket');
        click.setAttribute('cx', px);
        click.setAttribute('cy', py);
        click.setAttribute('r', 11);
        click.setAttribute('fill', 'transparent');
        click.setAttribute('stroke', 'transparent');
        click.setAttribute('data-pin', pinId);
        pinG.appendChild(click);

        click.addEventListener('click', (e) => {
          e.stopPropagation();
          if (_schemSuppressNextPinClick) {
            _schemSuppressNextPinClick = false;
            return;
          }
          handlePinClick(pinId);
        });
        click.addEventListener('mousedown', (e) => {
          if (e.button !== 0) return;
          e.stopPropagation();
          _schemWireDragStartPin(pinId, e);
        });
        _attachPinTooltipHandlers(click, pin.name);

        g.appendChild(pinG);
        return;
      }

      const pinCircle = document.createElementNS(svgNS, 'circle');
      pinCircle.setAttribute('class', 'schem-pin');
      pinCircle.setAttribute('cx', px);
      pinCircle.setAttribute('cy', py);
      pinCircle.setAttribute('r', SCHEM_PIN_RADIUS);
      pinCircle.setAttribute('fill', '#c0c0c0');
      pinCircle.setAttribute('stroke', '#1f2937');
      pinCircle.setAttribute('stroke-width', '1.2');
      pinCircle.setAttribute('data-pin', pinId);
      pinG.appendChild(pinCircle);

      if (def.pinLabels) {
        const lbl = document.createElementNS(svgNS, 'text');
        lbl.setAttribute('x', px);
        // Place label outside the component bbox.
        const labelAbove = pin.gy <= 0.01;
        lbl.setAttribute('y', labelAbove ? py - 8 : py + 14);
        lbl.setAttribute('text-anchor', 'middle');
        lbl.setAttribute('font-size', '7');
        lbl.setAttribute('fill', '#1f2937');
        lbl.setAttribute('font-family', 'system-ui, sans-serif');
        lbl.setAttribute('font-weight', '600');
        lbl.setAttribute('pointer-events', 'none');
        lbl.textContent = pin.name;
        pinG.appendChild(lbl);
      }

      pinCircle.addEventListener('click', (e) => {
        e.stopPropagation();
        if (_schemSuppressNextPinClick) {
          _schemSuppressNextPinClick = false;
          return;
        }
        handlePinClick(pinId);
      });
      pinCircle.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        e.stopPropagation();
        _schemWireDragStartPin(pinId, e);
      });
      _attachPinTooltipHandlers(pinCircle, pin.name);

      g.appendChild(pinG);
    });

    // Visible rotate handle for non-board components. Boards (perfboard,
    // breadboard) are large fixtures students rarely rotate, so we suppress
    // the handle on them to keep the canvas clean.
    if (!isPerfboard && c.type !== 'breadboard') {
      const hx = cw * SCHEM_GRID_PITCH + 4;
      const hy = -8;
      const rotHandle = document.createElementNS(svgNS, 'g');
      rotHandle.setAttribute('class', 'schem-rotate-handle');
      rotHandle.innerHTML = `
        <circle cx="${hx}" cy="${hy}" r="9" fill="white" stroke="${'#3b82f6'}" stroke-width="1.4"/>
        <path d="M ${hx - 3.5} ${hy - 1.5} A 4 4 0 1 1 ${hx + 3} ${hy + 2.5}" fill="none" stroke="#3b82f6" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M ${hx + 4.5} ${hy + 1} L ${hx + 2} ${hy + 4} L ${hx + 1} ${hy + 1} Z" fill="#3b82f6" stroke="none"/>
      `;
      rotHandle.style.cursor = 'pointer';
      rotHandle.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        e.preventDefault();
        pushSchemHistory();
        c.rotation = ((c.rotation || 0) + 90) % 360;
        schemSave();
        renderPerfboard();
      });
      g.appendChild(rotHandle);
    }

    // Board move handle (top-left, dotted square icon). Always-visible grab
    // target so students don't have to find the gap between pads/tie-points.
    // Both perfboard and breadboard get it; tan icon for the breadboard.
    if (isPerfboard || isBreadboard) {
      const moveFill = isPerfboard ? '#0c3a1f' : '#8a8270';
      const moveHandle = document.createElementNS(svgNS, 'g');
      moveHandle.setAttribute('class', 'schem-move-handle');
      moveHandle.innerHTML = `
        <rect x="-2" y="-2" width="20" height="20" rx="3" fill="${moveFill}" stroke="#fff" stroke-width="0.8"/>
        <circle cx="3" cy="3" r="1" fill="#fff"/>
        <circle cx="8" cy="3" r="1" fill="#fff"/>
        <circle cx="13" cy="3" r="1" fill="#fff"/>
        <circle cx="3" cy="8" r="1" fill="#fff"/>
        <circle cx="8" cy="8" r="1" fill="#fff"/>
        <circle cx="13" cy="8" r="1" fill="#fff"/>
        <circle cx="3" cy="13" r="1" fill="#fff"/>
        <circle cx="8" cy="13" r="1" fill="#fff"/>
        <circle cx="13" cy="13" r="1" fill="#fff"/>
      `;
      moveHandle.style.cursor = 'grab';
      moveHandle.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        e.stopPropagation();
        e.preventDefault();
        pushSchemHistory();
        const pt = svgPoint(e);
        // Select the board too, so keyboard delete + the selection halo work.
        const wasSelected = _schemSelected === c.id;
        _schemSelected = c.id;
        if (!wasSelected) renderPerfboard();
        _schemDrag = {
          id: c.id,
          startX: pt.x,
          startY: pt.y,
          originGx: c.x,
          originGy: c.y,
          moved: false
        };
        const freshNode = _schemSvg.querySelector(`[data-component-id="${c.id}"]`);
        if (freshNode) freshNode.classList.add('is-dragging');
      });
      g.appendChild(moveHandle);
    }

    // Board resize handle (bottom-right corner). Drag to grow/shrink the
    // grid. Works for both perfboard and breadboard; the breadboard's
    // channel row stays centered automatically as height changes.
    if (isPerfboard || isBreadboard) {
      const W = cw * SCHEM_GRID_PITCH;
      const H = ch * SCHEM_GRID_PITCH;
      const triFill = isPerfboard ? '#0c3a1f' : '#b5ad97';
      const tickStroke = isPerfboard ? '#fff' : '#5b554a';
      const handle = document.createElementNS(svgNS, 'g');
      handle.setAttribute('class', 'schem-resize-handle');
      handle.innerHTML = `
        <path d="M ${W - 14} ${H} L ${W} ${H} L ${W} ${H - 14} Z" fill="${triFill}" stroke="#fff" stroke-width="0.6"/>
        <line x1="${W - 8}" y1="${H - 2}" x2="${W - 2}" y2="${H - 8}" stroke="${tickStroke}" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="${W - 4}" y1="${H - 2}" x2="${W - 2}" y2="${H - 4}" stroke="${tickStroke}" stroke-width="1.2" stroke-linecap="round"/>
      `;
      handle.style.cursor = 'nwse-resize';
      handle.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        e.stopPropagation();
        e.preventDefault();
        pushSchemHistory();
        const pt = svgPoint(e);
        _schemResize = {
          id: c.id,
          startX: pt.x,
          startY: pt.y,
          startCols: cw,
          startRows: ch
        };
      });
      g.appendChild(handle);
    }

    // Drag start on the body, not on pins or the corner handles.
    g.addEventListener('mousedown', (e) => {
      if (e.target.classList && e.target.classList.contains('schem-pin')) return;
      if (e.target.closest && (e.target.closest('.schem-resize-handle') || e.target.closest('.schem-move-handle') || e.target.closest('.schem-rotate-handle'))) return;
      if (e.button !== 0) return;
      // Shift+click rotates 90 degrees clockwise (boards don't rotate).
      if (e.shiftKey && !_isResizableBoard(c)) {
        e.preventDefault();
        e.stopPropagation();
        pushSchemHistory();
        c.rotation = ((c.rotation || 0) + 90) % 360;
        schemSave();
        renderPerfboard();
        return;
      }
      const pt = svgPoint(e);
      pushSchemHistory();
      // Single-click also selects this component (and dragging selects too).
      const wasSelected = _schemSelected === c.id;
      _schemSelected = c.id;
      if (!wasSelected) {
        // Re-render to draw the halo around this component.
        // We do this synchronously here; subsequent drag will then operate on the fresh node.
        renderPerfboard();
      }
      _schemDrag = {
        id: c.id,
        startX: pt.x,
        startY: pt.y,
        originGx: c.x,
        originGy: c.y,
        moved: false
      };
      const freshNode = _schemSvg.querySelector(`[data-component-id="${c.id}"]`);
      if (freshNode) freshNode.classList.add('is-dragging');
      e.preventDefault();
    });

    // Right-click delete.
    g.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (confirm(`Delete ${def.label}?`)) {
        deleteComponent(c.id);
      }
    });

    // Double-click LED to cycle color.
    if (def.hasColor) {
      g.addEventListener('dblclick', (e) => {
        e.preventDefault();
        pushSchemHistory();
        const order = ['red', 'yellow', 'green', 'blue', 'white'];
        const cur = c.ledColor || 'red';
        const next = order[(order.indexOf(cur) + 1) % order.length];
        c.ledColor = next;
        schemSave();
        renderPerfboard();
      });
    }

    // Selection halo: dashed indigo rect around the component bbox (in local coords).
    if (_schemSelected === c.id) {
      const pad = 4;
      const halo = document.createElementNS(svgNS, 'rect');
      halo.setAttribute('class', 'schem-selection-halo');
      halo.setAttribute('x', -pad);
      halo.setAttribute('y', -pad);
      halo.setAttribute('width', cw * SCHEM_GRID_PITCH + pad * 2);
      halo.setAttribute('height', ch * SCHEM_GRID_PITCH + pad * 2);
      halo.setAttribute('rx', 6);
      halo.setAttribute('fill', 'none');
      halo.setAttribute('stroke', 'var(--accent)');
      halo.setAttribute('stroke-width', '1.6');
      halo.setAttribute('stroke-dasharray', '4 3');
      g.appendChild(halo);
    }

    layer.appendChild(g);
  }

  function _isPerfboardPin(pinId) {
    if (!pinId) return false;
    const compId = pinId.split(':')[0];
    const c = _schemState.components.find(x => x.id === compId);
    return !!(c && c.type === 'perfboard');
  }

  function drawWire(w) {
    const svgNS = 'http://www.w3.org/2000/svg';
    const layer = _schemSvg.querySelector('#schemLayerWires');
    const a = pinIdToCoords(w.fromPinId);
    const b = pinIdToCoords(w.toPinId);
    if (!a || !b) return;

    // Any wire touching the perfboard reads as a soldered joint, so it
    // renders in silver. Off-board hookup wires default to black; the
    // student can pick a different color from the palette per wire.
    const touchesPad = _isPerfboardPin(w.fromPinId) || _isPerfboardPin(w.toPinId);
    const stroke = touchesPad ? '#9aa3ad' : (SCHEM_COLORS[w.color] || SCHEM_COLORS.black);
    const padToPad = touchesPad;

    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('class', 'schem-wire');
    path.setAttribute('d', `M ${a.x} ${a.y} L ${b.x} ${b.y}`);
    path.setAttribute('stroke', stroke);
    path.setAttribute('stroke-width', padToPad ? '2.4' : '3');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('fill', 'none');
    path.setAttribute('data-wire-id', w.id);
    if (!padToPad && w.color === 'white') {
      path.setAttribute('stroke', '#f8fafc');
      path.style.filter = 'drop-shadow(0 0 1px rgba(0,0,0,0.4))';
    }

    path.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      deleteWire(w.id);
    });
    path.addEventListener('dblclick', (e) => {
      e.preventDefault();
      e.stopPropagation();
      deleteWire(w.id);
    });
    path.addEventListener('click', (e) => {
      e.stopPropagation();
      if (e.shiftKey) {
        deleteWire(w.id);
        return;
      }
      // Single-click: select this wire (and deselect any component).
      _schemSelected = null;
      _schemSelectedWire = w.id;
      redrawWires();
    });

    layer.appendChild(path);

    // Selection X icon at the wire's midpoint when this wire is selected.
    if (_schemSelectedWire === w.id) {
      const mx = (a.x + b.x) / 2;
      const my = (a.y + b.y) / 2;
      const xIcon = document.createElementNS(svgNS, 'g');
      xIcon.setAttribute('class', 'schem-wire-x');
      xIcon.style.cursor = 'pointer';
      xIcon.innerHTML = `
        <circle cx="${mx}" cy="${my}" r="9" fill="white" stroke="#dc2626" stroke-width="1.6"/>
        <line x1="${mx - 3.5}" y1="${my - 3.5}" x2="${mx + 3.5}" y2="${my + 3.5}" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="${mx + 3.5}" y1="${my - 3.5}" x2="${mx - 3.5}" y2="${my + 3.5}" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
      `;
      xIcon.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteWire(w.id);
      });
      xIcon.addEventListener('mousedown', (e) => e.stopPropagation());
      layer.appendChild(xIcon);
    }

    // Solder blobs at each end.
    [a, b].forEach(pt => {
      const blob = document.createElementNS(svgNS, 'circle');
      blob.setAttribute('class', 'schem-solder');
      blob.setAttribute('cx', pt.x);
      blob.setAttribute('cy', pt.y);
      blob.setAttribute('r', SCHEM_SOLDER_RADIUS);
      blob.setAttribute('fill', '#94a3b8');
      blob.setAttribute('stroke', '#475569');
      blob.setAttribute('stroke-width', '0.8');
      layer.appendChild(blob);
    });
  }

  function pinIdToCoords(pinId) {
    const [compId, pinName] = pinId.split(':');
    const c = _schemState.components.find(x => x.id === compId);
    if (!c) return null;
    const def = SCHEM_COMPONENTS[c.type];
    if (!def) return null;

    let pin;
    if (c.type === 'perfboard') {
      const m = pinName && pinName.match(/^r(\d+)c(\d+)$/);
      if (!m) return null;
      const row = parseInt(m[1], 10);
      const col = parseInt(m[2], 10);
      const cols = _schemComponentW(c);
      const rows = _schemComponentH(c);
      if (row >= rows || col >= cols) return null;
      pin = { name: pinName, gx: col + 0.5, gy: row + 0.5 };
    } else if (c.type === 'breadboard') {
      // Breadboards resize: generate the pin list from the CURRENT row count,
      // not the static definition, so wires on grown/shrunk rows resolve.
      pin = _schemBreadboardPins(_schemComponentW(c), _schemComponentH(c)).find(p => p.name === pinName);
    } else {
      pin = def.pins.find(p => p.name === pinName);
    }
    if (!pin) return null;

    const rot = ((c.rotation || 0) % 360 + 360) % 360;
    const w = _schemComponentW(c);
    const h = _schemComponentH(c);
    const cxLocal = w * SCHEM_GRID_PITCH / 2;
    const cyLocal = h * SCHEM_GRID_PITCH / 2;
    const px = pin.gx * SCHEM_GRID_PITCH;
    const py = pin.gy * SCHEM_GRID_PITCH;
    let localX = px;
    let localY = py;
    if (rot) {
      const rad = rot * Math.PI / 180;
      const cosR = Math.cos(rad);
      const sinR = Math.sin(rad);
      const dx = px - cxLocal;
      const dy = py - cyLocal;
      localX = cxLocal + (dx * cosR - dy * sinR);
      localY = cyLocal + (dx * sinR + dy * cosR);
    }
    const x = (c.x + 0.5) * SCHEM_GRID_PITCH + localX;
    const y = (c.y + 0.5) * SCHEM_GRID_PITCH + localY;
    return { x, y };
  }

  function svgPoint(e) {
    const pt = _schemSvg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    return pt.matrixTransform(_schemSvg.getScreenCTM().inverse());
  }

  // Show a small SVG <text> tooltip near the hovered pin with its name.
  function _attachPinTooltipHandlers(pinEl, pinName) {
    pinEl.addEventListener('mouseenter', () => {
      if (!_schemSvg) return;
      // Remove any stale tooltip first.
      const stale = _schemSvg.querySelector('.schem-pin-tooltip');
      if (stale && stale.parentNode) stale.parentNode.removeChild(stale);
      // Compute the pin's center in SVG-space (root) by transforming through CTM.
      try {
        const ctm = pinEl.getCTM();
        const cx = parseFloat(pinEl.getAttribute('cx')) || 0;
        const cy = parseFloat(pinEl.getAttribute('cy')) || 0;
        let sx = cx;
        let sy = cy;
        if (ctm) {
          sx = ctm.a * cx + ctm.c * cy + ctm.e;
          sy = ctm.b * cx + ctm.d * cy + ctm.f;
        }
        const svgNS = 'http://www.w3.org/2000/svg';
        const t = document.createElementNS(svgNS, 'text');
        t.setAttribute('class', 'schem-pin-tooltip');
        t.setAttribute('x', sx + 10);
        t.setAttribute('y', sy - 10);
        t.textContent = pinName;
        _schemSvg.appendChild(t);
      } catch (_) {}
    });
    pinEl.addEventListener('mouseleave', () => {
      if (!_schemSvg) return;
      const tip = _schemSvg.querySelector('.schem-pin-tooltip');
      if (tip && tip.parentNode) tip.parentNode.removeChild(tip);
    });
  }

  function _schemOnDragMove(e) {
    if (_schemResize) {
      const pt = svgPoint(e);
      const dx = (pt.x - _schemResize.startX) / SCHEM_GRID_PITCH;
      const dy = (pt.y - _schemResize.startY) / SCHEM_GRID_PITCH;
      const c = _schemState.components.find(x => x.id === _schemResize.id);
      if (!c) return;
      const newCols = c.type === 'breadboard'
        ? 17
        : Math.max(4, Math.round(_schemResize.startCols + dx));
      const minRows = c.type === 'breadboard' ? 7 : 4;
      const newRows = Math.max(minRows, Math.round(_schemResize.startRows + dy));
      if (newCols !== (c.cols || 14) || newRows !== (c.rows || 10)) {
        c.cols = newCols;
        c.rows = newRows;
        renderPerfboard();
      }
      return;
    }
    if (!_schemDrag) return;
    const pt = svgPoint(e);
    const dx = (pt.x - _schemDrag.startX) / SCHEM_GRID_PITCH;
    const dy = (pt.y - _schemDrag.startY) / SCHEM_GRID_PITCH;
    const c = _schemState.components.find(x => x.id === _schemDrag.id);
    if (!c) return;
    const cw = _schemComponentW(c);
    const ch = _schemComponentH(c);
    let nx = Math.round(_schemDrag.originGx + dx);
    let ny = Math.round(_schemDrag.originGy + dy);
    nx = Math.max(0, Math.min(_schemState.gridCols - cw, nx));
    ny = Math.max(0, Math.min(_schemState.gridRows - ch, ny));
    if (nx !== c.x || ny !== c.y) {
      c.x = nx;
      c.y = ny;
      // Re-render only this component's transform + redraw wires that touch it.
      // Keep the rotation in the fast-path transform so a rotated part doesn't
      // visually snap to 0° while its pins stay rotated.
      const node = _schemSvg.querySelector(`[data-component-id="${c.id}"]`);
      if (node) {
        const rot = ((c.rotation || 0) % 360 + 360) % 360;
        const rotPart = rot ? ` rotate(${rot} ${cw * SCHEM_GRID_PITCH / 2} ${ch * SCHEM_GRID_PITCH / 2})` : '';
        node.setAttribute('transform', `translate(${(c.x + 0.5) * SCHEM_GRID_PITCH}, ${(c.y + 0.5) * SCHEM_GRID_PITCH})${rotPart}`);
      }
      redrawWires();
    }
  }

  function _schemOnDragEnd() {
    if (_schemResize) {
      _schemState.wires = _schemState.wires.filter(w =>
        pinIdToCoords(w.fromPinId) && pinIdToCoords(w.toPinId)
      );
      _schemResize = null;
      schemSave();
      renderPerfboard();
      return;
    }
    if (!_schemDrag) return;
    const node = _schemSvg.querySelector(`[data-component-id="${_schemDrag.id}"]`);
    if (node) node.classList.remove('is-dragging');
    const draggedId = _schemDrag.id;
    _schemDrag = null;
    schemSave();
    // Only re-render the whole canvas if auto-fit would change its size.
    // Otherwise we keep the existing nodes in place — no flash, no flicker.
    const oldCols = _schemState.gridCols;
    const oldRows = _schemState.gridRows;
    autoFitCanvas();
    if (_schemState.gridCols !== oldCols || _schemState.gridRows !== oldRows) {
      renderPerfboard();
    }
  }

  function redrawWires() {
    const layer = _schemSvg.querySelector('#schemLayerWires');
    if (!layer) return;
    layer.innerHTML = '';
    _schemState.wires.forEach(w => drawWire(w));
  }

  function placeComponent(type) {
    const def = SCHEM_COMPONENTS[type];
    if (!def) return;
    // Drop in middle of canvas, offset slightly per existing count to avoid overlap.
    const count = _schemState.components.filter(c => c.type === type).length;
    const baseX = Math.max(0, Math.floor(_schemState.gridCols / 2 - def.w / 2));
    const baseY = Math.max(0, Math.floor(_schemState.gridRows / 2 - def.h / 2));
    const x = baseX + (count % 4);
    const y = baseY + Math.floor(count / 4);
    return placeComponentAt(type, x, y);
  }

  function placeComponentAt(type, gx, gy) {
    const def = SCHEM_COMPONENTS[type];
    if (!def) return null;
    pushSchemHistory();
    const w = def.w;
    const h = def.h;
    let x = Math.max(0, Math.min(_schemState.gridCols - w, Math.round(gx)));
    let y = Math.max(0, Math.min(_schemState.gridRows - h, Math.round(gy)));
    const id = schemNewId(type);
    const c = { id, type, x, y };
    if (def.hasColor) c.ledColor = 'red';
    if (type === 'perfboard') {
      c.cols = 14;
      c.rows = 10;
    }
    if (type === 'breadboard') {
      c.cols = 17;
      c.rows = 13; // header + 10 numbered tie rows (5 top + 5 bottom) + channel + header
    }
    _schemState.components.push(c);
    _schemSelected = id;
    schemSave();
    renderPerfboard();

    // LED reminder: offer 220 ohm resistor on first LED placement per session.
    if (type === 'led' && !_schemState.resistorReminderShown) {
      _schemState.resistorReminderShown = true;
      schemSave();
      schemToast('LEDs need a 220 ohm resistor in series. Add one from the palette.', 3600);
    }
    return c;
  }

  function _schemBuildPaletteGhost(type) {
    const def = SCHEM_COMPONENTS[type];
    if (!def) return null;
    const w = def.w * SCHEM_GRID_PITCH;
    const h = def.h * SCHEM_GRID_PITCH;
    const wrap = document.createElement('div');
    wrap.className = 'schem-palette-ghost';
    wrap.innerHTML = `
      <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
        ${def.svg({ ledColor: 'red' })}
      </svg>
    `;
    wrap.style.width = w + 'px';
    wrap.style.height = h + 'px';
    return wrap;
  }

  function _schemOnPaletteDragMove(e) {
    if (!_schemPaletteDrag) return;
    const pd = _schemPaletteDrag;
    const dx = e.clientX - pd.startX;
    const dy = e.clientY - pd.startY;
    if (!pd.didMove) {
      if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
      pd.didMove = true;
      pd.ghostEl = _schemBuildPaletteGhost(pd.type);
      if (pd.ghostEl) document.body.appendChild(pd.ghostEl);
    }
    if (pd.ghostEl) {
      const def = SCHEM_COMPONENTS[pd.type];
      const w = def.w * SCHEM_GRID_PITCH;
      const h = def.h * SCHEM_GRID_PITCH;
      pd.ghostEl.style.left = (e.clientX - w / 2) + 'px';
      pd.ghostEl.style.top = (e.clientY - h / 2) + 'px';
    }
  }

  function _schemOnPaletteDragEnd(e) {
    if (!_schemPaletteDrag) return;
    const pd = _schemPaletteDrag;
    if (!pd.didMove) {
      // Treat as click: drop at center.
      _schemCancelPaletteDrag();
      placeComponent(pd.type);
      return;
    }
    // Drag mode: drop where released if over the canvas.
    let dropped = false;
    if (_schemSvg) {
      const rect = _schemSvg.getBoundingClientRect();
      const inside = e.clientX >= rect.left && e.clientX <= rect.right &&
                     e.clientY >= rect.top && e.clientY <= rect.bottom;
      if (inside) {
        const def = SCHEM_COMPONENTS[pd.type];
        const pt = _schemSvg.createSVGPoint();
        pt.x = e.clientX;
        pt.y = e.clientY;
        const local = pt.matrixTransform(_schemSvg.getScreenCTM().inverse());
        // Position so cursor falls roughly in the middle of the component.
        const gx = local.x / SCHEM_GRID_PITCH - 0.5 - def.w / 2;
        const gy = local.y / SCHEM_GRID_PITCH - 0.5 - def.h / 2;
        // Cancel BEFORE placing so a duplicate listener (or re-entrant event)
        // sees a null drag and can't drop a second copy.
        _schemCancelPaletteDrag();
        placeComponentAt(pd.type, gx, gy);
        dropped = true;
      }
    }
    if (_schemPaletteDrag) _schemCancelPaletteDrag();
    if (!dropped) {
      // Released off-canvas: cancel silently.
    }
  }

  function _schemCancelPaletteDrag() {
    if (_schemPaletteDrag && _schemPaletteDrag.ghostEl && _schemPaletteDrag.ghostEl.parentNode) {
      _schemPaletteDrag.ghostEl.parentNode.removeChild(_schemPaletteDrag.ghostEl);
    }
    _schemPaletteDrag = null;
  }

  function handlePinClick(pinId) {
    if (!_schemPendingPin) {
      _schemPendingPin = pinId;
      highlightPendingPin(pinId);
      const a = pinIdToCoords(pinId);
      if (a) _ensureWirePreview(a.x, a.y);
      return;
    }
    if (_schemPendingPin === pinId) {
      // Click same pin again to cancel.
      _schemPendingPin = null;
      highlightPendingPin(null);
      _removeWirePreview();
      return;
    }
    completeWire(_schemPendingPin, pinId);
    _schemPendingPin = null;
    highlightPendingPin(null);
    _removeWirePreview();
  }

  // Drag-to-wire: mousedown on a pin starts tracking. If the cursor moves
  // past a small threshold and releases on another pin, complete the wire.
  // If it releases on the same pin (no real drag), the click handler runs
  // normally and sets pending. Both flows coexist.
  function _schemWireDragStartPin(pinId, e) {
    _schemWireDrag = {
      fromPinId: pinId,
      startClientX: e.clientX,
      startClientY: e.clientY,
      moved: false
    };
    // Show preview immediately so the wire visually anchors to the pin.
    const a = pinIdToCoords(pinId);
    if (a) _ensureWirePreview(a.x, a.y);
  }

  function _schemWireDragMove(e) {
    if (!_schemWireDrag) return;
    const dx = e.clientX - _schemWireDrag.startClientX;
    const dy = e.clientY - _schemWireDrag.startClientY;
    if (!_schemWireDrag.moved && (dx * dx + dy * dy) > 16) {
      _schemWireDrag.moved = true;
      // Lock pending pin so the preview tracks the cursor while we drag.
      if (_schemPendingPin !== _schemWireDrag.fromPinId) {
        _schemPendingPin = _schemWireDrag.fromPinId;
        highlightPendingPin(_schemPendingPin);
      }
    }
  }

  function _schemWireDragEnd(e) {
    if (!_schemWireDrag) return;
    const drag = _schemWireDrag;
    _schemWireDrag = null;
    if (!drag.moved) return; // a click, let click handler take over
    // Hit-test: is the mouseup target a pin?
    const elem = document.elementFromPoint(e.clientX, e.clientY);
    const pinEl = elem && elem.closest && elem.closest('[data-pin]');
    let targetPinId = pinEl && pinEl.getAttribute('data-pin');
    if (!targetPinId) {
      // Fallback: snap to nearest pin within ~1.4 grid cells. The breadboard's
      // static SVG content (rails, substrate, labels) has pointer-events:none,
      // so elementFromPoint should always reach a pin or click target — but
      // the snap fallback guarantees a clean landing even if the cursor is
      // slightly off the pin center.
      const pt = svgPoint(e);
      const snap = _schemNearestPin(pt.x, pt.y, SCHEM_GRID_PITCH * 1.4);
      if (snap) targetPinId = snap.pinId;
    }
    _schemSuppressNextPinClick = true;
    // The flag exists only to swallow the synthetic click from THIS mouseup.
    // That click often lands on an ancestor (or nowhere) instead of a pin —
    // the pin handlers would then never consume the flag and the student's
    // next real pin click would be silently eaten. Clear it after this tick.
    setTimeout(() => { _schemSuppressNextPinClick = false; }, 0);
    if (targetPinId && targetPinId !== drag.fromPinId) {
      completeWire(drag.fromPinId, targetPinId);
    }
    _schemPendingPin = null;
    highlightPendingPin(null);
    _removeWirePreview();
  }

  // Enumerate every pin id currently on the canvas (for snap-to-nearest).
  function _schemAllPinIds() {
    const ids = [];
    _schemState.components.forEach(c => {
      const def = SCHEM_COMPONENTS[c.type];
      if (!def) return;
      if (c.type === 'perfboard') {
        const cols = _schemComponentW(c);
        const rows = _schemComponentH(c);
        for (let r = 0; r < rows; r++) {
          for (let col = 0; col < cols; col++) {
            ids.push(`${c.id}:r${r}c${col}`);
          }
        }
      } else if (c.type === 'breadboard') {
        _schemBreadboardPins(_schemComponentW(c), _schemComponentH(c)).forEach(p => ids.push(`${c.id}:${p.name}`));
      } else if (def.pins) {
        def.pins.forEach(p => ids.push(`${c.id}:${p.name}`));
      }
    });
    return ids;
  }

  function _schemNearestPin(svgX, svgY, maxDist) {
    let best = null;
    let bestD2 = (maxDist || Infinity) ** 2;
    for (const pid of _schemAllPinIds()) {
      const coords = pinIdToCoords(pid);
      if (!coords) continue;
      const dx = coords.x - svgX;
      const dy = coords.y - svgY;
      const d2 = dx * dx + dy * dy;
      if (d2 < bestD2) {
        bestD2 = d2;
        best = { pinId: pid, x: coords.x, y: coords.y };
      }
    }
    return best;
  }

  // Faint dashed line from the pending pin to the cursor while the user picks the second pin.
  function _ensureWirePreview(x1, y1) {
    if (!_schemSvg) return;
    let line = _schemSvg.querySelector('#schemWirePreview');
    const svgNS = 'http://www.w3.org/2000/svg';
    if (!line) {
      line = document.createElementNS(svgNS, 'line');
      line.setAttribute('id', 'schemWirePreview');
      line.setAttribute('class', 'schem-wire-preview');
      line.setAttribute('stroke-dasharray', '5 4');
      line.setAttribute('stroke-width', '2.5');
      line.setAttribute('stroke-linecap', 'round');
      line.setAttribute('opacity', '0.45');
    }
    const color = SCHEM_COLORS[_schemState.selectedColor] || SCHEM_COLORS.red;
    line.setAttribute('stroke', color);
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x1);
    line.setAttribute('y2', y1);
    _schemSvg.appendChild(line);
  }

  function _removeWirePreview() {
    if (!_schemSvg) return;
    const line = _schemSvg.querySelector('#schemWirePreview');
    if (line && line.parentNode) line.parentNode.removeChild(line);
  }

  function _schemOnWirePreviewMove(e) {
    if (!_schemPendingPin || !_schemSvg) return;
    const line = _schemSvg.querySelector('#schemWirePreview');
    if (!line) return;
    const pt = svgPoint(e);
    // Magnetic snap: if cursor is within ~half a grid cell of any pin, latch
    // the preview endpoint to that pin so the student sees exactly where the
    // wire will land before releasing.
    const snap = _schemNearestPin(pt.x, pt.y, SCHEM_GRID_PITCH * 0.9);
    if (snap && snap.pinId !== _schemPendingPin) {
      line.setAttribute('x2', snap.x);
      line.setAttribute('y2', snap.y);
    } else {
      line.setAttribute('x2', pt.x);
      line.setAttribute('y2', pt.y);
    }
  }

  function highlightPendingPin(pinId) {
    _schemSvg.querySelectorAll('.schem-pin.is-pending').forEach(el => el.classList.remove('is-pending'));
    if (pinId) {
      const el = _schemSvg.querySelector(`[data-pin="${pinId}"]`);
      if (el) el.classList.add('is-pending');
    }
  }

  function completeWire(fromPinId, toPinId) {
    // No duplicate wires between the same two pins (either direction).
    const dup = _schemState.wires.some(w =>
      (w.fromPinId === fromPinId && w.toPinId === toPinId) ||
      (w.fromPinId === toPinId && w.toPinId === fromPinId));
    if (dup) { schemToast('Those pins are already connected.'); return; }
    pushSchemHistory();
    const id = schemNewId('wire');
    const w = { id, fromPinId, toPinId, color: _schemState.selectedColor };
    _schemState.wires.push(w);
    schemSave();
    drawWire(w);
  }

  function deleteComponent(id) {
    pushSchemHistory();
    _schemState.components = _schemState.components.filter(c => c.id !== id);
    // Drop any wires touching this component.
    _schemState.wires = _schemState.wires.filter(w => {
      return !w.fromPinId.startsWith(id + ':') && !w.toPinId.startsWith(id + ':');
    });
    schemSave();
    renderPerfboard();
  }

  function deleteWire(id) {
    pushSchemHistory();
    _schemState.wires = _schemState.wires.filter(w => w.id !== id);
    schemSave();
    redrawWires();
  }

  function clearCanvas() {
    pushSchemHistory();
    _schemState.components = [];
    _schemState.wires = [];
    schemSave();
    renderPerfboard();
    schemToast('Canvas cleared.');
  }

  // ============== Save-to popover (shared by Schematic + Vibe Coding) ==============
  // Pending artifact handed off to the next openModal() call. Consumed by
  // buildCheckpointPanel / buildPortfolioPanel and then cleared.
  // Shape: { blob, fileName, contentType, slotKey, benchmarkId, panelType, kind }
  //   panelType: 'checkpoint' (benchmarks 1-4) | 'portfolio' (Portfolio Drop)
  //   kind: 'schematic' | 'vibe' (for toast wording)
  window._pendingArtifact = null;

  // Broken-media fallbacks used from inline onerror handlers, so the markup
  // stays quote-free and the fallback icons stay in the one SVG icon family.
  window._linkTileFallback = function (imgEl, domain) {
    const div = document.createElement('div');
    div.className = 'link-fallback';
    div.innerHTML = `<div class="link-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 007.07 0l3-3a5 5 0 00-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 00-7.07 0l-3 3a5 5 0 007.07 7.07l1.5-1.5"/></svg></div><div class="link-domain"></div>`;
    div.querySelector('.link-domain').textContent = domain || 'link';
    imgEl.replaceWith(div);
  };
  window._fileBrokenFallback = function (imgEl) {
    if (!imgEl.parentElement) return;
    imgEl.parentElement.innerHTML = `<div class="pf-broken"><span class="pf-broken-icon"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span><span>(file unavailable)</span></div>`;
  };

  let _saveToPopOpen = null; // { popEl, anchorEl, onDocClick, onKeyDown, onReposition }
  function closeSaveToPop() {
    if (!_saveToPopOpen) return;
    const { popEl, onDocClick, onKeyDown, onReposition } = _saveToPopOpen;
    document.removeEventListener('click', onDocClick, true);
    document.removeEventListener('keydown', onKeyDown);
    if (onReposition) {
      window.removeEventListener('scroll', onReposition, true);
      window.removeEventListener('resize', onReposition);
    }
    if (popEl && popEl.parentNode) popEl.parentNode.removeChild(popEl);
    _saveToPopOpen = null;
  }

  // kind: 'schematic' (PNG) or 'vibe' (PDF). buildBlob: () => Promise<Blob>.
  // Popover is appended to document.body and positioned from the button's
  // viewport rect, so it can't be clipped by an ancestor's overflow: hidden
  // (the toolbar group uses overflow:hidden for its rounded segmented look).
  function openSaveToPop(anchorBtn, kind, buildBlob) {
    closeSaveToPop();

    const pop = document.createElement('div');
    pop.className = 'save-to-pop';
    pop.setAttribute('role', 'menu');
    pop.style.position = 'fixed';

    PROJECTS.forEach(project => {
      if (project.id === 'final') return; // Final / Instructable is excluded for both tools.
      // Project 0 is video summaries — its panel has no artifact slot, so a
      // save there would silently discard the student's file.
      if (project.kind === 'videos') return;
      const sec = document.createElement('div');
      sec.className = 'save-to-section';
      const eye = document.createElement('span');
      eye.className = 'save-to-eyebrow';
      eye.textContent = project.title;
      sec.appendChild(eye);

      project.benchmarks.forEach(b => {
        if (b.title === 'Portfolio') return; // handled below
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'save-to-item';
        const idx = project.benchmarks.indexOf(b) + 1;
        item.textContent = `Benchmark ${idx}: ${b.title}`;
        item.addEventListener('click', async () => {
          closeSaveToPop();
          await handleSaveToPick({ kind, buildBlob, project, benchmark: b, panelType: 'checkpoint' });
        });
        sec.appendChild(item);
      });

      // Portfolio Drop sub-row
      const drop = project.benchmarks.find(x => x.title === 'Portfolio');
      if (drop) {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'save-to-item is-portfolio';
        const slotLabel = kind === 'vibe' ? 'Code slot'
                        : kind === 'idea-board' ? 'Sketch slot'
                        : 'Wiring slot';
        item.innerHTML = `<span class="save-to-arrow"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 10 20 15 15 20"/><path d="M4 4v7a4 4 0 0 0 4 4h12"/></svg></span>Portfolio (${slotLabel})`;
        item.addEventListener('click', async () => {
          closeSaveToPop();
          await handleSaveToPick({ kind, buildBlob, project, benchmark: drop, panelType: 'portfolio' });
        });
        sec.appendChild(item);
      }

      pop.appendChild(sec);
    });

    document.body.appendChild(pop);

    function reposition() {
      const r = anchorBtn.getBoundingClientRect();
      const popW = pop.offsetWidth || 320;
      // Right-align the popover to the button, clamped to the viewport.
      let left = r.right - popW;
      if (left < 8) left = 8;
      if (left + popW > window.innerWidth - 8) left = window.innerWidth - popW - 8;
      pop.style.left = left + 'px';
      pop.style.top = (r.bottom + 8) + 'px';
    }
    reposition();

    const onDocClick = (e) => {
      if (pop.contains(e.target) || anchorBtn.contains(e.target)) return;
      closeSaveToPop();
    };
    const onKeyDown = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); closeSaveToPop(); }
    };
    const onReposition = () => reposition();
    // Defer attaching click handler so the click that opened the popover
    // doesn't immediately close it.
    setTimeout(() => document.addEventListener('click', onDocClick, true), 0);
    document.addEventListener('keydown', onKeyDown);
    window.addEventListener('scroll', onReposition, true);
    window.addEventListener('resize', onReposition);

    _saveToPopOpen = { popEl: pop, anchorEl: anchorBtn, onDocClick, onKeyDown, onReposition };
  }

  async function handleSaveToPick({ kind, buildBlob, project, benchmark, panelType }) {
    let blob;
    try {
      // buildBlob is always a () => Promise<Blob> wrapper, normalized by the caller.
      blob = await buildBlob();
    } catch (err) {
      console.warn('save-to capture failed', err);
      schemToast(kind === 'vibe' ? 'Could not build PDF. Try again.' : 'Could not build image. Try again.');
      return;
    }
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
    if (kind === 'schematic') {
      const slotKey = panelType === 'portfolio' ? 'wiring' : 'image';
      window._pendingArtifact = {
        blob,
        fileName: `wiring-schematic-${stamp}.png`,
        contentType: 'image/png',
        slotKey,
        benchmarkId: benchmark.id,
        panelType,
        kind
      };
    } else if (kind === 'idea-board') {
      // Portfolio gets its own 'sketch' slot; checkpoint benchmarks reuse the
      // generic 'image' slot since they don't expose typed slots per artifact.
      const slotKey = panelType === 'portfolio' ? 'sketch' : 'image';
      window._pendingArtifact = {
        blob,
        fileName: `idea-board-${stamp}.png`,
        contentType: 'image/png',
        slotKey,
        benchmarkId: benchmark.id,
        panelType,
        kind
      };
    } else {
      window._pendingArtifact = {
        blob,
        fileName: `arduino-sketch-${new Date().toISOString().slice(0, 10)}.pdf`,
        contentType: 'application/pdf',
        slotKey: 'code',
        benchmarkId: benchmark.id,
        panelType,
        kind
      };
    }
    // Navigate to the benchmark modal. openModal triggers panel build, which
    // consumes _pendingArtifact and clears it.
    const target = findBenchmarkById(benchmark.id);
    if (target) {
      openModal(target);
    } else {
      // Never strand a Blob in memory that would silently re-inject later.
      window._pendingArtifact = null;
      schemToast('Could not open that benchmark. Try again from the benchmark page.');
    }
  }

  // Build a PNG Blob from the current schematic SVG. Calls cb(blob) on success,
  // or cb(null, err) on failure. Shared by exportPNG() (download) and the
  // "+ Save to..." flow (drops the Blob into a benchmark/Portfolio slot).
  function buildSchemPngBlob(cb) {
    if (!_schemSvg) { cb(null, new Error('no svg')); return; }
    try {
      const serializer = new XMLSerializer();
      const clone = _schemSvg.cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      // Strip transient UI (wire delete X, selection halo, pin tooltip, wire
      // preview) so saved artifacts show only the actual schematic.
      clone.querySelectorAll('.schem-wire-x, .schem-selection-halo, .schem-pin-tooltip, #schemWirePreview, .schem-pin.is-pending')
        .forEach(el => {
          if (el.classList && el.classList.contains('schem-pin')) el.classList.remove('is-pending');
          else if (el.parentNode) el.parentNode.removeChild(el);
        });
      // Export at native resolution regardless of the on-screen zoom.
      if (_schemBaseW) {
        clone.setAttribute('width', _schemBaseW);
        clone.setAttribute('height', _schemBaseH);
      }
      const svgStr = serializer.serializeToString(clone);
      const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = () => {
        const w = _schemSvg.viewBox.baseVal.width || _schemSvg.clientWidth;
        const h = _schemSvg.viewBox.baseVal.height || _schemSvg.clientHeight;
        const scale = 2;
        const canvas = document.createElement('canvas');
        canvas.width = w * scale;
        canvas.height = h * scale;
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        canvas.toBlob((pngBlob) => {
          if (!pngBlob) { cb(null, new Error('toBlob returned null')); return; }
          cb(pngBlob);
        }, 'image/png');
      };
      img.onerror = (err) => {
        URL.revokeObjectURL(url);
        cb(null, err);
      };
      img.src = url;
    } catch (err) {
      cb(null, err);
    }
  }

  function exportPNG() {
    buildSchemPngBlob((pngBlob, err) => {
      if (!pngBlob) {
        console.error('export PNG failed', err);
        schemToast('Could not generate image. Try again.');
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(pngBlob);
      const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
      a.download = `wiring-schematic-${stamp}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      schemToast('Image saved.');
    });
  }

  function findBenchmarkById(id) {
    for (const p of PROJECTS) {
      for (const b of p.benchmarks) {
        if (b.id === id) return b;
      }
    }
    return null;
  }

  // ---- Benchmark → tool round-trip ----
  // When a tool is launched from inside a benchmark modal, the history entry
  // carries the benchmark id. The tool's back button then reads
  // "Back to <benchmark>" and returns straight into that modal; launched any
  // other way, it stays "Back to Tools". Browser Back works too (popstate
  // reopens ?b= deep links).
  function toolBackTarget() {
    try {
      const s = history.state;
      if (s && s.fromBench) return findBenchmarkById(s.fromBench);
    } catch (_) {}
    return null;
  }
  function wireToolBackButton(btn) {
    if (!btn) return;
    const bench = toolBackTarget();
    if (bench) {
      btn.innerHTML = `<span class="schem-back-arrow"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></span> Back to ${escapeHtml(bench.title)}`;
      btn.setAttribute('aria-label', `Back to ${bench.title}`);
    }
    btn.addEventListener('click', () => {
      if (bench) {
        history.pushState({}, '', '/?b=' + encodeURIComponent(bench.id));
        applyRoute('/');
        openModal(bench);
      } else {
        history.pushState({}, '', '/tools');
        applyRoute('/tools');
      }
    });
  }

  // Checkmarks are DERIVED from Firestore submissions for the picked student
  // (no more hand-toggling): a lab-computer visitor sees THEIR work, not the
  // previous student's, and a submit from any device checks the box on every
  // device. localStorage stays as a cache so the page paints instantly, then
  // the cloud query (one small read per student) reconciles it.
  function explainDerivedCheck() {
    schemToast('Checkmarks fill in automatically when you submit work.');
  }
  function applyCheckedToDom() {
    document.querySelectorAll('[data-checkbox]').forEach(cb => {
      const id = cb.getAttribute('data-checkbox');
      const on = checked.has(id);
      cb.classList.toggle('checked', on);
      cb.setAttribute('aria-checked', on ? 'true' : 'false');
      const row = cb.closest('.benchmark, .capstone-card, .vid-card');
      if (row) row.classList.toggle('done', on);
    });
    updateProjMeters();
  }
  let _checkSyncToken = 0;
  async function syncCheckedFromCloud() {
    const name = (localStorage.getItem(LAST_PICK_KEY) || '').trim();
    const token = ++_checkSyncToken;
    const cloudIds = new Set();
    if (name) {
      try {
        const snap = await getDocs(query(collection(db, 'portfolios'), where('studentName', '==', name)));
        snap.forEach(d => {
          const data = d.data();
          if (!data.deleted && data.benchmarkId) cloudIds.add(data.benchmarkId);
        });
      } catch (err) {
        console.warn('check sync failed', err);
        return; // keep the cached checks rather than blanking them on a network blip
      }
    }
    if (token !== _checkSyncToken) return; // superseded by a newer sync
    checked.clear();
    cloudIds.forEach(id => checked.add(id));
    persist();
    applyCheckedToDom();
  }

  // Auto-check a benchmark after a successful submission. Idempotent —
  // re-submitting won't toggle it back off.
  function markChecked(id) {
    if (checked.has(id)) return;
    checked.add(id);
    const cb = document.querySelector(`[data-checkbox="${id}"]`);
    const row = cb ? cb.closest('.benchmark, .capstone-card, .vid-card') : null;
    if (cb) {
      cb.classList.add('checked');
      cb.setAttribute('aria-checked', 'true');
    }
    if (row) row.classList.add('done');
    persist();
    updateProjMeters();
  }

  // ============== MODAL ==============
  const modal = document.getElementById('modal');

  const modalEyebrow = document.getElementById('modalEyebrow');
  const modalTitle = document.getElementById('modalTitle');
  const modalPoints = document.getElementById('modalPoints');

  const closeBtn = document.getElementById('closeBtn');

  // _focusStudent: when set, the next portfolio gallery render auto-expands the

  function openModal(b) {

    // strings. Step strings support a small markup vocabulary:
    //   **bold**             → <strong>
    //   *italic*             → <em>
    //   [label](tools#vibe)  → inline tool launcher (Vibe Coding)
    //   [label](tools#schematic) → inline tool launcher (Schematic)

    // Video — for grounding videos (Project 0), the player is embedded inside

    // (helper videos accompanying tutorial steps), render here as before.
    if (b.videoUrl && !b.summaryPrompt) {
      const sec = document.createElement('div');
      sec.className = 'modal-section';
      sec.innerHTML = `
        <h3>${badge()}Helper Video</h3>

    // Links
    if (b.links && b.links.length) {
      const sec = document.createElement('div');
      sec.className = 'modal-section';
      sec.innerHTML = `<h3>${badge()}Resources</h3><div class="links">${
        b.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${escapeHtml(l.label)}</a>`).join('')
      }</div>`;

    }
    // Rubric
    // Portfolios render their rubric inside the drop panel (one upload box per
    // criterion row), so the standalone rubric section is skipped for them.
    // Everything else (e.g. the Instructable) keeps the simple list here.
    if (b.rubric && b.rubric.length && b.title !== 'Portfolio') {
      const sec = document.createElement('div');
      sec.className = 'modal-section';
      const maxPts = (r) => (r.levels && r.levels.length) ? r.levels[r.levels.length - 1].points : (r.points || 0);
      const total = b.rubric.reduce((s, r) => s + maxPts(r), 0);
      const rowHtml = (r) => `
        <div class="rubric-row">
          <div class="rubric-criterion">${r.label ? `<strong>${escapeHtml(r.label)}:</strong> ` : ''}${escapeHtml(r.text || r.criterion || '')}</div>
          <div class="rubric-points">${maxPts(r)} pts</div>
        </div>`;
      let bodyHtml;
      // Leveled items → the SAME Emerging/Developing/Mastered grid the project
      // portfolios use (.pf-rubric), minus the "Your work" column since the
      // Instructable is submitted separately. Keeps the look identical.
      if (b.rubric.some(r => Array.isArray(r.levels) && r.levels.length)) {
        const levelNames = (b.rubric.find(r => r.levels) || { levels: [] }).levels.map(l => l.name);
        sec.innerHTML = `
          <h3>${badge()}Rubric · ${total} pts total</h3>
          <div class="pf-rubric pf-rubric--readonly">
            <div class="pf-rubric-head">
              <span>Criterion</span>${levelNames.map(n => `<span>${escapeHtml(n)}</span>`).join('')}
            </div>
            ${b.rubric.map(r => `
              <div class="pf-rubric-row">
                <div class="prc prc-crit"><span class="prc-name">${escapeHtml(r.label || '')}</span></div>
                ${(r.levels || []).map(l => `
                  <div class="prc prc-lvl">
                    <span class="prc-pts">${l.points} pts</span>
                    <span class="prc-desc">${escapeHtml(l.desc)}</span>

              </div>
            `).join('')}
          </div>
        `;
        bodyHtml = null;
      }
      // If rubric items carry a `category`, render them grouped (parts checklist
      // with a subtotal per category); otherwise a flat list.
      else if (b.rubric.some(r => r.category)) {
        const order = [];
        const byCat = {};
        b.rubric.forEach(r => {
          const c = r.category || 'Other';
          if (!byCat[c]) { byCat[c] = []; order.push(c); }
          byCat[c].push(r);
        });
        bodyHtml = order.map((c, i) => {
          const items = byCat[c];
          const sub = items.reduce((s, r) => s + maxPts(r), 0);
          return `
            <div class="rubric-group">
              <div class="rubric-group-head">
                <span class="rubric-group-badge">${i + 1}</span>

      // bodyHtml is null when the leveled grid already filled sec above.
      if (bodyHtml !== null) {
        sec.innerHTML = `
          <h3>${badge()}Rubric · ${total} pts total</h3>
          <div class="rubric">${bodyHtml}</div>

    // Submission panel branches by benchmark shape:
    //   summaryPrompt → grounding-video summary writer (Project 0)
    //   id === 'instructable' → public-link drop (final capstone)
    //   title === 'Portfolio' → multi-slot portfolio
    //   otherwise → standard evidence + reflection checkpoint
    const isPortfolioDrop = b.title === 'Portfolio';
    const isInstructable = b.id === 'instructable';

    if (isPortfolioDrop) {

      portfolioSec.className = 'modal-section';

        : isInstructable ? 'Drop your Instructable link'

        : isInstructable ? buildInstructablePanel(b.id)

    // No public "class" pile on the Portfolio or Video panels — you see one
    // person at a time by picking their name (read-only when it isn't you).
    // Checkpoint/product benchmarks still use the standard gallery for now.
    if (!isPortfolioDrop && !isVideoSummary && !isInstructable) {
      const gallerySec = document.createElement('div');
      gallerySec.className = 'modal-section';
      gallerySec.innerHTML = `
        <h3>Class submissions</h3>

    // Wire tool-launcher links wherever they appear (brief AND instructions)
    // to close the modal and open the right tool.
    modalBody.querySelectorAll('a[data-tool-link]').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();

          : tool === 'idea-board' ? '/tools/idea-board'

          // Push the tool URL BEFORE closing the modal: applyRoute closes it
          // itself, and closing it early would strip ?b= from the history
          // entry the browser Back button needs to return to.
          history.pushState({ fromBench: b.id }, '', path);

    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
