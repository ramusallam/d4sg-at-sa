        panelType,
        kind
      };
    }
    // Close the open Tool overlay (Vibe / Schematic) so the modal isn't
    // stacking on top of a still-visible tool. The body returns to /tools so
    // closing the modal lands the kid back on the Tools page, not in the tool.
    document.body.classList.remove('view-tools-detail');
    // Navigate to the benchmark modal. openModal triggers panel build, which
    // consumes _pendingArtifact and clears it.
    const target = findBenchmarkById(benchmark.id);
    if (target) openModal(target);
  }

  // Build a PNG Blob from the current schematic SVG. Calls cb(blob) on success,
  // or cb(null, err) on failure. Shared by exportPNG() (download) and the
  // "+ Save to..." flow (drops the Blob into a benchmark/Portfolio slot).
  function buildSchemPngBlob(cb) {
    if (!_schemSvg) { cb(null, new Error('no svg')); return; }
    try {
      const serializer = new XMLSerializer();
      const clone = _schemSvg.cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      // Export at native resolution regardless of the on-screen zoom.
      if (_schemBaseW) {
        clone.setAttribute('width', _schemBaseW);
        clone.setAttribute('height', _schemBaseH);
      }
      const svgStr = serializer.serializeToString(clone);
      const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = () => {
        const w = _schemSvg.viewBox.baseVal.width || _schemSvg.clientWidth;
        const h = _schemSvg.viewBox.baseVal.height || _schemSvg.clientHeight;
        const scale = 2;
        const canvas = document.createElement('canvas');
        canvas.width = w * scale;
        canvas.height = h * scale;
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        canvas.toBlob((pngBlob) => {
          if (!pngBlob) { cb(null, new Error('toBlob returned null')); return; }
          cb(pngBlob);
        }, 'image/png');
      };
      img.onerror = (err) => {
        URL.revokeObjectURL(url);
        cb(null, err);
      };
      img.src = url;
    } catch (err) {
      cb(null, err);
    }
  }

  function exportPNG() {
    buildSchemPngBlob((pngBlob, err) => {
      if (!pngBlob) {
        console.error('export PNG failed', err);
        schemToast('Could not generate image. Try again.');
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(pngBlob);
      const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
      a.download = `wiring-schematic-${stamp}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      schemToast('Image saved.');
    });
  }

  // ============== PROGRESS page ==============
  // Live grid of student × benchmark completion. Subscribes to the portfolios
  // collection once; the existence of any portfolio doc with (studentName,
  // benchmarkId) marks that cell as "done" and renders a clickable green check
  // that opens the benchmark modal and auto-expands that student's row.
  let _progressUnsubscribe = null;
  let _progressHomeworkUnsubscribe = null;
  let _progressData = {}; // { studentName: Set(benchmarkId) }
  let _progressHomework = {}; // { studentName: Set(weekId) }

  const PROG_CHECK_SVG = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path class="prog-check-path" d="M5 12l5 5 9-11"/></svg>`;
  // Incomplete capstone (Instructable) pip shows a finish-line flag — it reads
  // as "the end of the track" rather than just another empty circle.
  const PROG_FLAG_SVG = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 5c3-1.6 5.5 1.4 8.5 0S18 5.4 19 5v8.5c-1 .4-2.5 1.4-5.5 0s-5.5-1.6-8.5 0"/></svg>`;

  function findBenchmarkById(id) {
    for (const p of PROJECTS) {
      for (const b of p.benchmarks) {
        if (b.id === id) return b;
      }
    }
    return null;
  }

  function shortBenchLabel(b, idx) {
    if (b.id === 'instructable') return 'I';
    return String(idx + 1);
  }

  function shortProjectLabel(p) {
    // Keep the leading namespace ("Project 1", "Final"), drop the descriptive subtitle.
    const m = p.title.match(/^([^:]+):/);
    return m ? m[1].trim() : p.title;
  }

  function renderProgress() {
    app.innerHTML = '';
    const wrap = document.createElement('section');
    wrap.className = 'progress-section';
    wrap.innerHTML = `
      <h2 class="project-title">Progress</h2>
      <div id="progressTable" class="progress-board"></div>
    `;
    app.appendChild(wrap);
    subscribeProgress();
  }

  function subscribeProgress() {
    if (_progressUnsubscribe) _progressUnsubscribe();
    _progressUnsubscribe = onSnapshot(collection(db, 'portfolios'), (snap) => {
      _progressData = {};
      snap.forEach(d => {
        const data = d.data();
        const name = (data.studentName || '').trim();
        if (!name || !data.benchmarkId) return;
        if (!_progressData[name]) _progressData[name] = new Set();
        _progressData[name].add(data.benchmarkId);
      });
      renderProgressTable();
    }, (err) => {
      console.error('progress subscribe error', err);
      const tbl = document.getElementById('progressTable');
      if (tbl) tbl.innerHTML = `<tbody><tr><td class="prog-empty">Could not load progress.</td></tr></tbody>`;
    });

    if (_progressHomeworkUnsubscribe) _progressHomeworkUnsubscribe();
    _progressHomeworkUnsubscribe = onSnapshot(collection(db, 'artifacts'), (snap) => {
      _progressHomework = {};
      snap.forEach(d => {
        const data = d.data();
        const name = (data.studentName || '').trim();
        const bid = data.benchmarkId || '';
        // Only homework artifacts use the hw-w{n} id pattern.
        if (!name || !/^hw-w\d+$/.test(bid)) return;
        if (!_progressHomework[name]) _progressHomework[name] = new Set();
        _progressHomework[name].add(bid);
      });
      renderProgressTable();
    }, (err) => {
      console.error('progress homework subscribe error', err);
    });
  }

  function renderProgressTable() {
    const tbl = document.getElementById('progressTable');
    if (!tbl) return;

    // Viewer's localStorage name — they always see their own card first, even
    // if they haven't submitted anything yet. Lets every student walk up to
    // Progress and see their full track ready to fill.
    // Prefer the new universal picker key; fall back to the legacy text-input key.
    const myName = (localStorage.getItem(LAST_PICK_KEY) || localStorage.getItem(NAME_KEY) || '').trim();
    const merged = { ..._progressData };

    const allNames = new Set(Object.keys(merged));
    if (myName) allNames.add(myName);

    if (!allNames.size) {
      tbl.innerHTML = `
        <div class="prog-cards-empty">
          <p class="prog-cards-empty-line">Track your progress through the course.</p>
          <p class="prog-cards-empty-sub">Drop your first submission anywhere — your card will pin to the top of this page.</p>
        </div>
      `;
      return;
    }

    const totalBench = PROJECTS.reduce((s, p) => s + p.benchmarks.length, 0);

    // Rank students by how many tasks they've completed (leaderboard order),
    // with an alphabetical tiebreak. "You" stays highlighted wherever you land.
    const doneCountFor = (nm) => {
      const set = merged[nm] || new Set();
      let n = 0;
      PROJECTS.forEach(p => p.benchmarks.forEach(b => { if (set.has(b.id)) n++; }));
      return n;
    };
    const studentNames = Array.from(allNames).sort((a, b) => {
      const diff = doneCountFor(b) - doneCountFor(a);
      if (diff) return diff;
      return a.localeCompare(b, undefined, { sensitivity: 'base' });
    });

    let html = '<div class="prog-cards">';
    studentNames.forEach(name => {
      const done = merged[name] || new Set();
      let ownDone = 0;
      PROJECTS.forEach(p => p.benchmarks.forEach(b => { if (done.has(b.id)) ownDone++; }));
      const isMe = myName && name.toLowerCase() === myName.toLowerCase();
      // Competition rank: 1 + students strictly ahead (ties share a rank).
      // Only the top three ranks get a medal + podium shade — three tied for
      // first ARE the top three. Everyone else is unranked, normal color, below.
      const rank = studentNames.filter(n => doneCountFor(n) > ownDone).length + 1;
      const medaled = ownDone > 0 && rank <= 3;
      const medalCls = medaled ? ' is-rank' + rank : '';

      const pct = totalBench ? Math.round(ownDone / totalBench * 100) : 0;
      html += `<article class="prog-card${isMe ? ' is-you' : ''}${medalCls}">
        <header class="prog-card-head">
          <div class="prog-card-head-left">
            ${medaled ? `<span class="prog-card-rank is-rank${rank}" title="Top ${rank}">#${rank}</span>` : ''}
            <h3 class="prog-card-name">${escapeHtml(name)}${isMe ? '<span class="prog-card-you">You</span>' : ''}</h3>
          </div>
          <div class="prog-card-meter" title="${ownDone} of ${totalBench} project steps complete">
            <span class="prog-card-meter-num">${ownDone}<span class="prog-card-meter-den"> / ${totalBench}</span></span>
            <span class="prog-card-meter-bar"><i style="width:${pct}%"></i></span>
          </div>
        </header>
        <ul class="prog-card-rows">`;

      PROJECTS.forEach(p => {
        const prefix = shortProjectLabel(p);
        const subtitle = p.title.replace(/^[^:]+:\s*/, '');
        const rowFinalCls = p.id === 'final' ? ' is-final' : '';
        html += `<li class="prog-card-row${rowFinalCls}">
          <span class="prog-card-row-prefix">${escapeHtml(prefix)}</span>
          <span class="prog-card-row-title">${escapeHtml(subtitle)}</span>
          <span class="prog-card-row-lead"></span>
          <div class="prog-card-row-dots">`;
        p.benchmarks.forEach((b, idx) => {
          const isFinalPip = b.id === 'instructable';
          const finalCls = isFinalPip ? ' is-final-pip' : '';
          if (done.has(b.id)) {
            html += `<a class="prog-pip is-done${finalCls}" data-bench="${escapeHtml(b.id)}" data-student="${escapeHtml(name)}" title="View ${escapeHtml(name)}'s ${escapeHtml(b.title)}">${PROG_CHECK_SVG}</a>`;
          } else {
            html += `<span class="prog-pip${finalCls}" title="${escapeHtml(b.title)}">${isFinalPip ? PROG_FLAG_SVG : (idx + 1)}</span>`;
          }
        });
        html += `</div></li>`;
      });

      html += `</ul>`;

      // Homework dot row: light blue, separate from the green project pips.
      const hwDone = _progressHomework[name] || new Set();
      html += `<div class="prog-card-hw">
        <span class="prog-card-hw-label">Homework</span>
        <span class="prog-card-hw-lead"></span>
        <div class="prog-card-hw-dots">`;
      HOMEWORK.forEach(w => {
        const isDone = hwDone.has(w.id);
        if (isDone) {
          html += `<a class="prog-pip-hw is-done" data-hw-week="${w.week}" data-student="${escapeHtml(name)}" title="${escapeHtml(name)} dropped Week ${w.week}">${PROG_CHECK_SVG}</a>`;
        } else {
          html += `<span class="prog-pip-hw" title="Week ${w.week}">${w.week}</span>`;
        }
      });
      html += `</div></div>`;

      html += `</article>`;
    });
    html += '</div>';

    tbl.innerHTML = html;

    tbl.querySelectorAll('.prog-pip.is-done[data-bench]').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const benchObj = findBenchmarkById(a.dataset.bench);
        if (benchObj) openModal(benchObj, { focusStudent: a.dataset.student });
      });
    });

    tbl.querySelectorAll('.prog-pip-hw.is-done[data-hw-week]').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const week = parseInt(a.dataset.hwWeek, 10);
        const w = HOMEWORK.find(h => h.week === week);
        if (w) openHomeworkModal(w);
      });
    });
  }

  function toggleChecked(id, row, cb) {
    if (checked.has(id)) {
      checked.delete(id);
      row.classList.remove('done');
      cb.classList.remove('checked');
      cb.setAttribute('aria-checked', 'false');
    } else {
      checked.add(id);
      row.classList.add('done');
      cb.classList.add('checked');
      cb.setAttribute('aria-checked', 'true');
    }
    persist();
  }

  // Auto-check a benchmark after a successful submission. Idempotent —
  // re-submitting won't toggle it back off.
  function markChecked(id) {
    if (checked.has(id)) return;
    checked.add(id);
    const cb = document.querySelector(`[data-checkbox="${id}"]`);
    const row = cb ? cb.closest('.benchmark, .capstone-card, .vid-card') : null;
    if (cb) {
      cb.classList.add('checked');
      cb.setAttribute('aria-checked', 'true');
    }
    if (row) row.classList.add('done');
    persist();
  }

  // ============== MODAL ==============
  const modal = document.getElementById('modal');
  const modalCard = document.getElementById('modalCard');
  const modalTitle = document.getElementById('modalTitle');
  const modalPoints = document.getElementById('modalPoints');
  const modalBody = document.getElementById('modalBody');
  const closeBtn = document.getElementById('closeBtn');

  // _focusStudent: when set, the next portfolio gallery render auto-expands the
  // row for that student name and scrolls it into view.
  let _focusStudent = null;
  function openModal(b, opts = {}) {
    _focusStudent = opts.focusStudent || null;
    currentBenchmark = b;
    modalTitle.textContent = b.title;
    modalPoints.textContent = `${b.points} pts`;
    modalPoints.style.display = '';
    modalBody.classList.remove('is-hw');
    modalBody.innerHTML = '';

    let n = 0;
    const badge = () => `<span class="step-num">${++n}</span>`;

    // Instructions — accepts a plain string (legacy) OR an array of step
    // strings. Step strings support a small markup vocabulary:
    //   **bold**             → <strong>
    //   *italic*             → <em>
    //   [label](tools#vibe)  → inline tool launcher (Vibe Coding)
    //   [label](tools#schematic) → inline tool launcher (Schematic)
    //   [label](https://…)   → external link, new tab
    // Product-benchmark brief: rendered above Instructions so the user is the
    // headline, not buried in step 1. Story hook + How Might We + persona roster.
    if (b.brief) {
      const sec = document.createElement('div');
      sec.className = 'modal-section';
      const personaCards = (b.brief.personas || []).map(p => `
        <div class="cp-persona">
          <div class="cp-persona-name">${escapeHtml(p.name)}</div>
          <div class="cp-persona-cond">${escapeHtml(p.condition)}</div>
          <div class="cp-persona-row"><strong>Motion:</strong> ${escapeHtml(p.motion)}</div>
          <div class="cp-persona-row"><strong>Goal:</strong> ${escapeHtml(p.goal)}</div>
        </div>
      `).join('');
      sec.innerHTML = `
        <h3>${badge()}Brief</h3>
        <div class="cp-brief">
          ${b.brief.hook ? `<p class="cp-brief-hook">${escapeHtml(b.brief.hook)}</p>` : ''}
          ${b.brief.challenge ? `<p class="cp-brief-challenge">${formatStepMarkup(b.brief.challenge)}</p>` : ''}
          ${personaCards ? `<p class="cp-brief-pick">Pick your user</p><div class="cp-persona-roster">${personaCards}</div>` : ''}
        </div>
      `;
      modalBody.appendChild(sec);
    }
    if (b.instructions) {
      const sec = document.createElement('div');
      sec.className = 'modal-section';
      if (Array.isArray(b.instructions) && b.instructions.length) {
        const stepsHtml = b.instructions.map((stepText, i) => `
          <div class="cp-step">
            <div class="cp-step-eyebrow">Step ${String(i + 1).padStart(2, '0')}</div>
            <div class="cp-step-body">${formatStepMarkup(stepText)}</div>
          </div>
        `).join('');
        sec.innerHTML = `<h3>${badge()}Instructions</h3><div class="cp-steps">${stepsHtml}</div>`;
      } else {
        sec.innerHTML = `<h3>${badge()}Instructions</h3><p>${escapeHtml(b.instructions)}</p>`;
      }
      modalBody.appendChild(sec);
      // Wire tool-launcher links to close the modal and open the right tool.
      sec.querySelectorAll('a[data-tool-link]').forEach(a => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          const tool = a.getAttribute('data-tool-link');
          closeModal();
          const path = tool === 'vibe' ? '/tools/vibe'
            : tool === 'idea-board' ? '/tools/idea-board'
            : '/tools/schematic';
          if (typeof applyRoute === 'function') {
            history.pushState({}, '', path);
            applyRoute(path);
          }
        });
      });
    }
    // Video — for grounding videos (Project 0), the player is embedded inside
    // the side-by-side "Watch + write" section below, so it sits next to the
    // textarea instead of taking the full modal width. For everything else
    // (helper videos accompanying tutorial steps), render here as before.
    if (b.videoUrl && !b.summaryPrompt) {
      const sec = document.createElement('div');
      sec.className = 'modal-section';
      sec.innerHTML = `
        <h3>${badge()}Helper Video</h3>
        <div class="video-wrap">
          <iframe src="${b.videoUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      `;
      modalBody.appendChild(sec);
    }
    // Links
    if (b.links && b.links.length) {
      const sec = document.createElement('div');
      sec.className = 'modal-section';
      sec.innerHTML = `<h3>${badge()}Resources</h3><div class="links">${
        b.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${escapeHtml(l.label)}</a>`).join('')
      }</div>`;
      modalBody.appendChild(sec);
    }
    // Rubric
    if (b.rubric && b.rubric.length) {
      const sec = document.createElement('div');
      sec.className = 'modal-section';
      const total = b.rubric.reduce((s, r) => s + r.points, 0);
      sec.innerHTML = `
        <h3>${badge()}Rubric · ${total} pts total</h3>
        <div class="rubric">
          ${b.rubric.map(r => `
            <div class="rubric-row">
              <div class="rubric-criterion">${r.label ? `<strong>${escapeHtml(r.label)}:</strong> ` : ''}${escapeHtml(r.text || r.criterion || '')}</div>
              <div class="rubric-points">${r.points} pts</div>
            </div>
          `).join('')}
        </div>
      `;
      modalBody.appendChild(sec);
    }

    // Submission panel branches by benchmark shape:
    //   summaryPrompt → grounding-video summary writer (Project 0)
    //   id === 'instructable' → public-link drop (final capstone)
    //   title === 'Portfolio' → multi-slot portfolio
    //   otherwise → standard evidence + reflection checkpoint
    const isPortfolioDrop = b.title === 'Portfolio';
    const isInstructable = b.id === 'instructable';
    const isVideoSummary = !!b.summaryPrompt;
    const portfolioSec = document.createElement('div');
    portfolioSec.className = 'modal-section';
    const submitHeading = isVideoSummary ? 'Watch + write'
      : isInstructable ? 'Drop your Instructable link'
      : isPortfolioDrop ? 'Portfolio Drop'
      : 'Submit evidence + reflection';
    portfolioSec.innerHTML = `
      <h3>${badge()}${submitHeading}</h3>
      <div id="portfolioPanelMount"></div>
    `;
    modalBody.appendChild(portfolioSec);
    const panelMount = portfolioSec.querySelector('#portfolioPanelMount');
    panelMount.appendChild(
      isVideoSummary ? buildVideoSummaryPanel(b)
      : isInstructable ? buildInstructablePanel(b.id)
      : isPortfolioDrop ? buildPortfolioPanel(b.id)
      : buildCheckpointPanel(b.id)
    );

    // Gallery / Class submissions. Video-summary benchmarks use the compact
    // splashboard (every student's summary in one scannable list). Everything
    // else uses the standard portfolio gallery with expandable rows.
    const gallerySec = document.createElement('div');
    gallerySec.className = 'modal-section';
    const galleryHeading = isVideoSummary ? 'Class summaries'
      : isPortfolioDrop ? 'Class portfolios'
      : 'Class submissions';
    gallerySec.innerHTML = `
      <h3>${galleryHeading}</h3>
      <div class="pf-gallery" id="pfGallery"></div>
    `;
    modalBody.appendChild(gallerySec);
    if (isVideoSummary) {
      subscribeVideoSummaries(b);
    } else {
      subscribePortfolios(b.id);
    }

    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    closeBtn.focus();
  }

  function closeModal() {
    modal.classList.remove('open');
    document.body.style.overflow = '';
    currentBenchmark = null;
    _focusStudent = null;
    // Let any mounted submission panel detach Firestore listeners / picker subs.
    modalBody.querySelectorAll('.portfolio-panel').forEach(p => {
      if (typeof p._cleanup === 'function') { try { p._cleanup(); } catch (_) {} }
    });
    if (unsubscribeGallery) { unsubscribeGallery(); unsubscribeGallery = null; }
    if (unsubscribePortfolios) { unsubscribePortfolios(); unsubscribePortfolios = null; }
    // Cancel any pending debounced renders so they don't paint into a closed modal.
    if (_galleryRenderTimer) { clearTimeout(_galleryRenderTimer); _galleryRenderTimer = null; _galleryRenderArgs = null; }
    if (_pfGalleryRenderTimer) { clearTimeout(_pfGalleryRenderTimer); _pfGalleryRenderTimer = null; _pfGalleryRenderItems = null; }
    // Clear modal body refs so a re-open animates fresh.
    const pfGrid = document.getElementById('pfGallery');
    if (pfGrid) pfGrid._pfKnownIds = null;
    // Clear archive deep-link param so closing an archive doesn't keep it sticky.
    try {
      const sp = new URLSearchParams(location.search);
      if (sp.has('archive')) {
        sp.delete('archive');
        history.replaceState(null, '', sp.toString() ? `${location.pathname}?${sp.toString()}` : location.pathname);
      }
    } catch (_) {}
  }

  function openHomeworkModal(w) {
    currentBenchmark = w;
    modalTitle.textContent = w.title;
    modalPoints.textContent = '';
    modalPoints.style.display = 'none';
    modalBody.innerHTML = '';
    modalBody.classList.add('is-hw');

    const videoBlock = w.videoUrl
      ? `<div class="video-wrap"><iframe src="${w.videoUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`
      : `<div class="video-wrap" style="background:#fafaf7;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink-low);font-size:13px;">Video placeholder for ${escapeHtml(w.title)}</div>`;

    const grid = document.createElement('div');
    grid.className = 'hw-grid';
    grid.innerHTML = `
      <div class="hw-col">
        <div class="step-section">

          ${videoBlock}
        </div>
      </div>

        <div class="step-section">

    modalBody.appendChild(grid);

    subscribeGallery(w.id, {

    modal.classList.add('open');

  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();

  // ============== GALLERY ==============
  function subscribeGallery(benchmarkId, opts = {}) {
    if (unsubscribeGallery) unsubscribeGallery();
    const grid = document.getElementById('galleryGrid');
    if (!grid) return;
    const q = query(
      collection(db, 'artifacts'),
      where('benchmarkId', '==', benchmarkId)
    );
    unsubscribeGallery = onSnapshot(q, (snap) => {
      const items = [];
      snap.forEach(d => items.push({ id: d.id, ...d.data() }));
      // newest first
      items.sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
      // Update the count badge from the live snapshot for free (no extra read).
      updateCountBadge(benchmarkId, items.length);
      debouncedRenderGallery(grid, benchmarkId, items, opts);
    }, (err) => {
      console.error('gallery subscribe error', err);
      grid.innerHTML = `<div class="gallery-empty">Could not load gallery.</div>`;
    });
  }

  // Debounce gallery re-renders. When 30 students submit in 5 seconds the
  // snapshot fires 30 times; we want to coalesce to ~1 paint per ~200ms.
  let _galleryRenderTimer = null;
  let _galleryRenderArgs = null;
  function debouncedRenderGallery(...args) {
    _galleryRenderArgs = args;
    if (_galleryRenderTimer) return;
    _galleryRenderTimer = setTimeout(() => {
      _galleryRenderTimer = null;
      const a = _galleryRenderArgs;
      _galleryRenderArgs = null;
      if (a) renderGallery.apply(null, a);
    }, 200);
  }

  function renderGallery(grid, benchmarkId, items, opts = {}) {
    grid.innerHTML = '';
    items.forEach(item => {
      const tile = document.createElement('div');
      const isLink = item.type === 'link';
      const isVideo = (item.contentType || '').startsWith('video/');
      tile.className = 'gallery-tile' + (isLink ? ' link-tile' : '');

      let media;
      if (isLink) {
        media = item.linkImage
          ? `<img src="${item.linkImage}" alt="${escapeHtml(item.linkTitle || item.linkUrl)}" loading="lazy" decoding="async" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'link-fallback',innerHTML:'<div class=\\'link-icon\\'>🔗</div><div class=\\'link-domain\\'>${escapeHtml(item.linkDomain || '')}</div>'}));" />`
          : `<div class="link-fallback"><div class="link-icon">🔗</div><div class="link-domain">${escapeHtml(item.linkDomain || 'link')}</div></div>`;
      } else if (isVideo) {
        media = `<video src="${item.fileUrl}" muted preload="metadata"></video><div class="play-icon">▶</div>`;
      } else {
        media = `<img src="${item.fileUrl}" alt="${escapeHtml(item.studentName || '')}" loading="lazy" decoding="async" onerror="this.parentElement.innerHTML='<div class=&quot;pf-broken&quot;><span class=&quot;pf-broken-icon&quot;>⚠</span><span>(file unavailable)</span></div>';" />`;
      }

      tile.innerHTML = `
        ${media}
        ${isLink ? `<span class="link-chip">Link</span>` : ''}
        <div class="tile-caption">
          <span class="tile-name">${escapeHtml(item.studentName || 'Unnamed')}</span>
          <span class="tile-desc">${escapeHtml(item.description || '')}</span>
        </div>
        <button class="tile-delete" aria-label="Delete">×</button>
      `;
      tile.addEventListener('click', (e) => {
        if (e.target.closest('.tile-delete')) return;
        if (isLink) {
          window.open(item.linkUrl, '_blank', 'noopener');
        } else {
          openLightbox(item);
        }
      });
      tile.querySelector('.tile-delete').addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm(`Delete "${item.studentName}" submission?`)) return;
        await deleteArtifact(item);
      });
      grid.appendChild(tile);
    });
    // Add tile (always last)
    const addTile = document.createElement('div');
    addTile.className = 'add-tile';
    addTile.innerHTML = `<div class="plus">+</div><div>${opts.linkOnly ? 'Submit link' : 'Add your work'}</div>`;
    addTile.addEventListener('click', () => {
      let formRef;
      formRef = buildUploadForm(benchmarkId, () => {
        // re-render handled by snapshot; cleanup picker subscription.
        if (formRef && typeof formRef._cleanup === 'function') formRef._cleanup();
      }, () => {
        if (formRef && typeof formRef._cleanup === 'function') formRef._cleanup();
        renderGallery(grid, benchmarkId, items, opts);
      }, opts);
      grid.replaceChild(formRef, addTile);
    });
    grid.appendChild(addTile);
  }

  function buildUploadForm(benchmarkId, onSuccess, onCancel, opts = {}) {
    const linkOnly = !!opts.linkOnly;
    const descPlaceholder = opts.descriptionPlaceholder || 'What is this and what should we look at?';
    const form = document.createElement('div');
    form.className = 'upload-form';
    const UPLOAD_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0l-5 5m5-5l5 5M4 20h16"/></svg>';
    const LINK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><path d="M10 13a5 5 0 007.07 0l3-3a5 5 0 00-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 00-7.07 0l-3 3a5 5 0 007.07 7.07l1.5-1.5"/></svg>';

    const fileBlock = linkOnly ? '' : `
      <div class="attach-empty" data-attach-empty>
        <div class="attach-icon">${UPLOAD_ICON}</div>
        <div class="attach-text">Drop a file or click to upload</div>
        <div class="attach-sub">Image or video, up to 50MB</div>
        <button type="button" class="attach-link-toggle" data-link-toggle>${LINK_ICON} Or paste a link</button>
      </div>
      <input type="file" data-file accept="image/*,video/*" />
    `;

    form.innerHTML = `
      <div data-hw-namepicker></div>
      <label>Brief description<textarea data-desc rows="2" maxlength="500" placeholder="${escapeHtml(descPlaceholder)}"></textarea></label>

      <div class="attach ${linkOnly ? 'is-link-entry' : ''}" data-attach>
        ${fileBlock}
        <div class="attach-link-entry">
          <input type="url" data-link-input placeholder="${linkOnly ? 'Paste your link' : 'Paste a URL'}" />
          ${linkOnly ? '' : '<button type="button" class="icon-btn" data-link-cancel aria-label="Cancel">×</button>'}
        </div>
        <div class="attach-preview" data-preview></div>
      </div>

      <div class="upload-status" data-status></div>
      <div class="actions">
        <button class="btn-cancel" data-cancel type="button">Cancel</button>
        <button class="btn-submit" data-submit type="button">Submit</button>
      </div>
    `;

    // Universal roster picker (same instance used everywhere submissions happen).
    const hwPickerMount = form.querySelector('[data-hw-namepicker]');
    const hwPicker = renderNamePicker({
      initial: localStorage.getItem(LAST_PICK_KEY) || '',
      onChange: (n) => { if (n) ensureRosterEntry(n); }
    });
    hwPickerMount.appendChild(hwPicker.element);
    // Compat shim so the existing submit code that reads `nameInput.value` keeps working.
    const nameInput = { get value() { return hwPicker.getName(); }, set value(v) { hwPicker.setName(v); } };
    form._cleanup = () => hwPicker.destroy();

    const descInput = form.querySelector('[data-desc]');
    const statusEl = form.querySelector('[data-status]');
    const submitBtn = form.querySelector('[data-submit]');
    const attach = form.querySelector('[data-attach]');
    const attachEmpty = form.querySelector('[data-attach-empty]');
    const fileInput = form.querySelector('[data-file]');
    const linkToggle = form.querySelector('[data-link-toggle]');
    const linkInput = form.querySelector('[data-link-input]');
    const linkCancel = form.querySelector('[data-link-cancel]');
    const previewEl = form.querySelector('[data-preview]');

    // Attachment state
    let attachedFile = null;
    let attachedLink = null; // { url, preview }

    function setErr(msg) {
      statusEl.classList.add('error');
      statusEl.textContent = msg;
    }
    function clearStatus() {
      statusEl.classList.remove('error');
      statusEl.textContent = '';
    }

    function clearAttachment() {
      attachedFile = null;
      attachedLink = null;
      attach.classList.remove('has-content', 'is-link-entry');
      previewEl.innerHTML = '';
      fileInput.value = '';
      linkInput.value = '';
      clearStatus();
    }

    function attachFile(file) {
      if (!file.type.match(/^(image|video)\//)) { setErr('File must be an image or video.'); return; }
      if (file.size > 50 * 1024 * 1024) { setErr('File too large (50MB max).'); return; }
      attachedFile = file;
      attachedLink = null;
      const isVideo = file.type.startsWith('video/');
      const sizeKb = file.size / 1024;
      const sizeStr = sizeKb < 1024 ? `${Math.round(sizeKb)} KB` : `${(sizeKb / 1024).toFixed(1)} MB`;
      const objectUrl = URL.createObjectURL(file);
      previewEl.innerHTML = `
        <div class="preview-thumb">${isVideo ? `<video src="${objectUrl}" muted></video>` : `<img src="${objectUrl}" alt="preview" />`}</div>
        <div class="preview-info">
          <div class="preview-title">${escapeHtml(file.name)}</div>
          <div class="preview-meta">${sizeStr} · ${isVideo ? 'Video' : 'Image'}</div>
        </div>
        <button type="button" class="preview-remove" data-preview-remove aria-label="Remove">×</button>
      `;
      attach.classList.add('has-content');
      attach.classList.remove('is-link-entry');
      previewEl.querySelector('[data-preview-remove]').addEventListener('click', clearAttachment);
      clearStatus();
    }

    async function attachLink(url) {
      if (!/^https?:\/\//i.test(url)) { setErr('Link must start with http:// or https://'); return; }
      attachedFile = null;
      attachedLink = { url, preview: null };
      attach.classList.add('has-content');
      attach.classList.remove('is-link-entry');
      // loading state
      previewEl.innerHTML = `
        <div class="preview-thumb">${LINK_ICON_BIG}</div>
        <div class="preview-info">
          <div class="preview-title">${escapeHtml(url)}</div>
          <div class="preview-meta preview-loading">Pulling preview…</div>
        </div>
        <button type="button" class="preview-remove" data-preview-remove aria-label="Remove">×</button>
      `;
      previewEl.querySelector('[data-preview-remove]').addEventListener('click', clearAttachment);
      clearStatus();
      try {
        const preview = await fetchLinkPreview(url);
        if (attachedLink?.url !== url) return; // user changed it
        attachedLink.preview = preview;
        const thumb = preview.image
          ? `<img src="${preview.image}" alt="preview" onerror="this.parentElement.innerHTML='${LINK_ICON_BIG.replace(/'/g, "\\'")}';" />`
          : LINK_ICON_BIG;
        previewEl.innerHTML = `
          <div class="preview-thumb">${thumb}</div>
          <div class="preview-info">
            <div class="preview-title">${escapeHtml(preview.title || preview.domain || url)}</div>
            <div class="preview-meta">${escapeHtml(preview.domain || url)}</div>
          </div>
          <button type="button" class="preview-remove" data-preview-remove aria-label="Remove">×</button>
        `;
        previewEl.querySelector('[data-preview-remove]').addEventListener('click', clearAttachment);
      } catch (err) {
        // keep the basic preview but mark as failed
        const meta = previewEl.querySelector('.preview-meta');
        if (meta) meta.textContent = 'Could not pull preview · still submittable';
      }
    }

    const LINK_ICON_BIG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px;"><path d="M10 13a5 5 0 007.07 0l3-3a5 5 0 00-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 00-7.07 0l-3 3a5 5 0 007.07 7.07l1.5-1.5"/></svg>';

    if (!linkOnly) {
      // Click empty zone → file picker
      attachEmpty.addEventListener('click', (e) => {
        if (e.target.closest('[data-link-toggle]')) return;
        fileInput.click();
      });
      fileInput.addEventListener('change', () => {
        if (fileInput.files[0]) attachFile(fileInput.files[0]);
      });

      // Drag & drop on the attach zone (file or URL)
      ['dragenter', 'dragover'].forEach(ev => attach.addEventListener(ev, (e) => {
        e.preventDefault();
        attach.classList.add('is-dragover');
      }));
      ['dragleave', 'drop'].forEach(ev => attach.addEventListener(ev, (e) => {
        if (ev === 'dragleave' && e.target !== attach) return;
        attach.classList.remove('is-dragover');
      }));
      attach.addEventListener('drop', (e) => {
        e.preventDefault();
        const files = e.dataTransfer.files;
        if (files && files.length) { attachFile(files[0]); return; }
        const url = (e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain') || '').trim();
        if (url) attachLink(url);
      });

      // Link toggle: reveal URL entry
      linkToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        attach.classList.add('is-link-entry');
        setTimeout(() => linkInput.focus(), 50);
      });
      linkCancel.addEventListener('click', () => {
        attach.classList.remove('is-link-entry');
        linkInput.value = '';
      });
    } else {
      // linkOnly: drop URL anywhere on the attach zone is still useful
      ['dragenter', 'dragover'].forEach(ev => attach.addEventListener(ev, (e) => {
        e.preventDefault();
        attach.classList.add('is-dragover');
      }));
      ['dragleave', 'drop'].forEach(ev => attach.addEventListener(ev, (e) => {
        if (ev === 'dragleave' && e.target !== attach) return;
        attach.classList.remove('is-dragover');
      }));
      attach.addEventListener('drop', (e) => {
        e.preventDefault();
        const url = (e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain') || '').trim();
        if (url) attachLink(url);
      });
      // Auto-focus the link input when form opens
      setTimeout(() => linkInput.focus(), 50);
    }
    linkInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const v = linkInput.value.trim();
        if (v) attachLink(v);
      } else if (e.key === 'Escape') {
        linkCancel.click();
      }
    });
    // Paste a URL into the link input → auto-attach
    linkInput.addEventListener('paste', (e) => {
      const t = (e.clipboardData?.getData('text/plain') || '').trim();
      if (/^https?:\/\//i.test(t)) {
        e.preventDefault();
        linkInput.value = t;
        attachLink(t);
      }
    });
    // Paste a URL anywhere else on the form (not in desc/link/name-add inputs) → auto-attach
    form.addEventListener('paste', (e) => {
      if (e.target === descInput || e.target === linkInput) return;
      if (e.target && e.target.closest && e.target.closest('.name-picker')) return;
      const t = (e.clipboardData?.getData('text/plain') || '').trim();
      if (/^https?:\/\//i.test(t)) {
        e.preventDefault();
        attachLink(t);
      }
    });

    form.querySelector('[data-cancel]').addEventListener('click', onCancel);
    submitBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim();
      const desc = descInput.value.trim();
      if (!name) { setErr('Please enter your name.'); return; }
      if (!attachedFile && !attachedLink) { setErr(linkOnly ? 'Paste a link to your design.' : 'Drop a file or paste a link.'); return; }
      submitBtn.disabled = true;
      clearStatus();
      localStorage.setItem(LAST_PICK_KEY, name);
      try {
        if (attachedFile) {
          statusEl.textContent = 'Uploading…';
          await uploadArtifact({ benchmarkId, name, desc, file: attachedFile, onProgress: (pct) => {
            statusEl.textContent = `Uploading… ${pct}%`;
          }});
        } else {
          statusEl.textContent = 'Saving…';
          const preview = attachedLink.preview || await fetchLinkPreview(attachedLink.url);
          await addLinkArtifact({ benchmarkId, name, desc, link: attachedLink.url, preview });
        }
        statusEl.textContent = 'Done.';
        onSuccess();
      } catch (err) {
        console.error(err);
        setErr(err.message || 'Submit failed. Try again.');
        submitBtn.disabled = false;
      }
    });

    return form;
  }

  async function fetchLinkPreview(url) {
    try {
      const r = await fetch(`/api/preview?url=${encodeURIComponent(url)}`);
      if (!r.ok) throw new Error('preview');
      return await r.json();
    } catch (err) {
      // Graceful degradation — submit the link with no preview metadata
      let domain = '';
      try { domain = new URL(url).hostname.replace(/^www\./, ''); } catch (_) {}
      return { url, title: '', description: '', image: '', domain };
    }
  }

  async function addLinkArtifact({ benchmarkId, name, desc, link, preview }) {
    await addDoc(collection(db, 'artifacts'), {
      benchmarkId,
      studentName: name,
      description: desc,
      type: 'link',
      linkUrl: link,
      linkTitle: preview?.title || '',
      linkDescription: preview?.description || '',
      linkImage: preview?.image || '',
      linkDomain: preview?.domain || '',
      createdAt: serverTimestamp()
    });
  }

  function uploadArtifact({ benchmarkId, name, desc, file, onProgress }) {
    return new Promise((resolve, reject) => {
      const ext = (file.name.match(/\.[a-z0-9]+$/i) || [''])[0];
      const path = `artifacts/${benchmarkId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}${ext}`;
      const ref = storageRef(storage, path);
      const task = uploadBytesResumable(ref, file, { contentType: file.type });
      task.on('state_changed',
        (snap) => onProgress?.(Math.round(snap.bytesTransferred / snap.totalBytes * 100)),
        reject,
        async () => {
          try {
            const url = await getDownloadURL(task.snapshot.ref);
            await addDoc(collection(db, 'artifacts'), {
              benchmarkId,
              studentName: name,
              description: desc,
              fileUrl: url,
              filePath: path,
              contentType: file.type,
              createdAt: serverTimestamp()
            });
            resolve();
          } catch (e) { reject(e); }
        }
      );
    });
  }

  async function deleteArtifact(item) {
    try {
      if (item.filePath) {
        try { await deleteObject(storageRef(storage, item.filePath)); } catch (e) { /* file may already be gone */ }
      }
      await deleteDoc(doc(db, 'artifacts', item.id));
      // Open-snapshot listener will update the count for this benchmark live;
      // belt-and-braces refresh the badge in case nothing else closes the loop.
      if (item.benchmarkId) refreshCountBadge(item.benchmarkId);
    } catch (err) {
      console.error('delete failed', err);
      alert('Could not delete. Try again.');
    }
  }

  // ============== PORTFOLIO SYSTEM ==============
  const SLOT_DEFS = [
    { key: 'sketch',  label: 'Sketch',  icon: ICON_SKETCH,  accept: 'image/png,image/jpeg',                                          exts: 'PNG, JPG',  fileTypes: 'image', allowFile: true,  allowLink: false },
    { key: 'cad',     label: 'CAD',     icon: ICON_CAD,     accept: '.stl,model/stl,application/sla,application/vnd.ms-pki.stl',    exts: 'STL',       fileTypes: 'cad',   allowFile: true,  allowLink: true  },
    { key: 'code',    label: 'Code',    icon: ICON_CODE,    accept: 'application/pdf',                                               exts: 'PDF',       fileTypes: 'pdf',  allowFile: true,  allowLink: false },
    { key: 'wiring',  label: 'Wiring',  icon: ICON_WIRING,  accept: 'image/jpeg,image/png',                                          exts: 'JPG, PNG',  fileTypes: 'image', allowFile: true,  allowLink: false },
    { key: 'image',   label: 'Image',   icon: ICON_IMAGE,   accept: 'image/jpeg,image/png',                                          exts: 'JPG, PNG',  fileTypes: 'image', allowFile: true,  allowLink: false },
    { key: 'video',   label: 'Video',   icon: ICON_VIDEO,   accept: 'video/mp4',                                                     exts: 'MP4',       fileTypes: 'video', allowFile: true,  allowLink: true  },
    { key: 'summary', label: 'Summary', icon: ICON_SUMMARY, accept: '',                                                              exts: 'Text only', fileTypes: 'text', allowFile: false, allowLink: false }
  ];
  const SUMMARY_MAX = 1500;
  const PORTFOLIO_MAX_FILE = 100 * 1024 * 1024; // 100MB

  function isStlFile(file) {
    if (!file) return false;
    if (/\.stl$/i.test(file.name || '')) return true;
    const ct = (file.type || '').toLowerCase();
    return ct === 'model/stl' || ct === 'application/sla' || ct === 'application/vnd.ms-pki.stl';
  }

  function isAcceptedForSlot(slotKey, file) {
    if (!file) return false;
    if (file.size > PORTFOLIO_MAX_FILE) return false;
    const ct = (file.type || '').toLowerCase();
    if (slotKey === 'image' || slotKey === 'wiring' || slotKey === 'sketch') {
      return ct === 'image/jpeg' || ct === 'image/png';
    }
    if (slotKey === 'video') {
      return ct === 'video/mp4';
    }
    if (slotKey === 'cad') {
      return isStlFile(file);
    }
    if (slotKey === 'code') {
      return ct === 'application/pdf';
    }
    return false; // summary is text-only
  }

  function shortBytes(n) {
    if (n < 1024) return `${n} B`;
    if (n < 1024 * 1024) return `${Math.round(n / 1024)} KB`;
    return `${(n / 1024 / 1024).toFixed(1)} MB`;
  }

  function getDomain(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); }
    catch (_) { return ''; }
  }

  function thumbnailFor(slotData) {
    if (!slotData) return '';
    if (slotData.mode === 'text') return ICON_SUMMARY;
    if (slotData.mode === 'link') return ICON_LINK;
    const ct = (slotData.contentType || '').toLowerCase();
    if (ct.startsWith('image/')) return `<img src="${slotData.url}" alt="" loading="lazy" />`;
    if (ct.startsWith('video/')) return `<video src="${slotData.url}" muted preload="metadata"></video>`;
    return ICON_DOC;
  }

  function buildPortfolioPanel(benchmarkId) {
    const panel = document.createElement('div');
    panel.className = 'portfolio-panel';

    panel.innerHTML = `
      <div data-pf-namepicker></div>
      <div class="pf-slots" data-pf-slots></div>
      <div class="pf-actions">
        <div class="pf-status" data-pf-status></div>
        <button class="pf-submit" data-pf-submit type="button" disabled>Submit Portfolio</button>
      </div>
    `;

    const namePickerMount = panel.querySelector('[data-pf-namepicker]');
    const picker = renderNamePicker({
      initial: localStorage.getItem(LAST_PICK_KEY) || '',
      onChange: (n) => { if (n) ensureRosterEntry(n); }
    });
    namePickerMount.appendChild(picker.element);
    // Compat shim so existing code that reads `nameInput.value` keeps working.
    const nameInput = { get value() { return picker.getName(); }, set value(v) { picker.setName(v); } };
    panel._cleanup = () => picker.destroy();
    const slotsEl = panel.querySelector('[data-pf-slots]');
    const submitBtn = panel.querySelector('[data-pf-submit]');
    const statusEl = panel.querySelector('[data-pf-status]');

    // In-memory slot state: { image: {...}, video: {...}, ... } or null
    const state = { image: null, video: null, code: null, cad: null, summary: null };
    // Pending file objects, before submit (so we can upload at submit time)
    const pendingFiles = {}; // { slotKey: File }
    let openSlotKey = null;

    SLOT_DEFS.forEach((def, defIdx) => {
      const slot = document.createElement('div');
      slot.className = 'pf-slot';
      slot.dataset.slot = def.key;
      slot.innerHTML = `
        <div class="pf-slot-tile" data-pf-tile>
          <div class="pf-slot-number">${defIdx + 1}</div>
          <div class="pf-slot-icon">${def.icon}</div>
          <div class="pf-slot-label">${def.label}</div>
          <div class="pf-slot-status">+ Add</div>
          <div class="pf-slot-mini-actions">
            <button type="button" data-pf-mini-edit aria-label="Edit">✎</button>
            <button type="button" data-pf-mini-remove aria-label="Remove">×</button>
          </div>
        </div>
        <div class="pf-slot-body">
          <div class="pf-slot-head">
            <div class="pf-slot-head-title">
              <span class="pf-slot-icon">${def.icon}</span>
              ${def.label}
            </div>
            <button type="button" class="pf-slot-collapse" data-pf-collapse aria-label="Collapse">×</button>
          </div>
          <div class="pf-slot-body-inner" data-pf-body-inner></div>
        </div>
      `;
      slotsEl.appendChild(slot);

      const tile = slot.querySelector('[data-pf-tile]');
      const collapseBtn = slot.querySelector('[data-pf-collapse]');
      const bodyInner = slot.querySelector('[data-pf-body-inner]');

      tile.addEventListener('click', (e) => {
        if (e.target.closest('[data-pf-mini-remove]')) {
          e.stopPropagation();
          clearSlot(def.key);
          return;
        }
        if (e.target.closest('[data-pf-mini-edit]')) {
          e.stopPropagation();
        }
        openSlot(def.key);
      });
      // Keyboard support: Enter / Space on tile opens slot
      tile.setAttribute('tabindex', '0');
      tile.setAttribute('role', 'button');
      tile.setAttribute('aria-label', `${def.label} slot`);
      tile.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          if (e.target.closest('[data-pf-mini-remove], [data-pf-mini-edit]')) return;
          e.preventDefault();
          openSlot(def.key);
        }
      });
      // Drag-over feedback on the slot tile itself (when collapsed) — only
      // for slots that actually accept files.
      if (def.allowFile) {
        ['dragenter', 'dragover'].forEach(ev => slot.addEventListener(ev, (e) => {
          if (slot.classList.contains('is-open')) return;
          if (!e.dataTransfer || !e.dataTransfer.types.includes('Files')) return;
          e.preventDefault();
          slot.classList.add('is-tile-dragover');
        }));
        ['dragleave', 'drop'].forEach(ev => slot.addEventListener(ev, (e) => {
          if (ev === 'dragleave' && slot.contains(e.relatedTarget)) return;
          slot.classList.remove('is-tile-dragover');
        }));
        slot.addEventListener('drop', (e) => {
          if (slot.classList.contains('is-open')) return;
          const files = e.dataTransfer?.files;
          if (!files || !files.length) return;
          e.preventDefault();
          openSlot(def.key);
          handleFileForSlot(def, files[0]);
        });
      }
      collapseBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeOpenSlot();
      });

      function renderBody() {
        if (def.fileTypes === 'text') {
          const existingText = state.summary?.text || '';
          bodyInner.innerHTML = `
            <textarea class="pf-summary-box" data-pf-text rows="6" maxlength="${SUMMARY_MAX}" placeholder="Start by naming your end user (who they are, what access need you are designing for). Then 4–5 sentences reflecting on your prototyping process: what you created, problems you encountered, how you overcame them, and new things you learned.">${escapeHtml(existingText)}</textarea>
            <div class="pf-char-count" data-pf-char>${existingText.length} / ${SUMMARY_MAX}</div>
          `;
          const txt = bodyInner.querySelector('[data-pf-text]');
          const counter = bodyInner.querySelector('[data-pf-char]');
          const updateCount = () => {
            const len = txt.value.length;
            counter.textContent = `${len} / ${SUMMARY_MAX}`;
            counter.classList.toggle('is-warn', len > SUMMARY_MAX * 0.85 && len <= SUMMARY_MAX);
            counter.classList.toggle('is-over', len > SUMMARY_MAX);
          };
          txt.addEventListener('input', () => {
            updateCount();
            const v = txt.value.trim();
            state.summary = v ? { mode: 'text', text: v.slice(0, SUMMARY_MAX) } : null;
            refreshTile(def.key);
            refreshSubmit();
          });
          updateCount();
          setTimeout(() => txt.focus(), 50);
          return;
        }

        // File slot UI
        const filled = state[def.key];
        let previewHtml = '';
        if (filled) {
          let thumb = '';
          if (filled.mode === 'link') {
            thumb = ICON_LINK;
          } else if ((filled.contentType || '').startsWith('image/')) {
            thumb = `<img src="${filled.url}" alt="" />`;
          } else if ((filled.contentType || '').startsWith('video/')) {
            thumb = `<video src="${filled.url}" muted></video>`;
          } else {
            thumb = ICON_DOC;
          }
          const title = filled.mode === 'link'
            ? (filled.url || 'Link')
            : (filled.fileName || 'File');
          const meta = filled.mode === 'link'
            ? (getDomain(filled.url) || 'External link')
            : (filled.contentType || '');
          previewHtml = `
            <div class="pf-filled-preview">
              <div class="pf-fp-thumb">${thumb}</div>
              <div class="pf-fp-info">
                <div class="pf-fp-title">${escapeHtml(title)}</div>
                <div class="pf-fp-meta">${escapeHtml(meta)}</div>
              </div>
              <button type="button" class="pf-fp-remove" data-pf-clear aria-label="Remove">×</button>
            </div>
          `;
        }

        const dropHtml = def.allowFile ? `
          <div class="pf-drop" data-pf-drop>
            <div class="pf-drop-text">Drop a file or click to upload</div>
            <div class="pf-drop-sub">${def.exts} · up to 100MB</div>
            <input type="file" data-pf-file accept="${def.accept}" style="display:none;" />
          </div>
        ` : '';
        const linkHtml = def.allowLink ? `
          <div class="pf-link-row">
            <span class="pf-link-label">${def.allowFile ? 'Or link' : 'Public URL'}</span>
            <span class="pf-link-input-wrap">
              <input type="url" data-pf-link placeholder="https://…" value="${filled?.mode === 'link' ? escapeHtml(filled.url) : ''}" />
              <span class="pf-link-check" data-pf-link-check></span>
            </span>
          </div>
        ` : '';
        bodyInner.innerHTML = `${previewHtml}${dropHtml}${linkHtml}`;

        const dropZone = bodyInner.querySelector('[data-pf-drop]');
        const fileInput = bodyInner.querySelector('[data-pf-file]');
        const linkInput = bodyInner.querySelector('[data-pf-link]');
        const linkCheck = bodyInner.querySelector('[data-pf-link-check]');
        const clearBtn = bodyInner.querySelector('[data-pf-clear]');

        if (clearBtn) clearBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          clearSlot(def.key);
          renderBody();
        });

        if (dropZone && fileInput) {
          dropZone.addEventListener('click', () => fileInput.click());
          fileInput.addEventListener('change', () => {
            const f = fileInput.files[0];
            if (f) handleFileForSlot(def, f);
          });

          ['dragenter', 'dragover'].forEach(ev => dropZone.addEventListener(ev, (e) => {
            e.preventDefault();
            dropZone.classList.add('is-dragover');
          }));
          ['dragleave', 'drop'].forEach(ev => dropZone.addEventListener(ev, (e) => {
            if (ev === 'dragleave' && e.target !== dropZone) return;
            dropZone.classList.remove('is-dragover');
          }));
          dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            const files = e.dataTransfer.files;
            if (files && files.length) handleFileForSlot(def, files[0]);
          });
        }

        if (!linkInput) return;
        const commitLink = () => {
          const v = linkInput.value.trim();
          if (!v) return;
          if (!/^https?:\/\//i.test(v)) {
            setStatus('Link must start with http:// or https://', true);
            return;
          }
          // Clear pending file, set link
          delete pendingFiles[def.key];
          state[def.key] = { mode: 'link', url: v };
          refreshTile(def.key);
          refreshSubmit();
          setStatus('');
          renderBody();
        };
        const updateLinkCheck = () => {
          if (!linkCheck) return;
          const v = linkInput.value.trim();
          if (!v) {
            linkCheck.classList.remove('is-valid', 'is-invalid');
            linkCheck.textContent = '';
            return;
          }
          if (/^https?:\/\/[^\s]+\.[^\s]+/i.test(v)) {
            linkCheck.classList.add('is-valid');
            linkCheck.classList.remove('is-invalid');
            linkCheck.textContent = '✓';
          } else {
            linkCheck.classList.add('is-invalid');
            linkCheck.classList.remove('is-valid');
            linkCheck.textContent = '✗';
          }
        };
        linkInput.addEventListener('input', updateLinkCheck);
        updateLinkCheck();
        linkInput.addEventListener('blur', commitLink);
        linkInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            commitLink();
          }
        });
      }

      function handleFileForSlot(def, file) {
        if (!isAcceptedForSlot(def.key, file)) {
          setStatus(`That file type is not accepted for ${def.label}. Allowed: ${def.exts}.`, true);
          return;
        }
        if (file.size > PORTFOLIO_MAX_FILE) {
          setStatus('File too large (100MB max).', true);
          return;
        }
        pendingFiles[def.key] = file;
        // Use a local object URL for preview until upload at submit time
        const objUrl = URL.createObjectURL(file);
        const ct = file.type || (isStlFile(file) ? 'model/stl' : 'application/octet-stream');
        state[def.key] = {
          mode: 'file',
          url: objUrl,
          fileName: file.name,
          contentType: ct,
          _localPreview: true
        };
        refreshTile(def.key);
        refreshSubmit();
        setStatus('');
        renderBody();
        // Soft warning for files >50MB (still under the 100MB hard cap).
        if (file.size > 50 * 1024 * 1024) {
          const inner = bodyInner;
          const existing = inner.querySelector('.pf-soft-warn');
          if (existing) existing.remove();
          const warn = document.createElement('div');
          warn.className = 'pf-soft-warn';
          warn.textContent = 'Files over 50MB are accepted but may slow down the class. Consider linking instead.';
          inner.appendChild(warn);
        }
      }

      function openSlot(key) {
        // Already open? Do nothing — protect the in-progress textarea / link input.
        if (openSlotKey === key && slot.classList.contains('is-open')) return;
        if (openSlotKey && openSlotKey !== key) {
          const prev = slotsEl.querySelector(`.pf-slot[data-slot="${openSlotKey}"]`);
          if (prev) prev.classList.remove('is-open');
        }
        slot.classList.add('is-open');
        openSlotKey = key;
        renderBody();
      }
      function closeOpenSlot() {
        slot.classList.remove('is-open');
        if (openSlotKey === def.key) openSlotKey = null;
      }

      // Expose for outside helpers
      slot._openSlot = openSlot;
      slot._renderBody = renderBody;
    });

    function refreshTile(key) {
      const slot = slotsEl.querySelector(`.pf-slot[data-slot="${key}"]`);
      if (!slot) return;
      const filled = state[key];
      const tile = slot.querySelector('[data-pf-tile]');
      const iconEl = tile.querySelector('.pf-slot-icon');
      const labelEl = tile.querySelector('.pf-slot-label');
      const statusEl = tile.querySelector('.pf-slot-status');
      const def = SLOT_DEFS.find(d => d.key === key);

      if (filled) {
        slot.classList.add('is-filled');
        if (filled.mode === 'text') {
          const wordCount = filled.text.trim().split(/\s+/).filter(Boolean).length;
          statusEl.textContent = wordCount === 1 ? '1 word written' : `${wordCount} words written`;
          iconEl.textContent = def.icon;
        } else if (filled.mode === 'link') {
          statusEl.textContent = `Link · ${getDomain(filled.url) || 'external'}`;
          iconEl.textContent = def.icon;
        } else {
          // File: show filename truncated, swap icon for a tiny thumb if image/video
          statusEl.textContent = filled.fileName || 'File';
          if ((filled.contentType || '').startsWith('image/')) {
            iconEl.innerHTML = `<div class="pf-slot-thumb"><img src="${filled.url}" alt="" /></div>`;
          } else if ((filled.contentType || '').startsWith('video/')) {
            iconEl.innerHTML = `<div class="pf-slot-thumb"><video src="${filled.url}" muted></video></div>`;
          } else {
            iconEl.textContent = def.icon;
          }
        }
        labelEl.textContent = def.label;
      } else {
        slot.classList.remove('is-filled');
        iconEl.textContent = def.icon;
        statusEl.textContent = '+ Add';
        labelEl.textContent = def.label;
      }
    }

    function clearSlot(key) {
      const filled = state[key];
      if (filled?._localPreview && filled.url) {
        try { URL.revokeObjectURL(filled.url); } catch (_) {}
      }
      delete pendingFiles[key];
      state[key] = null;
      refreshTile(key);
      refreshSubmit();
    }

    function refreshSubmit() {
      const name = nameInput.value.trim();
      const anyFilled = Object.values(state).some(v => v !== null);
      submitBtn.disabled = !(name && anyFilled);
    }
    // Compat shim doesn't expose addEventListener; the picker's onChange does
    // the equivalent. We rebind to also refresh submit on name change.
    {
      const origOnChange = picker.element.querySelector('[data-name-select]');
      if (origOnChange) origOnChange.addEventListener('change', refreshSubmit);
      const addBtn = picker.element.querySelector('[data-name-add-btn]');
      if (addBtn) addBtn.addEventListener('click', () => setTimeout(refreshSubmit, 0));
    }

    let statusTimeout = null;
    function setStatus(msg, isErr) {
      if (statusTimeout) { clearTimeout(statusTimeout); statusTimeout = null; }
      statusEl.textContent = msg;
      statusEl.classList.toggle('is-error', !!isErr);
      // Auto-clear errors after 4s so they don't linger on the panel.
      if (isErr && msg) {
        statusTimeout = setTimeout(() => {
          statusEl.textContent = '';
          statusEl.classList.remove('is-error');
        }, 4000);
      }
    }

    let _isSubmitting = false;
    async function doSubmit() {
      if (_isSubmitting) return; // hard double-submit guard
      const name = nameInput.value.trim();
      if (!name) { setStatus('Please enter your name.', true); return; }
      const anyFilled = Object.values(state).some(v => v !== null);
      if (!anyFilled) { setStatus('Add at least one slot before submitting.', true); return; }
      _isSubmitting = true;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting…';
      setStatus('Submitting…');
      localStorage.setItem(LAST_PICK_KEY, name);

      // Track per-slot upload outcome so a single failure doesn't wipe the
      // student's other filled slots. Failed slots stay in state with a
      // _retryable flag so they can be re-tried.
      const failedSlots = [];

      try {
        const finalSlots = { image: null, video: null, code: null, cad: null, summary: null };
        const uploadedPaths = []; // track for rollback if doc-write fails

        for (const def of SLOT_DEFS) {
          const cur = state[def.key];
          if (!cur) continue;
          if (cur.mode === 'text') {
            finalSlots[def.key] = { mode: 'text', text: cur.text };
            continue;
          }
          if (cur.mode === 'link') {
            finalSlots[def.key] = { mode: 'link', url: cur.url };
            continue;
          }
          // File: upload
          const file = pendingFiles[def.key];
          if (!file) {
            // Already uploaded? (shouldn't happen in this flow, but guard)
            finalSlots[def.key] = {
              mode: 'file', url: cur.url, fileName: cur.fileName, contentType: cur.contentType
            };
            continue;
          }
          setStatus(`Uploading ${def.label}…`);
          try {
            const ext = (file.name.match(/\.[a-z0-9]+$/i) || [''])[0];
            const path = `portfolios/${benchmarkId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${def.key}${ext}`;
            const ref = storageRef(storage, path);
            const ct = file.type || (isStlFile(file) ? 'model/stl' : 'application/octet-stream');
            const task = uploadBytesResumable(ref, file, { contentType: ct });
            await new Promise((resolve, reject) => {
              task.on('state_changed',
                (snap) => {
                  const pct = Math.round(snap.bytesTransferred / snap.totalBytes * 100);
                  setStatus(`Uploading ${def.label}… ${pct}%`);
                },
                reject,
                resolve
              );
            });
            const url = await getDownloadURL(task.snapshot.ref);
            uploadedPaths.push(path);
            finalSlots[def.key] = {
              mode: 'file',
              url,
              fileName: file.name,
              contentType: ct,
              filePath: path
            };
          } catch (perSlotErr) {
            console.error(`upload failed for ${def.key}`, perSlotErr);
            failedSlots.push(def);
            // Leave state[def.key] intact so the student can retry without
            // re-attaching the file.
          }
        }

        const anySucceeded = Object.values(finalSlots).some(v => v !== null);
        if (failedSlots.length && !anySucceeded) {
          // Total failure — surface a retry prompt and bail without writing.
          throw new Error(
            `Upload failed for ${failedSlots.map(d => d.label).join(', ')}. Check your wifi and try again.`
          );
        }

        await addDoc(collection(db, 'portfolios'), {
          benchmarkId,
          studentName: name,
          createdAt: serverTimestamp(),
          slots: finalSlots
        });

        // Reset state ONLY for slots that successfully uploaded. Keep failed
        // slots in state so the student can retry them.
        for (const def of SLOT_DEFS) {
          if (failedSlots.find(f => f.key === def.key)) continue; // preserve
          const cur = state[def.key];
          if (cur?._localPreview && cur.url) {
            try { URL.revokeObjectURL(cur.url); } catch (_) {}
          }
          state[def.key] = null;
          delete pendingFiles[def.key];
          refreshTile(def.key);
        }
        if (openSlotKey && !failedSlots.find(f => f.key === openSlotKey)) {
          const prev = slotsEl.querySelector(`.pf-slot[data-slot="${openSlotKey}"]`);
          if (prev) prev.classList.remove('is-open');
          openSlotKey = null;
        }

        // Refresh the count badge for this benchmark in case the snapshot
        // hasn't propagated yet (it usually has, but this is belt-and-braces).
        refreshCountBadge(benchmarkId);
        if (!failedSlots.length) markChecked(benchmarkId);

        // Success pulse: green flash on the button, status briefly, then clear.
        submitBtn.textContent = failedSlots.length ? 'Submit failed slots' : '✓ Submitted!';
        if (!failedSlots.length) submitBtn.classList.add('is-success');
        if (failedSlots.length) {
          setStatus(`Saved ${SLOT_DEFS.length - failedSlots.length} slot(s). ${failedSlots.map(d => d.label).join(', ')} failed — retry?`, true);
        } else {
          setStatus('Your portfolio is in the gallery below.');
        }
        setTimeout(() => {
          submitBtn.classList.remove('is-success');
          submitBtn.textContent = 'Submit Portfolio';
          if (!failedSlots.length) setStatus('');
          _isSubmitting = false;
          refreshSubmit();
        }, 1800);
      } catch (err) {
        console.error('portfolio submit failed', err);
        submitBtn.textContent = 'Submit Portfolio';
        const msg = err?.code === 'unavailable' || /network|offline/i.test(err?.message || '')
          ? 'Connection failed. Check wifi and retry.'
          : (err.message || 'Submit failed. Try again.');
        setStatus(msg, true);
        submitBtn.disabled = false;
        _isSubmitting = false;
      }
    }
    submitBtn.addEventListener('click', doSubmit);
    // Prevent stray Enter-key resubmits from inside the panel.
    panel.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      if (e.target.tagName === 'TEXTAREA') return; // newline allowed in summary
      if (e.target === submitBtn) {
        e.preventDefault();
        doSubmit();
      }
    });

    // Consume any pending artifact handed off by a Tool's "+ Save to..." flow.
    // Drops the Blob into the right slot (wiring/code), opens Summary, scrolls.
    if (window._pendingArtifact &&
        window._pendingArtifact.panelType === 'portfolio' &&
        window._pendingArtifact.benchmarkId === benchmarkId) {
      const pa = window._pendingArtifact;
      window._pendingArtifact = null;
      const slotKey = pa.slotKey; // 'wiring' or 'code'
      // Build a synthetic File from the Blob and seed slot state.
      const synthFile = new File([pa.blob], pa.fileName, { type: pa.contentType });
      pendingFiles[slotKey] = synthFile;
      const objUrl = URL.createObjectURL(synthFile);
      state[slotKey] = {
        mode: 'file',
        url: objUrl,
        fileName: pa.fileName,
        contentType: pa.contentType,
        _localPreview: true
      };
      // Defer DOM-touching work until after this builder returns and the panel
      // is mounted. refreshTile / openSlot / scrollIntoView all rely on it
      // being attached.
      setTimeout(() => {
        refreshTile(slotKey);
        refreshSubmit();
        // Refresh the source slot's body too if it's open (rare, but safe).
        const srcSlot = slotsEl.querySelector(`.pf-slot[data-slot="${slotKey}"]`);
        if (srcSlot && srcSlot._renderBody && srcSlot.classList.contains('is-open')) {
          srcSlot._renderBody();
        }
        // Open Summary slot for editing.
        const summarySlot = slotsEl.querySelector('.pf-slot[data-slot="summary"]');
        if (summarySlot && summarySlot._openSlot) {
          summarySlot._openSlot('summary');
          // Scroll the Summary slot into view inside the modal.
          summarySlot.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        const verb = pa.kind === 'vibe' ? 'Code' : pa.kind === 'idea-board' ? 'Sketch' : 'Wiring';
        schemToast(`${verb} loaded. Write your summary and hit Submit.`, 3200);
      }, 60);
    }

    refreshSubmit();
    return panel;
  }

  // ----- Checkpoint panel (benchmarks 1-4): name picker + photos/PDF + reflection -----
  // Now writes drafts to Firestore continuously so a student can leave and come
  // back later (any device) and find their stuff. Files upload to Storage at a
  // draft path immediately on add; on Submit, the draft is promoted to a doc
  // in the `portfolios` collection and cleared.
  function buildCheckpointPanel(benchmarkId) {
    const panel = document.createElement('div');
    panel.className = 'portfolio-panel checkpoint-panel';
    panel.innerHTML = `
      <div data-cp-namepicker></div>
      <div class="cp-section">
        <div class="cp-section-label">Evidence</div>
        <div class="pf-drop" data-cp-drop>
          <div class="pf-drop-text">Tap to add photos, a code PDF, or a wiring image</div>
          <div class="pf-drop-sub">JPG, PNG, PDF · up to 100MB each</div>
          <input type="file" data-cp-file accept="image/jpeg,image/png,application/pdf" multiple style="display:none;" />
        </div>
        <div class="cp-preview" data-cp-preview hidden></div>
      </div>
      <div class="cp-section">
        <div class="cp-section-label">Reflection</div>
        <textarea class="cp-reflection" data-cp-text rows="6" maxlength="1500"
          placeholder="1. Summarize what you made.&#10;2. Describe any problems you ran into and how you worked through them.&#10;3. List at least three new things you learned."></textarea>
      </div>
      <div class="pf-actions">
        <span class="pf-saved-pill" data-cp-saved>Saved</span>
        <div class="pf-status" data-cp-status></div>
        <button class="pf-submit" data-cp-submit type="button" disabled>Submit</button>
      </div>
    `;

    const drop = panel.querySelector('[data-cp-drop]');
    const fileInput = panel.querySelector('[data-cp-file]');
    const preview = panel.querySelector('[data-cp-preview]');
    const textarea = panel.querySelector('[data-cp-text]');
    const submitBtn = panel.querySelector('[data-cp-submit]');
    const statusEl = panel.querySelector('[data-cp-status]');
    const savedPill = panel.querySelector('[data-cp-saved]');

    // Entry shape: { url, fileName, kind, contentType, filePath, status, _localObjUrl }
    let pendingFiles = [];
    let _hydrating = false;

    const namePickerMount = panel.querySelector('[data-cp-namepicker]');
    const picker = renderNamePicker({
      initial: localStorage.getItem(LAST_PICK_KEY) || '',
      onChange: (newName) => {
        if (!newName) return;
        ensureRosterEntry(newName);
        hydrateFromDraft(newName);
        flushPendingArtifactIfQueued();
      }
    });
    namePickerMount.appendChild(picker.element);

    function getCurrentName() { return picker.getName(); }

    function showSaved(text = 'Saved', state = 'saved') {
      savedPill.textContent = text;
      savedPill.classList.toggle('is-saving', state === 'saving');
      savedPill.classList.add('is-visible');
      if (state === 'saved') {
        clearTimeout(savedPill._t);
        savedPill._t = setTimeout(() => savedPill.classList.remove('is-visible'), 1800);
      }
    }
    function setStatus(msg, isError) {
      statusEl.textContent = msg || '';
      statusEl.classList.toggle('is-error', !!isError);
    }
    function refreshSubmit() {
      const ok = !!(
        getCurrentName() &&
        pendingFiles.length &&
        pendingFiles.every(p => p.status === 'uploaded') &&
        textarea.value.trim()
      );
      submitBtn.disabled = !ok;
    }
    function renderPreviews() {
      preview.innerHTML = pendingFiles.map((p, i) => {
        const thumb = p.kind === 'pdf'
          ? `<div class="cp-preview-pdf" aria-hidden="true">PDF</div>`
          : `<img src="${p.url}" alt="" />`;
        const overlay = p.status === 'uploading'
          ? `<div class="cp-preview-uploading">Uploading…</div>`
          : (p.status === 'failed' ? `<div class="cp-preview-failed">Failed</div>` : '');
        return `
          <div class="cp-preview-item" data-status="${p.status}">
            ${thumb}
            <div class="cp-preview-meta">
              <div class="cp-preview-name">${escapeHtml(p.fileName)}</div>
              <button type="button" class="cp-preview-remove" data-cp-remove="${i}" aria-label="Remove">×</button>
            </div>
            ${overlay}
          </div>
        `;
      }).join('');
      preview.querySelectorAll('[data-cp-remove]').forEach(b => {
        b.addEventListener('click', () => removeOne(parseInt(b.getAttribute('data-cp-remove'), 10)));
      });
      preview.hidden = pendingFiles.length === 0;
      refreshSubmit();
    }

    function persistDraftFiles() {
      const name = getCurrentName();
      if (!name || _hydrating) return;
      const files = pendingFiles
        .filter(p => p.status === 'uploaded')
        .map(p => ({
          url: p.url,
          fileName: p.fileName,
          kind: p.kind,
          contentType: p.contentType,
          filePath: p.filePath
        }));
      showSaved('Saving…', 'saving');
      saveDraft(name, benchmarkId, { files }).then(() => showSaved('Saved'));
    }
    const persistDraftReflection = debounce(() => {
      const name = getCurrentName();
      if (!name || _hydrating) return;
      showSaved('Saving…', 'saving');
      saveDraft(name, benchmarkId, { reflection: textarea.value }).then(() => showSaved('Saved'));
    }, 600);

    async function uploadOne(file, kind, entry) {
      const ext = (file.name.match(/\.[a-z0-9]+$/i) || [''])[0];
      const name = getCurrentName();
      const slug = nameSlug(name);
      const path = `drafts/${slug}__${benchmarkId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${kind}${ext}`;
      const ref = storageRef(storage, path);
      const ct = file.type || (kind === 'pdf' ? 'application/pdf' : 'image/jpeg');
      const task = uploadBytesResumable(ref, file, { contentType: ct });
      await new Promise((resolve, reject) => {
        task.on('state_changed', null, reject, resolve);
      });
      const url = await getDownloadURL(task.snapshot.ref);
      return { url, fileName: file.name, kind, contentType: ct, filePath: path };
    }
    function handleFiles(files) {
      const name = getCurrentName();
      if (!name) {
        setStatus('Pick your name first.', true);
        return;
      }
      const arr = Array.from(files || []);
      for (const f of arr) {
        const ct = (f.type || '').toLowerCase();
        const isImage = ct === 'image/jpeg' || ct === 'image/png';
        const isPdf = ct === 'application/pdf';
        if (!isImage && !isPdf) continue;
        if (f.size > PORTFOLIO_MAX_FILE) continue;
        const kind = isPdf ? 'pdf' : 'image';
        const entry = {
          url: URL.createObjectURL(f),
          fileName: f.name,
          kind,
          contentType: f.type,
          filePath: '',
          status: 'uploading',
          _localObjUrl: true
        };
        pendingFiles.push(entry);
        renderPreviews();
        uploadOne(f, kind, entry).then(remote => {
          try { URL.revokeObjectURL(entry.url); } catch (_) {}
          Object.assign(entry, remote, { status: 'uploaded', _localObjUrl: false });
          renderPreviews();
          persistDraftFiles();
        }).catch(err => {
          console.error('upload failed', err);
          entry.status = 'failed';
          renderPreviews();
          setStatus('Upload failed. Remove and retry.', true);
        });
      }
    }

    function removeOne(idx) {
      const p = pendingFiles[idx];
      if (!p) return;
      if (p._localObjUrl) {
        try { URL.revokeObjectURL(p.url); } catch (_) {}
      }
      if (p.filePath) {
        try { deleteObject(storageRef(storage, p.filePath)); } catch (_) {}
      }
      pendingFiles.splice(idx, 1);
      renderPreviews();
      persistDraftFiles();
    }

    async function hydrateFromDraft(name) {
      _hydrating = true;
      pendingFiles.forEach(p => { if (p._localObjUrl) { try { URL.revokeObjectURL(p.url); } catch (_) {} } });
      pendingFiles = [];
      textarea.value = '';
      renderPreviews();
      setStatus('Loading your saved work…');
      const draft = await loadDraft(name, benchmarkId);
      if (draft) {
        if (Array.isArray(draft.files)) {
          for (const f of draft.files) {
            pendingFiles.push({
              url: f.url,
              fileName: f.fileName,
              kind: f.kind,
              contentType: f.contentType,
              filePath: f.filePath,
