  function vibeGetEditorText() {
    if (_vibeEditor) return _vibeEditor.getValue();
    const fb = document.getElementById('vibeEditorFallback');
    return fb ? fb.value : '';
  }
  function vibeSetEditorText(txt) {
    if (_vibeEditor) {
      _vibeEditor.setValue(txt);
    } else {
      const fb = document.getElementById('vibeEditorFallback');
      if (fb) fb.value = txt;
    }
  }

  // ----- Composer helpers -----
  function vibeAutoGrow(el) {
    if (!el) return;
    // In the empty state the composer fills the panel via flex, so don't pin
    // an inline height (that would shrink the big writing box as you type).
    if (!el.closest('.vibe-left.is-empty')) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 220) + 'px';
    } else {
      el.style.height = '';
    }
    vibeSyncMirror(el);
  }
  // Repaint the visible mirror layer to match the (transparent) textarea,
  // wrapping any <FILL-IN> token in a blue chip so students see exactly what
  // to replace. Keeps the mirror scrolled in lock-step with the textarea.
  function vibeSyncMirror(el) {
    const mirror = document.getElementById('vibeInputMirror');
    if (!mirror || !el) return;
    const raw = el.value || '';
    // Escape first, then highlight <...> tokens on the escaped string.
    const safe = raw
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    const html = safe.replace(/&lt;[^&]*?&gt;/g, m => `<span class="vibe-fillin">${m}</span>`);
    // Trailing newline needs a spacer so the mirror's last line has height.
    mirror.innerHTML = html + (raw.endsWith('\n') ? '\n&#8203;' : '');
    mirror.scrollTop = el.scrollTop;
  }
  function vibeUpdateSendEnabled() {
    const inp = document.getElementById('vibeInput');
    const btn = document.getElementById('vibeSend');
    if (!inp || !btn) return;
    btn.disabled = _vibeBusy || !inp.value.trim();
  }

  // ----- Suggested prompts (empty-state chips) -----
  // ----- Tiny Markdown renderer for assistant replies -----
  // Handles paragraphs, **bold**, `inline code`, simple bullet lists, and
  // ```fenced code blocks``` (rendered with a Load/Copy action bar). Returns a
  // DocumentFragment so we never inject raw HTML strings from the model.
  function vibeRenderMarkdown(text) {
    const frag = document.createDocumentFragment();
    const src = String(text || '');
    // Split on fenced code blocks first.
    const parts = src.split(/(```[\s\S]*?```)/g);
    parts.forEach(part => {
      if (!part) return;
      const fence = part.match(/^```(?:arduino|cpp|c\+\+|c|ino)?\s*\n?([\s\S]*?)```$/i);
      if (fence) {
        const code = (fence[1] || '').replace(/\n$/, '');
        frag.appendChild(vibeBuildCodeBlock(code));
      } else {
        vibeRenderProse(part, frag);
      }
    });
    return frag;
  }

  function vibeRenderProse(text, frag) {
    const lines = String(text).replace(/^\n+|\n+$/g, '').split('\n');
    let listEl = null;
    const flushList = () => { if (listEl) { frag.appendChild(listEl); listEl = null; } };
    let paraBuf = [];
    const flushPara = () => {
      if (!paraBuf.length) return;
      const p = document.createElement('p');
      vibeInlineMd(paraBuf.join(' '), p);
      frag.appendChild(p);
      paraBuf = [];
    };
    lines.forEach(line => {
      const bullet = line.match(/^\s*[-*]\s+(.*)$/);
      if (bullet) {
        flushPara();
        if (!listEl) listEl = document.createElement('ul');
        const li = document.createElement('li');
        vibeInlineMd(bullet[1], li);
        listEl.appendChild(li);
      } else if (!line.trim()) {
        flushPara(); flushList();
      } else {
        flushList();
        paraBuf.push(line.trim());
      }
    });
    flushPara(); flushList();
  }

  // Inline markdown: **bold** and `code`. Escapes everything else as text.
  function vibeInlineMd(text, parent) {
    const tokens = String(text).split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
    tokens.forEach(tok => {
      if (!tok) return;
      if (/^\*\*[^*]+\*\*$/.test(tok)) {
        const s = document.createElement('strong');
        s.textContent = tok.slice(2, -2);
        parent.appendChild(s);
      } else if (/^`[^`]+`$/.test(tok)) {
        const c = document.createElement('code');
        c.textContent = tok.slice(1, -1);
        parent.appendChild(c);
      } else {
        parent.appendChild(document.createTextNode(tok));
      }
    });
  }

  // The assistant's code goes straight into the editor, so the chat never
  // shows a duplicate black code box. Where a fenced block would have been we
  // render a compact confirmation chip — the student keeps reading the wiring
  // and loading instructions, with quiet Reload / Copy fallbacks.
  function vibeBuildCodeBlock(code) {
    const chip = document.createElement('div');
    chip.className = 'vibe-codeloaded';

    const icon = document.createElement('span');
    icon.className = 'vibe-codeloaded-icon';
    icon.textContent = '✓';

    const text = document.createElement('span');
    text.className = 'vibe-codeloaded-text';
    text.textContent = 'Code loaded into your editor';

    const actions = document.createElement('div');
    actions.className = 'vibe-codeloaded-actions';

    const loadBtn = document.createElement('button');
    loadBtn.className = 'vibe-codeloaded-btn';
    loadBtn.textContent = 'Reload';
    loadBtn.title = 'Replace the editor with this version';
    loadBtn.addEventListener('click', () => {
      vibeSetEditorText(code);
      vibeSaveEditorText(code);
      vibeUpdateLibraries();
      loadBtn.textContent = 'Reloaded';
      loadBtn.classList.add('is-done');
      schemToast('Code loaded into the editor.');
      setTimeout(() => { loadBtn.textContent = 'Reload'; loadBtn.classList.remove('is-done'); }, 1600);
      if (_vibeAwaitingFix) {
        _vibeAwaitingFix = false;
        if (typeof vibeVerifyCode === 'function') setTimeout(() => vibeVerifyCode(true), 200);
      }
    });

    const copyBtn = document.createElement('button');
    copyBtn.className = 'vibe-codeloaded-btn';
    copyBtn.textContent = 'Copy';
    copyBtn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(code); copyBtn.textContent = 'Copied'; copyBtn.classList.add('is-done'); }
      catch (_) { copyBtn.textContent = 'Copy failed'; }
      setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.classList.remove('is-done'); }, 1500);
    });

    actions.appendChild(loadBtn);
    actions.appendChild(copyBtn);
    chip.appendChild(icon);
    chip.appendChild(text);
    chip.appendChild(actions);
    return chip;
  }

  function vibeRenderChat() {
    const scroll = document.getElementById('vibeChatScroll');
    if (!scroll) return;
    const wasNearBottom = (scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight) < 80 || scroll.scrollHeight <= scroll.clientHeight;
    const clearBtn = document.getElementById('vibeChatClear');
    if (clearBtn) clearBtn.style.display = _vibeChat.length ? '' : 'none';
    const isEmpty = !_vibeChat.length && !_vibeBusy;
    // When there's no conversation yet, collapse the empty chat area and let
    // the composer grow to fill the panel (a big writing box, no dead space).
    const leftPane = scroll.closest('.vibe-left');
    if (leftPane) leftPane.classList.toggle('is-empty', isEmpty);
    if (isEmpty) {
      scroll.innerHTML = '';
      return;
    }
    scroll.innerHTML = '';
    const _row = (avatarKind, msgClass) => {
      const row = document.createElement('div');
      row.className = `vibe-msg-row is-${avatarKind}`;
      const av = document.createElement('div');
      av.className = `vibe-msg-avatar is-${avatarKind}`;
      av.textContent = avatarKind === 'user' ? 'You' : 'AI';
      const msg = document.createElement('div');
      msg.className = `vibe-msg ${msgClass}`;
      row.appendChild(av);
      row.appendChild(msg);
      return { row, msg };
    };

    _vibeChat.forEach((msg) => {
      if (msg.role === 'user') {
        const { row, msg: el } = _row('user', 'vibe-msg-user');
        el.textContent = msg.content;
        scroll.appendChild(row);
      } else if (msg.role === 'assistant') {
        const { row, msg: el } = _row('ai', 'vibe-msg-ai');
        const md = document.createElement('div');
        md.className = 'vibe-md';
        md.appendChild(vibeRenderMarkdown(msg.content));
        el.appendChild(md);
        scroll.appendChild(row);
      } else if (msg.role === 'error') {
        const { row, msg: el } = _row('ai', 'vibe-msg-error');
        el.textContent = msg.content;
        scroll.appendChild(row);
      }
    });
    if (_vibeBusy) {
      const { row, msg: el } = _row('ai', 'vibe-msg-loading');
      el.textContent = 'Writing your code…';
      row.classList.add('is-loading');
      scroll.appendChild(row);
    }
    // Only auto-scroll when the student was already near the bottom, so
    // re-reading earlier wiring instructions isn't undone by a re-render.
    if (wasNearBottom) scroll.scrollTop = scroll.scrollHeight;
  }

  // ----- Prompt templates -----
  // Plain-text scaffolds that drop into the textarea with the placeholder
  // pre-selected so the student types right over it. No HTML span tricks.
  const VIBE_STEMS = [
    {
      label: 'Build',
      primary: true,
      text: "Build Arduino code for my adaptive controller that does this: <DESCRIBE THE BEHAVIOR>. Explain how to wire it and which pins to use.",
      placeholder: '<DESCRIBE THE BEHAVIOR>'
    },
    {
      label: 'Debug',
      text: "My code isn't working right. Here's what's happening: <DESCRIBE WHAT'S WRONG>. The code is in my editor. Find the bug and fix it.",
      placeholder: "<DESCRIBE WHAT'S WRONG>"
    }
  ];

  function vibeRenderStems() {
    const wrap = document.getElementById('vibeStems');
    if (!wrap) return;
    wrap.innerHTML = '';
    VIBE_STEMS.forEach(stem => {
      const btn = document.createElement('button');
      btn.className = 'vibe-stem' + (stem.primary ? ' vibe-stem--primary' : '');
      btn.type = 'button';
      btn.innerHTML = `<span class="vibe-stem-icon">${ICON_SPARKLE}</span><span>${stem.label}</span>`;
      btn.title = stem.text.length > 80 ? stem.text.slice(0, 77) + '...' : stem.text;
      btn.addEventListener('click', () => vibeApplyStem(stem));
      wrap.appendChild(btn);
    });
  }

  function vibeApplyStem(stem) {
    const inp = document.getElementById('vibeInput');
    if (!inp) return;
    // Drop the scaffold into the textarea as plain text. If it has a
    // <PLACEHOLDER> token, select exactly that span so the student types
    // right over it; otherwise put the cursor at the end.
    const placeholder = stem.placeholder || '';
    const text = stem.text || '';
    inp.value = text;
    vibeAutoGrow(inp);
    vibeUpdateSendEnabled();
    inp.focus();
    const idx = placeholder ? text.indexOf(placeholder) : -1;
    if (idx >= 0) {
      inp.setSelectionRange(idx, idx + placeholder.length);
    } else {
      inp.setSelectionRange(text.length, text.length);
    }
  }

  // ----- Libraries strip + status bar -----
  const VIBE_QUICK_LIBS = ['Keyboard.h', 'Mouse.h', 'Joystick.h', 'Servo.h'];

  function vibeDetectIncludes() {
    const txt = vibeGetEditorText();
    const found = [];
    const re = /^\s*#\s*include\s*[<"]([^>"]+)[>"]/gm;
    let m;
    while ((m = re.exec(txt)) !== null) {
      const lib = m[1].trim();
      if (lib && !found.includes(lib)) found.push(lib);
    }
    return found;
  }

  function vibeUpdateLibraries() {
    const active = document.getElementById('vibeLibsActive');
    if (!active) return;
    const includes = vibeDetectIncludes();
    active.innerHTML = '';
    if (!includes.length) {
      const empty = document.createElement('span');
      empty.className = 'vibe-libs-chip is-empty';
      empty.textContent = 'no libraries included';
      active.appendChild(empty);
    } else {
      includes.forEach(lib => {
        const chip = document.createElement('span');
        chip.className = 'vibe-libs-chip';
        chip.textContent = `<${lib}>`;
        active.appendChild(chip);
      });
    }
    document.querySelectorAll('.vibe-libs-add button').forEach(btn => {
      btn.disabled = includes.includes(btn.dataset.lib);
    });
  }

  function vibeAddLibrary(lib) {
    const txt = vibeGetEditorText();
    if (new RegExp(`#\\s*include\\s*[<"]${lib.replace(/\./g, '\\.')}[>"]`).test(txt)) return;
    const inc = `#include <${lib}>\n`;
    // Insert after any existing #include block, otherwise at the very top.
    const lines = txt.split('\n');
    let lastInclude = -1;
    for (let i = 0; i < lines.length; i++) {
      if (/^\s*#\s*include/.test(lines[i])) lastInclude = i;
    }
    if (lastInclude >= 0) {
      lines.splice(lastInclude + 1, 0, `#include <${lib}>`);
    } else {
      lines.unshift(`#include <${lib}>`);
    }
    const next = lines.join('\n');
    vibeSetEditorText(next);
    vibeSaveEditorText(next);
    vibeUpdateLibraries();
  }

  function vibeSetStatus(state, label) {
    const bar = document.getElementById('vibeStatus');
    if (!bar) return;
    bar.classList.toggle('is-connected', state === 'connected');
    bar.querySelector('.vibe-status-text').textContent = label;
  }

  function vibeSend() {
    if (_vibeBusy) return;
    const inputEl = document.getElementById('vibeInput');
    const txt = (inputEl.value || '').trim();
    if (!txt) return;

    _vibeChat.push({ role: 'user', content: txt });
    vibeSaveChat();
    inputEl.value = '';
    vibeAutoGrow(inputEl);
    _vibeBusy = true;
    vibeUpdateSendEnabled();
    vibeRenderChat();

    // Give the model the student's current sketch as context (like an IDE
    // companion) so "debug / explain / clean up my code" works — but only
    // when there's real code, and never show this context in the chat. The
    // sketch travels as its own field so the server can cap it without
    // rejecting the student's short message (the accumulated multi-behavior
    // sketch grows past a message-sized cap by later benchmarks).
    const editorCode = vibeGetEditorText();
    const editorIsDefault = !editorCode || !editorCode.trim() || editorCode.trim() === VIBE_DEFAULT_CODE.trim();
    const editorForApi = editorIsDefault ? '' : editorCode;

    // Short history (last few turns, excluding errors and the new message).
    const history = _vibeChat
      .filter(m => m.role === 'user' || m.role === 'assistant')
      .slice(-7, -1)
      .map(m => ({ role: m.role, content: m.content }));

    // Refocus the chat only if the student is still working in the chat
    // column — don't yank them out of the editor mid-keystroke.
    const chatHadFocus = () => {
      const active = document.activeElement;
      return !active || active === document.body || (active.closest && active.closest('.vibe-left'));
    };
    const finish = () => {
      _vibeBusy = false;
      vibeUpdateSendEnabled();
      const refocus = chatHadFocus();
      vibeRenderChat();
      const el = document.getElementById('vibeInput');
      if (el && refocus) el.focus();
    };

    // Abort a hung request after 75s so the composer never wedges shut on a
    // dropped connection (finish() is what re-enables Send).
    const aborter = new AbortController();
    const abortTimer = setTimeout(() => aborter.abort(), 75000);

    fetch('/api/vibe-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-D4SG-Client': 'd4sg-at-sa' },
      body: JSON.stringify({ message: txt, editorCode: editorForApi, history }),
      signal: aborter.signal
    }).then(async (r) => {
      clearTimeout(abortTimer);
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        const errMsg = data.error || ('Server error ' + r.status);
        // Surface the server's own message honestly — a rate limit or
        // too-long prompt is NOT a "try again" situation.
        if (r.status === 429) {
          _vibeChat.push({ role: 'error', content: errMsg + ' Verify and Upload still work while you wait.' });
        } else if (r.status === 400 || r.status === 403) {
          _vibeChat.push({ role: 'error', content: errMsg });
        } else {
          _vibeChat.push({ role: 'error', content: 'Something went wrong, try again. (' + errMsg + ')' });
        }
      } else {
        const reply = (data.reply || '').trim();
        // Prefer the structured code field; fall back to the first fenced
        // block inside the reply so we always have something to auto-load.
        let code = (data.code || '').trim();
        if (!code && reply) {
          const m = reply.match(/```(?:arduino|cpp|c\+\+|c|ino)?\s*\n?([\s\S]*?)```/i);
          if (m) code = (m[1] || '').replace(/\n$/, '').trim();
        }
        if (reply) {
          _vibeChat.push({ role: 'assistant', content: reply });
          // Vibe-coding flow: the code drops straight into the editor so the
          // chat stays clean — only the wiring + loading instructions live
          // there. Any fenced block in the reply renders as a small "loaded"
          // chip (see vibeBuildCodeBlock), not a duplicate black code box.
          if (code) {
            vibeSetEditorText(code);
            vibeSaveEditorText(code);
            vibeUpdateLibraries();
            if (_vibeAwaitingFix) {
              _vibeAwaitingFix = false;
              if (typeof vibeVerifyCode === 'function') setTimeout(() => vibeVerifyCode(true), 200);
            }
          }
        } else if (code) {
          _vibeChat.push({ role: 'assistant', content: '```cpp\n' + code + '\n```' });
        } else {
          _vibeChat.push({ role: 'error', content: 'The assistant did not return a response. Try rephrasing your request.' });
        }
      }
      vibeSaveChat();
      finish();
    }).catch((err) => {
      clearTimeout(abortTimer);
      const msg = (err && err.name === 'AbortError')
        ? 'The request took too long and was cancelled. Check your connection and try again.'
        : 'Something went wrong, try again. (' + (err.message || err) + ')';
      _vibeChat.push({ role: 'error', content: msg });
      vibeSaveChat();
      finish();
    });
  }


  // ============== Verify + Upload (Arduino IDE-style) ==============
  // Verify: POST sketch to /api/compile (Wokwi hexi proxy) — show stdout/stderr
  //   in the serial monitor, like Arduino IDE's bottom pane.
  // Upload: compile the same way, parse the resulting Intel HEX, then flash
  //   it to a connected Leonardo / Micro using AVR109 (Caterina bootloader)
  //   over Web Serial. The 1200-baud "knock" reboots the board into the
  //   bootloader, which appears as a NEW USB serial port; we wait for that
  //   port via the navigator.serial 'connect' event, open it, and stream
  //   pages of flash. After flashing we 'L' (leave) and 'E' (exit), the
  //   sketch port reappears, and we can reconnect the monitor.
  //
  //   Web Serial requires user permission once per port. First time a
  //   student uploads, the bootloader port may need a manual pick from the
  //   browser's port picker. Subsequent uploads find it via getPorts().

  // Arduino USB vendor ID (used for picker filters and getPorts matching).
  const ARDUINO_USB_VID = 0x2341;
  // Some students have clone / non-Arduino-branded 32u4 boards (SparkFun Pro
  // Micro, generic clones) that enumerate under a different USB vendor ID.
  // Match any of these for picker filters and port matching; if a board still
  // isn't seen, the flasher falls back to a filterless manual pick.
  const ARDUINO_USB_VIDS = new Set([
    0x2341, // Arduino
    0x2A03, // Arduino (.org)
    0x1B4F, // SparkFun (Pro Micro 32u4)
    0x16C0, // PJRC/Teensy + some 32u4 clones
    0x1A86, // QinHeng (CH34x) clones
    0x239A, // Adafruit (32u4 boards)
  ]);
  const isArduinoVid = (info) => !!(info && ARDUINO_USB_VIDS.has(info.usbVendorId));
  // Picker filters for requestPort — one entry per known vendor.
  const ARDUINO_PORT_FILTERS = Array.from(ARDUINO_USB_VIDS, (v) => ({ usbVendorId: v }));
  // Tracks whether the user had the monitor open before we started flashing,
  // so we can auto-reconnect after the upload finishes.
  let _vibeWasMonitoring = false;

  function vibeMonitorLine(text, kind) {
    const m = document.getElementById('vibeMonitor');
    if (!m) return;
    const empty = m.querySelector('.vibe-monitor-empty');
    if (empty) empty.remove();
    const line = document.createElement('div');
    line.style.whiteSpace = 'pre-wrap';
    if (kind === 'ok')   line.style.color = '#4ade80';
    if (kind === 'err')  line.style.color = '#f87171';
    if (kind === 'info') line.style.color = '#93c5fd';
    if (kind === 'dim')  line.style.color = '#94a3b8';
    line.textContent = text;
    m.appendChild(line);
    m.scrollTop = m.scrollHeight;
  }

  async function vibeCompileSketch(sketch) {
    const r = await fetch('/api/compile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-D4SG-Client': 'd4sg-at-sa' },
      body: JSON.stringify({ sketch, board: 'leonardo', student: (typeof vibeSlug === 'function' ? vibeSlug() : '') })
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      // Annotate the error so callers can tell a real compiler error (the
      // server returned stderr — the AI can fix it) apart from an infra
      // failure (server offline/waking, rate limit, network — the AI cannot
      // fix it and the student should NOT be funneled into the fix loop).
      const e = new Error(data.error || ('compile HTTP ' + r.status));
      e.httpStatus = r.status;
      e.stderr = (data.stderr || '').trimEnd();
      e.isInfra = !e.stderr;            // no compiler output => not the student's code
      e.isRateLimit = r.status === 429;
      throw e;
    }
    return data; // { hex, stdout, stderr, board }
  }

  async function vibeVerifyCode(fromAutoFix) {
    const sketch = vibeGetEditorText();
    if (!sketch || !sketch.trim()) {
      schemToast('Editor is empty. Click Build in the AI Assistant, or paste code, first.', 2400);
      return;
    }
    const btn = document.getElementById('vibeVerify');
    btn.disabled = true;
    btn.classList.add('is-active');
    vibeMonitorLine('[ Verifying… ]', 'info');
    let lastStderr = '';
    try {
      const data = await vibeCompileSketch(sketch);
      if (data.stdout) vibeMonitorLine(data.stdout.trimEnd(), 'dim');
      if (data.hex) {
        vibeMonitorLine('[ ✓ Compile succeeded ]', 'ok');
        _vibeFixAttempts = 0;   // clean compile resets the thrash counter
      } else {
        if (data.stderr) {
          lastStderr = data.stderr.trimEnd();
          vibeMonitorLine(lastStderr, 'err');
        }
        vibeMonitorLine('[ ✗ Verify failed ]', 'err');
        if (fromAutoFix) _vibeFixAttempts++;
        vibeOfferFixButton(lastStderr);
      }
    } catch (err) {
      if (err && err.stderr && !err.isInfra) {
        // Non-2xx, but the compiler still produced an error message — treat it
        // like a real compile error so the AI fix loop can act on it.
        lastStderr = err.stderr;
        vibeMonitorLine(lastStderr, 'err');
        vibeMonitorLine('[ ✗ Verify failed ]', 'err');
        if (fromAutoFix) _vibeFixAttempts++;
        vibeOfferFixButton(lastStderr);
      } else {
        // Infrastructure failure (server offline/waking, rate limit, network).
        // The AI can't fix this — do NOT offer the fix button, or the student
        // re-rolls forever chasing a ghost. Say plainly it isn't their code.
        vibeMonitorLine('[ ' + (err.message || String(err)) + ' ]', 'err');
        if (err && err.isRateLimit) {
          vibeMonitorLine("That's a daily compile limit, not a problem with your code. Try again later.", 'info');
        } else {
          vibeMonitorLine("The compile server is offline or waking up right now. This is NOT a problem with your code. Wait about a minute and click Verify again, or load an example from the Examples menu while you wait.", 'info');
        }
      }
    } finally {
      btn.disabled = false;
      btn.classList.remove('is-active');
    }
  }

  // When the compile errors out, drop two buttons into the monitor:
  // "Explain this error" (plain-English, learn-first) and "Ask AI to fix this"
  // (returns a corrected sketch). Explain comes first because understanding the
  // error beats blindly accepting a patch.
  function vibeOfferFixButton(stderr) {
    const monitor = document.getElementById('vibeMonitor');
    if (!monitor) return;
    // Remove any old buttons so only the most recent error has them.
    monitor.querySelectorAll('.vibe-monitor-fix-btn, .vibe-monitor-explain-btn').forEach(b => b.remove());

    // After two failed auto-fix rounds, the AI is clearly stuck — nudge the
    // student to slow down and actually understand the error via Explain.
    const stuck = _vibeFixAttempts >= 2;
    if (stuck) {
      vibeMonitorLine('[ The AI fix did not work twice in a row. Try "Explain this error" and fix it yourself. You can do this. ]', 'info');
    }

    const explainBtn = document.createElement('button');
    explainBtn.type = 'button';
    explainBtn.textContent = 'Explain this error';
    explainBtn.addEventListener('click', () => vibeAskAiToExplain(stderr));

    const fixBtn = document.createElement('button');
    fixBtn.type = 'button';
    fixBtn.textContent = 'Ask AI to fix this';
    fixBtn.addEventListener('click', () => vibeAskAiToFix(stderr));

    // The first (filled) slot is the recommended action; the second (outline)
    // slot is the alternative. Normally Fix leads; once the AI is stuck, Explain
    // leads so the student is steered toward understanding over re-rolling.
    const [primary, secondary] = stuck ? [explainBtn, fixBtn] : [fixBtn, explainBtn];
    primary.className = 'vibe-monitor-fix-btn';
    secondary.className = 'vibe-monitor-explain-btn';

    monitor.appendChild(document.createTextNode('\n'));
    monitor.appendChild(primary);
    monitor.appendChild(secondary);
    monitor.appendChild(document.createTextNode('\n'));
    if (_vibeMonitorAutoScroll) monitor.scrollTop = monitor.scrollHeight;
  }

  // Trim stderr to the most useful slice (last ~1500 chars; gcc summarizes at the bottom).
  function vibeErrTail(stderr) { return (stderr || '').slice(-1500).trim(); }

  function vibeAskAiToFix(stderr) {

    if (!inp) return;
    _vibeAwaitingFix = true;   // arm the auto-verify loop for the next code block loaded
    const prompt = 'My sketch in the editor does not compile. Please fix it and return the full corrected sketch in one ```cpp code block. Here is the compiler output:\n\n' + vibeErrTail(stderr);
    inp.value = prompt;
    if (typeof vibeAutoGrow === 'function') vibeAutoGrow(inp);
    if (typeof vibeUpdateSendEnabled === 'function') vibeUpdateSendEnabled();

  // Learn-first: ask the AI to explain the error in plain English WITHOUT
  // rewriting the code, so the student understands what went wrong and can fix
  // it themselves. Does not arm the auto-verify loop.
  function vibeAskAiToExplain(stderr) {
    const inp = document.getElementById('vibeInput');
    if (!inp) return;
    _vibeAwaitingFix = false;
    const prompt = 'My Arduino sketch did not compile. In plain English, explain what this error means, what most likely caused it in my code, and what to look for to fix it myself. Do NOT rewrite the whole sketch - just point me to the problem. Here is the compiler output:\n\n' + vibeErrTail(stderr);
    inp.value = prompt;
    if (typeof vibeAutoGrow === 'function') vibeAutoGrow(inp);
    if (typeof vibeUpdateSendEnabled === 'function') vibeUpdateSendEnabled();
    if (typeof vibeSyncMirror === 'function') vibeSyncMirror(inp);
    if (typeof vibeSend === 'function') vibeSend();
  }

  async function vibeUploadToArduino() {
    const sketch = vibeGetEditorText();
    if (!sketch || !sketch.trim()) {
      schemToast('Editor is empty. Click Build in the AI Assistant, or paste code, first.', 2400);
      return;
    }
    if (!('serial' in navigator)) {
      vibeMonitorLine('Web Serial not supported. Use Chrome or Edge on a desktop.', 'err');
      return;
    }
    const btn = document.getElementById('vibeUpload');
    btn.disabled = true;
    btn.classList.add('is-active');

    // 1. Compile.
    let hexText;
    vibeMonitorLine('[ Compiling… ]', 'info');
    try {
      const data = await vibeCompileSketch(sketch);
      if (data.stdout) vibeMonitorLine(data.stdout.trimEnd(), 'dim');
      if (!data.hex) {
        if (data.stderr) vibeMonitorLine(data.stderr.trimEnd(), 'err');
        vibeMonitorLine('[ ✗ Compile failed - fix errors above and try again ]', 'err');
        vibeOfferFixButton(data.stderr || '');
        return;
      }
      hexText = data.hex;
    } catch (err) {
      vibeMonitorLine('[ Compile error: ' + (err.message || err) + ' ]', 'err');
      if (err && err.isRateLimit) {
        vibeMonitorLine("That's a daily compile limit, not a problem with your code. Try again later.", 'info');
      } else if (!err || err.isInfra) {
        vibeMonitorLine("The compile server is offline or waking up right now. This is NOT a problem with your code. Wait about a minute and try again, or load an example from the Examples menu while you wait.", 'info');
      }
      return;
    } finally {
      // Compile failed or errored: ALWAYS re-enable Upload so the student can
      // fix their sketch and try again. (Success falls through to the flash
      // step, which manages the button in its own finally.)
      if (!hexText) {
        btn.disabled = false;
        btn.classList.remove('is-active');
      }
    }

    vibeMonitorLine('[ ✓ Compiled. Resetting board into bootloader… ]', 'info');

    // 2. Flash.
    try {
      _vibeWasMonitoring = !!_vibeSerialPort;
      const hexBytes = parseIntelHex(hexText);
      await vibeFlashHexToArduino(hexBytes);
      vibeMonitorLine('[ ✓ Upload complete ]', 'ok');
      // Reopen the serial monitor for sketch output.
      setTimeout(() => {
        if (_vibeWasMonitoring) {
          vibeReconnectSketchPort();
        } else {
          vibeMonitorLine('Click "Connect Arduino" above to watch Serial output.', 'dim');
        }
      }, 1500);
    } catch (err) {
      vibeMonitorLine('[ Upload error: ' + (err.message || err) + ' ]', 'err');
      vibeMonitorLine('Tip: unplug + replug the board and try again. Make sure no other program or browser tab has the port open.', 'dim');
    } finally {
      btn.disabled = false;
      btn.classList.remove('is-active');
    }
  }

  // ---- Intel HEX parser ----
  // Parses standard Intel HEX (the format Arduino .hex files use). Returns a
  // Uint8Array with bytes laid out at their flash addresses, padded with 0xFF.
  function parseIntelHex(hexText) {
    const lines = hexText.split(/\r?\n/);
    const recs = [];
    let extAddr = 0;
    let maxAddr = 0;
    for (const line of lines) {
      if (!line.startsWith(':')) continue;
      const len  = parseInt(line.substr(1, 2), 16);
      const addr = parseInt(line.substr(3, 4), 16);
      const type = parseInt(line.substr(7, 2), 16);
      if (type === 0x00) {
        const data = new Uint8Array(len);
        for (let i = 0; i < len; i++) data[i] = parseInt(line.substr(9 + i * 2, 2), 16);
        const fullAddr = extAddr + addr;
        recs.push({ addr: fullAddr, data });
        if (fullAddr + len > maxAddr) maxAddr = fullAddr + len;
      } else if (type === 0x02) {
        extAddr = parseInt(line.substr(9, 4), 16) << 4;
      } else if (type === 0x04) {
        extAddr = parseInt(line.substr(9, 4), 16) << 16;
      } else if (type === 0x01) {
        break;
      }
    }
    const buf = new Uint8Array(maxAddr);
    buf.fill(0xFF);
    for (const rec of recs) buf.set(rec.data, rec.addr);
    return buf;
  }

  // ---- Web Serial AVR109 (Caterina) flash ----
  // Procedure (Leonardo/Micro):
  //   1. Open the currently-known sketch port at 1200 baud and immediately
  //      close it. The Caterina sketch USB stack sees this and triggers a
  //      watchdog reset, jumping into the bootloader. The bootloader then
  //      enumerates as a NEW USB CDC device (different VID/PID).
  //   2. Wait for navigator.serial 'connect' to fire with the new port (or
  //      poll getPorts as a fallback). If we've never seen it, prompt the
  //      user with requestPort() filtered to the Arduino vendor.
  //   3. Open the bootloader port and run AVR109:
  //        S — programmer ID (7 bytes, "CATERIN")
  //        T 0x44 — select device (m32u4)
  //        P — enter programming mode
  //        e — chip erase
  //        for each 128-byte page:
  //          A addrH addrL — set word address
  //          B 0x00 0x80 0x46 + 128 bytes — write block (memtype 'F' = flash)
  //        L — leave programming mode
  //        E — exit bootloader (board reboots back into the new sketch)
  async function vibeFlashHexToArduino(hexBytes) {
    // Snapshot the ports we already had access to so we can spot the new
    // bootloader port that appears after the 1200-baud knock.
    const beforePorts = await navigator.serial.getPorts();

    // Knock the current sketch port down to the bootloader.
    let knockedPort = _vibeSerialPort;
    if (!knockedPort) {
      // No active connection. Try a previously-granted Arduino port; if none,
      // ask the user to pick one (so we can knock it).
      const prior = beforePorts.find(p => isArduinoVid(p.getInfo() || {}));
      if (prior) {
        knockedPort = prior;
      } else {
        try {
          knockedPort = await navigator.serial.requestPort({
            filters: ARDUINO_PORT_FILTERS
          });
        } catch (_) {
          throw new Error('No Arduino selected.');
        }
      }
    } else {
      // Stop the read loop and release the port before we touch it.
      await vibeDisconnectSerial();
    }

    // Open at 1200 then close — that's the magic reset signal.
    const knock = async () => {
      await knockedPort.open({ baudRate: 1200 });
      // Toggle DTR low to make the reset more reliable on clone boards — the
      // 1200-baud open/close alone is flaky on some 32u4 clones. Harmless and
      // ignored if the platform doesn't support setSignals.
      try { await knockedPort.setSignals({ dataTerminalReady: false }); } catch (_) {}
      // Tiny delay so the host sees the open before we close.
      await new Promise(r => setTimeout(r, 50));
      await knockedPort.close();
    };
    try {
      await knock();
    } catch (err) {
      const msg = String(err);
      if (msg.includes('already open')) {
        // A monitor teardown race can leave the port open — close and retry once.
        try {
          await knockedPort.close().catch(() => {});
          await knock();
        } catch (err2) {
          throw new Error('Could not reset board: ' + (err2.message || err2));
        }
      } else if (!msg.includes('closed')) {
        // If the port was already closed by the disconnect above, that's fine.
        throw new Error('Could not reset board: ' + (err.message || err));
      }
    }

    // 2. Wait for the bootloader port to appear.
    const beforeKey = (p) => {
      const i = p.getInfo() || {};
      return (i.usbVendorId || 0) + ':' + (i.usbProductId || 0);
    };
    const beforeKeys = new Set(beforePorts.map(beforeKey));

    const bootloaderPort = await new Promise((resolve, reject) => {
      let resolved = false;
      const onConnect = (ev) => {
        if (resolved) return;
        const p = ev.target || ev.port;
        if (!p) return;
        const info = p.getInfo() || {};
        if (!isArduinoVid(info)) return;
        resolved = true;
        cleanup();
        resolve(p);
      };
      let pickBtn = null;
      const cleanup = () => {
        navigator.serial.removeEventListener('connect', onConnect);
        clearInterval(poll);
        clearTimeout(firstCoach);
        clearTimeout(coach);
        clearTimeout(coach2);
        clearTimeout(giveUp);
        if (pickBtn) { pickBtn.remove(); pickBtn = null; }
      };
      // Chrome only shows the serial-port picker during a real click (transient
      // user activation). Calling requestPort() from a timer throws instantly —
      // no picker ever appears — so the manual fallback must be a button.
      const offerPicker = () => {
        if (resolved || pickBtn) return;
        const monitor = document.getElementById('vibeMonitor');
        if (!monitor) return;
        pickBtn = document.createElement('button');
        pickBtn.type = 'button';
        pickBtn.className = 'vibe-monitor-fix-btn';
        pickBtn.textContent = "Choose the board's port";
        pickBtn.addEventListener('click', async () => {
          try {
            const p = await navigator.serial.requestPort({});
            if (!resolved) { resolved = true; cleanup(); resolve(p); }
          } catch (_) { /* picker cancelled — keep waiting */ }
        });
        monitor.appendChild(document.createTextNode('\n'));
        monitor.appendChild(pickBtn);
        monitor.appendChild(document.createTextNode('\n'));
        if (_vibeMonitorAutoScroll) monitor.scrollTop = monitor.scrollHeight;
      };
      // Poll getPorts() in parallel — 'connect' only fires for ports the
      // user previously authorized. On first upload the new bootloader VID/PID
      // hasn't been authorized, so we fall back to manual requestPort below.
      const poll = setInterval(async () => {
        if (resolved) return;
        const ports = await navigator.serial.getPorts();
        // Prefer a newly-appeared Arduino-family port; if the board is a clone
        // with an unknown VID, accept ANY new port that showed up after the
        // knock (it's almost certainly the bootloader that just enumerated).
        let fallback = null;
        for (const p of ports) {
          if (beforeKeys.has(beforeKey(p))) continue; // not new since the knock
          if (isArduinoVid(p.getInfo() || {})) {
            resolved = true; cleanup(); resolve(p); return;
          }
          fallback = fallback || p;
        }
        if (fallback) {
          resolved = true; cleanup(); resolve(fallback); return;
        }
      }, 250);
      navigator.serial.addEventListener('connect', onConnect);
      // The 1200-baud knock only reboots the board if the running sketch
      // cooperates. On a fresh board, a stuck sketch, or the very first upload
      // of a session it often doesn't fire — so after ~2s with no bootloader,
      // coach the student to tap the physical RESET button (the canonical
      // Leonardo/Micro move) and keep listening for the full window.
      // First-ever upload on this machine: Chrome has never been granted
      // permission for the bootloader's port, so auto-detect CANNOT see it
      // (the 'connect' event and getPorts() only cover authorized ports).
      // Historically this made every student's first upload time out. Surface
      // the picker immediately instead; the flag is set after the first
      // successful flash, so every later upload uses the silent fast path.
      const firstUpload = !localStorage.getItem('d4sg-vibe-bootloader-ok-v1');
      const firstCoach = firstUpload ? setTimeout(() => {
        if (resolved) return;
        vibeMonitorLine("First upload on this laptop: click the button below, then pick the port named 'bootloader' (it appears a moment after the board resets).", 'info');
        vibeSetStatus('connecting', "First upload: choose the board's port below.");
        offerPicker();
      }, 1200) : null;
      const coach = setTimeout(() => {
        if (resolved || firstUpload) return;
        vibeMonitorLine('Almost there - if nothing happens, press the RESET button on your Arduino once now, then wait.', 'info');
        vibeSetStatus('connecting', 'Waiting for the board… tap RESET on the Arduino if it does not appear.');
      }, 2200);
      // Soft-brick recovery: a bad sketch (e.g. one that floods HID keystrokes)
      // can kill the board's USB so the 1200-baud knock never fires and a single
      // tap isn't enough. A DOUBLE-tap of RESET forces the bootloader open for
      // ~8 seconds. This is THE recovery move for a board that "won't take code".
      const coach2 = setTimeout(() => {
        if (resolved) return;
        vibeMonitorLine('Still nothing? Press RESET TWICE quickly (a fast double-tap), then click "Choose the board\'s port" below and pick the one named "bootloader".', 'info');
        vibeSetStatus('connecting', 'Double-tap RESET, then use the port button below.');
        offerPicker();
      }, 7000);
      const giveUp = setTimeout(() => {
        if (resolved) return;
        cleanup();
        reject(new Error('Board did not enter upload mode. Double-tap the RESET button on the Arduino, then press Upload again.'));
      }, 60000);
    });

    // Caterina runs USB CDC; baud rate is ignored. 57600 is conventional.
    await bootloaderPort.open({ baudRate: 57600 });
    try {
      await avr109WriteFlash(bootloaderPort, hexBytes, (msg, kind) => vibeMonitorLine(msg, kind));
      // Chrome now remembers the bootloader port - later uploads auto-detect.
      try { localStorage.setItem('d4sg-vibe-bootloader-ok-v1', '1'); } catch (_) {}
    } finally {
      try { await bootloaderPort.close(); } catch (_) {}
    }
  }

  // Talk AVR109 (Atmel butterfly bootloader protocol) over the open port.
  async function avr109WriteFlash(port, hexBytes, log) {
    const writer = port.writable.getWriter();
    const reader = port.readable.getReader();
    let leftover = new Uint8Array(0);

    const writeBytes = async (data) => {
      const arr = (data instanceof Uint8Array) ? data
                : (typeof data === 'string') ? new TextEncoder().encode(data)
                : new Uint8Array(data);
      await writer.write(arr);
    };
    const readN = async (n, timeoutMs = 4000) => {
      if (leftover.length >= n) {
        const out = leftover.slice(0, n);
        leftover = leftover.slice(n);
        return out;
      }
      const out = new Uint8Array(n);
      let read = 0;
      if (leftover.length) {
        out.set(leftover, 0);
        read = leftover.length;
        leftover = new Uint8Array(0);
      }
      const deadline = Date.now() + timeoutMs;
      while (read < n) {
        const remaining = deadline - Date.now();
        if (remaining <= 0) throw new Error('AVR109 read timeout');
        const result = await Promise.race([
          reader.read(),
          new Promise((res) => setTimeout(() => res({ value: null, done: false }), remaining))
        ]);
        if (result.done) throw new Error('AVR109 stream closed');
        if (!result.value) throw new Error('AVR109 read timeout');
        const v = result.value;
        const need = n - read;
        if (v.length <= need) {
          out.set(v, read);
          read += v.length;
        } else {
          out.set(v.subarray(0, need), read);
          leftover = v.slice(need);
          read = n;
        }
      }
      return out;
    };
    const expectAck = async () => {
      const r = await readN(1, 4000);
      if (r[0] !== 0x0D) throw new Error('AVR109 NAK (got 0x' + r[0].toString(16) + ')');
    };

    try {
      // Identify the bootloader (sanity check).
      await writeBytes('S');
      const id = new TextDecoder().decode(await readN(7, 2000));
      log('bootloader: ' + id, 'dim');
      await writeBytes('V');
      const ver = new TextDecoder().decode(await readN(2, 2000));
      log('caterina v' + ver, 'dim');

      // Select device — 0x44 = ATmega32U4.
      await writeBytes(new Uint8Array([0x54, 0x44])); // 'T'
      await expectAck();
      // Enter programming mode.
      await writeBytes('P');
      await expectAck();
      // Chip erase.
      log('erasing flash…', 'dim');
      await writeBytes('e');
      await expectAck();

      // 128-byte pages for ATmega32U4.
      const PAGE = 128;
      const total = hexBytes.length;
      const totalPages = Math.ceil(total / PAGE);
      log('writing ' + total + ' bytes in ' + totalPages + ' pages…', 'dim');

      for (let addr = 0; addr < total; addr += PAGE) {
        // AVR109 'A' takes a WORD address (byte address >> 1).
        const wordAddr = addr >> 1;
        await writeBytes(new Uint8Array([0x41, (wordAddr >> 8) & 0xFF, wordAddr & 0xFF]));
        await expectAck();

        const len = Math.min(PAGE, total - addr);
        let block = hexBytes.subarray(addr, addr + len);
        if (block.length < PAGE) {
          const padded = new Uint8Array(PAGE);
          padded.fill(0xFF);
          padded.set(block);
          block = padded;
        }
        const header = new Uint8Array([0x42, 0x00, PAGE, 0x46]); // 'B' sizeH sizeL 'F'
        const packet = new Uint8Array(header.length + PAGE);
        packet.set(header, 0);
        packet.set(block, header.length);
        await writeBytes(packet);
        await expectAck();
      }

      // Verify (best-effort): read the flash back and compare to what we wrote.
      // Fully guarded — every page write was already ACKed, so a flaky read-back
      // must never fail a good upload. Worst case it logs "verify skipped".
      try {
        let mismatch = false;
        for (let addr = 0; addr < total && !mismatch; addr += PAGE) {
          const wordAddr = addr >> 1;
          await writeBytes(new Uint8Array([0x41, (wordAddr >> 8) & 0xFF, wordAddr & 0xFF])); // 'A' set addr
          await expectAck();
          await writeBytes(new Uint8Array([0x67, 0x00, PAGE, 0x46])); // 'g' read PAGE bytes of Flash
          const back = await readN(PAGE, 4000);
          const len = Math.min(PAGE, total - addr);
          for (let i = 0; i < len; i++) { if (back[i] !== hexBytes[addr + i]) { mismatch = true; break; } }
        }
        log(mismatch ? '[ ⚠ Verify mismatch - upload again to be safe ]' : '[ ✓ Verified flash ]', mismatch ? 'err' : 'ok');
      } catch (e) {
        log('[ verify skipped (' + (e && e.message || e) + ') - write was acknowledged ]', 'dim');
      }

      // Leave programming mode and exit bootloader (reboot into new sketch).
      await writeBytes('L');
      await expectAck();
      await writeBytes('E');
      await expectAck();
    } finally {
      try { reader.releaseLock(); } catch (_) {}
      try { writer.releaseLock(); } catch (_) {}
    }
  }

  // After upload, the sketch port reappears under the original (sketch) VID/PID.
  // Try to reopen it for the serial monitor without prompting the user.
  async function vibeReconnectSketchPort() {
    try {
      const ports = await navigator.serial.getPorts();
      const sketchPort = ports.find(p => {
        const info = p.getInfo() || {};
        // Sketch port is the Arduino vendor entry that's not still in bootloader
        // VID/PID. Caterina's bootloader uses 0x0036/0x0037; sketches usually
        // use 0x8036/0x8037 or higher.
        return info.usbVendorId === ARDUINO_USB_VID && (info.usbProductId & 0x8000);
      }) || ports.find(p => isArduinoVid(p.getInfo() || {}));
      if (!sketchPort) {
        // Clone boards can re-enumerate with an unknown VID — never bail silently.
        vibeMonitorLine('Click "Connect Arduino" above to watch Serial output.', 'dim');
        return;
      }
      const baud = parseInt(document.getElementById('vibeBaudRate').value, 10) || 9600;
      await sketchPort.open({ baudRate: baud });
      _vibeSerialPort = sketchPort;
      _vibeSerialKeepReading = true;
      const btn = document.getElementById('vibeConnect');
      if (btn) {
        btn.classList.remove('is-primary');
        btn.classList.add('is-active');
        vibeSetTooltip(btn, 'Disconnect Arduino');
      }
      vibeMonitorLine('[ reconnected at ' + baud + ' baud ]', 'info');
      vibeSetStatus('connected', `Connected at ${baud} baud.`);
      // Re-enable the monitor Send box: after an upload this is exactly when
      // the student needs to type commands (e.g. "set port 0 to space").
      vibeMonitorSetSendEnabled(true);
      vibeReadLoop();
    } catch (err) {
      vibeMonitorLine('Could not reopen serial monitor - click "Connect Arduino" to reconnect.', 'dim');
    }
  }

  // ---- Web Serial ----
  let _vibeConnecting = false;
  let _vibeSerialPipeDone = null;
  async function vibeConnectSerial() {
    const monitor = document.getElementById('vibeMonitor');
    if (!('serial' in navigator)) {
      monitor.innerHTML = '';
      vibeAppendMonitor('Web Serial not supported in this browser. Use Chrome or Edge on a desktop, then reload this page.\n');
      return;
    }
    // A second click while the port picker is open would spawn a second
    // picker and orphan the first port.
    if (_vibeConnecting) return;
    _vibeConnecting = true;
    try {
      const port = await navigator.serial.requestPort();
      const baud = parseInt(document.getElementById('vibeBaudRate').value, 10) || 9600;
      await port.open({ baudRate: baud });
      _vibeSerialPort = port;
      _vibeSerialKeepReading = true;
      const btn = document.getElementById('vibeConnect');
      btn.classList.remove('is-primary');
      btn.classList.add('is-active');
      vibeSetTooltip(btn, 'Disconnect Arduino');
      monitor.innerHTML = '';
      vibeAppendMonitor('[ connected at ' + baud + ' baud ]\n');
      vibeSetStatus('connected', `Connected. Click Upload to send your code to the board.`);
      vibeMonitorSetSendEnabled(true);
      vibeReadLoop();
    } catch (err) {
      // User cancelled the picker, or open failed.
      if (err && err.name !== 'NotFoundError') {
        vibeAppendMonitor('[ connection error: ' + (err.message || err) + ' ]\n');
      }
    } finally {
      _vibeConnecting = false;
    }
  }

  async function vibeReadLoop() {
    if (!_vibeSerialPort) return;
    const decoder = new TextDecoderStream();
    _vibeSerialPipeDone = _vibeSerialPort.readable.pipeTo(decoder.writable).catch(() => {});
    const reader = decoder.readable.getReader();
    _vibeSerialReader = reader;
    try {
      while (_vibeSerialKeepReading) {
        const { value, done } = await reader.read();
        if (done) break;
        if (value) vibeAppendMonitor(value);
      }
    } catch (err) {
      vibeAppendMonitor('[ read error: ' + (err.message || err) + ' ]\n');
    }
    // Loop ended while we still wanted to read = the board was unplugged or
    // the cable got bumped. Reset the UI so "Connected" never lies, and say
    // what to do next.
    if (_vibeSerialKeepReading) {
      await vibeDisconnectSerial();
      vibeAppendMonitor('[ board disconnected - plug it back in and click Connect Arduino ]\n');
    }
  }

  async function vibeDisconnectSerial() {
    _vibeSerialKeepReading = false;
    try {
      if (_vibeSerialReader) {
        await _vibeSerialReader.cancel().catch(() => {});
        _vibeSerialReader = null;
      }
      // Wait for the readable→decoder pipe to fully release the port before
      // closing. Closing while the stream is still locked rejects (silently,
      // because of the catch) and leaves the port wedged open — which then
      // breaks the next Upload's 1200-baud knock with "Could not reset board".
      if (_vibeSerialPipeDone) {
        await _vibeSerialPipeDone;
        _vibeSerialPipeDone = null;
      }
      if (_vibeSerialPort) {
        await _vibeSerialPort.close().catch(() => {});
      }
    } catch (_) {}
    _vibeSerialPort = null;
    const btn = document.getElementById('vibeConnect');
    if (btn) {
      btn.classList.add('is-primary');
      btn.classList.remove('is-active');
      vibeSetTooltip(btn, 'Connect Arduino');
    }
    vibeAppendMonitor('[ disconnected ]\n');
    vibeSetStatus('disconnected', 'Disconnected. Click Connect Arduino and pick your Leonardo or Micro.');
    vibeMonitorSetSendEnabled(false);
  }

  function vibeStopReading() {
    if (_vibeSerialPort) {
      vibeDisconnectSerial();
    }
  }

  function vibeAppendMonitor(text) {
    const m = document.getElementById('vibeMonitor');
    if (!m) return;
    // Clear empty placeholder
    const empty = m.querySelector('.vibe-monitor-empty');
    if (empty) m.innerHTML = '';
    m.appendChild(document.createTextNode(text));
    if (_vibeMonitorAutoScroll) {
      m.scrollTop = m.scrollHeight;
    }
  }

  // Write a line over Serial. Read by the Arduino sketch via Serial.read(). The
  // line ending matches what the student selected in the dropdown so they can
  // match whatever protocol their firmware expects.
  async function vibeMonitorSendLine() {
    if (!_vibeSerialPort || !_vibeSerialPort.writable) {
      schemToast('Connect to the Arduino first (click "Connect Arduino" above).');
      return;
    }
    const input = document.getElementById('vibeMonitorInput');
    const endingSelect = document.getElementById('vibeMonitorLineEnding');
    if (!input) return;
    const text = input.value;
    if (!text) return;
    // Unescape the select's "\n" / "\r" / "\r\n" representation.
    const rawEnding = endingSelect ? endingSelect.value : '\n';
    const ending = rawEnding.replace(/\\n/g, '\n').replace(/\\r/g, '\r');
    // A rapid second Enter while the previous write holds the lock would
    // throw "stream locked" — just drop it.
    if (_vibeSerialPort.writable.locked) return;
    const writer = _vibeSerialPort.writable.getWriter();
    try {
      const payload = new TextEncoder().encode(text + ending);
      await writer.write(payload);
      vibeAppendMonitor('> ' + text + '\n');
      input.value = '';
    } catch (err) {
      vibeAppendMonitor('[ send error: ' + (err.message || err) + ' ]\n');
    } finally {
      try { writer.releaseLock(); } catch (_) {}
    }
  }

  // Enable / disable the send controls based on whether we have a live port.
  function vibeMonitorSetSendEnabled(enabled) {
    const sendBtn = document.getElementById('vibeMonitorSend');
    const input = document.getElementById('vibeMonitorInput');
    if (sendBtn) sendBtn.disabled = !enabled;
    if (input) input.disabled = !enabled;
  }

  // ============== UTIL ==============
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // ============== NAME PICKER ==============
  // Mobile-first roster picker. Native <select> for the wheel-spinner UX on
  // iOS, an inline "+ I'm new — add me" fallback that grows the live roster.
  // Returns { element, getName(), setName(name), destroy() }.
  function renderNamePicker(opts = {}) {
    const wrap = document.createElement('div');
    wrap.className = 'name-picker';
    wrap.innerHTML = `
      <label class="name-picker-label">${escapeHtml(opts.label || "Who's adding this?")}</label>
      <select class="name-picker-select" data-name-select aria-label="Pick your name"></select>
    `;
    const select = wrap.querySelector('[data-name-select]');

    let currentName = opts.initial || localStorage.getItem(LAST_PICK_KEY) || '';

    function rebuildOptions(names) {
      const seen = new Set(names.map(n => n.toLowerCase()));
      // If the current pick isn't in the live roster yet (just added, not
      // round-tripped through Firestore), keep it visible.
      if (currentName && !seen.has(currentName.toLowerCase())) {
        names = [...names, currentName].sort((a, b) =>
          a.localeCompare(b, undefined, { sensitivity: 'base' })
        );
      }
      const opts = [`<option value="">Pick your name…</option>`];
      for (const n of names) {
        const sel = (n === currentName) ? ' selected' : '';
        opts.push(`<option value="${escapeHtml(n)}"${sel}>${escapeHtml(n)}</option>`);
      }
      select.innerHTML = opts.join('');
    }

    const unsub = subscribeRoster(rebuildOptions);

    select.addEventListener('change', () => {
      currentName = select.value;
      if (currentName) localStorage.setItem(LAST_PICK_KEY, currentName);
      if (typeof opts.onChange === 'function') opts.onChange(currentName);
    });

    return {
      element: wrap,
      getName: () => currentName,
      setName: (n) => {
        currentName = n || '';
        if (currentName) localStorage.setItem(LAST_PICK_KEY, currentName);
        // Trigger rebuild so the new selection actually shows in the <select>.
        rebuildOptions(_liveRoster);
      },
      destroy: () => { unsub(); }
    };
  }

  // ============== STUDENT DRAFTS ==============
  // Per-student per-benchmark drafts persisted to Firestore so the student
  // can leave, switch devices, come back, and find their stuff. Doc path:
  //   drafts/${nameSlug}__${benchmarkId}
  // Storage path for files:
  //   drafts/${nameSlug}__${benchmarkId}/${stamp}-${fileName}
  function draftDocId(name, benchmarkId) {
    const slug = nameSlug(name);
    return slug && benchmarkId ? `${slug}__${benchmarkId}` : '';
  }
  async function loadDraft(name, benchmarkId) {
    const id = draftDocId(name, benchmarkId);
    if (!id) return null;
    try {
      const snap = await getDoc(doc(db, 'drafts', id));
      if (!snap.exists()) return null;
      const data = snap.data();
      // A soft-cleared draft (deleted on Submit) must not rehydrate stale work.
      return data.deleted ? null : data;
    } catch (e) {
      console.warn('loadDraft failed', e);
      return null;
    }
  }
  async function saveDraft(name, benchmarkId, partial) {
    const id = draftDocId(name, benchmarkId);
    if (!id) return;
    try {
      await setDoc(
        doc(db, 'drafts', id),
        {
          studentName: name,
          nameSlug: nameSlug(name),
          benchmarkId,
          // Clear any prior soft-delete flag so restarting a benchmark after Submit
          // saves into a live draft again.
          deleted: false,
          ...partial,
          updatedAt: serverTimestamp(),
        },
        { merge: true }
      );
    } catch (e) {
      console.warn('saveDraft failed', e);
    }
  }
  async function clearDraft(name, benchmarkId) {
    const id = draftDocId(name, benchmarkId);
    if (!id) return;
    // Soft clear: hard deletes are denied by rules. Mark the draft deleted so it
    // won't rehydrate; a lifecycle rule can sweep old deleted drafts later.
    try {
      await setDoc(doc(db, 'drafts', id), {
        studentName: name,
        nameSlug: nameSlug(name),
        benchmarkId,
        deleted: true,
        deletedAt: serverTimestamp(),
      }, { merge: true });
    } catch (e) {}
  }
  // Debounce helper for keystroke autosave.
  function debounce(fn, ms) {
    let t = null;
    return function (...args) {
      if (t) clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), ms);
    };
  }

  // Small inline-markup formatter for benchmark step text. Order matters:
  // 1) escape, 2) link tokens, 3) bold, 4) italic.
  function formatStepMarkup(text) {
    let s = escapeHtml(text);
    // [label](href) — internal tool links resolve to data-tool-link, others to <a target=_blank>.
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, label, href) => {
      const internal = href.match(/^tools#(vibe|schematic|idea-board)$/);
      if (internal) {
        return `<a href="#" class="cp-step-tool" data-tool-link="${internal[1]}">${label}</a>`;
      }
      const safeHref = href.replace(/"/g, '');
      return `<a href="${safeHref}" target="_blank" rel="noopener">${label}</a>`;
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    return s;
  }

  // ====== Idea Board: Excalidraw-based ======
  // Excalidraw is loaded lazily on first visit to /tools/idea-board so it
  // does not bloat any other route.

  // Excalidraw embedding via UMD bundles (the official documented CDN pattern).
  // Loading via dynamic ES-module imports against esm.sh was flaky; the UMD
  // <script> route is what Excalidraw's own README recommends and gives us
  // window.React / window.ReactDOM / window.ExcalidrawLib reliably.
  const IDEA_EXCAL_VERSION = '0.17.6';
  const IDEA_REACT_VERSION = '18.2.0';
  const IDEA_UMD_SCRIPTS = [
    `https://unpkg.com/react@${IDEA_REACT_VERSION}/umd/react.production.min.js`,
    `https://unpkg.com/react-dom@${IDEA_REACT_VERSION}/umd/react-dom.production.min.js`,
    `https://unpkg.com/@excalidraw/excalidraw@${IDEA_EXCAL_VERSION}/dist/excalidraw.production.min.js`
  ];
  const IDEA_EXCAL_CSS_HREF = `https://unpkg.com/@excalidraw/excalidraw@${IDEA_EXCAL_VERSION}/dist/excalidraw.production.min.css`;
  let _ideaExcalRoot = null;
  let _ideaExcalReact = null;
  let _ideaExcalComp = null;
  let _ideaExcalApi = null;
  let _ideaExcalSaveTimer = null;
  let _ideaA11yObserver = null;
  let _ideaDropCount = 0;   // cascades each new stamp into a fresh grid cell so drops never pile up

  function ideaStorageKey() {
    const slug = (typeof nameSlug === 'function')
      ? (nameSlug(localStorage.getItem(LAST_PICK_KEY) || '') || '_anon')
      : '_anon';
    return `d4sg-idea-pro::${slug}`;
  }

  function ideaLoadState() {
    try {
      const raw = localStorage.getItem(ideaStorageKey());
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (_) { return null; }
  }

  function ideaSaveState(elements, appState) {
    try {
      const cleanAppState = appState ? { ...appState } : {};
      delete cleanAppState.collaborators;
      delete cleanAppState.editingElement;
      delete cleanAppState.draggingElement;
      delete cleanAppState.resizingElement;
      delete cleanAppState.selectedElementIds;
      delete cleanAppState.activeEmbeddable;
      // Never persist the pan: a wheel-scroll over the canvas pans the board,
      // and a saved pan makes the next visit open on blank space — the student
      // thinks their sketch is gone.
      delete cleanAppState.scrollX;
      delete cleanAppState.scrollY;
      const payload = JSON.stringify({ elements: elements || [], appState: cleanAppState });
      localStorage.setItem(ideaStorageKey(), payload);
      // Mirror to Firestore so the board follows the student to other laptops.
      // Capture the author NOW: a pending mirror that fires after a student
      // switch must write to the board's author, not whoever is picked then.
      ideaMirrorDraftDebounced(payload, (localStorage.getItem(LAST_PICK_KEY) || '').trim());
    } catch (err) {
      console.warn('Idea Board save failed', err);
    }
  }

  // Debounced cloud mirror (matches the Vibe Coding pattern). Only runs if a
  // student name is picked; anonymous work stays local.
  const ideaMirrorDraftDebounced = debounce((payload, name) => {
    if (!name) return;
    try { saveDraft(name, 'idea-board', { ideaBoard: payload }); } catch (_) {}
  }, 1200);

  // On boot or student switch: if local is empty for this slug but the cloud
  // has a saved board, pull it down and seed localStorage.
  async function ideaHydrateFromCloud() {
    const name = (localStorage.getItem(LAST_PICK_KEY) || '').trim();
    if (!name) return null;
    const hasLocal = !!localStorage.getItem(ideaStorageKey());
    if (hasLocal) return null;
    try {
      const draft = await loadDraft(name, 'idea-board');
      if (draft && typeof draft.ideaBoard === 'string') {
        localStorage.setItem(ideaStorageKey(), draft.ideaBoard);
        return JSON.parse(draft.ideaBoard);
      }
    } catch (_) {}
    return null;
  }

  function ensureExcalidrawCss() {
    if (document.querySelector('link[data-excal-css]')) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = IDEA_EXCAL_CSS_HREF;
    link.dataset.excalCss = '1';
    document.head.appendChild(link);
  }

  async function initIdeaBoardTool() {
    app.innerHTML = '';
    const wrap = document.createElement('section');
    wrap.className = 'project idea-pro-wrap';
    wrap.innerHTML = `
      <button class="schem-back" id="ideaBack" aria-label="Back to Tools"><span class="schem-back-arrow"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></span> Back to Tools</button>
      <h2 class="project-title">Idea Board</h2>
      <div data-idea-identity></div>
      <div class="idea-toolbar" id="ideaToolsBar" aria-label="Drawing tools"></div>
      <div class="idea-pro-stamps" id="ideaProStamps" aria-label="Assistive technology components"></div>
      <div class="idea-pro-frame">
        <div id="excalidrawRoot" class="idea-pro-canvas"></div>
        <div class="idea-pro-loading" id="ideaProLoading">
          <div class="spin"></div>
          <span>Loading the drawing board…</span>
        </div>
      </div>
    `;
    app.appendChild(wrap);

    wireToolBackButton(document.getElementById('ideaBack'));

    // Identity strip — switching students reloads their saved board.
    const idEl = wrap.querySelector('[data-idea-identity]');
    if (idEl && typeof renderIdentityStrip === 'function') {
      idEl.appendChild(renderIdentityStrip({
        onChange: () => ideaProSwitchStudent()
      }));
    }

    // Unmount the Excalidraw React tree on ANY route change so each visit
    // gets exactly one live instance (no leaked roots or onChange autosaves).
    setViewTeardown(() => {
      if (_ideaExcalRoot) { try { _ideaExcalRoot.unmount(); } catch (_) {} }
      _ideaExcalRoot = null;
      _ideaExcalApi = null;
      if (_ideaA11yObserver) _ideaA11yObserver.disconnect();
      _ideaA11yObserver = null;
      cleanupIdentityStrip(idEl);
    });

    ensureExcalidrawCss();

    try {
      await Promise.all([
        loadExcalidrawUmd(),
        ideaHydrateFromCloud().catch(() => null)
      ]);
      mountIdeaProBoard();
    } catch (err) {
      console.error('idea board load failed', err);
      const loading = document.getElementById('ideaProLoading');
      if (loading) {
        loading.innerHTML = `<div class="idea-pro-error">Could not load the drawing board. Check your internet connection and refresh.</div>`;
      }
    }
  }

  // Load the three UMD scripts in sequence (order matters: React, ReactDOM,
  // then Excalidraw which depends on both).
  function loadExcalidrawUmd() {
    if (window.ExcalidrawLib && window.React && window.ReactDOM) return Promise.resolve();
    return IDEA_UMD_SCRIPTS.reduce((chain, src) => chain.then(() => loadOneScript(src)), Promise.resolve());
  }
  function loadOneScript(src) {
    return new Promise((resolve, reject) => {
      const existing = document.querySelector(`script[data-cdn-src="${src}"]`);
      if (existing) {
        if (existing.dataset.cdnLoaded === '1') return resolve();
        existing.addEventListener('load', () => resolve());
        existing.addEventListener('error', () => reject(new Error('Failed to load ' + src)));
        return;
      }
      const s = document.createElement('script');
      s.src = src;
      s.crossOrigin = 'anonymous';
      s.dataset.cdnSrc = src;
      s.onload = () => { s.dataset.cdnLoaded = '1'; resolve(); };
      s.onerror = () => reject(new Error('Failed to load ' + src));
      document.head.appendChild(s);
    });
  }

      initial.appState = Object.assign({ currentItemFillStyle: 'solid' }, initial.appState, { viewBackgroundColor: '#ffffff' });

  // Reflect Excalidraw's live state back into our toolbar (active tool, current
  // stroke color, zoom %). Called on every onChange and after our own actions.
  function ideaSyncToolbar(appState) {
    if (!_ideaExcalApi) return;
    try { appState = appState || _ideaExcalApi.getAppState(); } catch (_) { return; }
    const active = appState.activeTool && appState.activeTool.type;
    document.querySelectorAll('#ideaToolsBar [data-tool]').forEach(b => {
      b.classList.toggle('is-active', b.dataset.tool === active);
    });
    const cur = (appState.currentItemStrokeColor || '').toLowerCase();
    document.querySelectorAll('#ideaToolsBar [data-color]').forEach(b => {
      b.classList.toggle('is-active', (b.dataset.color || '').toLowerCase() === cur);
    });
    const bg = (appState.currentItemBackgroundColor || 'transparent').toLowerCase();
    document.querySelectorAll('#ideaToolsBar [data-fill]').forEach(b => {
      b.classList.toggle('is-active', (b.dataset.fill || '').toLowerCase() === bg);
    });
    const fstyle = appState.currentItemFillStyle || '';
    document.querySelectorAll('#ideaToolsBar [data-fillstyle]').forEach(b => {
      b.classList.toggle('is-active', b.dataset.fillstyle === fstyle);
    });

    if (zl) zl.textContent = Math.round(((appState.zoom && appState.zoom.value) || 1) * 100) + '%';
  }

  // Apply a style change as the default for NEW shapes (via currentItem* in
  // appState) AND to anything currently selected (by patching those elements).
  function ideaApplyStyle(elementProps, appStateProps) {
    if (!_ideaExcalApi) return;
    const appState = _ideaExcalApi.getAppState();
    const sel = appState.selectedElementIds || {};
    const hasSel = Object.keys(sel).some(id => sel[id]);
    const update = { appState: appStateProps || {} };
    if (hasSel && elementProps) {
      update.elements = _ideaExcalApi.getSceneElements().map(e =>
        sel[e.id]
          ? Object.assign({}, e, elementProps, { version: (e.version || 1) + 1, versionNonce: Math.floor(Math.random() * 2147483647) })
          : e
      );

  // PNG Blob of the current Excalidraw board (white background, native res).
  // Used by the "Save to Benchmark" flow (mirrors the PNG export path).
  async function ideaBuildExcalPngBlob() {
    if (!_ideaExcalApi || !window.ExcalidrawLib || !window.ExcalidrawLib.exportToBlob) {
      throw new Error('Idea Board is not ready yet.');
    }
    const elements = _ideaExcalApi.getSceneElements();
    if (!elements || !elements.length) throw new Error('The board is empty.');
    const appState = _ideaExcalApi.getAppState();
    const files = _ideaExcalApi.getFiles ? _ideaExcalApi.getFiles() : null;
    return await window.ExcalidrawLib.exportToBlob({
      elements,
      appState: Object.assign({}, appState, { exportWithDarkMode: false, exportBackground: true, viewBackgroundColor: '#ffffff' }),
      files,
      mimeType: 'image/png',
      quality: 1
    });
  }

  async function ideaExport(format) {
    if (!_ideaExcalApi || !window.ExcalidrawLib) return;
    try {
      const elements = _ideaExcalApi.getSceneElements();
      const appState = _ideaExcalApi.getAppState();
      const files = _ideaExcalApi.getFiles ? _ideaExcalApi.getFiles() : null;
      if (!elements || !elements.length) {
        schemToast && schemToast('The board is empty.');
        return;
      }
      const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
      if ((format === 'png' || format === 'jpg') && window.ExcalidrawLib.exportToBlob) {
        // JPG has no transparency, so a white background is essential (already
        // forced below). Quality 0.92 keeps JPGs crisp but reasonably small.
        const isJpg = format === 'jpg';
        const blob = await window.ExcalidrawLib.exportToBlob({
          elements,
          appState: Object.assign({}, appState, { exportWithDarkMode: false, exportBackground: true, viewBackgroundColor: '#ffffff' }),
          files,
          mimeType: isJpg ? 'image/jpeg' : 'image/png',
          quality: isJpg ? 0.92 : 1
        });
        ideaDownloadBlob(blob, `idea-board-${stamp}.${isJpg ? 'jpg' : 'png'}`);
      } else if (format === 'svg' && window.ExcalidrawLib.exportToSvg) {
        const svg = await window.ExcalidrawLib.exportToSvg({
          elements,
          appState: Object.assign({}, appState, { exportWithDarkMode: false, exportBackground: true, viewBackgroundColor: '#ffffff' }),
          files
        });
        const svgText = new XMLSerializer().serializeToString(svg);
        const blob = new Blob([svgText], { type: 'image/svg+xml' });
        ideaDownloadBlob(blob, `idea-board-${stamp}.svg`);
      }
    } catch (err) {
      console.warn('Idea Board export failed', err);
      schemToast && schemToast('Could not export. ' + (err && err.message || ''));
    }
  }

  function ideaDownloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  function ideaDropStamp(key) {
    if (!_ideaExcalApi) return;
    const stamp = IDEA_STAMPS.find(s => s.key === key);
    if (!stamp) return;
    // Cascade each drop into its own grid cell (in WORLD units, so the spacing
    // holds at any zoom) instead of piling them all at the viewport center.
    const appState = _ideaExcalApi.getAppState();
    const container = document.getElementById('excalidrawRoot');
    const zoom = (appState.zoom && appState.zoom.value) || 1;
    const vw = container ? container.clientWidth : 800;
    const vh = container ? container.clientHeight : 560;
    // World coordinates of the current viewport center.
    const centerWorldX = (vw / 2 - (appState.scrollX || 0) * zoom) / zoom;
    const centerWorldY = (vh / 2 - (appState.scrollY || 0) * zoom) / zoom;
    // Grid of ~150px cells (stamps run 50-120px wide, so this leaves a gap).
    // Columns adapt to the visible width — on a half-screen window a fixed
    // 5-wide grid would start off-canvas and clicks would "do nothing".
    const STEP = 150;
    const worldW = vw / zoom, worldH = vh / zoom;
    const PER_ROW = Math.max(1, Math.min(5, Math.floor((worldW - 40) / STEP)));
    const i = _ideaDropCount % (PER_ROW * 4);   // wrap so the cascade stays near view
    const col = i % PER_ROW;
    const row = Math.floor(i / PER_ROW);
    // Start the block up-and-left of center, clamped inside the visible world
    // rect so every drop lands on-screen.
    let baseX = centerWorldX - (PER_ROW * STEP) / 2 + 30;
    let baseY = centerWorldY - 1.5 * STEP;
    baseX = Math.max(baseX, centerWorldX - worldW / 2 + 20);
    baseY = Math.max(baseY, centerWorldY - worldH / 2 + 20);
    const worldX = baseX + col * STEP + (Math.random() * 14 - 7);
    const worldY = baseY + row * STEP + (Math.random() * 14 - 7);
    _ideaDropCount++;
    const newElements = stamp.build(Math.round(worldX), Math.round(worldY));
    const sceneElements = _ideaExcalApi.getSceneElements();
    _ideaExcalApi.updateScene({
      elements: [...sceneElements, ...newElements]
    });
  }

  // Re-mount with the new student's saved board when the identity strip changes.
  async function ideaProSwitchStudent() {
    if (!_ideaExcalRoot || !_ideaExcalReact || !_ideaExcalComp) return;
    // A save scheduled by the PREVIOUS student's last edit would fire after
    // the identity strip already points at the new student and misfile the old
    // board into their slot. Drop it — the cloud mirror captures its author at
    // schedule time, so the old student's work is safe in their own draft.
    if (_ideaExcalSaveTimer) { clearTimeout(_ideaExcalSaveTimer); _ideaExcalSaveTimer = null; }
    // Pull from cloud first in case this is the student's first time on this device.
    await ideaHydrateFromCloud().catch(() => null);
    const props = {
      initialData: ideaInitialData(),
      onChange: ideaOnChange,
      theme: 'light',
      name: 'T4SG Idea Board',
      excalidrawAPI: (api) => { _ideaExcalApi = api; ideaFitOnOpen(api); },
      UIOptions: ideaUIOptions(),
      // Force remount by changing the key.
      key: ideaStorageKey() + '_' + Date.now()
    };
    _ideaExcalRoot.render(_ideaExcalReact.createElement(_ideaExcalComp, props));
    renderIdeaToolbar();
  }

      try {
        const snap = await getDocs(query(collection(db, 'exhibit'), orderBy('createdAt', 'desc')));

      try {
        // Soft delete: mark deleted (recoverable) instead of hard-deleting.
        await setDoc(doc(db, 'exhibit', del.dataset.exDel), { deleted: true, deletedAt: serverTimestamp() }, { merge: true });
        const card = del.closest('.exhibit-card');
        if (card) card.remove();
        if (!grid.querySelector('.exhibit-card')) {
          grid.innerHTML = `<div class="exhibit-empty">No work here yet - add the first piece above.</div>`;

          url,
          maker: wrap.querySelector('#exMaker').value.trim(),
          type: wrap.querySelector('#exType').value.trim(),
          image: wrap.querySelector('#exImage').value.trim(),
          blurb: wrap.querySelector('#exBlurb').value.trim(),

        msg.textContent = 'Adding…';

          await addDoc(collection(db, 'exhibit'), data);
