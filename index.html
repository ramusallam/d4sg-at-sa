<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>D4SG @ SA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
<style>
  :root {
    /* Spark Learning aesthetic — warm cream page, white cards, indigo accent.
       Mirrors Studio/Companion tokens so D4SG feels like the same world. */
    --bg-0: #F7F3EE;        /* page — warm cream */
    --bg-1: #FFFFFF;        /* cards / panels */
    --bg-2: #FAF7F1;        /* nested surfaces (slightly warm) */
    --ink-hi: #1C1917;      /* primary text — warm stone */
    --ink-mid: #57534E;     /* secondary text — warm gray */
    --ink-low: #A0937B;     /* muted — warm tan */
    --accent: #6366f1;      /* indigo (Spark canonical) */
    --accent-hover: #4f46e5;
    --accent-soft: #EEF2FF;
    --success: #10b981;     /* Spark semantic green */
    --border: #E8E0D2;      /* warm border to match cream */
    --border-strong: #D6CDB8;

    /* Modal: white card on dimmed backdrop */
    --paper: #FFFFFF;
    --paper-soft: #FAF7F1;
    --paper-ink: #1C1917;
    --paper-ink-mid: #57534E;
    --paper-accent: #6366f1;

    /* Elevation tokens — match Spark scale */
    --shadow-sm: 0 1px 2px rgba(17, 17, 17, 0.04), 0 1px 3px rgba(17, 17, 17, 0.06);
    --shadow-md: 0 4px 12px rgba(17, 17, 17, 0.06), 0 2px 4px rgba(17, 17, 17, 0.04);
    --shadow-lg: 0 16px 40px rgba(17, 17, 17, 0.10), 0 4px 12px rgba(17, 17, 17, 0.06);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    background: var(--bg-0);
    color: var(--ink-hi);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
    font-size: 13px;
  }

  /* ============== STICKY HEADER ============== */
  body > header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(247, 243, 238, 0.85);
    backdrop-filter: saturate(180%) blur(16px);
    -webkit-backdrop-filter: saturate(180%) blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 12px 28px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }
  .header-title {
    font-size: clamp(22px, 3vw, 34px);
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--ink-hi);
    margin: 0;
  }
  .header-title .at {
    color: var(--accent);
    font-weight: 700;
  }
  .header-title-link {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .header-title-link:hover { opacity: 0.7; }
  .header-meta {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-low);
  }

  /* ============== LAYOUT ============== */
  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px 28px 64px;
  }

  .project {
    margin-bottom: 48px;
  }
  .project:last-child { margin-bottom: 0; }

  .project-title {
    font-size: clamp(17px, 1.9vw, 22px);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink-hi);
    margin: 0 0 14px;
  }
  .project-blurb {
    font-size: 13px;
    color: var(--ink-mid);
    margin: 0 0 18px;
    max-width: 640px;
  }

  /* Final Project — the "Final Project: Instructable" capstone hero.
     Shares the indigo accent palette and finish-flag glyph with the Progress
     page's final pip so the two read as the same milestone across the app. */
  .project.is-standalone {
    margin-top: 40px;
  }
  .capstone-card {
    position: relative;
    border-radius: 18px;
    padding: 26px 30px 22px;
    cursor: pointer;
    border: 1px solid rgba(99, 102, 241, 0.30);
    background: var(--bg-1);
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.08);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .capstone-card:hover {
    transform: translateY(-2px);
    border-color: rgba(99, 102, 241, 0.50);
    box-shadow: 0 12px 30px rgba(99, 102, 241, 0.16);
  }
  .capstone-card.done {
    border-color: rgba(99, 102, 241, 0.55);
    background: rgba(99, 102, 241, 0.05);
  }
  .capstone-eyebrow {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 5px;
  }
  .capstone-check {
    position: absolute;
    top: 22px;
    right: 24px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid rgba(99, 102, 241, 0.5);
    background: rgba(255, 255, 255, 0.6);
    cursor: pointer;
    padding: 0;
    transition: all 0.15s ease;
    z-index: 2;
  }
  .capstone-check:hover { border-color: var(--success); }
  .capstone-check.checked {
    background: var(--success);
    border-color: var(--success);
  }
  .capstone-check.checked::after {
    content: "";
    position: absolute;
    left: 8px;
    top: 4px;
    width: 6px;
    height: 11px;
    border: solid #fff;
    border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg);
  }
  .capstone-main {
    display: flex;
    align-items: flex-start;
    gap: 18px;
  }
  .capstone-icon {
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    color: var(--accent);
    background: var(--accent-soft);
  }
  .capstone-title {
    margin: 2px 0 6px;
    font-size: clamp(20px, 2.4vw, 26px);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--ink-hi);
    line-height: 1.15;
  }
  .capstone-goal {
    margin: 0;
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink-mid);
    white-space: nowrap;
  }
  .capstone-footer {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid rgba(99, 102, 241, 0.20);
  }
  .capstone-points {
    font-size: 13px;
    font-weight: 800;
    color: var(--accent);
    background: rgba(99, 102, 241, 0.14);
    border: 1px solid rgba(99, 102, 241, 0.30);
    border-radius: 999px;
    padding: 5px 13px;
  }
  .capstone-cta {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
  }
  .capstone-arrow { transition: transform 0.18s ease; }
  .capstone-card:hover .capstone-arrow { transform: translateX(4px); }
  @media (max-width: 900px) {
    .capstone-goal { white-space: normal; }
  }
  @media (max-width: 640px) {
    .capstone-card { padding: 22px 20px; }
    .capstone-footer { flex-wrap: wrap; }
    .capstone-cta { margin-left: 0; }
  }

  /* Project 0: grounding-video accordion. Rows match the Projects 1-3
     benchmark look; clicking a row drops down the video + summary. */
  .vid-acc { display: flex; flex-direction: column; }
  .vid-acc-row { cursor: pointer; }
  .vid-acc-row .checkbox { pointer-events: none; }
  .vid-acc.done .checkbox.checked { background: var(--success); border-color: var(--success); }
  .vid-acc-chevron {
    color: var(--ink-low);
    margin-left: 4px;
    flex-shrink: 0;
    transition: transform 0.2s ease;
  }
  .vid-acc.is-open .vid-acc-chevron { transform: rotate(180deg); }
  .vid-acc.is-open .vid-acc-row {
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
  }
  .vid-acc-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: white;
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 14px 14px;
    padding: 16px 18px 18px;
    margin-top: -2px;
  }
  .vid-acc-panel[hidden] { display: none; }
  /* Classmates' work in Project 0 uses the same .pf-gallery component as
     every other benchmark, so it's viewed/perused consistently. */
  .vid-peers { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .vid-peers-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--ink-low);
    margin: 0;
  }
  /* Two-column panel: smaller video on the left, summary on the right, so a
     student can watch and write the summary at the same time without scrolling. */
  .vid-acc-body { display: flex; gap: 16px; align-items: flex-start; }
  .vid-acc-media-col { flex: 0 0 44%; max-width: 44%; }
  .vid-acc-write-col { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  @media (max-width: 720px) {
    .vid-acc-body { flex-direction: column; }
    .vid-acc-media-col { flex: 1 1 auto; max-width: 100%; width: 100%; }
  }
  /* Name picker is the first thing in the write column, styled exactly like
     the benchmark/portfolio submit picker. Let the column gap handle spacing. */
  .vid-name .name-picker { margin-bottom: 0; }
  .vid-card-media {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #0f172a;
    border-radius: 10px;
    overflow: hidden;
  }
  .vid-card-media iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .vid-card-media--empty {
    display: grid;
    place-items: center;
    background: var(--bg-2);
    color: var(--ink-low);
    font-size: 13px;
    font-weight: 600;
  }
  .vid-card-prompt {
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-mid);
    margin: 0;
  }
  .vid-summary {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-1);
    padding: 10px 12px;
    font: inherit;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--ink-hi);
    resize: vertical;
    min-height: 84px;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .vid-summary:focus { border-color: var(--accent); background: white; }
  .vid-summary::placeholder { color: var(--ink-low); }
  .vid-card-actions {
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    gap: 12px;
    flex-wrap: wrap;
  }
  .vid-saved {
    font-size: 12px;
    font-weight: 600;
    color: var(--success);
    margin-right: auto;
  }
  .vid-save {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.12s ease;
  }
  .vid-save:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
  .vid-save:disabled { background: var(--border); color: var(--ink-low); cursor: not-allowed; }

  .benchmarks {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .benchmark {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 18px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease, box-shadow 0.2s ease;
    user-select: none;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  }
  .benchmark:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
  }
  .benchmark:active {
    transform: translateY(0);
  }

  .checkbox {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border: 2px solid var(--border-strong);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    transition: background 0.15s ease, border-color 0.15s ease;
    cursor: pointer;
  }
  .checkbox:hover {
    border-color: var(--accent-hover);
  }
  .checkbox.checked {
    background: var(--success);
    border-color: var(--success);
  }
  .checkbox.checked::after {
    content: '';
    width: 6px;
    height: 11px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }

  .benchmark-num {
    flex-shrink: 0;
    width: 22px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-low);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
  }
  .benchmark.done .benchmark-num { color: var(--ink-low); opacity: 0.5; }

  .benchmark-label {
    flex: 1;
    font-size: clamp(15px, 1.6vw, 17px);
    font-weight: 500;
    color: var(--ink-hi);
    line-height: 1.45;
  }
  .benchmark.done .benchmark-label {
    color: var(--ink-low);
    text-decoration: line-through;
    text-decoration-color: rgba(107, 114, 128, 0.5);
  }

  .points {
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-mid);
    background: var(--bg-2);
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }

  /* ============== MODAL ============== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    animation: backdropIn 0.2s ease-out;
  }
  .modal-backdrop.open { display: flex; }
  @keyframes backdropIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal {
    background: var(--paper);
    color: var(--paper-ink);
    border-radius: 16px;
    width: min(1180px, 96vw);
    height: min(94vh, 1240px);
    max-height: 94vh;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 40px 80px rgba(0, 0, 0, 0.55),
      0 0 0 1px rgba(0, 0, 0, 0.05);
    animation: modalIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.94) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-header {
    flex-shrink: 0;
    padding: 26px 36px 20px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    background: var(--paper-soft);
  }
  .modal-title-wrap { flex: 1; min-width: 0; }
  .modal-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--paper-accent);
    margin: 0 0 6px;
  }
  .modal-title {
    font-size: clamp(22px, 3vw, 30px);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--paper-ink);
    margin: 0;
    line-height: 1.25;
  }
  .modal-points {
    font-size: 12px;
    font-weight: 600;
    color: var(--paper-ink-mid);
    background: rgba(0, 0, 0, 0.05);
    padding: 6px 12px;
    border-radius: 999px;
    margin-top: 8px;
    display: inline-block;
    font-variant-numeric: tabular-nums;
  }
  .close-btn {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.06);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.15s ease;
    color: var(--paper-ink);
    font-size: 22px;
    line-height: 1;
  }
  .close-btn:hover {
    background: rgba(0, 0, 0, 0.12);
    transform: scale(1.05);
  }

  .modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 22px 36px 28px;
  }
  .modal-section {
    margin-bottom: 28px;
  }
  .modal-section:last-child { margin-bottom: 0; }
  .modal-section h3 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--paper-ink);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .modal-section p {
    font-size: 16px;
    line-height: 1.65;
    color: var(--paper-ink);
    margin: 0 0 12px;
  }
  .modal-section ul {
    margin: 0;
    padding-left: 22px;
    color: var(--paper-ink);
  }
  .modal-section ul li {
    margin-bottom: 6px;
    line-height: 1.55;
  }

  /* ===== Name picker (roster dropdown + "+ Add me" fallback) ===== */
  .name-picker {
    margin-bottom: 18px;
  }
  .name-picker-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--ink-mid);
    margin-bottom: 6px;
  }
  .name-picker-select {
    width: 100%;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    color: var(--ink-hi);
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 38px 12px 14px;
    min-height: 44px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path fill='%23555' d='M6 8L0 0h12z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 10px 7px;
  }
  .name-picker-select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .name-picker-add {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .name-picker-input {
    flex: 1;
    font-size: 16px; /* prevents iOS zoom on focus */
    font-family: inherit;
    color: var(--ink-hi);
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    min-height: 44px;
  }
  .name-picker-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .name-picker-add-btn {
    padding: 0 18px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    color: white;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    min-height: 44px;
    min-width: 72px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .name-picker-add-btn:hover { background: var(--accent-hover); }
  .name-picker-add-btn:active { transform: scale(0.97); }

  /* ===== Identity strip on Tool views ===== */
  .identity-strip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    margin: 0 0 16px;
    background: var(--accent-soft);
    border: 1px solid rgba(59, 130, 246, 0.18);
    border-radius: 12px;
    max-width: 520px;
  }
  .identity-strip-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
    flex-shrink: 0;
  }
  .identity-strip-picker {
    flex: 1;
    min-width: 0;
  }
  .identity-strip-picker .name-picker {
    margin-bottom: 0;
  }
  .identity-strip-picker .name-picker-select {
    background-color: white;
    padding-top: 8px;
    padding-bottom: 8px;
    min-height: 38px;
    font-size: 14px;
  }
  .identity-strip-picker .name-picker-input {
    padding-top: 8px;
    padding-bottom: 8px;
    min-height: 38px;
  }
  .identity-strip-picker .name-picker-add-btn {
    padding-top: 0;
    padding-bottom: 0;
    min-height: 38px;
  }
  @media (max-width: 640px) {
    .identity-strip {
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }
    .identity-strip-label {
      font-size: 11px;
    }
  }

  /* ===== Saved-state pill near Submit ===== */
  .pf-saved-pill {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-mid);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(34, 197, 94, 0.10);
    color: #15803d;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .pf-saved-pill.is-visible { opacity: 1; }
  .pf-saved-pill::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .pf-saved-pill.is-saving {
    color: var(--ink-mid);
    background: rgba(0, 0, 0, 0.04);
  }

  /* ===== Product-benchmark brief: story hook + How Might We + persona roster ===== */
  .cp-brief { display: flex; flex-direction: column; gap: 16px; }
  .cp-brief-hook {
    font-size: 15.5px;
    color: var(--ink-mid);
    margin: 0;
    line-height: 1.6;
    border-left: 3px solid var(--accent);
    padding-left: 14px;
  }
  .cp-brief-challenge {
    font-size: 15.5px;
    font-weight: 600;
    color: var(--ink-hi);
    margin: 0;
    line-height: 1.5;
  }
  .cp-brief-pick {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-low);
    margin: 0;
  }
  .cp-persona-roster {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  @media (max-width: 900px) {
    .cp-persona-roster { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .cp-persona-roster { grid-template-columns: 1fr; }
  }
  .cp-persona {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .cp-persona-name { font-weight: 700; font-size: 14px; color: var(--ink-hi); }
  .cp-persona-cond {
    font-size: 10px;
    color: var(--ink-low);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 4px;
  }
  .cp-persona-row { font-size: 12.5px; color: var(--ink-mid); line-height: 1.45; }
  .cp-persona-row strong { color: var(--ink-hi); font-weight: 600; }

  /* ===== Benchmark step instructions — gorgeous, simple, scannable ===== */
  .cp-steps {
    display: flex;
    flex-direction: column;
  }
  .cp-step {
    padding: 14px 0;
  }
  .cp-step + .cp-step {
    border-top: 1px solid rgba(17, 17, 17, 0.06);
  }
  .cp-step-eyebrow {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .cp-step-body {
    font-size: 15.5px;
    line-height: 1.65;
    color: var(--paper-ink);
  }
  .cp-step-body strong { font-weight: 700; color: var(--paper-ink); }
  .cp-step-body em { font-style: italic; color: var(--paper-ink-mid); }
  .cp-step-body a {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1.5px;
    font-weight: 600;
  }
  .cp-step-body a:hover { color: var(--accent-hover); }
  .cp-step-tool {
    cursor: pointer;
  }

  .video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
  }
  .video-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* Project 0 grounding-video panel: video on the left, writer on the right.
     Right column is sized so it sits next to the video rather than towering
     over it. Stacks below 720px. */
  .vs-panel { padding: 0; background: transparent; border: none; box-shadow: none; }
  .vs-pair {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 16px;
    align-items: start;
  }
  .vs-media {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 16 / 9;
    box-shadow: 0 4px 12px rgba(17, 17, 17, 0.08);
  }
  .vs-media iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .vs-media--empty {
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255, 255, 255, 0.6);
    font-size: 13px;
    aspect-ratio: 16 / 9;
  }
  .vs-write {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .vs-prompt {
    margin: 0;
    font-size: 13px;
    line-height: 1.45;
    color: var(--ink-mid);
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 0 6px 6px 0;
    padding: 7px 11px;
  }
  .vs-textarea {
    width: 100%;
    min-height: 130px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink-hi);
    background: white;
    resize: vertical;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .vs-textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }
  .vs-textarea::placeholder { color: var(--ink-low); }
  .vs-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 2px;
  }
  @media (max-width: 720px) {
    .vs-pair { grid-template-columns: 1fr; gap: 12px; }
    .vs-textarea { min-height: 110px; }
  }

  .links a {
    display: inline-block;
    background: rgba(0, 0, 0, 0.05);
    border: 1px solid rgba(0, 0, 0, 0.1);
    color: var(--paper-ink);
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    margin: 0 8px 8px 0;
    transition: background 0.15s ease;
  }
  .links a:hover {
    background: rgba(0, 0, 0, 0.1);
  }

  .rubric {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
  }
  .rubric-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06);
  }
  .rubric-row:last-child { border-bottom: none; }
  .rubric-criterion { font-weight: 500; color: var(--paper-ink); flex: 1; }
  .rubric-points {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--paper-accent);
    flex-shrink: 0;
  }

  /* ============== HEADER NAV (Homework / Back) ============== */
  .nav-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: white;
    border: 1px solid var(--border);
    color: var(--ink-mid);
    text-decoration: none;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.15s ease;
    margin-right: 10px;
    cursor: pointer;
  }
  .nav-link:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  /* All four nav pills always visible: Home / Tools / Homework / Progress.
     The pill for the current view fills indigo so the student sees where
     they are. No layout jumps as they navigate. */
  .nav-to-home, .nav-to-hw, .nav-to-progress, .nav-to-tools { display: inline-flex; }
  body.view-home .nav-to-home,
  body.view-hw .nav-to-hw,
  body.view-progress .nav-to-progress,
  body.view-tools .nav-to-tools {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  body.view-home .nav-to-home:hover,
  body.view-hw .nav-to-hw:hover,
  body.view-progress .nav-to-progress:hover,
  body.view-tools .nav-to-tools:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: white;
  }

  /* Syllabus — intentionally NOT a pill. It's informational, not an app
     surface. Rendered as a ghost text link with a small doc icon, tucked
     ahead of the nav pills and separated by a thin divider so the eye
     reads it as "context, not a destination". */
  .nav-syllabus {
    background: transparent !important;
    border: none !important;
    color: var(--ink-low);
    padding: 7px 16px 7px 4px;
    border-radius: 0;
    text-transform: none;
    letter-spacing: 0.3px;
    font-size: 12px;
    font-weight: 500;
    font-style: italic;
    margin-right: 12px;
    border-right: 1px solid var(--border) !important;
    gap: 6px;
  }
  .nav-syllabus svg { opacity: 0.7; transition: opacity 0.15s ease; }
  .nav-syllabus:hover {
    background: transparent !important;
    color: var(--accent) !important;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .nav-syllabus:hover svg { opacity: 1; }
  body.view-syllabus .nav-syllabus {
    color: var(--accent) !important;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  body.view-syllabus .nav-syllabus,
  body.view-syllabus .nav-syllabus:hover { background: transparent !important; border-color: transparent var(--border) transparent transparent !important; }

  /* ============== SYLLABUS page ============== */
  /* One column, no card boxes, generous whitespace. Reads like a printed
     handout: title, a lede paragraph, then quietly-titled sections separated
     by hairline rules. Body type is 15.5px with a tall line-height so the
     page breathes. */
  .syllabus {
    max-width: 100%;
    margin: 12px auto 64px;
    padding: 0;
  }
  /* Lead paragraph keeps a readable measure even though the page is wide. */
  .syllabus-lead { max-width: 880px; }
  /* The rest of the syllabus flows as cards that fill the site width, so it
     feels contiguous with the home + Exhibit grids rather than a narrow column. */
  .syllabus-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
    margin-top: 22px;
    align-items: start;
  }
  .syllabus-grid .syllabus-section {
    margin: 0;
    padding: 20px 22px;
    border-top: none;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow-sm);
  }
  /* Instructor sits up top under the title as a flat accent band — deliberately
     NOT a white card, so it reads as a header detail, not one of the sections. */
  .syllabus-instructor {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 14px;
    margin: 4px 0 26px;
    padding: 13px 18px;
    background: var(--accent-soft);
    border-radius: 12px;
  }
  .syllabus-instructor .si-eyebrow {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .syllabus-instructor .si-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-hi);
  }
  .syllabus-instructor .si-meta {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px;
    font-size: 13.5px;
    color: var(--ink-mid);
  }
  .syllabus-instructor a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(99, 102, 241, 0.30);
    transition: border-color 0.15s ease;
  }
  .syllabus-instructor a:hover { border-bottom-color: var(--accent); }
  .syllabus-instructor .si-dot { color: var(--ink-low); }
  .syllabus-head {
    margin-bottom: 8px;
  }
  .syllabus-head-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }
  .syllabus-eyebrow {
    margin: 0 0 14px;
    font-size: clamp(17px, 1.9vw, 22px);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--accent);
    line-height: 1.15;
  }
  .syllabus-title {
    margin: 0 0 16px;
    font-size: clamp(26px, 3vw, 34px);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--ink-hi);
    line-height: 1.1;
  }
  .syllabus-title-at { color: var(--accent); font-style: italic; padding: 0 1px; }

  .syllabus-section {
    padding: 26px 0 4px;
    border-top: 1px solid var(--border);
  }
  .syllabus-section:first-of-type {
    border-top: none;
    padding-top: 8px;
  }
  .syllabus-section-title {
    margin: 0 0 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .syllabus-section p {
    margin: 0;
    font-size: 15.5px;
    line-height: 1.65;
    color: var(--paper-ink);
  }
  .syllabus-section p + p { margin-top: 12px; }
  .syllabus-section strong { color: var(--ink-hi); }
  .syllabus-section em { color: var(--ink-low); font-style: italic; }
  .syllabus-section a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(99, 102, 241, 0.30);
    transition: border-color 0.15s ease;
  }
  .syllabus-section a:hover { border-bottom-color: var(--accent); }

  .syllabus-list {
    margin: 0;
    padding-left: 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 15.5px;
    line-height: 1.6;
    color: var(--paper-ink);
  }
  .syllabus-list strong { color: var(--ink-hi); }
  .syllabus-list--numbered li::marker { color: var(--accent); font-weight: 700; }

  /* Grading: lightweight definition list, two columns. */
  .syllabus-dl {
    margin: 0;
    display: grid;
    gap: 8px 0;
  }
  .syllabus-dl > div {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: baseline;
    padding: 6px 0;
    border-bottom: 1px dashed var(--border);
  }
  .syllabus-dl > div:last-child { border-bottom: none; }
  .syllabus-dl dt {
    margin: 0;
    font-size: 15.5px;
    color: var(--ink-hi);
    font-weight: 600;
  }
  .syllabus-dl dd {
    margin: 0;
    font-size: 15.5px;
    color: var(--accent);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  /* ============== PROGRESS page ============== */
  /* Per-student cards stacked vertically. Each card mirrors the project
     section aesthetic on the home page: white surface, rounded corners,
     soft shadow. Inside each card, one row per project shows the project
     prefix, title, and 5 status pips (1 for the final row). Pips are
     clickable when filled and deep-link to that student's gallery row. */
  .progress-section { margin-bottom: 32px; }
  .progress-board {
    width: 100%;
  }
  .prog-cards {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .prog-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 2px 6px rgba(17, 17, 17, 0.04);
    padding: 24px 28px 26px;
    transition: box-shadow 0.2s ease, transform 0.12s ease;
  }
  .prog-card:hover {
    box-shadow: 0 8px 22px rgba(17, 17, 17, 0.06);
  }
  .prog-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(17, 17, 17, 0.06);
  }
  .prog-card-head-left {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .prog-card-rank {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 30px;
    height: 26px;
    padding: 0 8px;
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.2px;
    font-variant-numeric: tabular-nums;
  }
  /* Podium medals — only the top three. Gold / silver / bronze. */
  .prog-card-rank.is-rank1 { background: linear-gradient(135deg, #fbbf24, #d97706); box-shadow: 0 1px 6px rgba(217, 119, 6, 0.35); }
  .prog-card-rank.is-rank2 { background: linear-gradient(135deg, #cbd5e1, #94a3b8); color: #1f2937; box-shadow: 0 1px 6px rgba(100, 116, 139, 0.30); }
  .prog-card-rank.is-rank3 { background: linear-gradient(135deg, #e0a878, #b06f3c); box-shadow: 0 1px 6px rgba(176, 111, 60, 0.32); }
  /* A soft podium wash on the card itself for the top three. */
  .prog-card.is-rank1 { border-color: rgba(217, 119, 6, 0.40); background: linear-gradient(180deg, rgba(251, 191, 36, 0.10), rgba(255, 255, 255, 0)); }
  .prog-card.is-rank2 { border-color: rgba(100, 116, 139, 0.38); background: linear-gradient(180deg, rgba(148, 163, 184, 0.13), rgba(255, 255, 255, 0)); }
  .prog-card.is-rank3 { border-color: rgba(176, 111, 60, 0.36); background: linear-gradient(180deg, rgba(176, 111, 60, 0.10), rgba(255, 255, 255, 0)); }
  .prog-card-name {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink-hi);
    margin: 0;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .prog-card-you {
    display: inline-flex;
    align-items: center;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .prog-card.is-you {
    border-color: var(--accent);
    box-shadow: 0 2px 8px rgba(99, 102, 241, 0.12);
  }
  .prog-card.is-you:hover {
    box-shadow: 0 8px 24px rgba(99, 102, 241, 0.16);
  }
  /* At-a-glance completion meter, right side of the card header. */
  .prog-card-meter {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .prog-card-meter-num {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-hi);
    font-variant-numeric: tabular-nums;
  }
  .prog-card-meter-den {
    color: var(--ink-low);
    font-weight: 600;
  }
  .prog-card-meter-bar {
    width: 84px;
    height: 6px;
    border-radius: 999px;
    background: var(--bg-2);
    overflow: hidden;
  }
  .prog-card-meter-bar > i {
    display: block;
    height: 100%;
    border-radius: 999px;
    background: var(--success);
    transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .prog-card.is-you .prog-card-meter-bar > i { background: var(--accent); }
  .prog-card-rows {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
  }
  /* Each project is one flowing line: label, a dotted leader that fills the
     gap, then the step pips. The leader is what makes long and short rows read
     as a single connected track instead of floating in empty space. */
  .prog-card-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
  }
  .prog-card-row-prefix {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--ink-low);
    flex-shrink: 0;
    min-width: 58px;
  }
  .prog-card-row-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--paper-ink);
    flex-shrink: 0;
    white-space: nowrap;
  }
  .prog-card-row-lead {
    flex: 1 1 auto;
    min-width: 18px;
    height: 0;
    border-bottom: 1.5px dotted var(--border-strong);
    opacity: 0.55;
    margin: 0 2px;
  }
  /* The culminating Instructable row, set off as the finish line. */
  .prog-card-row.is-final {
    margin-top: 6px;
    padding-top: 14px;
    border-top: 1px dashed var(--border-strong);
  }
  .prog-card-row.is-final .prog-card-row-prefix { color: var(--accent); }
  .prog-card-row.is-final .prog-card-row-title { color: var(--ink-hi); font-weight: 600; }
  .prog-card-row.is-final .prog-card-row-lead { border-bottom-style: dashed; }
  .prog-card-row-dots {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .prog-pip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.6px solid var(--border-strong);
    background: var(--bg-2);
    color: var(--ink-mid);
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    text-decoration: none;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    flex-shrink: 0;
  }
  .prog-pip.is-done {
    background: var(--success);
    border-color: var(--success);
    color: white;
    cursor: pointer;
    animation: progPipPop 0.32s ease both;
  }
  .prog-pip.is-done:hover {
    transform: scale(1.18);
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.32);
  }
  @keyframes progPipPop {
    0%   { transform: scale(0.5); opacity: 0; }
    60%  { transform: scale(1.12); }
    100% { transform: scale(1); opacity: 1; }
  }
  .prog-check-path {
    stroke-dasharray: 26;
    stroke-dashoffset: 26;
    animation: progCheckDraw 0.4s 0.12s ease forwards;
  }
  @keyframes progCheckDraw { to { stroke-dashoffset: 0; } }
  .prog-pip svg {
    width: 13px;
    height: 13px;
  }
  /* Capstone (Instructable) pip: accent-tinted finish-flag when pending. */
  .prog-pip.is-final-pip:not(.is-done) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .prog-pip.is-final-pip svg { width: 14px; height: 14px; }

  /* Homework lives in its own sky-tinted panel at the foot of each card so it
     reads as a separate track from the project work above, but still feels
     like a deliberate part of the same card. */
  .prog-card-hw {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
    padding: 13px 16px;
    background: rgba(125, 211, 252, 0.09);
    border: 1px solid rgba(125, 211, 252, 0.40);
    border-radius: 12px;
  }
  .prog-card-hw-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #0284c7;
    flex-shrink: 0;
  }
  .prog-card-hw-lead {
    flex: 1 1 auto;
    min-width: 14px;
    height: 0;
    border-bottom: 1.5px dotted #7dd3fc;
    opacity: 0.7;
    margin: 0 2px;
  }
  .prog-card-hw-dots {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .prog-pip-hw {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid #7dd3fc;
    background: rgba(125, 211, 252, 0.10);
    color: #0284c7;
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    text-decoration: none;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    flex-shrink: 0;
  }
  .prog-pip-hw.is-done {
    background: #38bdf8;
    border-color: #38bdf8;
    color: white;
    cursor: pointer;
  }
  .prog-pip-hw.is-done:hover {
    transform: scale(1.18);
    box-shadow: 0 4px 12px rgba(56, 189, 248, 0.35);
  }
  .prog-pip-hw svg {
    width: 12px;
    height: 12px;
  }

  .prog-cards-empty {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 40px 24px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(17, 17, 17, 0.04);
  }
  .prog-cards-empty-line {
    margin: 0 0 6px;
    font-size: 15px;
    color: var(--paper-ink);
    font-weight: 600;
  }
  .prog-cards-empty-sub {
    margin: 0;
    font-size: 13px;
    color: var(--ink-low);
  }

  @media (max-width: 720px) {
    .prog-card { padding: 18px 18px 18px; }
    .prog-card-name { font-size: 16px; }
    .prog-card-row { flex-wrap: wrap; gap: 4px 10px; padding: 10px 0; }
    .prog-card-row-prefix { min-width: 0; }
    .prog-card-row-lead { display: none; }
    .prog-card-row-dots { width: 100%; margin-top: 6px; gap: 10px; }
    .prog-card-hw { flex-wrap: wrap; }
    .prog-card-hw-lead { display: none; }
    .prog-card-hw-dots { width: 100%; margin-top: 6px; justify-content: flex-start; }
  }

  /* Instructable submission panel — single link field, slim like checkpoint */
  .instructable-panel .inst-link-input {
    width: 100%;
    border: 1px solid var(--border-strong);
    border-radius: 11px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 14px;
    color: var(--paper-ink);
    background: var(--bg-1);
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .instructable-panel .inst-link-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  /* ============== HOMEWORK page ============== */
  .week-row {
    /* uses .benchmark styles for consistency; only overrides where needed */
  }
  .week-row .checkbox { display: none; } /* homework rows have no checkbox */
  .step-section {
    margin-bottom: 28px;
  }
  .step-section h3 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--paper-ink);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .step-num {
    display: inline-flex;
    width: 24px;
    height: 24px;
    background: var(--accent);
    color: white;
    border-radius: 50%;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(59, 130, 246, 0.25);
  }
  .step-section p {
    font-size: 15px;
    line-height: 1.6;
    color: var(--paper-ink);
    margin: 0 0 14px;
  }
  .tinkercad-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: white;
    text-decoration: none;
    padding: 9px 16px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 14px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .tinkercad-btn:hover { background: var(--accent-hover); }
  .tinkercad-btn:active { transform: translateY(1px); }
  .tinkercad-btn .arrow { font-size: 12px; }

  /* Homework modal: two-column layout (Step 1 left, Step 2 right, no outer scroll) */
  .modal-body.is-hw {
    overflow-y: auto;
    padding: 22px 28px 28px;
  }
  .hw-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    height: 100%;
    align-items: stretch;
  }
  .hw-col {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .hw-col .step-section { margin-bottom: 0; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .hw-col .video-wrap { flex-shrink: 0; max-height: 56vh; aspect-ratio: 16 / 9; }
  .hw-step2-scroll {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    padding-right: 4px;
    margin-right: -4px;
  }
  .hw-col .gallery-grid {
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
  }

  @media (max-width: 720px) {
    .hw-grid { grid-template-columns: 1fr; height: auto; gap: 20px; }
    .modal-body.is-hw { overflow-y: auto; padding: 20px 22px 32px; }
    .hw-col .step-section { flex: 0 0 auto; }
    .hw-step2-scroll { overflow: visible; padding-right: 0; margin-right: 0; }
  }

  /* ============== ARTIFACT COUNT BADGE (on benchmark row) ============== */
  .artifact-count {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid rgba(59, 130, 246, 0.25);
    font-variant-numeric: tabular-nums;
  }
  .artifact-count svg { width: 12px; height: 12px; }

  /* ============== GALLERY (inside modal) ============== */
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  .gallery-tile {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg-2);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.15s ease;
  }
  .gallery-tile:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.10);
  }
  .gallery-tile img,
  .gallery-tile video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .gallery-tile .play-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 30px;
    height: 30px;
    background: rgba(0, 0, 0, 0.55);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 12px;
    pointer-events: none;
  }
  .gallery-tile .tile-caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 14px 8px 6px;
    background: linear-gradient(to top, rgba(0,0,0,0.82), rgba(0,0,0,0));
    color: white;
    font-size: 10px;
    line-height: 1.25;
  }
  .gallery-tile .tile-caption .tile-name {
    font-weight: 700;
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .gallery-tile .tile-caption .tile-desc {
    display: none;
  }
  .gallery-tile .tile-delete {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    border: none;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    line-height: 1;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  body.is-admin .gallery-tile .tile-delete { display: flex; }
  .gallery-tile .tile-delete:hover {
    background: #ef4444;
    transform: scale(1.1);
  }

  /* Add tile (dashed) */
  .add-tile {
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    background: transparent;
    border: 1.5px dashed var(--border-strong);
    color: var(--ink-mid);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    font-weight: 600;
    font-size: 10px;
    text-align: center;
    padding: 4px;
  }
  .add-tile:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .add-tile .plus {
    font-size: 22px;
    line-height: 1;
    font-weight: 300;
  }

  /* Upload form */
  .upload-form {
    grid-column: 1 / -1;
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
  }
  .upload-form label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--ink-low);
  }
  .upload-form input[type="text"],
  .upload-form textarea {
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--bg-2);
    color: var(--paper-ink);
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
    resize: vertical;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 400;
  }
  .upload-form input[type="text"]:focus,
  .upload-form textarea:focus {
    border-color: var(--accent);
    background: white;
  }
  .upload-form input[type="file"] { display: none; }

  /* Smart attachment zone */
  .attach {
    position: relative;
    border: 1.5px dashed var(--border-strong);
    border-radius: 12px;
    background: var(--bg-2);
    transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
    overflow: hidden;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .attach.is-dragover {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: scale(1.005);
  }
  .attach.has-content {
    border-style: solid;
    background: white;
    cursor: default;
    min-height: 0;
  }
  .attach-empty {
    width: 100%;
    padding: 22px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    color: var(--ink-mid);
    text-align: center;
  }
  .attach-empty:hover { color: var(--accent); }
  .attach-empty .attach-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: white;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .attach-empty:hover .attach-icon { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.18); }
  .attach-empty .attach-icon svg { width: 18px; height: 18px; }
  .attach-empty .attach-text {
    font-size: 14px;
    font-weight: 600;
    color: var(--paper-ink);
  }
  .attach-empty .attach-sub {
    font-size: 12px;
    color: var(--ink-low);
  }
  .attach-link-toggle {
    margin-top: 4px;
    background: transparent;
    border: none;
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background 0.15s ease;
  }
  .attach-link-toggle:hover { background: var(--accent-soft); }

  .attach-link-entry {
    display: none;
    padding: 14px;
    width: 100%;
    align-items: center;
    gap: 8px;
  }
  .attach.is-link-entry .attach-empty { display: none; }
  .attach.is-link-entry .attach-link-entry { display: flex; }
  .attach-link-entry input {
    flex: 1;
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: white;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .attach-link-entry input:focus { border-color: var(--accent); }
  .attach-link-entry .icon-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-mid);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
    transition: all 0.15s ease;
  }
  .attach-link-entry .icon-btn:hover { border-color: var(--ink-mid); color: var(--paper-ink); }

  /* Preview card (file or link) */
  .attach-preview {
    display: none;
    padding: 12px;
    width: 100%;
    align-items: center;
    gap: 14px;
  }
  .attach.has-content .attach-preview { display: flex; }
  .attach.has-content .attach-empty,
  .attach.has-content .attach-link-entry { display: none; }
  .attach-preview .preview-thumb {
    flex-shrink: 0;
    width: 64px;
    height: 64px;
    border-radius: 9px;
    overflow: hidden;
    background: var(--bg-2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: var(--accent);
  }
  .attach-preview .preview-thumb img,
  .attach-preview .preview-thumb video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .attach-preview .preview-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .attach-preview .preview-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--paper-ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .attach-preview .preview-meta {
    font-size: 12px;
    color: var(--ink-mid);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .attach-preview .preview-remove {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-mid);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .attach-preview .preview-remove:hover {
    border-color: #ef4444;
    color: #ef4444;
  }
  .attach-preview .preview-loading {
    font-size: 13px;
    color: var(--ink-mid);
    font-style: italic;
  }

  .upload-form .actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    align-items: center;
  }
  .upload-form .btn-cancel {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-mid);
    padding: 10px 18px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
    transition: all 0.15s ease;
  }
  .upload-form .btn-cancel:hover { border-color: var(--border-strong); color: var(--paper-ink); }
  .upload-form .btn-submit {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .upload-form .btn-submit:hover { background: var(--accent-hover); }
  .upload-form .btn-submit:active { transform: translateY(1px); }
  .upload-form .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .upload-form .upload-status {
    font-size: 13px;
    color: var(--ink-mid);
    min-height: 18px;
  }
  .upload-form .upload-status.error { color: #ef4444; }
  /* Link tile chrome */
  .gallery-tile.link-tile .link-chip {
    position: absolute;
    top: 4px;
    left: 4px;
    background: rgba(0, 0, 0, 0.65);
    color: white;
    border-radius: 4px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 2px 5px;
    text-transform: uppercase;
    pointer-events: none;
  }
  .gallery-tile.link-tile .link-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: linear-gradient(135deg, var(--accent-soft), white);
    color: var(--accent);
    padding: 6px;
    text-align: center;
  }
  .gallery-tile.link-tile .link-fallback .link-icon {
    font-size: 20px;
    line-height: 1;
  }
  .gallery-tile.link-tile .link-fallback .link-domain {
    font-size: 10px;
    font-weight: 600;
    color: var(--ink-mid);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
  }

  .gallery-empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--ink-low);
    font-size: 14px;
    padding: 8px 0 16px;
  }

  /* ============== LIGHTBOX ============== */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0, 0, 0, 0.92);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    flex-direction: column;
    gap: 16px;
  }
  .lightbox.open { display: flex; }
  .lightbox-media {
    max-width: min(1100px, 92vw);
    max-height: 78vh;
    border-radius: 12px;
    overflow: hidden;
    background: black;
  }
  .lightbox-media img,
  .lightbox-media video {
    display: block;
    max-width: 100%;
    max-height: 78vh;
    object-fit: contain;
  }
  .lightbox-meta {
    color: white;
    text-align: center;
    max-width: min(700px, 90vw);
  }
  .lightbox-meta .lb-name { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .lightbox-meta .lb-desc { font-size: 14px; opacity: 0.85; line-height: 1.5; }
  .lightbox-close {
    position: absolute;
    top: 18px;
    right: 22px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    color: white;
    border: none;
    font-size: 24px;
    cursor: pointer;
    line-height: 1;
  }
  .lightbox-close:hover { background: rgba(255, 255, 255, 0.22); }

  /* ============== ADMIN CONTROLS ============== */
  .admin-bar {
    display: none;
    align-items: center;
    gap: 10px;
  }
  body.is-admin .admin-bar { display: inline-flex; }
  .admin-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 4px 8px;
    border-radius: 5px;
    border: 1px solid rgba(59, 130, 246, 0.25);
  }
  .archive-btn {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--ink-mid);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .archive-btn:hover {
    border-color: #ef4444;
    color: #ef4444;
  }

  /* ============== PORTFOLIO PANEL (drop + expand) ============== */
  .portfolio-panel {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .portfolio-panel .pf-name-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .portfolio-panel .pf-name-row label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--ink-low);
  }
  .portfolio-panel .pf-name-row input {
    font-family: inherit;
    font-size: 15px;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--bg-2);
    color: var(--paper-ink);
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .portfolio-panel .pf-name-row input:focus {
    border-color: var(--accent);
    background: white;
  }

  .pf-slots {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
  }
  .pf-slot {
    background: var(--bg-2);
    border: 1.5px dashed var(--border-strong);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    display: flex;
    flex-direction: column;
  }
  .pf-slot.is-open {
    border-style: solid;
    border-color: var(--accent);
    background: white;
    box-shadow: 0 6px 18px rgba(59, 130, 246, 0.12);
    grid-column: 1 / -1;
  }
  /* When a slot is open, the small tile of that slot hides (we render the
     full body instead), and every OTHER slot in the row hides too — the
     student focuses on one upload at a time, no clutter. */
  .pf-slot.is-open .pf-slot-tile { display: none; }
  .pf-slots:has(.pf-slot.is-open) .pf-slot:not(.is-open) { display: none; }
  .pf-slot.is-filled:not(.is-open) {
    border-style: solid;
    background: white;
    border-color: var(--border);
  }
  .pf-slot:hover:not(.is-open) {
    border-color: var(--accent);
    color: var(--accent);
  }
  .pf-slot.is-tile-dragover:not(.is-open) {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(59, 130, 246, 0.18);
  }
  .pf-slot-tile {
    cursor: pointer;
    padding: 18px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 120px;
    text-align: center;
    color: var(--ink-mid);
    transition: color 0.15s ease;
    position: relative;
  }
  .pf-slot.is-filled .pf-slot-tile { color: var(--paper-ink); }
  .pf-slot-number {
    position: absolute;
    top: 10px;
    left: 12px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    z-index: 1;
  }
  .pf-slot.is-filled .pf-slot-number { background: var(--success); }
  .pf-slot-icon {
    font-size: 26px;
    line-height: 1;
    color: var(--accent);
  }
  .pf-slot-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }
  .pf-slot-status {
    font-size: 11px;
    color: var(--ink-low);
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
  }
  .pf-slot.is-filled .pf-slot-status { color: var(--success); font-weight: 600; }
  .pf-slot-thumb {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg-2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 18px;
    flex-shrink: 0;
  }
  .pf-slot-thumb img,
  .pf-slot-thumb video {
    width: 100%; height: 100%; object-fit: cover;
  }
  .pf-slot-mini-actions {
    position: absolute;
    top: 6px;
    right: 6px;
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .pf-slot.is-filled .pf-slot-mini-actions { opacity: 0.65; }
  .pf-slot.is-filled:hover .pf-slot-mini-actions { opacity: 1; }
  .pf-slot-mini-actions button {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    color: white;
    border: none;
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .pf-slot-mini-actions button:hover { background: #ef4444; transform: scale(1.05); }

  .pf-slot-body {
    overflow: hidden;
    transition: max-height 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease;
    max-height: 0;
    opacity: 0;
  }
  .pf-slot.is-open .pf-slot-body {
    max-height: 1200px;
    opacity: 1;
  }
  .pf-slot-body-inner {
    padding: 6px 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .pf-slot-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px 8px;
  }
  .pf-slot-head .pf-slot-head-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--paper-ink);
  }
  .pf-slot-head .pf-slot-head-title .pf-slot-icon { font-size: 20px; }
  .pf-slot-collapse {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-mid);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .pf-slot-collapse:hover { border-color: var(--ink-mid); color: var(--paper-ink); }

  .pf-drop {
    border: 1.5px dashed var(--border-strong);
    border-radius: 11px;
    background: var(--bg-2);
    min-height: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--ink-mid);
    cursor: pointer;
    transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
    padding: 18px 14px;
    text-align: center;
  }
  .pf-drop:hover { color: var(--accent); border-color: var(--accent); }
  .pf-drop.is-dragover {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(59, 130, 246, 0.18);
  }
  .pf-drop .pf-drop-icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: white;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
  }
  .pf-drop .pf-drop-icon svg { width: 18px; height: 18px; }
  .pf-drop-text { font-size: 14px; font-weight: 600; color: var(--paper-ink); }
  .pf-drop-sub { font-size: 12px; color: var(--ink-low); }

  /* ============== CHECKPOINT PANEL (benchmarks 1-4) ============== */
  .checkpoint-panel .cp-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 14px;
  }
  .checkpoint-panel .cp-section-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--paper-ink);
    letter-spacing: 0.01em;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .checkpoint-panel .cp-section-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 18px;
  }
  .checkpoint-panel .cp-reflection {
    width: 100%;
    border: 1px solid var(--border-strong);
    border-radius: 11px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.55;
    color: var(--paper-ink);
    background: var(--bg-1);
    resize: vertical;
    min-height: 120px;
    box-sizing: border-box;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .checkpoint-panel .cp-reflection:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .checkpoint-panel .cp-reflection::placeholder {
    color: var(--ink-low);
    white-space: pre-line;
  }
  .checkpoint-panel .cp-preview {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .checkpoint-panel .cp-preview[hidden] { display: none; }
  .checkpoint-panel .cp-preview-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--bg-2);
  }
  .checkpoint-panel .cp-preview-item[data-status="uploading"] { opacity: 0.7; }
  .checkpoint-panel .cp-preview-item[data-status="failed"] { border-color: #fca5a5; background: #fef2f2; }
  .checkpoint-panel .cp-preview-uploading,
  .checkpoint-panel .cp-preview-failed {
    position: absolute;
    top: 4px;
    right: 36px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(0,0,0,0.06);
    color: var(--ink-mid);
  }
  .checkpoint-panel .cp-preview-failed { background: rgba(239, 68, 68, 0.12); color: #b91c1c; }
  .checkpoint-panel .cp-preview img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .checkpoint-panel .cp-preview-pdf {
    width: 64px;
    height: 64px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #fef3c7, #fde68a);
    color: #92400e;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.2px;
  }
  .checkpoint-panel .cp-preview-meta {
    display: flex;
    flex: 1;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-width: 0;
  }
  .checkpoint-panel .cp-preview-name {
    font-size: 13px;
    color: var(--paper-ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .checkpoint-panel .cp-preview-remove {
    background: none;
    border: none;
    font-size: 22px;
    line-height: 1;
    color: var(--ink-low);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.18s ease, color 0.18s ease;
  }
  .checkpoint-panel .cp-preview-remove:hover {
    background: var(--bg-1);
    color: #ef4444;
  }

  .pf-link-row {
    display: flex;
    gap: 8px;
    align-items: center;
    position: relative;
  }
  .pf-link-row .pf-link-input-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }
  .pf-link-row input {
    flex: 1;
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 10px 36px 10px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: white;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .pf-link-row input:focus { border-color: var(--accent); }
  .pf-link-row .pf-link-check {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    line-height: 1;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease, color 0.15s ease;
  }
  .pf-link-row .pf-link-check.is-valid { opacity: 1; color: var(--success); }
  .pf-link-row .pf-link-check.is-invalid { opacity: 1; color: #ef4444; }
  .pf-link-row .pf-link-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--ink-low);
    white-space: nowrap;
  }

  .pf-summary-box {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-2);
    color: var(--paper-ink);
    outline: none;
    resize: vertical;
    min-height: 110px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .pf-summary-box:focus { border-color: var(--accent); background: white; }
  .pf-char-count {
    font-size: 11px;
    color: var(--ink-low);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .pf-char-count.is-warn { color: #d97706; }
  .pf-char-count.is-over { color: #ef4444; font-weight: 600; }

  .pf-filled-preview {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-2);
  }
  .pf-filled-preview .pf-fp-thumb {
    width: 56px;
    height: 56px;
    border-radius: 9px;
    overflow: hidden;
    background: white;
    border: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 22px;
  }
  .pf-filled-preview .pf-fp-thumb img,
  .pf-filled-preview .pf-fp-thumb video { width: 100%; height: 100%; object-fit: cover; }
  .pf-filled-preview .pf-fp-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .pf-filled-preview .pf-fp-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--paper-ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pf-filled-preview .pf-fp-meta {
    font-size: 12px;
    color: var(--ink-mid);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pf-filled-preview .pf-fp-remove {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-mid);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }
  .pf-filled-preview .pf-fp-remove:hover { border-color: #ef4444; color: #ef4444; }

  .pf-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-top: 6px;
  }
  .pf-status {
    font-size: 13px;
    color: var(--ink-mid);
    flex: 1;
    min-height: 18px;
  }
  .pf-status.is-error { color: #ef4444; }
  .pf-submit {
    background: var(--accent);
    color: white;
    border: none;
    padding: 11px 22px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .pf-submit:hover:not(:disabled) { background: var(--accent-hover); }
  .pf-submit:active:not(:disabled) { transform: translateY(1px); }
  .pf-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .pf-submit.is-success {
    background: var(--success);
    opacity: 1;
    cursor: default;
    animation: submitPulse 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes submitPulse {
    0%   { transform: scale(0.96); }
    60%  { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  /* ============== PORTFOLIO GALLERY ============== */
  .pf-gallery {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .pf-gallery-empty {
    text-align: center;
    color: var(--ink-low);
    font-size: 14px;
    padding: 20px 0;
  }

  /* ===== Summary splashboard (Project 0 class submissions) =====
     All student summaries for a video, consolidated into one compact board
     instead of one expandable dropdown per student. Rows clamp to two lines;
     click to expand. "Download PDF" exports every summary as one document. */
  .sb-board {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg-1);
    overflow: hidden;
  }
  .sb-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
  }
  .sb-count {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--ink-low);
  }
  .sb-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .sb-row {
    padding: 11px 14px;
    border-top: 1px solid rgba(17, 17, 17, 0.05);
  }
  .sb-row:first-child { border-top: none; }
  .sb-row-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    cursor: pointer;
  }
  .sb-row-name {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink-hi);
  }
  .sb-row-toggle {
    color: var(--ink-low);
    font-size: 13px;
    transition: transform 0.18s ease;
    flex-shrink: 0;
  }
  .sb-row.is-open .sb-row-toggle { transform: rotate(180deg); }
  .sb-row-text {
    margin: 5px 0 0;
    font-size: 13px;
    line-height: 1.5;
    color: var(--paper-ink);
    white-space: pre-wrap;
  }
  .sb-row-text.is-clamped {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .pf-row {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    animation: pfRowIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes pfRowIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .pf-row.is-open {
    border-color: var(--accent);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.07);
  }
  .pf-row-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s ease;
  }
  .pf-row-head:hover { background: var(--bg-2); }
  .pf-row-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--paper-ink);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pf-row-icons {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .pf-row-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid rgba(59, 130, 246, 0.2);
    border-radius: 50%;
    font-size: 12px;
    line-height: 1;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .pf-row-chip:hover { transform: translateY(-1px); background: white; }
  .pf-row-chip .pf-chip-icon { font-size: 13px; line-height: 1; }
  .pf-row-chip.is-empty {
    background: transparent;
    color: var(--ink-low);
    border-style: dashed;
    font-size: 10px;
    font-weight: 600;
    width: auto;
    height: 22px;
    padding: 0 8px;
    border-radius: 999px;
  }
  .pf-row-caret {
    color: var(--ink-low);
    font-size: 14px;
    line-height: 1;
    transition: transform 0.25s ease;
    flex-shrink: 0;
  }
  .pf-row.is-open .pf-row-caret { transform: rotate(90deg); }
  .pf-row-delete {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-low);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    display: none;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }
  body.is-admin .pf-row-delete { display: flex; }
  .pf-row-delete:hover { border-color: #ef4444; color: #ef4444; }

  .pf-row-body {
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .pf-row.is-open .pf-row-body { max-height: 2400px; }
  .pf-row-body-inner {
    padding: 6px 18px 18px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }
  .pf-view-tile {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    position: relative;
    min-height: 130px;
  }
  .pf-view-tile:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
    border-color: var(--accent);
  }
