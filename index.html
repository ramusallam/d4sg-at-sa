    transition: background 0.15s ease, transform 0.1s ease;
  }
  .pf-submit:hover:not(:disabled) { background: var(--accent-hover); }
  .pf-submit:active:not(:disabled) { transform: translateY(1px); }
  .pf-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .pf-submit.is-success {
    background: var(--success);
    opacity: 1;
    cursor: default;
    animation: submitPulse 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes submitPulse {
    0%   { transform: scale(0.96); }
    60%  { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  /* ============== PORTFOLIO GALLERY ============== */
  .pf-gallery {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .pf-gallery-empty {
    text-align: center;
    color: var(--ink-low);
    font-size: 14px;
    padding: 20px 0;
  }
  /* ===== Jump-to-student picker (above the class submissions list) ===== */
  .pf-jumpbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .pf-jumpbar label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: var(--ink-low);
    white-space: nowrap;
  }
  .pf-jump {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-hi);
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-1, #fff);
    cursor: pointer;
    transition: border-color 150ms, box-shadow 150ms;
  }
  .pf-jump:hover { border-color: var(--accent); }
  .pf-jump:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }

  /* ===== Summary splashboard (Project 0 class submissions) =====
     All student summaries for a video, consolidated into one compact board
     instead of one expandable dropdown per student. Rows clamp to two lines;
     click to expand. "Download PDF" exports every summary as one document. */
  .sb-board {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg-1);
    overflow: hidden;
  }
  .sb-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
  }
  .sb-count {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--ink-low);
  }
  .sb-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .sb-row {
    padding: 11px 14px;
    border-top: 1px solid rgba(17, 17, 17, 0.05);
  }
  .sb-row:first-child { border-top: none; }
  .sb-row-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    cursor: pointer;
  }
  .sb-row-name {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink-hi);
  }
  .sb-row-toggle {
    color: var(--ink-low);
    font-size: 13px;
    transition: transform 0.18s ease;
    flex-shrink: 0;
  }
  .sb-row.is-open .sb-row-toggle { transform: rotate(180deg); }
  .sb-row-text {
    margin: 5px 0 0;
    font-size: 13px;
    line-height: 1.5;
    color: var(--paper-ink);
    white-space: pre-wrap;
  }
  .sb-row-text.is-clamped {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .pf-row {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    animation: pfRowIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes pfRowIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .pf-row.is-open {
    border-color: var(--accent);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.07);
  }
  .pf-row-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s ease;
  }
  .pf-row-head:hover { background: var(--bg-2); }
  .pf-row-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--paper-ink);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pf-row-icons {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .pf-row-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid rgba(99, 102, 241, 0.2);
    border-radius: 50%;
    font-size: 12px;
    line-height: 1;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .pf-row-chip:hover { transform: translateY(-1px); background: white; }
  .pf-row-chip .pf-chip-icon { font-size: 13px; line-height: 1; }
  .pf-row-chip.is-empty {
    background: transparent;
    color: var(--ink-low);
    border-style: dashed;
    font-size: 10px;
    font-weight: 600;
    width: auto;
    height: 22px;
    padding: 0 8px;
    border-radius: 999px;
  }
  .pf-row-caret {
    color: var(--ink-low);
    font-size: 14px;
    line-height: 1;
    transition: transform 0.25s ease;
    flex-shrink: 0;
  }
  .pf-row.is-open .pf-row-caret { transform: rotate(90deg); }
  .pf-row-delete {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-low);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    display: none;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }
  body.is-admin .pf-row-delete { display: flex; }
  .pf-row-delete:hover { border-color: #ef4444; color: #ef4444; }

  .pf-row-body {
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .pf-row.is-open .pf-row-body { max-height: 2400px; }
  .pf-row-body-inner {
    padding: 6px 18px 18px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }
  .pf-view-tile {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    position: relative;
    min-height: 130px;
  }
  .pf-view-tile:hover {
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
    border-color: var(--accent);
  }
  .pf-view-tile.is-expanded {
    grid-column: 1 / -1;
    cursor: default;
  }
  .pf-view-tile.is-expanded:hover { transform: none; }
  .pf-view-head {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pf-view-head .pf-view-icon {
    font-size: 16px;
    line-height: 1;
    color: var(--accent);
  }
  .pf-view-head .pf-view-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--ink-low);
    flex: 1;
  }
  .pf-view-thumb {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 8px;
    overflow: hidden;
    background: white;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 28px;
    position: relative;
  }
  .pf-view-thumb img,
  .pf-view-thumb video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .pf-view-thumb .play-badge {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 30px;
    height: 30px;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 50%;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    pointer-events: none;
  }
  .pf-view-tile.is-expanded .pf-view-thumb {
    aspect-ratio: auto;
    max-height: 60vh;
  }
  .pf-view-tile.is-expanded .pf-view-thumb img {
    object-fit: contain;
    max-height: 60vh;
  }
  .pf-view-tile.is-expanded .pf-view-thumb video {
    object-fit: contain;
    max-height: 60vh;
  }
  .pf-view-filename {
    font-size: 12px;
    color: var(--paper-ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
  }
  .pf-view-open {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--accent);
    color: white;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    transition: background 0.15s ease;
    align-self: flex-start;
  }
  .pf-view-open:hover { background: var(--accent-hover); }
  .pf-view-summary {
    font-size: 13px;
    color: var(--paper-ink);
    line-height: 1.5;
    white-space: pre-wrap;
    overflow: hidden;
    flex: 1;
  }
  .pf-view-summary.is-collapsed {
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
  }
  .pf-view-readmore {
    background: transparent;
    border: none;
    color: var(--accent);
    padding: 0;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    align-self: flex-start;
  }
  .pf-view-readmore:hover { text-decoration: underline; }
  .pf-view-slot-delete {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    color: white;
    border: none;
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.15s ease;
    z-index: 1;
  }
  body.is-admin .pf-view-slot-delete { display: flex; }
  .pf-view-slot-delete:hover { background: #ef4444; transform: scale(1.05); }

  /* ============== ARCHIVE VIEWER ============== */
  .archive-banner {
    background: #fef3c7;
    border: 1px solid #fcd34d;
    color: #78350f;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .archive-banner .archive-banner-tag {
    background: #d97706;
    color: white;
    font-size: 10px;
    letter-spacing: 1.5px;
    padding: 3px 8px;
    border-radius: 5px;
    text-transform: uppercase;
  }
  .archive-banner .archive-banner-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
  }
  .archive-banner button {
    background: white;
    border: 1px solid #d97706;
    color: #78350f;
    padding: 6px 12px;
    border-radius: 7px;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .archive-banner button:hover { background: #d97706; color: white; }
  .archive-banner button.btn-restore { border-color: var(--success); color: #166534; }
  .archive-banner button.btn-restore:hover { background: var(--success); color: white; }

  .archive-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .archive-list-empty {
    text-align: center;
    color: var(--ink-low);
    font-size: 14px;
    padding: 28px 0;
  }
  .archive-list-item {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    cursor: pointer;
    transition: border-color 0.15s ease, box-shadow 0.18s ease, transform 0.12s ease;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .archive-list-item:hover {
    border-color: var(--accent);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
  }
  .archive-list-item .archive-info { flex: 1; min-width: 0; }
  .archive-list-item .archive-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--paper-ink);
    margin-bottom: 3px;
  }
  .archive-list-item .archive-meta {
    font-size: 12px;
    color: var(--ink-mid);
  }
  .archive-list-item .archive-caret { color: var(--ink-low); font-size: 14px; }

  /* "Show next 50" pager */
  .pf-pager {
    display: flex;
    justify-content: center;
    padding: 14px 0 4px;
  }
  .pf-pager button {
    background: white;
    border: 1px solid var(--border-strong);
    color: var(--paper-ink);
    padding: 9px 18px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    transition: all 0.15s ease;
  }
  .pf-pager button:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .pf-pager button:disabled { opacity: 0.5; cursor: default; }

  /* Friendly file-unavailable placeholder */
  .pf-broken {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg-2);
    color: var(--ink-low);
    font-size: 11px;
    font-weight: 600;
    text-align: center;
    padding: 8px;
    gap: 4px;
  }
  .pf-broken .pf-broken-icon { font-size: 20px; opacity: 0.6; }

  /* Soft warning under upload (large file) */
  .pf-soft-warn {
    background: #fef3c7;
    border: 1px solid #fcd34d;
    color: #78350f;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.4;
    margin-top: 6px;
  }

  /* Retry button surfaced after upload failures */
  .pf-retry-btn {
    background: white;
    border: 1px solid #ef4444;
    color: #ef4444;
    padding: 6px 12px;
    border-radius: 7px;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    margin-left: 8px;
    transition: all 0.15s ease;
  }
  .pf-retry-btn:hover { background: #ef4444; color: white; }

  /* Bound thumbnail sizes so the browser doesn't decode at full res */
  .pf-row-chip img,
  .pf-slot-thumb img,
  .pf-fp-thumb img {
    max-width: 120px;
    max-height: 120px;
  }

  /* ============== TABLET ============== */
  @media (max-width: 900px) and (min-width: 641px) {
    .pf-slots { grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .pf-slot-tile { min-height: 110px; padding: 12px 6px; }
    .pf-slot-icon { font-size: 22px; }
    .pf-slot-label { font-size: 11px; letter-spacing: 1px; }
    .pf-slot-status { font-size: 10px; }
  }

  /* ============== REDUCED MOTION ============== */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ============== MOBILE ============== */
  @media (max-width: 640px) {
    .header-inner { padding: 14px 18px; gap: 8px; flex-wrap: wrap; }
    main { padding: 28px 20px 80px; }
    .benchmark { padding: 14px 16px; gap: 12px; }
    .artifact-count { font-size: 11px; padding: 4px 8px; }
    .modal {
      width: 100vw;
      height: 100vh;
      max-height: 100vh;
      border-radius: 0;
    }
    .modal-header { padding: 20px 22px 16px; }
    .modal-body { padding: 20px 22px 32px; }
    .gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pf-slots { grid-template-columns: repeat(3, 1fr); }
    .pf-slot.is-open { grid-column: 1 / -1; }
    .pf-row-body-inner { grid-template-columns: repeat(2, 1fr); }
    .pf-slot-tile { min-height: 100px; padding: 14px 8px; }
    .pf-slot-icon { font-size: 22px; }
  }

  /* ============== TOOLS PAGE ============== */
  .tools-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    margin-bottom: 36px;
  }
  @media (max-width: 760px) {
    .tools-grid { grid-template-columns: 1fr; }
  }
  .tool-card {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 2px 6px rgba(17, 17, 17, 0.04);
    padding: 18px 20px 16px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.15s ease;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 140px;
  }
  .tool-card:hover {
    border-color: var(--accent);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
  }
  .tool-card.is-disabled {
    cursor: not-allowed;
    opacity: 0.78;
  }
  .tool-card.is-disabled:hover {
    transform: none;
    border-color: var(--border);
    box-shadow: 0 2px 6px rgba(17, 17, 17, 0.04);
  }
  .tool-card-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0;
  }
  .tool-card.is-disabled .tool-card-eyebrow {
    color: var(--ink-low);
  }
  .tool-card-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink-hi);
    margin: 0;
  }
  .tool-card-blurb {
    font-size: 14px;
    color: var(--ink-mid);
    margin: 0;
    line-height: 1.55;
  }
  .tool-card-footer {
    margin-top: auto;
    padding-top: 12px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .tool-card.is-disabled .tool-card-footer {
    color: var(--ink-low);
  }

  /* ============== SCHEMATIC TOOL ============== */
  .schem-wrap {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .schem-toolbar {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 14px 18px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    scrollbar-width: thin;
  }
  .schem-toolbar::-webkit-scrollbar { height: 6px; }
  .schem-toolbar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
  .schem-toolbar::-webkit-scrollbar-track { background: transparent; }
  .schem-toolbar > * { flex-shrink: 0; }
  .schem-toolbar-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .schem-toolbar-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-low);
  }
  .schem-color-row {
    display: flex;
    gap: 6px;
  }
  /* Zoom readout sits as a segment inside the toolbar pill, with dividers
     matching the buttons on either side. */
  .schem-zoom-readout {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 50px;
    height: 32px;
    padding: 0 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-mid);
    border-left: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
    user-select: none;
  }
  .schem-zoom-readout + .vibe-tool-btn { border-left: 1px solid var(--border); }
  .schem-color {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    padding: 0;
  }
  .schem-color:hover { transform: scale(1.08); }
  .schem-color.is-active {
    border-color: var(--ink-hi);
    box-shadow: 0 0 0 2px var(--bg-1), 0 0 0 4px var(--ink-hi);
  }
  .schem-btn {
    background: var(--bg-1);
    border: 1px solid var(--border);
    color: var(--ink-mid);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .schem-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .schem-btn.is-primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .schem-btn.is-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: white;
  }
  .schem-btn.is-danger:hover {
    border-color: #dc2626;
    color: #dc2626;
    background: #fef2f2;
  }
  /* Big, foolproof "Back to Tools" pill at the top of every tool detail page.
     Visually a real button so ADHD students never lose the way out. */
  .schem-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: white;
    border: 1.5px solid var(--border);
    color: var(--ink-hi);
    cursor: pointer;
    padding: 9px 18px 9px 14px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 0.4px;
    margin-bottom: 18px;
    transition: all 0.15s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .schem-back:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
    transform: translateX(-2px);
  }
  .schem-back-arrow {
    font-size: 16px;
    line-height: 1;
  }

  .schem-stage {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 16px;
  }
  @media (max-width: 820px) {
    .schem-stage { grid-template-columns: 1fr; }
  }

  .schem-palette {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 640px;
    overflow-y: auto;
  }
  .schem-palette-group {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-low);
    margin: 8px 4px 4px;
  }
  .schem-palette-group:first-child { margin-top: 2px; }
  .schem-palette-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-2);
    cursor: pointer;
    transition: all 0.12s ease;
    font-size: 13px;
    color: var(--ink-hi);
    text-align: left;
    width: 100%;
  }
  .schem-palette-item:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }
  .schem-palette-thumb {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .schem-canvas-wrap {
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    overflow: auto;
    max-height: 640px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
  }
  .schem-canvas {
    display: block;
    background: #FFFFFF;
    border-radius: 8px;
    user-select: none;
  }
  .schem-pin {
    cursor: crosshair;
    transition: fill 0.1s ease, filter 0.1s ease;
  }
  .schem-pin:hover {
    fill: #fbbf24 !important;
    filter: drop-shadow(0 0 4px rgba(251, 191, 36, 0.6));
  }
  /* Breadboard sockets stay invisible until hovered, then gently tint without
     resizing — resizing causes the click target to shrink under the cursor,
     which produces a flickering enter/leave loop ("shake"). */
  .schem-socket:hover {
    fill: rgba(251, 191, 36, 0.22) !important;
    filter: none;
  }
  .schem-pin.is-pending {
    fill: #f59e0b !important;
    stroke: #b45309;
    stroke-width: 2;
  }
  .schem-socket.is-pending {
    fill: rgba(245, 158, 11, 0.35) !important;
    stroke: none;
  }
  .schem-pin-tooltip {
    pointer-events: none;
    font-size: 10px;
    font-weight: 700;
    font-family: system-ui, -apple-system, sans-serif;
    fill: #1f2937;
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3;
    stroke-linejoin: round;
  }
  .schem-component {
    cursor: grab;
  }
  .schem-component.is-dragging { cursor: grabbing; }
  .schem-selection-halo {
    pointer-events: none;
  }
  .schem-palette-ghost {
    position: fixed;
    pointer-events: none;
    opacity: 0.7;
    z-index: 1000;
    filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.25));
  }
  .schem-wire-preview {
    pointer-events: none;
  }
  .schem-wire {
    fill: none;
    stroke-linecap: round;
    pointer-events: stroke;
    cursor: pointer;
  }
  .schem-wire:hover { opacity: 0.7; }
  .schem-solder {
    pointer-events: none;
  }

  .schem-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink-hi);
    color: white;
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    z-index: 200;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
  }
  .schem-toast.is-visible {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px);
  }

  .schem-hint {
    font-size: 12.5px;
    color: var(--ink-mid);
    line-height: 1.55;
    padding: 10px 14px;
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
  }

  /* ============== VIBE CODING TOOL ============== */
  /* Companion layout: AI chat lives in a persistent left pane, the Arduino
     editor + serial monitor in the right pane — both visible at once, like
     ChatGPT next to the Arduino IDE. Stacks vertically on narrow screens. */
  .vibe-wrap {
    display: grid;
    grid-template-columns: minmax(320px, 34%) 1fr;
    gap: 16px;
    margin-top: 8px;
    height: calc(100vh - 150px);
    min-height: 640px;
  }
  @media (max-width: 900px) {
    .vibe-wrap {
      grid-template-columns: 1fr;
      height: auto;
      min-height: 0;
    }
    .vibe-left { height: 70vh; min-height: 460px; }
    .vibe-right { min-height: 520px; }
  }

  /* ----- Left pane: the AI chat companion ----- */
  .vibe-left {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .vibe-left-head {
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--bg-2);
  }
  .vibe-left-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2px;
    color: var(--ink-hi);
    margin: 0;
    display: inline-flex;
    align-items: center;
    gap: 9px;
  }
  .vibe-left-title-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, #14b8a6, var(--accent));
    box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.16);
  }
  .vibe-left-clear {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-low);
    border-radius: 8px;
    padding: 5px 11px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .vibe-left-clear:hover { border-color: var(--ink-mid); color: var(--ink-mid); }

  @media (max-width: 980px) {
    .vibe-wrap { height: auto; }
  }
  .vibe-panel {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .vibe-panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--bg-2);
  }
  .vibe-panel-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-mid);
    margin: 0;
  }
  .vibe-panel-actions {
    display: flex;
    gap: 5px;
    align-items: center;
    flex-wrap: wrap;
  }

  /* Chat panel */
  .vibe-chat-scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }
  .vibe-msg {
    max-width: 92%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .vibe-msg-user {
    align-self: flex-end;
    background: var(--accent);
    color: white;
    border: none;
  }
  .vibe-msg-ai {
    align-self: flex-start;
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--ink-hi);
  }
  .vibe-msg-error {
    align-self: flex-start;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    font-size: 13.5px;
  }
  .vibe-msg-loading {
    align-self: flex-start;
    color: var(--ink-mid);
    font-size: 13.5px;
    font-style: italic;
    animation: vibePulse 1.4s ease-in-out infinite;
  }
  @keyframes vibePulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  .vibe-msg-codepreview {
    margin-top: 8px;
    background: #1e293b;
    color: #e2e8f0;
    border-radius: 8px;
    padding: 10px 12px;
    font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    line-height: 1.5;
    max-height: 180px;
    overflow: auto;
    white-space: pre;
  }
  .vibe-msg-copybtn {
    margin-top: 8px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .vibe-msg-copybtn:hover { background: var(--accent-hover); }
  .vibe-msg-copybtn.is-copied { background: var(--success); }

  .vibe-stems-wrap {
    border-top: 1px solid var(--border);
    background: var(--bg-2);
    padding: 9px 14px 0;
  }
  .vibe-stems {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .vibe-stem {
    background: white;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-mid);
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .vibe-stem:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .vibe-stem--primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 3px 10px rgba(99, 102, 241, 0.22);
  }
  .vibe-stem--primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: #fff;
  }
  .vibe-stem--primary .vibe-stem-icon { opacity: 1; }
  .vibe-stem-icon { font-size: 10.5px; opacity: 0.7; }

  /* The composer card — textarea + send button share one rounded card that
     lifts on focus (the signature premium moment). */
  .vibe-input-row {
    border-top: 1px solid var(--border);
    padding: 12px 14px 14px;
    background: var(--bg-2);
  }
  .vibe-composer {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px 8px 8px 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .vibe-composer:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15), 0 6px 18px rgba(99, 102, 241, 0.10);
  }
  /* The textarea sits transparently on top of a mirror layer that re-renders
     the same text. The mirror is what's actually visible — it lets us paint
     the <FILL-IN> tokens blue, which a bare textarea can't do. The two share
     identical box metrics so the caret lands exactly on the painted glyphs. */
  .vibe-input-wrap {
    flex: 1 1 auto;
    position: relative;
    display: flex;
    min-width: 0;
  }
  .vibe-input,
  .vibe-input-mirror {
    font: inherit;
    font-size: 14.5px;
    line-height: 1.5;
    padding: 7px 0;
    letter-spacing: normal;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .vibe-input {
    position: relative;
    z-index: 1;
    flex: 1 1 auto;
    width: 100%;
    border: none;
    background: transparent;
    min-height: 76px;
    max-height: 220px;
    overflow-y: auto;
    color: transparent;
    caret-color: var(--ink-hi);
    resize: none;
    outline: none;
  }
  .vibe-input-mirror {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow-y: auto;
    pointer-events: none;
    color: var(--ink-hi);
    margin: 0;
  }
  /* Empty mirror shows nothing; the textarea's own ::placeholder handles the
     hint so we don't double up. */
  .vibe-input-mirror:empty { display: none; }
  .vibe-fillin {
    color: var(--accent);
    font-weight: 600;
    background: var(--accent-soft);
    border-radius: 4px;
    padding: 0 2px;
  }
  .vibe-input::placeholder { color: var(--ink-low); }
  /* When a stem auto-selects the fill-in token, keep that selection blue too. */
  .vibe-input::selection { background: rgba(99, 102, 241, 0.22); }

  /* Empty state: no conversation yet. Collapse the blank chat scroll and let
     the composer grow to fill the panel as one big writing box. */
  .vibe-left.is-empty .vibe-chat-scroll {
    flex: 0 0 0;
    min-height: 0;
    padding: 0;
    overflow: hidden;
  }
  .vibe-left.is-empty .vibe-input-row {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
  }
  .vibe-left.is-empty .vibe-composer {
    flex: 1 1 auto;
    align-items: stretch;
  }
  .vibe-left.is-empty .vibe-input-wrap { height: 100%; }
  .vibe-left.is-empty .vibe-input {
    max-height: none;
    height: 100%;
  }
  .vibe-left.is-empty .vibe-send-btn { align-self: flex-end; }

  .vibe-send-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 11px;
    padding: 0;
    width: 40px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.12s ease, opacity 0.15s ease;
    flex-shrink: 0;
  }
  .vibe-send-btn:hover:not(:disabled) { transform: translateY(-1px); background: var(--accent-hover); }
  .vibe-send-btn:disabled {
    background: var(--border);
    color: var(--ink-low);
    cursor: not-allowed;
  }
  /* Markdown rendering inside assistant chat bubbles. */
  .vibe-md p { margin: 0 0 8px; }
  .vibe-md p:last-child { margin-bottom: 0; }
  .vibe-md ul, .vibe-md ol { margin: 4px 0 8px; padding-left: 20px; }
  .vibe-md li { margin: 2px 0; }
  .vibe-md strong { font-weight: 700; color: var(--ink-hi); }
  .vibe-md code {
    font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 5px;
  }
  /* A generated-code block in chat, with its own action bar. */
  .vibe-codeblock {
    margin: 10px 0 6px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #1e293b;
  }
  .vibe-codeblock-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: #0f172a;
    padding: 6px 10px;
  }
  .vibe-codeblock-lang {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #94a3b8;
  }
  .vibe-codeblock-actions { display: flex; gap: 6px; }
  .vibe-codeblock-btn {
    background: #1e293b;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 7px;
    padding: 4px 10px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.14s ease, border-color 0.14s ease;
  }
  .vibe-codeblock-btn:hover { background: #334155; }
  .vibe-codeblock-btn.is-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .vibe-codeblock-btn.is-primary:hover { background: var(--accent-hover); }
  .vibe-codeblock-btn.is-done { background: var(--success); border-color: var(--success); color: #fff; }
  .vibe-codeblock pre {
    margin: 0;
    background: #1e293b;
    color: #e2e8f0;
    font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    line-height: 1.5;
    padding: 11px 12px;
    max-height: 260px;
    overflow: auto;
    white-space: pre;
  }

  /* Compact "loaded into editor" confirmation chip — replaces the duplicate
     black code box in the chat. Keeps the conversation clean so only the
     wiring + loading instructions remain readable. */
  .vibe-codeloaded {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0 6px;
    padding: 9px 11px;
    border-radius: 10px;
    border: 1px solid rgba(16, 185, 129, 0.32);
    background: rgba(16, 185, 129, 0.08);
  }
  .vibe-codeloaded-icon {
    flex: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--success);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
    line-height: 1;
  }
  .vibe-codeloaded-text {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-hi);
  }
  .vibe-codeloaded-actions { display: flex; gap: 6px; flex: none; }
  .vibe-codeloaded-btn {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 4px 10px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-mid);
    cursor: pointer;
    transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease;
  }
  .vibe-codeloaded-btn:hover { background: var(--bg-2); border-color: var(--border-strong); }
  .vibe-codeloaded-btn.is-done { color: var(--success); border-color: var(--success); }

  /* Editor panel: takes full page width now. Editor expands, monitor docks
     at bottom. */
  .vibe-right {
    display: grid;
    grid-template-rows: auto auto 1fr auto auto auto;
    min-height: 0;
    flex: 1 1 auto;
  }
  .vibe-editor-wrap {
    flex: 1 1 auto;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 340px;
  }
  .vibe-editor-wrap .vibe-monaco {
    width: 100%;
    height: 100%;
    min-height: 0;
    flex: 1 1 auto;
  }
  /* Let Monaco's find/IntelliSense overflow widgets escape the editor box. */
  .vibe-editor-wrap .monaco-editor .overflow-guard { border-radius: 0; }
  .vibe-editor-fallback {
    flex: 1 1 auto;
    width: 100%;
    border: none;
    padding: 14px 16px;
    font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    line-height: 1.55;
    background: var(--bg-1);
    color: var(--ink-hi);
    resize: none;
    outline: none;
  }
  .vibe-monitor-header {
    background: #0f172a;
    color: #cbd5e1;
    padding: 7px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-top: 1px solid var(--border);
  }
  .vibe-monitor-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: #94a3b8;
    margin: 0;
  }
  .vibe-monitor-controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .vibe-monitor-controls select,
  .vibe-monitor-controls .vibe-mini-btn {
    background: #1e293b;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 5px 11px;
    font-size: 11.5px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .vibe-monitor-controls .vibe-mini-btn:hover {
    background: #334155;
  }
  .vibe-example-select {
    background: #1e293b;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 11.5px;
    font-family: inherit;
    cursor: pointer;
    max-width: 160px;
    height: 30px;
  }
  .vibe-monitor {
    background: #0b1220;
    color: #4ade80;
    font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    line-height: 1.5;
    padding: 8px 14px;
    height: 68px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .vibe-monitor::-webkit-scrollbar { width: 10px; }
  .vibe-monitor::-webkit-scrollbar-track { background: #0b1220; }
  .vibe-monitor::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  .vibe-monitor::-webkit-scrollbar-thumb:hover { background: #334155; }
  .vibe-monitor-empty {
    color: #475569;
    font-style: italic;
  }
  .vibe-monitor-send {
    display: flex;
    align-items: stretch;
    gap: 6px;
    padding: 6px 8px;
    background: #0b1220;
    border-top: 1px solid #1e293b;
  }
  .vibe-monitor-input {
    flex: 1 1 auto;
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 6px;
    color: #e2e8f0;
    padding: 5px 9px;

  .vibe-monitor-input::placeholder { color: #475569; }
  .vibe-monitor-input:disabled { opacity: 0.5; }
  .vibe-monitor-ending {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 6px;

  .vibe-monitor-send-btn {
    background: var(--accent);

    border-color: var(--accent);
    padding: 5px 14px;
    font-weight: 600;
  }
  .vibe-monitor-send-btn:hover:not(:disabled) {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }
  .vibe-monitor-send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .vibe-monitor-fix-btn {
    display: inline-flex;
    align-items: center;

    background: var(--accent);
    color: white;
    border: 1px solid var(--accent);

    padding: 4px 12px;
    font-family: inherit;
    font-size: 11.5px;

  }
  .vibe-monitor-fix-btn:hover { background: var(--accent-hover); }
  .vibe-monitor-fix-btn:active { transform: translateY(1px); }
  /* Secondary "Explain this error" button — outline, sits beside the fix button.
     Explaining first (instead of auto-fixing) is the pedagogical default. */
  .vibe-monitor-explain-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    color: #93c5fd;
    border: 1px solid #3b557a;
    border-radius: 6px;
    padding: 4px 12px;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    margin: 4px 0 4px 8px;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .vibe-monitor-explain-btn:hover { background: rgba(147,197,253,0.12); border-color: #93c5fd; }
  .vibe-monitor-explain-btn:active { transform: translateY(1px); }

  .vibe-btn {
    background: var(--bg-1);
    border: 1px solid var(--border);
    color: var(--ink-mid);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  /* Icon-only segmented toolbar: each button is a 34x34 square with the
     icon centered. Buttons within a group share a soft container with
     internal dividers. Hover lifts to white + indigo icon; active state
     fills indigo. Reads as a deliberate, slick toolbar component. */
  .vibe-toolbar-group {
    display: inline-flex;
    align-items: stretch;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    padding: 0;
    box-shadow: 0 1px 0 rgba(17, 17, 17, 0.02);
  }
  .vibe-tool-btn {
    background: transparent;
    border: none;
    color: var(--ink-mid);
    width: 36px;
    height: 32px;
    padding: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.14s ease, color 0.14s ease, transform 0.12s ease;
    line-height: 1;
    font-family: inherit;
  }
  .vibe-tool-btn + .vibe-tool-btn { border-left: 1px solid var(--border); }
  .vibe-tool-btn svg {
    color: var(--ink-mid);
    transition: color 0.14s ease, transform 0.12s ease;
    display: block;
  }
  .vibe-tool-btn:hover {
    background: white;
  }
  .vibe-tool-btn:hover svg {
    color: var(--accent);
    transform: scale(1.08);
  }
  .vibe-tool-btn:active svg { transform: scale(0.94); }
  .vibe-tool-btn.is-active,
  .vibe-tool-btn.is-copied {
    background: var(--accent);
  }
  .vibe-tool-btn.is-active svg,
  .vibe-tool-btn.is-copied svg { color: white; }

  /* Floating hover tooltip for tool buttons. Body-mounted so the toolbar
     group's overflow:hidden can't clip it. */
  .tt-tooltip {
    position: fixed;
    z-index: 1300;
    background: #111827;
    color: #f9fafb;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.2;
    padding: 6px 10px;
    border-radius: 6px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity 0.12s ease, transform 0.12s ease;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.18), 0 1px 3px rgba(15, 23, 42, 0.08);
    letter-spacing: 0;
    text-transform: none;
  }
  .tt-tooltip.is-visible {
    opacity: 1;
    transform: translateY(0);
  }
  .vibe-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .vibe-btn.is-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .vibe-btn.is-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: white;
  }
  .vibe-btn.is-active {
    background: var(--success);
    border-color: var(--success);
    color: white;
  }
  .vibe-btn.is-copied {
    background: var(--success);
    border-color: var(--success);
    color: white;
  }

  /* "+ Save to..." popover (shared by Schematic + Vibe Coding tools). */
  .save-to-anchor {
    position: relative;
    display: inline-block;
  }
  .save-to-pop {
    position: fixed;
    z-index: 1200;
    width: 320px;
    max-height: 460px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 12px 32px rgba(15, 23, 42, 0.14), 0 2px 6px rgba(15, 23, 42, 0.06);
    padding: 6px 0;
    text-align: left;
  }
  .save-to-section {
    border-top: 1px solid var(--border);
    padding: 8px 0 6px;
  }
  .save-to-section:first-child { border-top: none; }
  .save-to-eyebrow {
    display: block;
    padding: 6px 14px 4px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--ink-mid);
  }
  .save-to-item {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 38px;
    padding: 8px 14px;
    background: transparent;
    border: 0;
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
    letter-spacing: 0;
    text-transform: none;

  .save-to-item:hover:not(:disabled) {
    background: var(--bg-2);
    color: var(--accent);
  }
  .save-to-item:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .save-to-item.is-portfolio {
    font-weight: 600;
    color: var(--accent);
  }
  .save-to-item.is-portfolio:hover:not(:disabled) {
    background: var(--accent-soft);
  }
  .save-to-item .save-to-arrow {
    margin-right: 4px;
    opacity: 0.6;
  }

  /* Chat avatars — ChatGPT-style "AI" / "You" mini circles next to each
     message. Keeps the conversation legible at a glance. */
  .vibe-msg-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .vibe-msg-row.is-user { flex-direction: row-reverse; }
  .vibe-msg-row.is-loading { gap: 10px; }
  .vibe-msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.4px;
    color: white;
    margin-top: 2px;
  }
  .vibe-msg-avatar.is-ai {
    background: linear-gradient(135deg, #14b8a6, #0d9488);
  }
  .vibe-msg-avatar.is-user {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
  }
  .vibe-msg-row .vibe-msg { max-width: 100%; flex: 1 1 auto; }

  /* Libraries strip — sits above the editor, mimics Arduino IDE's
     "library inclusions" visibility. Auto-detects #include lines from the
     editor and surfaces quick-add buttons for the libraries the class uses. */
  .vibe-libs {
    background: var(--bg-2);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 9px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 12px;
  }
  .vibe-libs-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--ink-low);
    flex-shrink: 0;
  }
  .vibe-libs-active {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1 1 auto;
    min-width: 0;
  }
  .vibe-libs-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    color: var(--paper-ink);
  }
  .vibe-libs-chip.is-empty {
    background: transparent;
    border-style: dashed;
    color: var(--ink-low);
    font-family: inherit;
    font-style: italic;
  }
  .vibe-libs-add {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .vibe-libs-add button {
    background: white;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    color: var(--accent);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .vibe-libs-add button:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .vibe-libs-add button:disabled {
    color: var(--ink-low);
    cursor: not-allowed;
    opacity: 0.6;
  }

  /* Connection status strip at the very bottom of the right panel. */
  .vibe-status {
    background: var(--bg-2);
    border-top: 1px solid var(--border);
    padding: 7px 14px;
    font-size: 11.5px;
    color: var(--ink-mid);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .vibe-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ink-low);
  }
  .vibe-status.is-connected .vibe-status-dot { background: var(--success); }
  .vibe-status.is-connected { color: var(--paper-ink); }
  /* One continuous toolbar across the top — never wraps to a second line.
     If the viewport is too narrow to hold every group, the bar scrolls
     horizontally (slim styled scrollbar) instead of stacking. */
  /* ====== Idea Board v2 (Excalidraw embedded) ====== */
  .idea-pro-wrap {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    height: calc(100vh - 150px);
    min-height: 760px;
  }
  .idea-pro-wrap .schem-back { align-self: flex-start; }
  /* Horizontal strip of one-click AT component stamps above the canvas. */
  .idea-pro-stamps {
    display: flex;
    flex-wrap: wrap;             /* every chip visible - wrap, never scroll */
    gap: 5px;
    padding: 8px 10px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .idea-stamp-btn {
    flex: 0 0 auto;              /* keep natural width; don't squish */
    white-space: nowrap;
    background: white;
    border: 1px solid var(--border);
    color: var(--ink-mid);
    padding: 4px 9px;
    border-radius: 7px;
    font: inherit;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease, transform 0.1s ease;
  }
  .idea-stamp-btn:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .idea-stamp-btn:active { transform: translateY(1px); }
  .idea-pro-frame {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(17, 17, 17, 0.04);
  }
  .idea-pro-canvas {
    position: absolute;
    inset: 0;
    background: #ffffff;
  }
  /* We drive Excalidraw entirely from our own docked toolbar (.idea-toolbar),
     so hide ALL of its built-in chrome. Excalidraw puts that chrome in
     different direct children of .excalidraw depending on width — desktop uses
     .layer-ui__wrapper; the narrow/compact layout uses .App-top-bar +
     .App-bottom-bar. Rather than chase class names per breakpoint, hide every
     direct-child UI div and allowlist only the functional overlays we need:
     the canvas wrapper, the text-edit container, the right-click context menu,
     the eyedropper, and the laser overlay. The interactive <canvas> is a direct
     child too but it's a <canvas> (not a div), so this never touches it. */
  .idea-pro-canvas .excalidraw > div:not(.excalidraw__canvas-wrapper):not(.excalidraw-textEditorContainer):not(.excalidraw-contextMenuContainer):not(.excalidraw-eye-dropper-container):not(.LaserToolOverlay) {
    display: none !important;
  }

  /* ---- Unified docked drawing toolbar (replaces Excalidraw's floating UI) ---- */
  .idea-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    padding: 8px 10px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .idea-tb-group { display: flex; align-items: center; gap: 4px; }
  .idea-tb-colors { gap: 7px; padding: 0 2px; }
  .idea-tb-div {
    width: 1px;
    align-self: stretch;
    background: var(--border-strong);
    margin: 3px 7px;
  }
  .idea-tool-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    padding: 0;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--ink-mid);
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease, transform 0.08s ease;
  }
  .idea-tool-btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .idea-tool-btn:active { transform: translateY(1px); }
  .idea-tool-btn.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .idea-tool-btn--danger:hover { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }
  .idea-color-swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px var(--border);
    padding: 0;
    transition: transform 0.08s ease, box-shadow 0.12s ease;
  }
  .idea-color-swatch:hover { transform: scale(1.14); }
  .idea-color-swatch.is-active { box-shadow: 0 0 0 2px var(--accent); }
  /* Fill swatches are SQUARES to read differently from the round stroke swatches. */
  .idea-fill-swatch {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    cursor: pointer;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px var(--border);
    padding: 0;
    transition: transform 0.08s ease, box-shadow 0.12s ease;
  }
  .idea-fill-swatch:hover { transform: scale(1.14); }
  .idea-fill-swatch.is-active { box-shadow: 0 0 0 2px var(--accent); }
  /* "No fill" chip: white with a red diagonal slash. */
  .idea-fill-clear {
    background: #fff;
    background-image: linear-gradient(45deg, transparent 44%, #ef4444 44%, #ef4444 56%, transparent 56%);
  }
  .idea-tb-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--ink-mid);
    opacity: 0.7;
    margin-right: 3px;
  }
  .idea-zoom-label {
    min-width: 44px;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-mid);
    font-variant-numeric: tabular-nums;
  }

  /* "New version available" banner — surfaced when the loaded index.html no
     longer matches what the server is serving (single-page app can't see new
     deploys without a full reload). */
  #updateBanner {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--accent);
    color: #fff;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.20);
  }
  #updateBannerBtn {
    background: #fff;
    color: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 6px 14px;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  #updateBannerBtn:hover { background: #eef2ff; }
  /* Excalidraw root mounts inside .idea-pro-canvas; the library renders its
     own toolbar, hand-drawn shapes, palette, etc. We only constrain it to fit
     the working area. */
  .idea-pro-canvas .excalidraw {
    height: 100%;
    width: 100%;
  }
  .idea-pro-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-direction: column;
    color: var(--ink-mid);
    font-size: 13.5px;
    pointer-events: none;
  }
  .idea-pro-loading .spin {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2.5px solid var(--border-strong);
    border-top-color: var(--accent);
    animation: spin360 0.9s linear infinite;
  }
  .idea-pro-error {
    color: #b91c1c;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 10px;
    padding: 14px 18px;
    max-width: 480px;
    text-align: center;
    font-size: 13.5px;
    line-height: 1.55;
    pointer-events: auto;
  }

  .idea-toolbar {
    display: flex;
    align-items: center;
    gap: 6px 10px;
    flex-wrap: wrap;             /* every tool visible - wrap, never scroll */
    padding: 8px 12px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
  }
  .idea-toolbar > * { flex-shrink: 0; }
  .idea-color {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    padding: 0;
  }
  .idea-color:hover { transform: scale(1.08); }
  .idea-color.is-active {
    border-color: var(--ink-hi);
    box-shadow: 0 0 0 2px var(--bg-1), 0 0 0 4px var(--ink-hi);
  }
  @keyframes spin360 { to { transform: rotate(360deg); } }


  /* Exhibit page hero */
  .exhibit-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: normal;
    text-transform: none;
    color: var(--ink-low);
    text-decoration: none;
    background: transparent;
    border: none;
    margin: 0;
    padding: 0;
    transition: color .15s ease, gap .15s ease;
  }
  .exhibit-back:hover { color: var(--accent); gap: 9px; background: transparent; border-color: transparent; }
  .exhibit-title {
    font-size: clamp(30px, 5vw, 46px);
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--ink-hi);
    margin: 0 0 14px;
    line-height: 1.04;
  }

  /* Card grid */
  .exhibit-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(278px, 1fr));
    gap: 22px;
  }
  .exhibit-card {
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    text-decoration: none;
    box-shadow: var(--shadow-sm);
    transition: transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s ease, border-color .2s ease;
  }
  .exhibit-card:hover {
    box-shadow: var(--shadow-lg);
    border-color: var(--border-strong);
  }
  .exhibit-thumb {
    position: relative;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: linear-gradient(135deg, var(--accent-soft), #ffffff 70%);
  }
  .exhibit-thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;

  const LAST_PICK_KEY = 'd4sg-last-pick-v1';
  // "Maya R." → "maya-r", used as a stable id in Firestore doc paths.
  function nameSlug(name) {
    return String(name || '')
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }
  // Live roster: ROSTER ∪ any names ever added through the picker.
  // Subscribes once on load; subsequent reads use _liveRoster.
  let _liveRoster = [...ROSTER];
  const _rosterSubs = new Set();
  function subscribeRoster(cb) {
    _rosterSubs.add(cb);
    cb(_liveRoster);
    return () => _rosterSubs.delete(cb);
  }
  function _setLiveRoster(names) {
    const merged = Array.from(new Set([...ROSTER, ...names])).sort((a, b) =>
      a.localeCompare(b, undefined, { sensitivity: 'base' })
    );
    _liveRoster = merged;
    // A remembered last pick that's no longer on the roster (retired seed
    // names, purged test students) must not resurrect through pickers.
    try {
      const stored = (localStorage.getItem(LAST_PICK_KEY) || '').trim();
      if (stored && !merged.some(n => n.toLowerCase() === stored.toLowerCase())) {
        localStorage.removeItem(LAST_PICK_KEY);
      }
    } catch (_) {}
    _rosterSubs.forEach(cb => { try { cb(_liveRoster); } catch (e) {} });
  }
  onSnapshot(collection(db, 'students'), (snap) => {
    const fromFirestore = [];
    snap.forEach(d => {
      const v = d.data();
      if (v && !v.deleted && typeof v.name === 'string' && v.name.trim()) fromFirestore.push(v.name.trim());
    });
    _setLiveRoster(fromFirestore);
  });
  async function ensureRosterEntry(name) {
    const slug = nameSlug(name);
    if (!slug) return;
    try {
      await setDoc(
        doc(db, 'students', slug),
        { name: name.trim(), joinedAt: serverTimestamp() },
        { merge: true }
      );
    } catch (e) {
      console.warn('roster add failed', e);
    }
  }

  // panels pre-select correctly when they hit "Save to benchmark".
  // ---- Per-view teardown ----
  // Each view/tool that attaches document-level listeners, Firestore
  // subscriptions, a serial port, or editor instances registers ONE cleanup
  // here; applyRoute runs it before rendering the next view.
  let _viewTeardown = null;

  function cleanupIdentityStrip(mountEl) {
    if (!mountEl || !mountEl.querySelector) return;
    const strip = mountEl.querySelector('.identity-strip');
    if (strip && typeof strip._cleanup === 'function') { try { strip._cleanup(); } catch (_) {} }
  }

  function renderIdentityStrip(opts = {}) {
    const wrap = document.createElement('div');
    wrap.className = 'identity-strip';
    wrap.innerHTML = `
      <span class="identity-strip-label">Saving as</span>
      <div class="identity-strip-picker" data-identity-picker></div>

    if (innerLabel) innerLabel.style.display = 'none';
    mount.appendChild(picker.element);
    wrap._cleanup = () => picker.destroy();
    return wrap;
  }

  // one project's benchmark straight to another is a single click — the home
  // tab stays parked on the full project list the whole time. If a pop-up
  // blocker eats the new tab, fall back to the in-page modal so nothing breaks.
  const WORK_TAB_NAME = 'd4sgBenchmark';
  // Make a clickable card/row reachable by keyboard: Tab to focus, Enter or
  // Space to activate (fires its click handler).
  function makeKeyActivatable(el, role) {
    el.setAttribute('tabindex', '0');
    el.setAttribute('role', role || 'button');
    el.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      if (e.target !== el) return; // let inner controls keep their own keys
      e.preventDefault();
      el.click();
    });
  }

  // Heads-up channel between tabs: right before a card click navigates the
  // work tab, the clicking tab broadcasts "will-navigate" so the work tab can
  // blank itself to plain cream. Without this, the reused tab sits frozen on
  // the PREVIOUS benchmark for the whole page load — the "flashes something
  // else for a millisecond" feel.
  const NAV_CHANNEL = ('BroadcastChannel' in window) ? new BroadcastChannel('d4sg-worktab-nav') : null;
  function blankForNav() {
    document.documentElement.classList.add('nav-blanking');
    // Failsafe: if the navigation never lands (offline, blocked), come back.
    setTimeout(() => document.documentElement.classList.remove('nav-blanking'), 2500);
  }
  if (NAV_CHANNEL) {
    NAV_CHANNEL.onmessage = (e) => {
      if (e.data === 'will-navigate' && window.name === WORK_TAB_NAME) blankForNav();
    };
  }
  // Back/forward cache restores the page mid-blank — unhide it.
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) document.documentElement.classList.remove('nav-blanking');
  });

  function openBenchmarkTab(b) {
    const url = location.origin + '/?b=' + encodeURIComponent(b.id);
    if (NAV_CHANNEL) { try { NAV_CHANNEL.postMessage('will-navigate'); } catch (_) {} }
    // A broadcast never echoes back to its sender — if THIS tab is the work
    // tab (clicking a card from its own home list), blank it directly.
    if (window.name === WORK_TAB_NAME) blankForNav();
    // A native anchor click with a fixed target name is the bulletproof way to
    // open a new tab: unlike window.open it is NEVER treated as a blockable
    // pop-up, and the shared target name makes every click reuse the same work
    // tab. (No rel=noopener — that can defeat named-tab reuse in some browsers.)
    try {
      const a = document.createElement('a');
      a.href = url;
      a.target = WORK_TAB_NAME;
      document.body.appendChild(a);
      a.click();
      a.remove();
    } catch (_) {
      // Last-ditch fallback if DOM/anchor is unavailable for any reason.
      openModal(b);
    }
  }

  function updateCountBadge(benchmarkId, n) {

  // Live count badges — SCOPED for scale.
  //
  // Old approach: two unscoped onSnapshot listeners on the full /portfolios
  // and /artifacts collections. At 200 students × ~5 submissions × 20
  // benchmarks that's 20,000+ doc reads on first paint and the listener
  // re-fires on every write.
  //
  // New approach:
  //   1. Initial load: one getCountFromServer() per benchmark (server-side
  //      aggregation, billed as 1 read each — ~30 total instead of 20,000).
  //   2. Live updates: maintain counts locally by listening only to the
  //      currently-OPEN benchmark's gallery (already done in
  //      subscribePortfolios + subscribeGallery). Other badges drift only
  //      while a different benchmark is open; refreshCountBadge() is called
  //      after every submit/delete to re-pull the affected benchmark.
  async function refreshCountBadge(benchmarkId) {
    if (!benchmarkId) return;
    const isHw = benchmarkId.startsWith('hw-');
    const colName = isHw ? 'artifacts' : 'portfolios';
    try {
      const base = query(collection(db, colName), where('benchmarkId', '==', benchmarkId));
      const delQ = query(collection(db, colName), where('benchmarkId', '==', benchmarkId), where('deleted', '==', true));
      const [aggAll, aggDel] = await Promise.all([getCountFromServer(base), getCountFromServer(delQ)]);
      updateCountBadge(benchmarkId, Math.max(0, aggAll.data().count - aggDel.data().count));
    } catch (err) {
      console.warn('count refresh failed for', benchmarkId, err);
    }
  }

  async function loadInitialCounts() {
    const ids = Object.keys(countEls);
    // Run in parallel; getCountFromServer is a single read each.
    await Promise.allSettled(ids.map(refreshCountBadge));
  }

    let timerInterval = null;

    function paintTimer() {
      const endAt = Number(localStorage.getItem(DAY_ONE_TIMER_KEY) || 0);
      if (!endAt) {
        readout.textContent = `${DAY_ONE_MINUTES}:00`;
        timerBtn.textContent = 'Start';
        timerEl.classList.remove('is-low', 'is-critical', 'is-done');
        return;
      }
      const left = Math.max(0, endAt - Date.now());
      const m = Math.floor(left / 60000);
      const s = Math.floor((left % 60000) / 1000);
      readout.textContent = left > 0 ? `${m}:${String(s).padStart(2, '0')}` : 'Time';
      timerBtn.textContent = 'Reset';
      timerEl.classList.toggle('is-low', left > 0 && left <= 5 * 60000);
      timerEl.classList.toggle('is-critical', left > 0 && left <= 60000);
      timerEl.classList.toggle('is-done', left === 0);
      if (left === 0 && timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }
    function startTicking() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(paintTimer, 1000);
    }
    timerBtn.addEventListener('click', () => {
      const running = Number(localStorage.getItem(DAY_ONE_TIMER_KEY) || 0);
      if (running) {
        localStorage.removeItem(DAY_ONE_TIMER_KEY);
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      } else {
        localStorage.setItem(DAY_ONE_TIMER_KEY, String(Date.now() + DAY_ONE_MINUTES * 60000));
        startTicking();
      }
      paintTimer();

    if (Number(localStorage.getItem(DAY_ONE_TIMER_KEY) || 0)) startTicking();
    paintTimer();

  // Default schematic state.
  function _schemDefaultState() {
    return {
      gridCols: 38,
      gridRows: 24,
      components: [],
      wires: [],
      // Black is the default jumper color — wires between devices read clean
      // and obvious. The student can still switch to red/yellow/green/blue/
      // white from the palette per-wire.
      selectedColor: 'black',
      resistorReminderShown: false,
      _idCounter: 1
    };
  }

  let _schemState = null;
  let _schemPendingPin = null;   // pinId waiting for second click
  let _schemDrag = null;         // { id, startX, startY, originGx, originGy }
  let _schemResize = null;       // { id, startX, startY, startCols, startRows } - perfboard resize
  let _schemSvg = null;          // root <svg>
  let _schemZoom = 1;            // canvas zoom factor (display scale; viewBox stays 1:1)
  let _schemBaseW = 0, _schemBaseH = 0; // unscaled canvas pixel size, for zoom math
  let _schemWireDrag = null;     // { fromPinId, startClientX, startClientY, moved }
  let _schemSuppressNextPinClick = false; // skip the click that follows a wire-drag
  let _schemSelectedWire = null; // currently selected wire id, or null
  let _schemSelected = null;     // currently selected component id, or null
  let _schemPaletteDrag = null;  // { type, startX, startY, ghostEl, didMove }
  const _schemHistory = [];      // JSON snapshots of state for undo
  const _SCHEM_HISTORY_MAX = 40;

  function pushSchemHistory() {
    try {
      const snap = JSON.stringify(_schemState);
      // Skip no-op snapshots (e.g. a mousedown that only selected something)
      // so the 40-step stack holds 40 real edits, not 40 identical states.
      if (_schemHistory[_schemHistory.length - 1] === snap) return;
      _schemHistory.push(snap);
      if (_schemHistory.length > _SCHEM_HISTORY_MAX) _schemHistory.shift();
    } catch (_) {}
  }
  function schemUndo() {
    let snap = _schemHistory.pop();
    // Skip snapshots identical to the present state so one Cmd+Z always
    // produces a visible change (or an honest "Nothing to undo").
    try {
      const now = JSON.stringify(_schemState);
      while (snap === now) snap = _schemHistory.pop();
    } catch (_) {}
    if (!snap) {
      schemToast('Nothing to undo.');
      return;
    }
    try {
      _schemState = JSON.parse(snap);
      _schemPendingPin = null;
      _schemSelected = null;
      schemSave();
      renderPerfboard();
    } catch (_) {
      schemToast('Could not undo.');
    }
  }

  function schemLoad() {
    try {
      // Prefer the per-student slot; fall back to the legacy global key so
      // diagrams drawn before the per-student migration still appear.
      const raw = localStorage.getItem(schemStorageKey()) || localStorage.getItem(SCHEM_STORAGE_KEY);
      if (!raw) return _schemDefaultState();
      const parsed = JSON.parse(raw);
      // Merge defaults so older saves don't crash.
      const state = Object.assign(_schemDefaultState(), parsed);
      // Migrate oversized breadboards from the old 30-row layout down to the
      // compact 13-row footprint so previously-placed boards stop swallowing
      // the canvas. Width is already forced to 17 elsewhere.
      if (Array.isArray(state.components)) {
        state.components.forEach(c => {
          if (c && c.type === 'breadboard' && (c.rows || 0) > 17) {
            c.rows = 13;
            c.cols = 17;
          }
        });
      }
      return state;
    } catch (err) {
      console.warn('schematic load failed', err);
      return _schemDefaultState();
    }
  }

  let _schemSaveWarned = false;
  function schemSave() {
    try {
      const payload = JSON.stringify(_schemState);
      localStorage.setItem(schemStorageKey(), payload);
      schemMirrorDraftDebounced(payload);
      _schemSaveWarned = false;
    } catch (err) {
      console.warn('schematic save failed', err);
      // Tell the student once instead of silently losing work.
      if (!_schemSaveWarned) {
        _schemSaveWarned = true;
        schemToast('Could not save. Your browser storage may be full.');
      }
    }
  }

  // Cloud mirror to Firestore so a student's schematic follows them across
  // laptops. Matches the Vibe Coding pattern. Only runs once a name is picked.
  const schemMirrorDraftDebounced = debounce((payload) => {
    const name = (localStorage.getItem(LAST_PICK_KEY) || '').trim();
    if (!name) return;
    try { saveDraft(name, 'schematic', { schematic: payload }); } catch (_) {}
  }, 1200);

  // First-load hydrate from cloud: if local is empty for this student but
  // Firestore has a saved schematic, seed localStorage so schemLoad picks it up.
  async function schemHydrateFromCloud() {
    const name = (localStorage.getItem(LAST_PICK_KEY) || '').trim();
    if (!name) return;
    const key = schemStorageKey();
    if (localStorage.getItem(key)) return; // already have local
    try {
      const draft = await loadDraft(name, 'schematic');
      if (draft && typeof draft.schematic === 'string') {
        localStorage.setItem(key, draft.schematic);
      }
    } catch (_) {}
  }

  // Called when the student switches names in the identity strip. Reloads the
  // canvas from whichever slot now matches.
  async function schemSwitchStudent() {
    // The undo stack holds the PREVIOUS student's snapshots — an undo after
    // the switch would restore their board and save it into the new student's
    // slot (localStorage + cloud draft). Never carry history across students.
    _schemHistory.length = 0;
    await schemHydrateFromCloud();
    try {
      _schemState = schemLoad();
      if (document.getElementById('schemCanvasWrap')) renderPerfboard();
    } catch (e) { console.warn('schemSwitchStudent failed', e); }
  }

  function schemNewId(prefix) {
    const n = _schemState._idCounter++;
    return `${prefix}_${n}`;
  }

  function schemToast(msg, ms) {
    let el = document.getElementById('schemToast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'schemToast';
      el.className = 'schem-toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    requestAnimationFrame(() => el.classList.add('is-visible'));
    clearTimeout(el._timer);
    el._timer = setTimeout(() => {
      el.classList.remove('is-visible');
    }, ms || 2400);
  }

  // ============== Hover tooltips for tool icons ==============
  // Floats a styled label below the tool button on hover. Lives on
  // document.body so the toolbar group's overflow:hidden can't clip it
  // (same trick as the Save-to popover). Reads its text from the button's
  // title attribute on first hover, then strips it so the OS tooltip
  // doesn't double up. aria-label stays for screen readers.
  let _ttEl = null;
  let _ttActive = null;
  let _ttShowTimer = null;

  function vibeSetTooltip(btn, text) {
    if (!btn) return;
    btn.dataset.tt = text || '';
    if (btn.hasAttribute('title')) btn.removeAttribute('title');
    btn.setAttribute('aria-label', text || btn.getAttribute('aria-label') || '');
    if (_ttActive === btn && _ttEl && _ttEl.classList.contains('is-visible')) {
      _ttEl.textContent = text || '';
    }
  }

  function _ttEnsure() {
    if (_ttEl) return _ttEl;
    _ttEl = document.createElement('div');
    _ttEl.className = 'tt-tooltip';
    document.body.appendChild(_ttEl);
    return _ttEl;
  }

  function _ttShow(btn) {
    const txt = btn.dataset.tt;
    if (!txt) return;
    const el = _ttEnsure();
    el.textContent = txt;
    el.classList.add('is-visible');
    const r = btn.getBoundingClientRect();
    const w = el.offsetWidth;
    let left = r.left + r.width / 2 - w / 2;
    let top = r.bottom + 8;
    if (left < 8) left = 8;
    if (left + w > window.innerWidth - 8) left = window.innerWidth - w - 8;
    el.style.left = left + 'px';
    el.style.top = top + 'px';
  }

  function _ttHide() {
    _ttActive = null;
    clearTimeout(_ttShowTimer);
    if (_ttEl) _ttEl.classList.remove('is-visible');
  }

  function _ttPrep(root) {
    if (!root) return;
    root.querySelectorAll('.vibe-tool-btn[title]').forEach(b => {
      b.dataset.tt = b.getAttribute('title');
      b.removeAttribute('title');
    });
  }

  // Tool buttons render dynamically when initSchematicTool / initVibeCodingTool
  // run, so prep on every DOM mutation. Cheap because the selector is fast.
  (function initToolTooltips() {
    if (typeof window === 'undefined') return;
    _ttPrep(document.body);
    const obs = new MutationObserver(() => _ttPrep(document.body));
    obs.observe(document.body, { childList: true, subtree: true });
    document.addEventListener('mouseover', (e) => {
      const btn = e.target.closest('.vibe-tool-btn');
      if (!btn || _ttActive === btn) return;
      _ttActive = btn;
      clearTimeout(_ttShowTimer);
      _ttShowTimer = setTimeout(() => {
        if (_ttActive === btn) _ttShow(btn);
      }, 350);
    });
    document.addEventListener('mouseout', (e) => {
      const btn = e.target.closest('.vibe-tool-btn');
      if (btn) _ttHide();
    });
    window.addEventListener('scroll', _ttHide, true);
    window.addEventListener('blur', _ttHide);
  })();

  function initSchematicTool() {
    _schemState = schemLoad();
    _schemHistory.length = 0;
    _schemPendingPin = null;
    _schemDrag = null;
    _schemSelected = null;
    _schemPaletteDrag = null;

    app.innerHTML = '';

              </button>

                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/></svg>
              </button>
            </div>
          </div>
          <div class="vibe-toolbar-group" style="margin-left: auto;">
            <button class="vibe-tool-btn" id="schemUndo" title="Undo (Cmd+Z / Ctrl+Z)" aria-label="Undo">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>
