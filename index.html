        </div>
      </div>
    `;
    app.appendChild(wrap);

    // Identity strip — match Schematic so the kid claims their work first.
    const identityMount = wrap.querySelector('[data-idea-identity]');
    if (identityMount) identityMount.appendChild(renderIdentityStrip());

    // --- Back button ---
    const backBtn = document.getElementById('ideaBack');
    backBtn.addEventListener('click', () => {
      history.pushState({}, '', '/tools');
      applyRoute('/tools');
    });

    // --- Color row ---
    renderIdeaColors();
    renderIdeaWidths();

    // --- Build the Konva stage in the frame ---
    const frame = document.getElementById('ideaFrame');
    const rect0 = frame.getBoundingClientRect();
    _ideaStage = new Konva.Stage({
      container: frame,
      width: Math.max(300, Math.round(rect0.width)),
      height: Math.max(300, Math.round(rect0.height))
    });
    _ideaBgLayer = new Konva.Layer({ listening: false });
    const bg = new Konva.Rect({
      x: 0, y: 0,
      width: _ideaStage.width(),
      height: _ideaStage.height(),
      fill: '#ffffff',
      name: 'idea-bg'
    });
    _ideaBgLayer.add(bg);
    _ideaStage.add(_ideaBgLayer);

    _ideaLayer = new Konva.Layer();
    _ideaStage.add(_ideaLayer);

    _ideaTransformer = new Konva.Transformer({
      rotateEnabled: true,
      anchorSize: 9,
      borderStroke: '#4f46e5',
      anchorStroke: '#4f46e5',
      anchorFill: 'white',
      borderDash: [4, 3]
    });
    _ideaLayer.add(_ideaTransformer);

    // --- Restore saved state (if any) ---
    ideaRestoreFromStorage();

    // --- Responsive resize: stretch stage + bg rect to frame ---
    const doResize = () => {
      if (!_ideaStage) return;
      const r = frame.getBoundingClientRect();
      const w = Math.max(300, Math.round(r.width));
      const h = Math.max(300, Math.round(r.height));
      if (w === _ideaStage.width() && h === _ideaStage.height()) return;
      _ideaStage.width(w);
      _ideaStage.height(h);
      bg.width(w);
      bg.height(h);
      _ideaBgLayer.batchDraw();
    };
    _ideaResizeObs = new ResizeObserver(doResize);
    _ideaResizeObs.observe(frame);
    _ideaCleanup.push(() => { try { _ideaResizeObs.disconnect(); } catch (e) {} });

    // --- Stage event wiring ---
    _ideaZoom = 1;
    _ideaStage.on('mousedown touchstart', ideaOnStageDown);
    _ideaStage.on('mousemove touchmove', ideaOnStageMove);
    _ideaStage.on('mouseup touchend', ideaOnStageUp);
    _ideaStage.on('click tap', ideaOnStageClick);
    _ideaStage.on('dblclick dbltap', ideaOnStageDblClick);
    // Ctrl/Cmd + scroll zooms toward the cursor (matches the Wiring Schematic).
    _ideaStage.on('wheel', (e) => {
      if (!(e.evt.ctrlKey || e.evt.metaKey)) return;
      e.evt.preventDefault();
      const pointer = _ideaStage.getPointerPosition();
      const factor = e.evt.deltaY < 0 ? 1.1 : 1 / 1.1;
      ideaApplyZoom(_ideaZoom * factor, pointer);
    });

    // --- Toolbar wiring ---
    wrap.querySelectorAll('[data-idea-tool]').forEach(btn => {
      btn.addEventListener('click', () => ideaSetTool(btn.dataset.ideaTool));
    });
    ideaUpdateToolHighlight();

    document.getElementById('ideaImageBtn').addEventListener('click', () => {
      document.getElementById('ideaImageInput').click();
    });
    document.getElementById('ideaImageInput').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) ideaAddImageFromFile(file);
      e.target.value = '';
    });

    // Drag-and-drop image onto canvas — covers OS files, webpage images, and
    // pasted clipboard images. Drop targets attach to both the frame and the
    // outer wrap so the user can land anywhere on the card.
    const dropWrap = frame.closest('.idea-canvas-wrap') || frame;
    const onDragOver = (e) => {
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
      frame.classList.add('is-dropping');
    };
    const onDragLeave = (e) => {
      if (e.relatedTarget && dropWrap.contains(e.relatedTarget)) return;
      frame.classList.remove('is-dropping');
    };
    const onDrop = (e) => {
      e.preventDefault();
      e.stopPropagation();
      frame.classList.remove('is-dropping');
      const dt = e.dataTransfer;
      if (!dt) return;
      if (dt.files && dt.files.length) {
        const file = Array.from(dt.files).find(f => f.type && f.type.startsWith('image/'));
        if (file) { ideaAddImageFromFile(file); return; }
      }
      if (dt.items) {
        for (const item of dt.items) {
          if (item.kind === 'file' && item.type && item.type.startsWith('image/')) {
            const file = item.getAsFile();
            if (file) { ideaAddImageFromFile(file); return; }
          }
        }
      }
    };
    [frame, dropWrap].forEach(el => {
      el.addEventListener('dragover', onDragOver);
      el.addEventListener('dragleave', onDragLeave);
      el.addEventListener('drop', onDrop);
    });
    // Paste-from-clipboard: when the Idea Board is the active tool, ⌘V/Ctrl+V
    // anywhere on the page imports a clipboard image.
    const onPaste = (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (const item of items) {
        if (item.kind === 'file' && item.type && item.type.startsWith('image/')) {
          const file = item.getAsFile();
          if (file) {
            e.preventDefault();
            ideaAddImageFromFile(file);
            return;
          }
        }
      }
    };
    document.addEventListener('paste', onPaste);
    _ideaCleanup.push(() => {
      [frame, dropWrap].forEach(el => {
        el.removeEventListener('dragover', onDragOver);
        el.removeEventListener('dragleave', onDragLeave);
        el.removeEventListener('drop', onDrop);
      });
      document.removeEventListener('paste', onPaste);
    });

    document.getElementById('ideaUndo').addEventListener('click', ideaUndo);
    document.getElementById('ideaZoomOut').addEventListener('click', () => ideaApplyZoom(_ideaZoom - 0.15));
    document.getElementById('ideaZoomIn').addEventListener('click', () => ideaApplyZoom(_ideaZoom + 0.15));
    document.getElementById('ideaZoomFit').addEventListener('click', ideaZoomReset);
    document.getElementById('ideaClear').addEventListener('click', () => {
      if (_ideaLayer.getChildren(n => n !== _ideaTransformer).length === 0) {
        schemToast('Already empty.');
        return;
      }
      if (!confirm('Clear the whole idea board? This cannot be undone.')) return;
      ideaPushHistory();
      _ideaTransformer.nodes([]);
      _ideaLayer.getChildren(n => n !== _ideaTransformer).forEach(n => n.destroy());
      _ideaSelected = null;
      _ideaLayer.batchDraw();
      ideaScheduleSave();
      schemToast('Canvas cleared.');
    });

    const saveBtn = document.getElementById('ideaSaveTo');
    saveBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (_saveToPopOpen && _saveToPopOpen.anchorEl === saveBtn) {
        closeSaveToPop();
        return;
      }
      const buildBlob = () => ideaBuildPngBlob();
      openSaveToPop(saveBtn, 'idea-board', buildBlob);
    });

    document.getElementById('ideaDownload').addEventListener('click', async () => {
      try {
        const blob = await ideaBuildPngBlob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
        a.href = url;
        a.download = `idea-board-${stamp}.png`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 500);
      } catch (err) {
        console.warn('idea download failed', err);
        schemToast('Could not export image.');
      }
    });

    // --- Keyboard: undo + delete selection ---
    const onKey = (e) => {
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return;
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
        e.preventDefault();
        ideaUndo();
        return;
      }
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if ((e.key === 'Delete' || e.key === 'Backspace') && _ideaTransformer && _ideaTransformer.nodes().length) {
        e.preventDefault();
        ideaPushHistory();
        // Detach the Transformer BEFORE destroying its anchored nodes — otherwise
        // Konva tries to redraw handles for nodes that no longer exist.
        const sel = _ideaTransformer.nodes().slice();
        _ideaTransformer.nodes([]);
        sel.forEach(n => { try { n.destroy(); } catch (err) {} });
        _ideaSelected = null;
        _ideaLayer.batchDraw();
        ideaScheduleSave();
      }
    };
    document.addEventListener('keydown', onKey);
    _ideaCleanup.push(() => document.removeEventListener('keydown', onKey));

    // Backlink: leaving the tool tears down listeners.
    backBtn.addEventListener('click', () => {
      _ideaCleanup.forEach(fn => { try { fn(); } catch (e) {} });
      _ideaCleanup = [];
      if (_ideaTextEditor && _ideaTextEditor.parentNode) {
        _ideaTextEditor.parentNode.removeChild(_ideaTextEditor);
        _ideaTextEditor = null;
      }
    });
  }

  function renderIdeaColors() {
    const row = document.getElementById('ideaColors');
    if (!row) return;
    row.innerHTML = '';
    Object.entries(IDEA_COLORS).forEach(([name, hex]) => {
      const btn = document.createElement('button');
      btn.className = 'idea-color' + (name === _ideaColor ? ' is-active' : '');
      btn.style.background = hex;
      btn.title = name;
      btn.setAttribute('aria-label', `Color: ${name}`);
      btn.addEventListener('click', () => {
        _ideaColor = name;
        renderIdeaColors();
        // If something is selected, recolor its stroke (and fill if it had one).
        const nodes = _ideaTransformer.nodes();
        if (nodes.length) {
          ideaPushHistory();
          nodes.forEach(n => {
            if (n.stroke) n.stroke(IDEA_COLORS[name]);
            // Don't auto-fill a transparent shape; only update existing solid fills.
            if (n.getClassName && n.getClassName() === 'Text') n.fill(IDEA_COLORS[name]);
          });
          _ideaLayer.batchDraw();
          ideaScheduleSave();
        }
      });
      row.appendChild(btn);
    });
  }

  function renderIdeaWidths() {
    const row = document.getElementById('ideaWidths');
    if (!row) return;
    row.innerHTML = '';
    Object.entries(IDEA_WIDTHS).forEach(([name, px]) => {
      const btn = document.createElement('button');
      btn.className = 'idea-width' + (name === _ideaWidth ? ' is-active' : '');
      btn.title = `${name} stroke`;
      btn.setAttribute('aria-label', `Stroke width: ${name}`);
      // Visible bar — height scales with width.
      const bar = document.createElement('span');
      bar.style.height = Math.max(2, Math.min(8, px)) + 'px';
      btn.appendChild(bar);
      btn.addEventListener('click', () => {
        _ideaWidth = name;
        renderIdeaWidths();
        const nodes = _ideaTransformer.nodes();
        if (nodes.length) {
          ideaPushHistory();
          nodes.forEach(n => { if (typeof n.strokeWidth === 'function') n.strokeWidth(IDEA_WIDTHS[name]); });
          _ideaLayer.batchDraw();
          ideaScheduleSave();
        }
      });
      row.appendChild(btn);
    });
  }

  function ideaSetTool(tool) {
    _ideaTool = tool;
    // Deselect when switching off Select.
    if (tool !== 'select') {
      _ideaTransformer.nodes([]);
      _ideaSelected = null;
      _ideaLayer.batchDraw();
    }
    ideaUpdateToolHighlight();
    // Cursor hint on the stage container.
    const frame = document.getElementById('ideaFrame');
    if (frame) {
      const cursor = ({
        select: 'default',
        pen: 'crosshair',
        highlight: 'crosshair',
        eraser: 'pointer',
        callout: 'text',
        rect: 'crosshair',
        ellipse: 'crosshair',
        line: 'crosshair',
        arrow: 'crosshair'
      })[tool] || 'default';
      frame.style.cursor = cursor;
    }
  }

  function ideaUpdateToolHighlight() {
    document.querySelectorAll('[data-idea-tool]').forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.ideaTool === _ideaTool);
    });
  }

  // --- Drawing handlers ---
  // Canvas zoom (Konva stage scale). Zoom out to see the whole sketch, in to
  // focus. Drawing uses relative pointer positions, so strokes stay accurate
  // at any zoom. Mirrors the Wiring Schematic's zoom control + aesthetic.
  function ideaApplyZoom(newScale, center) {
    if (!_ideaStage) return;
    newScale = Math.min(2, Math.max(0.3, newScale));
    const old = _ideaStage.scaleX() || 1;
    const c = center || { x: _ideaStage.width() / 2, y: _ideaStage.height() / 2 };
    const pointTo = { x: (c.x - _ideaStage.x()) / old, y: (c.y - _ideaStage.y()) / old };
    _ideaStage.scale({ x: newScale, y: newScale });
    _ideaStage.position({ x: c.x - pointTo.x * newScale, y: c.y - pointTo.y * newScale });
    _ideaStage.batchDraw();
    _ideaZoom = newScale;
    const lbl = document.getElementById('ideaZoomLabel');
    if (lbl) lbl.textContent = Math.round(newScale * 100) + '%';
  }
  function ideaZoomReset() {
    if (!_ideaStage) return;
    _ideaStage.scale({ x: 1, y: 1 });
    _ideaStage.position({ x: 0, y: 0 });
    _ideaStage.batchDraw();
    _ideaZoom = 1;
    const lbl = document.getElementById('ideaZoomLabel');
    if (lbl) lbl.textContent = '100%';
  }

  function ideaOnStageDown(e) {
    // Ignore mousedown on the transformer itself or on a selected node when in Select.
    if (_ideaTool === 'select') return;
    if (_ideaTool === 'eraser') return;     // handled in click handler
    if (_ideaTool === 'callout') return;    // handled in click handler

    const pos = _ideaStage.getRelativePointerPosition();
    if (!pos) return;
    _ideaDrawing = true;
    ideaPushHistory();

    if (_ideaTool === 'pen' || _ideaTool === 'highlight') {
      const isHi = _ideaTool === 'highlight';
      _ideaCurrentLine = new Konva.Line({
        stroke: ideaPalette(),
        strokeWidth: isHi ? Math.max(12, ideaStroke() * 4) : ideaStroke(),
        opacity: isHi ? 0.35 : 1,
        lineCap: 'round',
        lineJoin: 'round',
        tension: 0.5,
        bezier: true,
        points: [pos.x, pos.y, pos.x, pos.y],
        globalCompositeOperation: 'source-over',
        draggable: false
      });
      _ideaLayer.add(_ideaCurrentLine);
      return;
    }

    if (_ideaTool === 'rect') {
      _ideaCurrentShape = new Konva.Rect({
        x: pos.x, y: pos.y, width: 1, height: 1,
        stroke: ideaPalette(), strokeWidth: ideaStroke(),
        fill: 'transparent', draggable: true
      });
      _ideaLayer.add(_ideaCurrentShape);
      return;
    }
    if (_ideaTool === 'ellipse') {
      _ideaCurrentShape = new Konva.Ellipse({
        x: pos.x, y: pos.y, radiusX: 1, radiusY: 1,
        stroke: ideaPalette(), strokeWidth: ideaStroke(),
        fill: 'transparent', draggable: true
      });
      _ideaCurrentShape._startX = pos.x;
      _ideaCurrentShape._startY = pos.y;
      _ideaLayer.add(_ideaCurrentShape);
      return;
    }
    if (_ideaTool === 'line') {
      _ideaCurrentShape = new Konva.Line({
        points: [pos.x, pos.y, pos.x, pos.y],
        stroke: ideaPalette(), strokeWidth: ideaStroke(),
        lineCap: 'round', draggable: true
      });
      _ideaLayer.add(_ideaCurrentShape);
      return;
    }
    if (_ideaTool === 'arrow') {
      _ideaCurrentShape = new Konva.Arrow({
        points: [pos.x, pos.y, pos.x, pos.y],
        stroke: ideaPalette(), strokeWidth: ideaStroke(),
        fill: ideaPalette(),
        pointerLength: 12, pointerWidth: 10, draggable: true
      });
      _ideaLayer.add(_ideaCurrentShape);
      return;
    }
  }

  function ideaOnStageMove() {
    if (!_ideaDrawing) return;
    const pos = _ideaStage.getRelativePointerPosition();
    if (!pos) return;

    if (_ideaCurrentLine) {
      const pts = _ideaCurrentLine.points().concat([pos.x, pos.y]);
      _ideaCurrentLine.points(pts);
      _ideaLayer.batchDraw();
      return;
    }
    if (_ideaCurrentShape) {
      const cls = _ideaCurrentShape.getClassName();
      if (cls === 'Rect') {
        const x0 = _ideaCurrentShape.x();
        const y0 = _ideaCurrentShape.y();
        _ideaCurrentShape.width(pos.x - x0);
        _ideaCurrentShape.height(pos.y - y0);
      } else if (cls === 'Ellipse') {
        const cx = _ideaCurrentShape._startX;
        const cy = _ideaCurrentShape._startY;
        _ideaCurrentShape.x((cx + pos.x) / 2);
        _ideaCurrentShape.y((cy + pos.y) / 2);
        _ideaCurrentShape.radiusX(Math.abs(pos.x - cx) / 2);
        _ideaCurrentShape.radiusY(Math.abs(pos.y - cy) / 2);
      } else if (cls === 'Line' || cls === 'Arrow') {
        const pts = _ideaCurrentShape.points();
        _ideaCurrentShape.points([pts[0], pts[1], pos.x, pos.y]);
      }
      _ideaLayer.batchDraw();
    }
  }

  function ideaOnStageUp() {
    if (!_ideaDrawing) return;
    _ideaDrawing = false;

    // Reject tiny accidental shapes (single-click on a shape tool shouldn't
    // litter the canvas with a 0-px Rect).
    if (_ideaCurrentShape) {
      const cls = _ideaCurrentShape.getClassName();
      let isTiny = false;
      if (cls === 'Rect') isTiny = Math.abs(_ideaCurrentShape.width()) < 4 || Math.abs(_ideaCurrentShape.height()) < 4;
      else if (cls === 'Ellipse') isTiny = _ideaCurrentShape.radiusX() < 3 || _ideaCurrentShape.radiusY() < 3;
      else if (cls === 'Line' || cls === 'Arrow') {
        const p = _ideaCurrentShape.points();
        const dx = p[2] - p[0]; const dy = p[3] - p[1];
        isTiny = Math.hypot(dx, dy) < 4;
      }
      if (isTiny) _ideaCurrentShape.destroy();
      else {
        // Normalize negative-width rects so they're easier to select/resize.
        if (cls === 'Rect') {
          if (_ideaCurrentShape.width() < 0) {
            _ideaCurrentShape.x(_ideaCurrentShape.x() + _ideaCurrentShape.width());
            _ideaCurrentShape.width(-_ideaCurrentShape.width());
          }
          if (_ideaCurrentShape.height() < 0) {
            _ideaCurrentShape.y(_ideaCurrentShape.y() + _ideaCurrentShape.height());
            _ideaCurrentShape.height(-_ideaCurrentShape.height());
          }
        }
      }
      _ideaCurrentShape = null;
    }
    _ideaCurrentLine = null;
    _ideaLayer.batchDraw();
    ideaScheduleSave();
  }

  function ideaOnStageClick(e) {
    const target = e.target;
    // Eraser: any click on an actual shape deletes it (object-level delete,
    // not pixel erase). Background hits do nothing.
    if (_ideaTool === 'eraser') {
      if (target && target !== _ideaStage && target.name && target.name() !== 'idea-bg') {
        ideaPushHistory();
        if (_ideaTransformer.nodes().includes(target)) _ideaTransformer.nodes([]);
        // For a child of a group (e.g. callout text or rect), destroy the group.
        const parent = target.getParent && target.getParent();
        if (parent && parent.getClassName && parent.getClassName() === 'Group' && parent !== _ideaLayer) {
          parent.destroy();
        } else if (target !== _ideaTransformer) {
          target.destroy();
        }
        _ideaLayer.batchDraw();
        ideaScheduleSave();
      } else if (target && target.getParent && target.getParent().getClassName && target.getParent().getClassName() === 'Group') {
        // Group children (callout pieces) don't always have a name.
        ideaPushHistory();
        target.getParent().destroy();
        _ideaLayer.batchDraw();
        ideaScheduleSave();
      }
      return;
    }

    // Callout: click on empty canvas creates a new callout there.
    if (_ideaTool === 'callout') {
      // Only create if the click landed on the stage / background, not on an
      // existing shape — let the kid keep selecting existing callouts.
      const isBg = target === _ideaStage || (target.name && target.name() === 'idea-bg');
      if (isBg) {
        const pos = _ideaStage.getRelativePointerPosition();
        if (pos) ideaCreateCallout(pos.x, pos.y);
        return;
      }
    }

    // Select tool: click selects a shape; click on background clears.
    if (_ideaTool === 'select') {
      if (target === _ideaStage || (target.name && target.name() === 'idea-bg')) {
        _ideaTransformer.nodes([]);
        _ideaSelected = null;
        _ideaLayer.batchDraw();
        return;
      }
      // Walk up to the top-level layer child (so clicking inside a Group
      // selects the Group, not its inner Rect).
      let node = target;
      while (node && node.getParent && node.getParent() !== _ideaLayer) {
        node = node.getParent();
        if (!node || node === _ideaStage) break;
      }
      if (!node || node === _ideaTransformer || node === _ideaStage) return;
      node.draggable(true);
      _ideaTransformer.nodes([node]);
      _ideaSelected = node._id;
      _ideaLayer.batchDraw();
    }
  }

  function ideaOnStageDblClick(e) {
    // Double-click a callout to edit its text in an overlaid textarea.
    const target = e.target;
    let group = target;
    while (group && group.getParent && group.getParent() !== _ideaLayer) group = group.getParent();
    if (!group || !group.getAttr || group.getAttr('ideaKind') !== 'callout') return;
    const textNode = group.findOne('Text');
    if (textNode) ideaOpenTextEditor(group, textNode);
  }

  // --- Callout creation + inline edit ---
  function ideaCreateCallout(x, y) {
    ideaPushHistory();
    const group = new Konva.Group({
      x, y,
      draggable: true,
      ideaKind: 'callout'
    });
    const text = new Konva.Text({
      text: 'Label',
      fontSize: 16,
      fontFamily: 'system-ui, -apple-system, sans-serif',
      fill: ideaPalette(),
      padding: 8,
      lineHeight: 1.35
    });
    const w = Math.max(60, text.width());
    const h = Math.max(28, text.height());
    const bg = new Konva.Rect({
      x: 0, y: 0,
      width: w, height: h,
      fill: 'white',
      stroke: ideaPalette(),
      strokeWidth: 1.5,
      cornerRadius: 6
    });
    group.add(bg);
    group.add(text);
    _ideaLayer.add(group);
    _ideaLayer.batchDraw();
    ideaScheduleSave();
    // Drop the user straight into the edit textarea.
    ideaOpenTextEditor(group, text);
  }

  function ideaOpenTextEditor(group, textNode) {
    if (_ideaTextEditor && _ideaTextEditor.parentNode) {
      _ideaTextEditor.parentNode.removeChild(_ideaTextEditor);
      _ideaTextEditor = null;
    }
    const frame = document.getElementById('ideaFrame');
    const stageBox = frame.getBoundingClientRect();
    const containerBox = frame.parentElement.getBoundingClientRect();
    const absPos = group.getAbsolutePosition();

    const ta = document.createElement('textarea');
    ta.className = 'idea-text-edit';
    ta.value = textNode.text();
    // Position relative to the wrap (which is positioned).
    ta.style.left = (stageBox.left - containerBox.left + absPos.x) + 'px';
    ta.style.top = (stageBox.top - containerBox.top + absPos.y) + 'px';
    ta.style.minWidth = Math.max(80, textNode.width()) + 'px';
    ta.style.minHeight = Math.max(24, textNode.height()) + 'px';
    ta.style.color = textNode.fill();
    frame.parentElement.appendChild(ta);
    ta.focus();
    ta.select();
    _ideaTextEditor = ta;

    const commit = () => {
      if (_ideaTextEditor !== ta) return;
      ideaPushHistory();
      const val = ta.value.trim() || 'Label';
      textNode.text(val);
      const newW = Math.max(60, textNode.width());
      const newH = Math.max(28, textNode.height());
      const bg = group.findOne('Rect');
      if (bg) { bg.width(newW); bg.height(newH); }
      _ideaLayer.batchDraw();
      ideaScheduleSave();
      if (ta.parentNode) ta.parentNode.removeChild(ta);
      _ideaTextEditor = null;
      document.removeEventListener('mousedown', onOutside, true);
    };
    const onOutside = (ev) => {
      if (ev.target !== ta) commit();
    };
    ta.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') { ev.preventDefault(); commit(); }
      if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); commit(); }
    });
    // Defer so the dblclick doesn't trip it.
    setTimeout(() => document.addEventListener('mousedown', onOutside, true), 0);
  }

  // --- Image upload (file picker or drag-drop) ---
  function ideaAddImageFromFile(file) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const dataUrl = ev.target.result;
      const img = new Image();
      img.onload = () => {
        ideaPushHistory();
        const stageW = _ideaStage.width();
        const targetW = stageW * 0.5;
        const scale = targetW / img.width;
        const w = img.width * scale;
        const h = img.height * scale;
        const kImg = new Konva.Image({
          image: img,
          x: (_ideaStage.width() - w) / 2,
          y: (_ideaStage.height() - h) / 2,
          width: w,
          height: h,
          draggable: true,
          ideaImageSrc: dataUrl   // persisted so we can re-hydrate from JSON
        });
        // Drop images behind drawn marks (but above bg).
        kImg.moveToBottom();
        _ideaLayer.add(kImg);
        _ideaLayer.batchDraw();
        ideaScheduleSave();
      };
      img.src = dataUrl;
    };
    reader.readAsDataURL(file);
  }

  // --- History (undo) ---
  // Strip the Transformer before snapshotting so each undo cycle doesn't
  // accrue an orphan handle node in the rebuilt layer.
  function ideaPushHistory() {
    try {
      const layerJson = JSON.parse(_ideaLayer.toJSON());
      if (layerJson.children) {
        layerJson.children = layerJson.children.filter(c => c.className !== 'Transformer');
      }
      _ideaHistory.push(layerJson);
      if (_ideaHistory.length > 30) _ideaHistory.shift();
    } catch (e) {}
  }
  function ideaUndo() {
    if (!_ideaHistory.length) { schemToast('Nothing to undo.'); return; }
    const snap = _ideaHistory.pop();
    ideaRestoreLayerFromJSON(snap);
    ideaScheduleSave();
  }

  function ideaRestoreLayerFromJSON(json) {
    // Tear down the current layer and rebuild from JSON. Preserve images by
    // matching saved data URLs back to HTMLImageElements. The Transformer
    // is destroyed by destroyChildren(), so recreate it fresh — reusing a
    // destroyed Konva node leaves it visually attached but functionally dead
    // (Delete-key + drag handles silently no-op).
    if (!_ideaLayer) return;
    let parsed;
    try { parsed = typeof json === 'string' ? JSON.parse(json) : json; } catch (e) { return; }
    _ideaLayer.destroyChildren();
    if (parsed && parsed.children) {
      parsed.children.forEach(childJson => {
        if (childJson.className === 'Transformer') return; // never restore stale handles
        try {
          const node = Konva.Node.create(childJson);
          _ideaLayer.add(node);
          if (node.getClassName && node.getClassName() === 'Image') {
            const src = node.getAttr('ideaImageSrc');
            if (src) {
              const img = new Image();
              img.onload = () => { node.image(img); _ideaLayer.batchDraw(); };
              img.src = src;
            }
          }
        } catch (e) { /* skip broken node */ }
      });
    }
    _ideaTransformer = new Konva.Transformer({
      rotateEnabled: true,
      anchorSize: 9,
      borderStroke: '#4f46e5',
      anchorStroke: '#4f46e5',
      anchorFill: 'white',
      borderDash: [4, 3]
    });
    _ideaLayer.add(_ideaTransformer);
    _ideaSelected = null;
    _ideaLayer.batchDraw();
  }

  function ideaScheduleSave() {
    if (_ideaSaveTimer) clearTimeout(_ideaSaveTimer);
    _ideaSaveTimer = setTimeout(ideaSaveToStorage, 350);
  }
  function ideaSaveToStorage() {
    try {
      // Strip the transformer from the snapshot so we don't re-create handles on load.
      const layerJson = JSON.parse(_ideaLayer.toJSON());
      if (layerJson.children) {
        layerJson.children = layerJson.children.filter(c => c.className !== 'Transformer');
      }
      localStorage.setItem(IDEA_STORAGE_KEY, JSON.stringify({
        version: 1,
        layer: layerJson
      }));
    } catch (e) { /* quota, etc — ignore */ }
  }
  function ideaRestoreFromStorage() {
    try {
      const raw = localStorage.getItem(IDEA_STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (!data || !data.layer) return;
      ideaRestoreLayerFromJSON(data.layer);
    } catch (e) {}
  }

  // --- PNG export (white background under everything) ---
  function ideaBuildPngBlob() {
    return new Promise((resolve, reject) => {
      if (!_ideaStage) { reject(new Error('no stage')); return; }
      // Temporarily detach transformer for a clean export, then restore.
      const nodes = _ideaTransformer.nodes();
      _ideaTransformer.nodes([]);
      _ideaTransformer.visible(false);
      _ideaLayer.batchDraw();
      // Swap the cream background to white so the export reads as a clean
      // sketch on paper, not on a colored card.
      const bg = _ideaBgLayer.findOne('.idea-bg');
      const prevFill = bg ? bg.fill() : null;
      if (bg) { bg.fill('#ffffff'); _ideaBgLayer.batchDraw(); }
      // Export at native 1:1 regardless of on-screen zoom/pan, then restore.
      const prevScale = _ideaStage.scaleX();
      const prevPos = _ideaStage.position();
      _ideaStage.scale({ x: 1, y: 1 });
      _ideaStage.position({ x: 0, y: 0 });
      const restoreZoom = () => { _ideaStage.scale({ x: prevScale, y: prevScale }); _ideaStage.position(prevPos); _ideaStage.batchDraw(); };
      try {
        const dataUrl = _ideaStage.toDataURL({ pixelRatio: 2, mimeType: 'image/png' });
        fetch(dataUrl).then(r => r.blob()).then(b => {
          if (bg) { bg.fill(prevFill || '#FAF6EE'); _ideaBgLayer.batchDraw(); }
          restoreZoom();
          _ideaTransformer.visible(true);
          _ideaTransformer.nodes(nodes);
          _ideaLayer.batchDraw();
          resolve(b);
        }).catch(err => {
          if (bg) { bg.fill(prevFill || '#FAF6EE'); _ideaBgLayer.batchDraw(); }
          restoreZoom();
          _ideaTransformer.visible(true);
          _ideaTransformer.nodes(nodes);
          _ideaLayer.batchDraw();
          reject(err);
        });
      } catch (err) {
        if (bg) { bg.fill(prevFill || '#FAF6EE'); _ideaBgLayer.batchDraw(); }
        restoreZoom();
        _ideaTransformer.visible(true);
        _ideaTransformer.nodes(nodes);
        _ideaLayer.batchDraw();
        reject(err);
      }
    });
  }

  // ============== INIT ==============
  // Smooth in-page route switching via pushState; no full reload between
  // Tools / Homework / Progress / Home, so nav doesn't flicker.
  // ============================================================
  // ============== CAD TOOL ====================================
  // Three modes (Wizard / AI Build / Code) sharing one engine:
  // JSCAD modeling -> ASCII STL -> Three.js viewer. Engine is
  // lazy-loaded from esm.sh on first /tools/cad visit so the rest
  // of the hub stays fast. AI Build hits /api/cad-code, which is a
  // sibling of /api/vibe-code tuned for assistive-tech parts.
  // ============================================================

  // Scene-graph state. Each entry in `objects` is one independent shape the
  // student can click, drag, edit, and toggle as hole/solid — the same model
  // Tinkercad uses. AI mode and the legacy single-mesh path go through the
  // same `objects` array as a single compound entry.
  const _cad = {
    engine: null,
    scene: null, camera: null, renderer: null, controls: null,
    grid: null, container: null, animHandle: null,
    raycaster: null, mouseNdc: null,
    gizmo: null, gizmoMode: 'translate',
    objects: [],        // [{id, kind, type, params, transform, color, isHole, mesh}]
    selectedId: null,
    nextObjId: 1,
    dropOffset: 0,      // staircase new drops in X so they don't all stack at origin
    code: '',           // last AI code (single compound entry)
    mode: 'wizard',     // 'wizard' | 'ai'
    chat: [],
    wizActive: 'buttonEnclosure',
    wizParams: {},
    busy: false
  };

  // The basic primitive palette (Tinkercad's first row). Each entry knows how
  // to build itself in Three.js (for fast preview meshes) and in JSCAD (for
  // CSG export). Params here are the editable shape numbers — position and
  // rotation are stored per-object on `transform`.
  const CAD_PRIMITIVES = {
    cube: {
      title: 'Box',
      defaultParams: { w: 20, d: 20, h: 20 },
      paramSpecs: [
        { key: 'w', label: 'Width X (mm)',  min: 1, max: 300, step: 0.5 },
        { key: 'd', label: 'Depth Y (mm)',  min: 1, max: 300, step: 0.5 },
        { key: 'h', label: 'Height Z (mm)', min: 1, max: 300, step: 0.5 }
      ]
    },
    cylinder: {
      title: 'Cylinder',
      defaultParams: { radius: 10, height: 20, segments: 48 },
      paramSpecs: [
        { key: 'radius',  label: 'Radius (mm)', min: 0.5, max: 150, step: 0.5 },
        { key: 'height',  label: 'Height (mm)', min: 1,   max: 300, step: 0.5 },
        { key: 'segments',label: 'Smoothness',  min: 8,   max: 96,  step: 4 }
      ]
    },
    sphere: {
      title: 'Sphere',
      defaultParams: { radius: 12, segments: 32 },
      paramSpecs: [
        { key: 'radius',  label: 'Radius (mm)', min: 1, max: 150, step: 0.5 },
        { key: 'segments',label: 'Smoothness',  min: 8, max: 96,  step: 4 }
      ]
    },
    cone: {
      title: 'Cone',
      defaultParams: { radius: 12, height: 24, segments: 48 },
      paramSpecs: [
        { key: 'radius',  label: 'Base radius (mm)', min: 1, max: 150, step: 0.5 },
        { key: 'height',  label: 'Height (mm)',      min: 1, max: 300, step: 0.5 },
        { key: 'segments',label: 'Smoothness',       min: 8, max: 96,  step: 4 }
      ]
    },
    torus: {
      title: 'Torus',
      defaultParams: { radius: 16, tube: 4, segments: 48 },
      paramSpecs: [
        { key: 'radius',  label: 'Ring radius (mm)', min: 4, max: 100, step: 0.5 },
        { key: 'tube',    label: 'Tube radius (mm)', min: 0.5, max: 20, step: 0.2 },
        { key: 'segments',label: 'Smoothness',       min: 12, max: 96, step: 4 }
      ]
    }
  };

  async function cadLoadEngine() {
    if (_cad.engine) return _cad.engine;
    const setStatus = (msg) => {
      const el = document.getElementById('cadStatus');
      if (el) { el.textContent = msg; el.classList.remove('is-error','is-good'); }
    };
    setStatus('Loading 3D engine…');
    try {
      // Direct subpackages keep the bundle small. 3MF is loaded best-effort —
      // some bundle paths don't expose it cleanly; if it fails, we still ship
      // STL and silently disable the 3MF button.
      const [modeling, stlMod, three, orbitMod, stlLoaderMod, threeMfMod, tcMod] = await Promise.all([
        import('https://esm.sh/@jscad/modeling@2.12.0'),
        import('https://esm.sh/@jscad/stl-serializer@2.1.11'),
        import('https://esm.sh/three@0.158.0'),
        import('https://esm.sh/three@0.158.0/examples/jsm/controls/OrbitControls.js'),
        import('https://esm.sh/three@0.158.0/examples/jsm/loaders/STLLoader.js'),
        import('https://esm.sh/@jscad/3mf-serializer@2.0.18').catch(() => null),
        import('https://esm.sh/three@0.158.0/examples/jsm/controls/TransformControls.js')
      ]);
      const modelingNs = modeling.default || modeling;
      const stlNs = stlMod.default || stlMod;
      const threeNs = three.default || three;
      const stlSerialize = (typeof stlNs.serialize === 'function')
        ? stlNs.serialize
        : (stlNs.stlSerializer && stlNs.stlSerializer.serialize);
      if (typeof stlSerialize !== 'function') {
        throw new Error('STL serializer not found in module bundle.');
      }
      let threeMfSerialize = null;
      if (threeMfMod) {
        const tns = threeMfMod.default || threeMfMod;
        threeMfSerialize = (typeof tns.serialize === 'function')
          ? tns.serialize
          : (tns.threeMfSerializer && tns.threeMfSerializer.serialize);
      }
      _cad.engine = {
        modeling: modelingNs,
        stlSerialize,
        threeMfSerialize,
        THREE: threeNs,
        OrbitControls: orbitMod.OrbitControls,
        STLLoader: stlLoaderMod.STLLoader,
        TransformControls: tcMod.TransformControls
      };
      // Disable the 3MF button up-front if its serializer didn't load.
      const tmfBtn = document.getElementById('cadBtnExport3mf');
      if (tmfBtn && !threeMfSerialize) {
        tmfBtn.disabled = true;
        tmfBtn.title = '3MF serializer unavailable — use Export STL.';
      }
      setStatus('');
      return _cad.engine;
    } catch (err) {
      const el = document.getElementById('cadStatus');
      if (el) { el.textContent = 'Engine failed to load.'; el.classList.add('is-error'); }
      throw err;
    }
  }

  function cadBuildScene(container) {
    const { THREE, OrbitControls, TransformControls } = _cad.engine;
    while (container.firstChild) container.removeChild(container.firstChild);
    const w = container.clientWidth || 800;
    const h = container.clientHeight || 480;

    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(40, w / h, 0.5, 5000);
    camera.position.set(120, -160, 110);
    camera.up.set(0, 0, 1);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.setSize(w, h, false);
    container.appendChild(renderer.domElement);

    // Soft three-light setup: key, fill, rim.
    const key = new THREE.DirectionalLight(0xffffff, 0.95);
    key.position.set(80, -120, 180);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 0.45);
    fill.position.set(-100, 80, 40);
    scene.add(fill);
    scene.add(new THREE.AmbientLight(0xffffff, 0.35));

    // Build-plate grid (200x200mm). Helps kids judge scale.
    const grid = new THREE.GridHelper(200, 20, 0xbcb8a8, 0xddd9c8);
    grid.rotation.x = Math.PI / 2;
    scene.add(grid);
    const axes = new THREE.AxesHelper(20);
    scene.add(axes);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 20);
    controls.update();

    // 3D move/rotate gizmo. Attached when the student selects an object;
    // detached on deselect. Disables orbit while dragging so the camera
    // doesn't fight the gizmo.
    const gizmo = new TransformControls(camera, renderer.domElement);
    gizmo.setSize(0.85);
    gizmo.addEventListener('dragging-changed', (e) => {
      controls.enabled = !e.value;
    });
    gizmo.addEventListener('change', () => {
      const obj = cadGetSelected();
      if (!obj || !obj.mesh) return;
      // Sync mesh transform back to the scene-graph state so the inspector
      // sliders and the export pipeline see the new pos/rot live.
      obj.transform.px = obj.mesh.position.x;
      obj.transform.py = obj.mesh.position.y;
      obj.transform.pz = obj.mesh.position.z;
      obj.transform.rx = obj.mesh.rotation.x;
      obj.transform.ry = obj.mesh.rotation.y;
      obj.transform.rz = obj.mesh.rotation.z;
      cadUpdateInspectorLive();
    });
    scene.add(gizmo);

    // Raycast click handler: on a mouseup that didn't drag (small move
    // distance), pick the topmost object under the pointer. Click empty
    // space to deselect.
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    let downX = 0, downY = 0;
    renderer.domElement.addEventListener('mousedown', (e) => {
      downX = e.clientX; downY = e.clientY;
    });
    renderer.domElement.addEventListener('mouseup', (e) => {
      // Ignore drags (more than 4px movement = camera orbit, not a click).
      if (Math.abs(e.clientX - downX) > 4 || Math.abs(e.clientY - downY) > 4) return;
      // Ignore right/middle clicks (those pan/zoom).
      if (e.button !== 0) return;
      const rect = renderer.domElement.getBoundingClientRect();
      ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(ndc, camera);
      const meshes = _cad.objects.map(o => o.mesh).filter(Boolean);
      const hit = raycaster.intersectObjects(meshes, false)[0];
      if (hit && hit.object && hit.object.userData && hit.object.userData.objId != null) {
        cadSelectObject(hit.object.userData.objId);
      } else {
        cadDeselect();
      }
    });

    _cad.scene = scene;
    _cad.camera = camera;
    _cad.renderer = renderer;
    _cad.controls = controls;
    _cad.grid = grid;
    _cad.container = container;
    _cad.gizmo = gizmo;
    _cad.raycaster = raycaster;
    _cad.mouseNdc = ndc;

    if (_cad.animHandle) cancelAnimationFrame(_cad.animHandle);
    const tick = () => {
      controls.update();
      renderer.render(scene, camera);
      _cad.animHandle = requestAnimationFrame(tick);
    };
    tick();

    if (typeof ResizeObserver !== 'undefined') {
      const ro = new ResizeObserver(() => {
        const w2 = container.clientWidth, h2 = container.clientHeight;
        if (!w2 || !h2) return;
        renderer.setSize(w2, h2, false);
        camera.aspect = w2 / h2;
        camera.updateProjectionMatrix();
      });
      ro.observe(container);
    }
  }

  function cadFitCameraToObject(obj) {
    const { THREE } = _cad.engine;
    const box = new THREE.Box3().setFromObject(obj);
    if (!isFinite(box.min.x)) return;
    const size = new THREE.Vector3();
    const center = new THREE.Vector3();
    box.getSize(size);
    box.getCenter(center);
    const maxDim = Math.max(size.x, size.y, size.z, 20);
    // Generous framing — kids consistently said the part felt "too zoomed in"
    // when this was 2.6x. Pull the camera back so the whole part sits centered
    // with breathing room on every edge.
    const dist = maxDim * 3.6;
    cadAnimateCamera(
      new THREE.Vector3(center.x + dist * 0.65, center.y - dist * 0.85, center.z + dist * 0.55),
      center
    );
    _cad.camera.near = Math.max(0.5, dist * 0.01);
    _cad.camera.far = dist * 20;
    _cad.camera.updateProjectionMatrix();
  }

  // Smoothly fly the camera to a new position/target. Eases in-out so the
  // transition feels like Tinkercad's ViewCube snap rather than a hard cut.
  function cadAnimateCamera(toPos, toTarget, durationMs) {
    if (!_cad.camera || !_cad.controls) return;
    const { THREE } = _cad.engine;
    const fromPos = _cad.camera.position.clone();
    const fromTarget = _cad.controls.target.clone();
    const target = toTarget ? new THREE.Vector3().copy(toTarget) : fromTarget;
    const dur = durationMs || 380;
    const t0 = performance.now();
    const step = (now) => {
      const u = Math.min(1, (now - t0) / dur);
      // easeInOutQuad
      const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      _cad.camera.position.lerpVectors(fromPos, toPos, e);
      _cad.controls.target.lerpVectors(fromTarget, target, e);
      _cad.controls.update();
      if (u < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // Snap the camera to one of the standard views, Tinkercad-style. If there's
  // a mesh, frame it; otherwise orbit the world origin.
  function cadSetView(name) {
    if (!_cad.camera || !_cad.controls) return;
    const { THREE } = _cad.engine;
    if (name === 'center') { cadFitAll(); return; }
    // Anchor: the combined scene bounds if we have objects, else world origin.
    let anchor = new THREE.Vector3(0, 0, 0);
    let radius = 60;
    if (_cad.objects.length) {
      const box = new THREE.Box3();
      _cad.objects.forEach(o => { if (o.mesh) box.expandByObject(o.mesh); });
      if (isFinite(box.min.x)) {
        const size = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(anchor);
        radius = Math.max(size.x, size.y, size.z, 20) * 1.6;
      }
    }
    const dirs = {
      iso:    new THREE.Vector3( 1, -1.2,  0.85),
      top:    new THREE.Vector3( 0,  0,    1.4),
      bottom: new THREE.Vector3( 0,  0,   -1.4),
      front:  new THREE.Vector3( 0, -1.4,  0.05),
      back:   new THREE.Vector3( 0,  1.4,  0.05),
      right:  new THREE.Vector3( 1.4, 0,   0.05),
      left:   new THREE.Vector3(-1.4, 0,   0.05)
    };
    const d = (dirs[name] || dirs.iso).clone().normalize().multiplyScalar(radius);
    const toPos = anchor.clone().add(d);
    cadAnimateCamera(toPos, anchor);
  }

  // Wipe the rendered mesh and the stored code/STL. The build-plate grid and
  // axes stay so the scene doesn't look broken. Disables Export until a new
  // part is rendered.
  // ===== Scene-graph helpers =====

  function cadGetSelected() {
    if (_cad.selectedId == null) return null;
    return _cad.objects.find(o => o.id === _cad.selectedId) || null;
  }
  function cadNextObjId() { return _cad.nextObjId++; }

  // Where a freshly-dropped object should sit so it rests on the build plate.
  function cadDefaultZ(kind, type, params) {
    if (kind === 'template' || kind === 'compound') return 0;
    if (type === 'cube')     return params.h / 2;
    if (type === 'cylinder' || type === 'cone') return params.height / 2;
    if (type === 'sphere')   return params.radius;
    if (type === 'torus')    return params.tube;
    return 0;
  }

  // Native Three.js geometry for the basic primitives (fast preview path; no
  // round-trip through JSCAD + STL for shapes Three.js already knows how to
  // draw). CSG export still goes through JSCAD primitives, see cadObjToJscad.
  function cadMakePrimitiveGeom(type, params) {
    const { THREE } = _cad.engine;
    let g;
    if (type === 'cube') {
      g = new THREE.BoxGeometry(params.w, params.d, params.h);
    } else if (type === 'cylinder') {
      g = new THREE.CylinderGeometry(params.radius, params.radius, params.height, params.segments);
      g.rotateX(Math.PI / 2); // Three's cylinder axis is Y; our scene is Z-up.
    } else if (type === 'sphere') {
      const ws = Math.max(8, params.segments);
      g = new THREE.SphereGeometry(params.radius, ws, Math.max(6, Math.floor(ws/2)));
    } else if (type === 'cone') {
      g = new THREE.ConeGeometry(params.radius, params.height, params.segments);
      g.rotateX(Math.PI / 2);
    } else if (type === 'torus') {
      g = new THREE.TorusGeometry(params.radius, params.tube, Math.max(8, Math.floor(params.segments/2)), params.segments);
    } else {
      g = new THREE.BoxGeometry(10, 10, 10);
    }
    return g;
  }

  function cadMakeMaterial(color, isHole) {
    const { THREE } = _cad.engine;
    return new THREE.MeshStandardMaterial({
      color: (color != null) ? color : 0x6366f1,
      metalness: 0.05,
      roughness: 0.55,
      transparent: !!isHole,
      opacity: isHole ? 0.42 : 1.0,
      flatShading: false
    });
  }

  // Evaluate a JSCAD program string and return a Three.js BufferGeometry built
  // from the serialized STL. Used for templates and for AI-generated code.
  function cadEvalTemplateGeom(code) {
    const { modeling, stlSerialize, STLLoader } = _cad.engine;
    const sandboxRequire = (name) => {
      if (name === '@jscad/modeling') return modeling;
      if (name.startsWith('@jscad/modeling/')) {
        const parts = name.split('/').slice(2);
        return parts.reduce((acc, k) => (acc && acc[k] != null) ? acc[k] : undefined, modeling);
      }
      throw new Error('Cannot import "' + name + '" inside the CAD tool.');
    };
    const moduleObj = { exports: {} };
    // eslint-disable-next-line no-new-func
    const fn = new Function('require', 'module', 'exports', 'Math', code);
    fn(sandboxRequire, moduleObj, moduleObj.exports, Math);
    const m = moduleObj.exports || {};
    const mainFn = (typeof m.main === 'function') ? m.main : null;
    if (!mainFn) throw new Error('Template code must export a `main` function.');
    const geomOut = mainFn();
    if (!geomOut) throw new Error('`main()` returned nothing.');
    const geoms = Array.isArray(geomOut) ? geomOut : [geomOut];
    const stl = stlSerialize({ binary: false }, ...geoms);
    const stlText = Array.isArray(stl) ? stl.join('') : String(stl);
    const loader = new STLLoader();
    const buf = loader.parse(stlText);
    buf.computeVertexNormals();
    return buf;
  }

  // Build (or rebuild) the visible mesh for one scene object from its current
  // params + color + hole state. Preserves transform so inspector edits don't
  // snap the object back to the origin.
  function cadRegenObject(obj) {
    const { THREE } = _cad.engine;
    let geom;
    if (obj.kind === 'primitive') {
      geom = cadMakePrimitiveGeom(obj.type, obj.params);
    } else if (obj.kind === 'template') {
      const tpl = CAD_WIZ[obj.type];
      if (!tpl) throw new Error('Unknown template: ' + obj.type);
      geom = cadEvalTemplateGeom(tpl.build(obj.params));
    } else if (obj.kind === 'compound') {
      geom = cadEvalTemplateGeom(obj.code || '');
    }
    const material = cadMakeMaterial(obj.color, obj.isHole);
    if (obj.mesh) {
      if (obj.mesh.geometry) obj.mesh.geometry.dispose();
      if (obj.mesh.material) obj.mesh.material.dispose();
      obj.mesh.geometry = geom;
      obj.mesh.material = material;
    } else {
      obj.mesh = new THREE.Mesh(geom, material);
      obj.mesh.userData.objId = obj.id;
      _cad.scene.add(obj.mesh);
    }
    obj.mesh.position.set(obj.transform.px, obj.transform.py, obj.transform.pz);
    obj.mesh.rotation.set(obj.transform.rx, obj.transform.ry, obj.transform.rz);
  }

  function cadAddPrimitive(type) {
    const def = CAD_PRIMITIVES[type];
    if (!def) return;
    const params = { ...def.defaultParams };
    const off = _cad.dropOffset;
    _cad.dropOffset = (_cad.dropOffset + 25) % 180;
    const obj = {
      id: cadNextObjId(),
      kind: 'primitive',
      type,
      params,
      transform: { px: off, py: off, pz: cadDefaultZ('primitive', type, params), rx: 0, ry: 0, rz: 0 },
      color: 0x6366f1,
      isHole: false,
      mesh: null
    };
    _cad.objects.push(obj);
    try {
      cadRegenObject(obj);
      cadSelectObject(obj.id);
      cadSetStatus(`${def.title} added.`, 'good');
    } catch (err) {
      _cad.objects = _cad.objects.filter(o => o.id !== obj.id);
      cadSetStatus('Failed to add shape.', 'error');
      cadShowError(String(err && err.message || err));
    }
  }

  function cadAddTemplate(key) {
    const tpl = CAD_WIZ[key];
    if (!tpl) return;
    const params = {};
    tpl.params.forEach(p => { params[p.key] = p.value; });
    const off = _cad.dropOffset;
    _cad.dropOffset = (_cad.dropOffset + 25) % 180;
    const obj = {
      id: cadNextObjId(),
      kind: 'template',
      type: key,
      params,
      transform: { px: off, py: off, pz: 0, rx: 0, ry: 0, rz: 0 },
      color: 0x6366f1,
      isHole: false,
      mesh: null
    };
    _cad.objects.push(obj);
    try {
      cadRegenObject(obj);
      cadSelectObject(obj.id);
      cadSetStatus(`${tpl.title} added.`, 'good');
    } catch (err) {
      _cad.objects = _cad.objects.filter(o => o.id !== obj.id);
      cadSetStatus('Template failed.', 'error');
      cadShowError(String(err && err.message || err));
    }
  }

  function cadAddCompoundFromCode(code) {
    const obj = {
      id: cadNextObjId(),
      kind: 'compound',
      type: 'ai-compound',
      params: {},
      code,
      transform: { px: 0, py: 0, pz: 0, rx: 0, ry: 0, rz: 0 },
      color: 0x6366f1,
      isHole: false,
      mesh: null
    };
    _cad.objects.push(obj);
    try {
      cadRegenObject(obj);
      cadSelectObject(obj.id);
      cadSetStatus('AI shape added.', 'good');
    } catch (err) {
      _cad.objects = _cad.objects.filter(o => o.id !== obj.id);
      cadSetStatus('AI code failed to render.', 'error');
      cadShowError(String(err && err.message || err));
    }
  }

  function cadSelectObject(id) {
    _cad.selectedId = id;
    const obj = cadGetSelected();
    if (obj && obj.mesh && _cad.gizmo) {
      _cad.gizmo.setMode(_cad.gizmoMode || 'translate');
      _cad.gizmo.attach(obj.mesh);
    }
    if (_cad.mode === 'wizard') {
      const panel = document.getElementById('cadLeftBody');
      if (panel) renderCadWizardPanel(panel);
    }
  }

  function cadDeselect() {
    if (_cad.gizmo) _cad.gizmo.detach();
    _cad.selectedId = null;
    if (_cad.mode === 'wizard') {
      const panel = document.getElementById('cadLeftBody');
      if (panel) renderCadWizardPanel(panel);
    }
  }

  function cadDeleteObject(id) {
    const i = _cad.objects.findIndex(o => o.id === id);
    if (i < 0) return;
    const obj = _cad.objects[i];
    if (_cad.gizmo && _cad.selectedId === id) _cad.gizmo.detach();
    if (obj.mesh) {
      _cad.scene.remove(obj.mesh);
      if (obj.mesh.geometry) obj.mesh.geometry.dispose();
      if (obj.mesh.material) obj.mesh.material.dispose();
    }
    _cad.objects.splice(i, 1);
    if (_cad.selectedId === id) cadDeselect();
  }

  function cadFitAll() {
    const { THREE } = _cad.engine;
    if (!_cad.objects.length) {
      _cad.controls.target.set(0, 0, 20);
      cadAnimateCamera(new THREE.Vector3(120, -160, 110), new THREE.Vector3(0, 0, 20));
      return;
    }
    const box = new THREE.Box3();
    _cad.objects.forEach(o => { if (o.mesh) box.expandByObject(o.mesh); });
    if (!isFinite(box.min.x)) return;
    const size = new THREE.Vector3();
    const center = new THREE.Vector3();
    box.getSize(size); box.getCenter(center);
    const maxDim = Math.max(size.x, size.y, size.z, 20);
    const dist = maxDim * 3.6;
    cadAnimateCamera(
      new THREE.Vector3(center.x + dist * 0.65, center.y - dist * 0.85, center.z + dist * 0.55),
      center
    );
    _cad.camera.near = Math.max(0.5, dist * 0.01);
    _cad.camera.far = dist * 20;
    _cad.camera.updateProjectionMatrix();
  }

  // Sync inspector inputs from the live gizmo drag — but skip the field the
  // user is currently typing in so we don't yank their caret.
  function cadUpdateInspectorLive() {
    const obj = cadGetSelected();
    if (!obj) return;
    const setNum = (key, val) => {
      const el = document.querySelector(`[data-cad-insp-key="${key}"]`);
      if (!el || document.activeElement === el) return;
      el.value = (typeof val === 'number') ? (+val.toFixed(2)) : val;
    };
    setNum('px', obj.transform.px);
    setNum('py', obj.transform.py);
    setNum('pz', obj.transform.pz);
    setNum('rx', obj.transform.rx * 180 / Math.PI);
    setNum('ry', obj.transform.ry * 180 / Math.PI);
    setNum('rz', obj.transform.rz * 180 / Math.PI);
  }

  function cadClearScene() {
    [..._cad.objects].forEach(o => cadDeleteObject(o.id));
    _cad.objects = [];
    _cad.selectedId = null;
    _cad.dropOffset = 0;
    _cad.code = '';
    cadClearError();
    cadSetStatus('Scene cleared.', 'good');
    if (_cad.mode === 'wizard') {
      const panel = document.getElementById('cadLeftBody');
      if (panel) renderCadWizardPanel(panel);
    }
  }

  function cadShowError(msg) {
    const wrap = document.getElementById('cadViewerWrap');
    if (!wrap) return;
    let box = wrap.querySelector('.cad-viewer-error');
    if (!box) {
      box = document.createElement('div');
      box.className = 'cad-viewer-error';
      wrap.appendChild(box);
    }
    box.textContent = msg;
  }
  function cadClearError() {
    const box = document.querySelector('.cad-viewer-error');
    if (box) box.remove();
  }
  function cadSetStatus(msg, kind) {
    const el = document.getElementById('cadStatus');
    if (!el) return;
    el.textContent = msg || '';
    el.classList.toggle('is-error', kind === 'error');
    el.classList.toggle('is-good', kind === 'good');
  }

  // Legacy entry point — kept for AI mode, which still produces a single
  // compound mesh from JSCAD code. Now wraps the new scene-graph path.
  async function cadRunFromCurrent(code) {
    if (_cad.busy) return;
    _cad.busy = true;
    cadSetStatus('Rendering…');
    cadClearError();
    try {
      await cadLoadEngine();
      _cad.code = code;
      cadAddCompoundFromCode(code);
    } catch (err) {
      const msg = (err && err.message) ? err.message : String(err);
      cadSetStatus('Error', 'error');
      cadShowError(msg);
    }
    _cad.busy = false;
  }

  // Shared download helper for both STL and 3MF.
  function cadDownloadBlob(data, ext, mime) {
    const blob = (data instanceof Blob) ? data : new Blob([data], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    a.href = url;
    a.download = `d4sg-cad-${stamp}.${ext}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // Convert one scene object to a JSCAD geom with its scene transform baked
  // in. Primitives use JSCAD primitive constructors directly; templates and
  // AI compounds re-run their code to recover the geom.
  function cadObjToJscadGeom(obj) {
    const { modeling } = _cad.engine;
    const { primitives, transforms, geometries } = modeling;
    let geom = null;
    if (obj.kind === 'primitive') {
      const p = obj.params;
      if (obj.type === 'cube') {
        geom = primitives.cuboid({ size: [p.w, p.d, p.h] });
      } else if (obj.type === 'cylinder') {
        geom = primitives.cylinder({ radius: p.radius, height: p.height, segments: p.segments });
      } else if (obj.type === 'sphere') {
        geom = primitives.sphere({ radius: p.radius, segments: p.segments });
      } else if (obj.type === 'cone') {
        geom = primitives.cylinder({ radius: 0.01, height: p.height, segments: p.segments });
        // Use a true cone via cylinderElliptic if available, else two-radii cylinder.
        if (primitives.cylinderElliptic) {
          geom = primitives.cylinderElliptic({
            startRadius: [p.radius, p.radius],
            endRadius:   [0.01, 0.01],
            height: p.height, segments: p.segments
          });
        }
      } else if (obj.type === 'torus') {
        if (primitives.torus) {
          geom = primitives.torus({ innerRadius: p.tube, outerRadius: p.radius, innerSegments: Math.max(8, Math.floor(p.segments/2)), outerSegments: p.segments });
        }
      }
    } else if (obj.kind === 'template' || obj.kind === 'compound') {
      const code = (obj.kind === 'template') ? CAD_WIZ[obj.type].build(obj.params) : (obj.code || '');
      // Re-run the code, get the geom directly (skip the STL round-trip).
      const sandboxRequire = (name) => {
        if (name === '@jscad/modeling') return modeling;
        if (name.startsWith('@jscad/modeling/')) {
          const parts = name.split('/').slice(2);
          return parts.reduce((acc, k) => (acc && acc[k] != null) ? acc[k] : undefined, modeling);
        }
        throw new Error('Cannot import "' + name + '" inside the CAD tool.');
      };
      const moduleObj = { exports: {} };
      const fn = new Function('require', 'module', 'exports', 'Math', code);
      fn(sandboxRequire, moduleObj, moduleObj.exports, Math);
      const m = moduleObj.exports || {};
      const mainFn = (typeof m.main === 'function') ? m.main : null;
      if (!mainFn) return null;
      const out = mainFn();
      if (!out) return null;
      const arr = Array.isArray(out) ? out : [out];
      // Combine multi-geom template outputs into one before transforming.
      geom = (arr.length === 1) ? arr[0] : modeling.booleans.union(...arr);
    }
    if (!geom) return null;
    // Apply scene transform (rotate first, then translate — match Three.js mesh order).
    const t = obj.transform;
    if (t.rx) geom = transforms.rotateX(t.rx, geom);
    if (t.ry) geom = transforms.rotateY(t.ry, geom);
    if (t.rz) geom = transforms.rotateZ(t.rz, geom);
    if (t.px || t.py || t.pz) geom = transforms.translate([t.px, t.py, t.pz], geom);
    return geom;
  }

  // Walk every scene object, union the solids, subtract the holes, return the
  // combined JSCAD geom. Throws if there are no solid shapes to export.
  function cadBuildSceneGeom() {
    if (!_cad.objects.length) throw new Error('Nothing to export — drop a shape first.');
    const { modeling } = _cad.engine;
    const solids = [];
    const holes = [];
    _cad.objects.forEach(o => {
      const g = cadObjToJscadGeom(o);
      if (!g) return;
      (o.isHole ? holes : solids).push(g);
    });
    if (!solids.length) throw new Error('At least one shape must be a Solid (not all Holes).');
    let combined = (solids.length === 1) ? solids[0] : modeling.booleans.union(...solids);
    if (holes.length) combined = modeling.booleans.subtract(combined, ...holes);
    return combined;
  }

  function cadExportStl() {
    try {
      const { stlSerialize } = _cad.engine;
      const geom = cadBuildSceneGeom();
      const stl = stlSerialize({ binary: false }, geom);
      const stlText = Array.isArray(stl) ? stl.join('') : String(stl);
      cadDownloadBlob(stlText, 'stl', 'application/sla');
      cadSetStatus('STL downloaded.', 'good');
    } catch (err) {
      cadSetStatus(err.message || 'STL export failed.', 'error');
    }
  }

  function cadExport3mf() {
    const { threeMfSerialize } = _cad.engine || {};
    if (!threeMfSerialize) { cadSetStatus('3MF unavailable — use STL.', 'error'); return; }
    try {
      const geom = cadBuildSceneGeom();
      const out = threeMfSerialize({}, geom);
      const payload = Array.isArray(out) ? out[0] : out;
      cadDownloadBlob(payload, '3mf', 'model/3mf');
      cadSetStatus('3MF downloaded.', 'good');
    } catch (err) {
      cadSetStatus(err.message || '3MF export failed.', 'error');
    }
  }

  // In-app maximize: just toggle a class and force the WebGL renderer to
  // re-size to the new container dimensions next frame. No native fullscreen
  // API — safer on Chromebooks, no OS chrome flicker, no crash on rapid
  // toggles.
  function cadToggleFullscreen() {
    const el = document.getElementById('cadPanel');
    if (!el) return;
    el.classList.toggle('is-maximized');
    cadResyncViewerSize();
    // A second resync after the layout has fully settled catches the case
    // where the canvas measures 0 mid-transition.
    requestAnimationFrame(() => cadResyncViewerSize());
    setTimeout(() => cadResyncViewerSize(), 200);
  }
  function cadResyncViewerSize() {
    const viewer = document.getElementById('cadViewer');
    if (!viewer || !_cad.renderer || !_cad.camera) return;
    const w = viewer.clientWidth, h = viewer.clientHeight;
    if (!w || !h) return;
    _cad.renderer.setSize(w, h, false);
    _cad.camera.aspect = w / h;
    _cad.camera.updateProjectionMatrix();
  }

  // ---------- Wizard templates ----------
  // Each template returns the JSCAD source string for the configured params.
  // Code is written so the student can switch to Code mode and tweak it.
  // Display order + label for the template categories. Templates are grouped
  // by their `category` field at render time; new ones get a category here.
  const CAD_CATEGORIES = [
    { key: 'switches',  label: 'Switches & Buttons' },
    { key: 'joystick',  label: 'Joystick & Pointer' },
    { key: 'sensors',   label: 'Sensors & Mouth' },
    { key: 'structure', label: 'Structure & Cabling' },
    { key: 'grips',     label: 'Grips & Adaptations' }
  ];

  const CAD_WIZ = {
    // =========================================================
    // SWITCHES & BUTTONS
    // =========================================================
    buttonEnclosure: {
      title: 'Button Enclosure',
      category: 'switches',
      blurb: 'Box with a panel-mount button on top and a cable hole in the back.',
      params: [
        { key: 'w', label: 'Width X (mm)',  type: 'number', value: 60, min: 25, max: 200, step: 1 },
        { key: 'd', label: 'Depth Y (mm)',  type: 'number', value: 45, min: 25, max: 200, step: 1 },
        { key: 'h', label: 'Height Z (mm)', type: 'number', value: 28, min: 15, max: 100, step: 1 },
        { key: 'holeD', label: 'Button hole Ø (mm)', type: 'number', value: 16.2, min: 6, max: 30, step: 0.1 },
        { key: 'cableD', label: 'Cable hole Ø (mm)', type: 'number', value: 8.5, min: 3, max: 14, step: 0.1 },
        { key: 'wallT', label: 'Wall thickness (mm)', type: 'number', value: 2.0, min: 1.5, max: 5.0, step: 0.1 }
      ],
      build: (p) =>
`const { primitives, transforms, booleans } = require('@jscad/modeling')
const { cuboid, cylinder, roundedCuboid } = primitives
const { translate, rotate } = transforms
const { subtract } = booleans

function main () {
  const w = ${p.w}, d = ${p.d}, h = ${p.h}
  const wallT = ${p.wallT}
  const holeD = ${p.holeD}, cableD = ${p.cableD}

  const outer = roundedCuboid({ size: [w, d, h], roundRadius: 1.5, segments: 16, center: [0, 0, h/2] })
  const inner = cuboid({ size: [w - 2*wallT, d - 2*wallT, h - wallT], center: [0, 0, (h - wallT)/2] })
  const btnHole = cylinder({ radius: holeD/2, height: wallT + 2, segments: 48, center: [0, 0, h - wallT/2] })
  const cableHole = translate([0, d/2, h/2], rotate([Math.PI/2, 0, 0],
    cylinder({ radius: cableD/2, height: wallT + 4, segments: 32 })))
  return subtract(outer, inner, btnHole, cableHole)
}
module.exports = { main }`
    },

    largeSwitchDome: {
      title: 'Large Switch Dome',
      category: 'switches',
      blurb: 'Big "Buddy button" style soft-touch switch shell. Cylindrical base with a domed top.',
      params: [
        { key: 'outerD', label: 'Outer Ø (mm)', type: 'number', value: 80,  min: 50, max: 120, step: 1 },
        { key: 'totalH', label: 'Total height (mm)', type: 'number', value: 30, min: 18, max: 50, step: 0.5 },
        { key: 'wallT',  label: 'Wall thickness (mm)', type: 'number', value: 2.5, min: 1.6, max: 5, step: 0.1 },
        { key: 'cableW', label: 'Cable exit width (mm)', type: 'number', value: 8, min: 3, max: 16, step: 0.5 },
        { key: 'cableH', label: 'Cable exit height (mm)', type: 'number', value: 4, min: 2, max: 10, step: 0.5 }
      ],
      build: (p) =>
`const { primitives, transforms, booleans } = require('@jscad/modeling')
const { cuboid, cylinder, sphere } = primitives
const { translate } = transforms
const { union, subtract, intersect } = booleans

function main () {
  const outerD = ${p.outerD}, totalH = ${p.totalH}, wallT = ${p.wallT}
  const cableW = ${p.cableW}, cableH = ${p.cableH}

  // Cylindrical body. The dome takes a bit less than half the diameter in height.
  const bodyH = Math.max(2, totalH - outerD * 0.35)
  const body = translate([0,0,bodyH/2], cylinder({ radius: outerD/2, height: bodyH, segments: 72 }))

  // Upper-hemisphere dome cap sitting on top of the body.
  const fullDome = translate([0,0,bodyH], sphere({ radius: outerD/2, segments: 56 }))
  const clip = cuboid({ size: [outerD+4, outerD+4, outerD], center: [0,0,bodyH + outerD/2] })
  const dome = intersect(fullDome, clip)
  const outer = union(body, dome)

const { cuboid, roundedCuboid } = primitives

function main () {

  const strapW = ${p.strapW}, slotL = ${p.slotL}
  const num = ${p.numStraps}

  const plateRound = Math.max(0.4, Math.min(2, T/2 - 0.2))
  const plate = roundedCuboid({ size: [W, D, T], roundRadius: plateRound, segments: 18, center: [0,0,T/2] })
  const slots = []

    // Pair of slots near +Y and -Y edges.

    slots.push(cuboid({ size: [strapW, slotL, T + 2], center: [x, -D/2 + 5 + slotL/2, T/2] }))

}

const { cuboid, cylinder, roundedCuboid } = primitives

function main () {
  const knobD = ${p.knobD}, knobH = ${p.knobH}
  const wallT = ${p.wallT}
  const armL = ${p.armL}, armW = ${p.armW}, armT = ${p.armT}

`const { primitives, transforms, booleans } = require('@jscad/modeling')
const { cylinder } = primitives
const { translate } = transforms
const { subtract } = booleans

function main () {
  const penD = ${p.penD}, gripD = ${p.gripD}, L = ${p.L}
  const flutes = ${p.flutes}, fluteR = ${p.fluteR}

  const outer = translate([0,0,L/2], cylinder({ radius: gripD/2, height: L, segments: 72 }))
  const bore  = translate([0,0,L/2], cylinder({ radius: penD/2, height: L + 1, segments: 48 }))

  const flutesGeom = []
  if (flutes > 0) {

    for (let i = 0; i < flutes; i++) {

  }
  return subtract(outer, bore, ...flutesGeom)
}
module.exports = { main }`

`const { primitives, transforms, booleans } = require('@jscad/modeling')
const { cuboid, cylinder } = primitives
const { translate, rotate } = transforms
const { union, subtract } = booleans

function main () {
  const palmR = ${p.palmR}, cuffT = ${p.cuffT}, cuffW = ${p.cuffW}
  const utenD = ${p.utenD}, utenL = ${p.utenL}

  // Cuff ring laid flat (axis along Z), open on +Y so it slides onto the hand.
  const outer = translate([0,0,cuffW/2], cylinder({ radius: palmR + cuffT, height: cuffW, segments: 64 }))
  const inner = translate([0,0,cuffW/2], cylinder({ radius: palmR, height: cuffW + 1, segments: 64 }))
  const opening = cuboid({ size: [(palmR + cuffT) * 2 + 4, palmR + cuffT + 6, cuffW + 2],
    center: [0, (palmR + cuffT + 6)/2, cuffW/2] })

  // External utensil socket on the -Y (palm-side) of the cuff.
  const sockOuter = translate([0, -(palmR + cuffT + utenD/2 + 1), cuffW/2],
    rotate([Math.PI/2, 0, 0], cylinder({ radius: utenD/2 + cuffT, height: utenL, segments: 40 })))

    rotate([Math.PI/2, 0, 0], cylinder({ radius: utenD/2, height: utenL + 2, segments: 40 })))

  return subtract(union(outer, sockOuter), inner, opening, sockBore)
}
module.exports = { main }`

  function cadDefaultWizParams(key) {
    const t = CAD_WIZ[key];
    if (!t) return {};
    const out = {};
    t.params.forEach(p => { out[p.key] = p.value; });
    return out;
  }

  function cadCurrentWizardCode() {
    const t = CAD_WIZ[_cad.wizActive];
    if (!t) return '';
    return t.build(_cad.wizParams);
  }

  // ---------- Mode renderers (left panel) ----------
  // Sidebar contents for the Shapes tab. Top: inspector for the selected
  // object (or a thin "tap a shape to add it" hint when nothing is selected).
  // Below: the palette — basic primitives, then the AT templates grouped by
  // category. Clicking a palette item DROPS that shape into the scene as a
  // new independent object, just like Tinkercad.
  function renderCadWizardPanel(panel) {
    const selected = cadGetSelected();
    const inspectorHtml = renderCadInspectorHtml(selected);

    const primPaletteHtml = `
      <h4 class="cad-wiz-cat">Basic Shapes</h4>

          </button>`).join('')}
      </div>`;

    const templatePaletteHtml = CAD_CATEGORIES.map(cat => {
      const entries = Object.entries(CAD_WIZ).filter(([, tpl]) => tpl.category === cat.key);
      if (!entries.length) return '';
      return `
        <h4 class="cad-wiz-cat">${escapeHtml(cat.label)}</h4>

              <span class="cad-wiz-template-title">${escapeHtml(tpl.title)}</span>
            </button>`).join('')}
        </div>`;
    }).join('');

    panel.innerHTML = `
      ${inspectorHtml}
      ${primPaletteHtml}
      ${templatePaletteHtml}
    `;

    // Palette click handlers — drop a new shape into the scene.
    panel.querySelectorAll('[data-cad-prim]').forEach(b => {
      b.addEventListener('click', () => cadAddPrimitive(b.dataset.cadPrim));

    panel.querySelectorAll('[data-cad-tpl]').forEach(b => {

  // Inspector renderer. Pulls the right param-spec list based on the selected
  // object's kind (primitive vs template vs compound), plus the universal
  // transform fields, hole/solid toggle, and a delete button.
  function renderCadInspectorHtml(obj) {
    if (!obj) {
      return `
        <div class="cad-insp cad-insp--empty">
          <p class="cad-insp-hint">Tap a shape below to drop it into the scene. Click a shape in the canvas to edit it here.</p>
        </div>`;
    }
    let specs = [];
    let title = '';
    if (obj.kind === 'primitive') {
      const def = CAD_PRIMITIVES[obj.type];
      title = def.title;
      specs = def.paramSpecs;
    } else if (obj.kind === 'template') {
      const tpl = CAD_WIZ[obj.type];
      title = tpl.title;
      // Template paramSpecs use a slightly different key (min/max/step/value/label).
      specs = tpl.params.map(p => ({ key: p.key, label: p.label, min: p.min, max: p.max, step: p.step }));
    } else if (obj.kind === 'compound') {
      title = 'AI Shape';
      specs = [];
    }
    const paramsHtml = specs.map(s => `
      <div class="cad-wiz-row">
        <label>${escapeHtml(s.label)}</label>
        <input type="number" data-cad-param="${s.key}" value="${obj.params[s.key]}"
          min="${s.min}" max="${s.max}" step="${s.step}" />
      </div>`).join('');
    return `
      <div class="cad-insp">
        <div class="cad-insp-head">
          <strong>${escapeHtml(title)}</strong>
          <div class="cad-insp-head-actions">
            <button type="button" class="cad-insp-toggle ${obj.isHole ? 'is-hole' : ''}" data-cad-toggle-hole title="Solid / Hole">

            <button type="button" class="cad-insp-delete" data-cad-delete title="Delete (Backspace)">×</button>
          </div>
        </div>
        ${paramsHtml ? `<div class="cad-insp-section"><span class="cad-insp-label">Size</span>${paramsHtml}</div>` : ''}
        <div class="cad-insp-section">
          <span class="cad-insp-label">Position (mm)</span>
          <div class="cad-insp-triplet">
            <input type="number" step="0.5" data-cad-insp-key="px" value="${(+obj.transform.px.toFixed(2))}" />
            <input type="number" step="0.5" data-cad-insp-key="py" value="${(+obj.transform.py.toFixed(2))}" />
            <input type="number" step="0.5" data-cad-insp-key="pz" value="${(+obj.transform.pz.toFixed(2))}" />
          </div>
          <div class="cad-insp-triplet-axes"><span>X</span><span>Y</span><span>Z</span></div>
        </div>
        <div class="cad-insp-section">
          <span class="cad-insp-label">Rotation (°)</span>
          <div class="cad-insp-triplet">
            <input type="number" step="5" data-cad-insp-key="rx" value="${(+(obj.transform.rx * 180 / Math.PI).toFixed(1))}" />
            <input type="number" step="5" data-cad-insp-key="ry" value="${(+(obj.transform.ry * 180 / Math.PI).toFixed(1))}" />
            <input type="number" step="5" data-cad-insp-key="rz" value="${(+(obj.transform.rz * 180 / Math.PI).toFixed(1))}" />
          </div>
          <div class="cad-insp-triplet-axes"><span>X</span><span>Y</span><span>Z</span></div>
        </div>
      </div>`;
  }

  function wireCadInspector(panel, obj) {
    // Size / shape params — regenerate the mesh when changed.
    panel.querySelectorAll('[data-cad-param]').forEach(inp => {
      inp.addEventListener('change', () => {
        const k = inp.dataset.cadParam;
        const v = parseFloat(inp.value);
        if (Number.isFinite(v)) {
          obj.params[k] = v;
          try { cadRegenObject(obj); cadClearError(); }
          catch (err) { cadShowError(String(err && err.message || err)); }
        }
      });
    });
    // Transform fields — just update transform + re-place the mesh (no regen).
    panel.querySelectorAll('[data-cad-insp-key]').forEach(inp => {
      inp.addEventListener('change', () => {
        const k = inp.dataset.cadInspKey;
        let v = parseFloat(inp.value);
        if (!Number.isFinite(v)) return;
        if (k === 'rx' || k === 'ry' || k === 'rz') v = v * Math.PI / 180;
        obj.transform[k] = v;
        if (obj.mesh) {
          obj.mesh.position.set(obj.transform.px, obj.transform.py, obj.transform.pz);
          obj.mesh.rotation.set(obj.transform.rx, obj.transform.ry, obj.transform.rz);
        }
      });
    });
    // Solid / Hole toggle — re-regen so material updates.
    const tg = panel.querySelector('[data-cad-toggle-hole]');
    if (tg) tg.addEventListener('click', () => {
      obj.isHole = !obj.isHole;
      cadRegenObject(obj);
      renderCadWizardPanel(panel);
    });
    // Delete button.
    const del = panel.querySelector('[data-cad-delete]');
    if (del) del.addEventListener('click', () => cadDeleteObject(obj.id));
  }

        }

    panel.querySelector('#cadAiSend').addEventListener('click', () => cadAiSubmit(input.value));

    });

  function cadAiRenderLog() {

  async function cadAiSubmit(prompt) {
    prompt = (prompt || '').trim();
    if (!prompt) return;
    // Replace any unfilled <FILL-IN> tokens with empty to avoid sending the scaffold verbatim.
    if (/<[^>]+>/.test(prompt)) {
      cadSetStatus('Replace the <…> placeholder first.', 'error');
      return;
    }
    const inp = document.getElementById('cadAiInput');
    if (inp) inp.value = '';
    _cad.chat.push({ role: 'user', content: prompt });
    _cad.chat.push({ role: 'assistant', content: 'Thinking…' });
    cadAiRenderLog();
    cadSetStatus('AI is drafting…');
    try {
      // We send the recent chat + the currently-loaded code so the model can
      // edit-in-place when the student says "adjust".
      const history = _cad.chat.slice(0, -1).filter(m => m.role === 'user' || m.role === 'assistant');
      if (_cad.code) {
        history.unshift({ role: 'user', content: 'For context, here is the JSCAD code currently rendered:\n```js\n' + _cad.code + '\n```' });
      }
      const resp = await fetch('/api/cad-code', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ prompt, history })
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error((data && data.error) || ('HTTP ' + resp.status));
      const reply = (data.reply || '').trim();
      const code = (data.code || '').trim();
      _cad.chat[_cad.chat.length - 1] = { role: 'assistant', content: reply || 'No reply.' };
      cadAiRenderLog();
      if (code) {
        cadRunFromCurrent(code);
      } else {
        cadSetStatus('No code in the reply.', 'error');
      }
    } catch (err) {
      _cad.chat[_cad.chat.length - 1] = { role: 'assistant', content: 'Error: ' + (err.message || err) };
      cadAiRenderLog();
      cadSetStatus('AI request failed.', 'error');
    }
  }
