    document.querySelectorAll('.cad-side-tab').forEach(b => {
      b.addEventListener('click', () => cadSetMode(b.dataset.cadMode));
    });
    document.getElementById('cadBtnExportStl').addEventListener('click', cadExportStl);
    document.getElementById('cadBtnExport3mf').addEventListener('click', cadExport3mf);
    document.getElementById('cadBtnFullscreen').addEventListener('click', cadToggleFullscreen);
    // Escape exits the maximized viewer. Listener is scoped to document but is
    // a no-op when the panel isn't maximized, so it doesn't fight other modals.
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      const panel = document.getElementById('cadPanel');
      if (panel && panel.classList.contains('is-maximized')) {
        e.preventDefault();
        cadToggleFullscreen();
      }
    });
    document.getElementById('cadBtnRun').addEventListener('click', () => {
      // Regen every scene object — useful after a transient error, or to
      // refresh everything after editing a template's params heavily.
      let n = 0;
      _cad.objects.forEach(o => { try { cadRegenObject(o); n++; } catch (_) {} });
      cadSetStatus(n ? `Rendered ${n} shape${n === 1 ? '' : 's'}.` : 'Scene is empty — drop a shape first.', n ? 'good' : 'error');
    });
    document.getElementById('cadBtnClear').addEventListener('click', cadClearScene);
    document.getElementById('cadBtnCenter').addEventListener('click', cadFitAll);
    // Keyboard shortcuts: Delete to remove selected, T/R to switch gizmo mode,
    // Escape to deselect (Escape on maximized panel is handled elsewhere).
    document.addEventListener('keydown', (e) => {
      // Don't intercept while the student is typing into a number input or
      // the AI textarea.
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (e.key === 'Delete' || e.key === 'Backspace') {
        if (_cad.selectedId != null) { e.preventDefault(); cadDeleteObject(_cad.selectedId); }
      } else if (e.key === 't' || e.key === 'T') {
        _cad.gizmoMode = 'translate';
        if (_cad.gizmo && _cad.selectedId != null) _cad.gizmo.setMode('translate');
      } else if (e.key === 'r' || e.key === 'R') {
        _cad.gizmoMode = 'rotate';
        if (_cad.gizmo && _cad.selectedId != null) _cad.gizmo.setMode('rotate');
      } else if (e.key === 'Escape') {
        if (_cad.selectedId != null) cadDeselect();
      }
    });
    document.querySelectorAll('#cadViewPad [data-cad-view]').forEach(b => {
      b.addEventListener('click', () => cadSetView(b.dataset.cadView));
    });

    // Render the sidebar UI right away so the palette is visible while the
    // 3D engine boots. Scene starts empty — student drops the first shape.
    cadSetMode(_cad.mode || 'wizard');
    cadLoadEngine().then(() => {
      cadBuildScene(document.getElementById('cadViewer'));
      const loading = document.getElementById('cadViewerLoading');
      if (loading) loading.remove();
    }).catch((err) => {
      cadSetStatus('Engine failed: ' + (err.message || err), 'error');
    });
  }

  // Syllabus page — informational context for the course. Lives outside the
  // four nav pills (which are app surfaces). Drop real syllabus copy or a
  // remote URL in here as the course solidifies; for now it's placeholder
  // structure aligned with the four-project sequence.
  // ============== EXHIBIT page render ==============
  // A quiet, dedicated wall of past student assistive-tech work: websites,
  // Instructables, builds, videos. Students see gorgeous read-only cards that
  // link out to the real work. Admin (?admin token) gets an add form + delete.
  function exhibitHostLabel(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); }
    catch (_) { return 'Open'; }
  }

  function renderExhibit() {
    app.innerHTML = '';
    const wrap = document.createElement('section');
    wrap.className = 'exhibit';
    wrap.innerHTML = `
      <a href="/" class="exhibit-back nav-link">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        <span>Back</span>
      </a>
      <div class="exhibit-hero">
        <p class="exhibit-eyebrow">Exhibit</p>
      </div>

      <form class="exhibit-admin" id="exAdminForm" autocomplete="off">
        <h3>Add work to the Exhibit</h3>
        <p class="ex-admin-hint">Admin only. Title and link are required; everything else is optional.</p>
        <div class="ex-fields">
          <div>
            <label for="exTitle">Title</label>
            <input id="exTitle" type="text" maxlength="120" placeholder="e.g. One-Handed Keyboard Mount" required>
          </div>
          <div>
            <label for="exMaker">Maker &amp; year</label>
            <input id="exMaker" type="text" maxlength="80" placeholder="e.g. Maya R. · 2024">
          </div>
          <div>
            <label for="exType">Type</label>
            <input id="exType" type="text" maxlength="32" list="exTypeList" placeholder="Website, Instructable, Build…">
            <datalist id="exTypeList">
              <option value="Website"></option>
              <option value="Instructable"></option>
              <option value="App"></option>
              <option value="Build"></option>
              <option value="Video"></option>
              <option value="Doc"></option>
            </datalist>
          </div>
          <div>
            <label for="exLink">Link (URL)</label>
            <input id="exLink" type="url" maxlength="500" placeholder="https://…" required>
          </div>
          <div class="ex-full">
            <label for="exImage">Image URL (optional)</label>
            <input id="exImage" type="url" maxlength="500" placeholder="https://… a screenshot or photo of the work">
          </div>
          <div class="ex-full">
            <label for="exBlurb">Short blurb (optional)</label>
            <textarea id="exBlurb" maxlength="240" placeholder="One line on what it is and who it helps."></textarea>
          </div>
        </div>
        <div class="ex-add-row">
          <span class="ex-add-msg" id="exAddMsg"></span>
          <button type="submit" class="ex-add-btn" id="exAddBtn">Add to Exhibit</button>
        </div>
      </form>

      <div class="exhibit-grid" id="exGrid">
        <div class="exhibit-empty">Loading…</div>
      </div>
    `;
    app.appendChild(wrap);

    const grid = wrap.querySelector('#exGrid');

    function cardHtml(item) {
      const id = item.id;
      const title = escapeHtml(item.title || 'Untitled');
      const maker = item.maker ? `<div class="exhibit-maker">${escapeHtml(item.maker)}</div>` : '';
      const blurb = item.blurb ? `<div class="exhibit-blurb">${escapeHtml(item.blurb)}</div>` : '';
      const type = item.type ? `<span class="exhibit-type">${escapeHtml(item.type)}</span>` : '';
      const initial = escapeHtml((item.title || '?').trim().charAt(0).toUpperCase() || '?');
      const img = item.image
        ? `<img src="${escapeHtml(item.image)}" alt="" loading="lazy" onerror="this.style.display='none'">`
        : '';
      const host = escapeHtml(exhibitHostLabel(item.url || ''));
      const href = escapeHtml(item.url || '#');
      return `
        <a class="exhibit-card" href="${href}" target="_blank" rel="noopener noreferrer" data-ex-id="${escapeHtml(id)}">
          <button class="exhibit-del" type="button" data-ex-del="${escapeHtml(id)}" aria-label="Delete">×</button>
          <div class="exhibit-thumb">
            <div class="ex-fallback">${initial}</div>
            ${img}
            ${type}
          </div>
          <div class="exhibit-body">
            <div class="exhibit-card-title">${title}</div>
            ${maker}
            ${blurb}
            <span class="exhibit-visit">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
              ${host}
            </span>
          </div>
        </a>
      `;
    }

    async function load() {
      try {
        const snap = await getDocs(query(collection(db, 'exhibit'), orderBy('createdAt', 'desc')));
        const items = [];
        snap.forEach(d => items.push({ id: d.id, ...d.data() }));
        if (!items.length) {
          grid.innerHTML = `<div class="exhibit-empty">${isAdmin ? 'No work here yet — add the first piece above.' : 'Past student work will appear here soon.'}</div>`;
          return;
        }
        grid.innerHTML = items.map(cardHtml).join('');
      } catch (err) {
        grid.innerHTML = `<div class="exhibit-empty">Could not load the Exhibit. ${escapeHtml(err && err.message || '')}</div>`;
      }
    }

    // Delete (admin) — intercept the click before the card's link fires.
    grid.addEventListener('click', async (e) => {
      const del = e.target.closest('[data-ex-del]');
      if (!del) return;
      e.preventDefault();
      e.stopPropagation();
      if (!isAdmin) return;
      if (!confirm('Remove this piece from the Exhibit?')) return;
      try {
        await deleteDoc(doc(db, 'exhibit', del.dataset.exDel));
        const card = del.closest('.exhibit-card');
        if (card) card.remove();
        if (!grid.querySelector('.exhibit-card')) {
          grid.innerHTML = `<div class="exhibit-empty">No work here yet — add the first piece above.</div>`;
        }
      } catch (err) {
        alert('Could not delete: ' + (err && err.message || err));
      }
    });

    // Add (admin)
    if (isAdmin) {
      const form = wrap.querySelector('#exAdminForm');
      const btn = wrap.querySelector('#exAddBtn');
      const msg = wrap.querySelector('#exAddMsg');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = wrap.querySelector('#exTitle').value.trim();
        const url = wrap.querySelector('#exLink').value.trim();
        if (!title || !url) { msg.textContent = 'Title and link are required.'; return; }
        const data = {
          title,
          url,
          maker: wrap.querySelector('#exMaker').value.trim(),
          type: wrap.querySelector('#exType').value.trim(),
          image: wrap.querySelector('#exImage').value.trim(),
          blurb: wrap.querySelector('#exBlurb').value.trim(),
          createdAt: serverTimestamp()
        };
        btn.disabled = true;
        msg.textContent = 'Adding…';
        try {
          await addDoc(collection(db, 'exhibit'), data);
          form.reset();
          msg.textContent = 'Added.';
          await load();
          setTimeout(() => { msg.textContent = ''; }, 1800);
        } catch (err) {
          msg.textContent = 'Could not add: ' + (err && err.message || err);
        } finally {
          btn.disabled = false;
        }
      });
    }

    load();
  }

  function applyRoute(path) {
    const r = (path || '').replace(/\/+$/, '');
    document.body.classList.remove('view-home', 'view-hw', 'view-progress', 'view-tools', 'view-tools-detail', 'view-syllabus', 'view-exhibit');
    if (r === '/exhibit') {
      document.body.classList.add('view-exhibit');
      renderExhibit();
    } else if (r === '/syllabus') {
      document.body.classList.add('view-syllabus');
      renderSyllabus();
    } else if (r === '/hw') {
      document.body.classList.add('view-hw');
      renderHomework();
    } else if (r === '/progress') {
      document.body.classList.add('view-progress');
      renderProgress();
    } else if (r === '/tools/vibe') {
      document.body.classList.add('view-tools');
      initVibeCodingTool();
    } else if (r === '/tools/schematic') {
      document.body.classList.add('view-tools');
      initSchematicTool();
    } else if (r === '/tools/idea-board') {
      document.body.classList.add('view-tools');
      initIdeaBoardTool();
    } else if (r === '/tools') {
      document.body.classList.add('view-tools');
      renderTools();
    } else {
      document.body.classList.add('view-home');
      renderProjects();
    }
    window.scrollTo(0, 0);
    // Every navigation is a cheap moment to notice a new deploy.
    if (typeof checkForUpdate === 'function') checkForUpdate().catch(() => {});
  }

  // Intercept top-nav links so navigation feels instant. Only intercept
  // same-origin internal routes; external/admin links go through normal
  // navigation.
  document.addEventListener('click', (e) => {
    const a = e.target && e.target.closest && e.target.closest('a');
    if (!a) return;
    if (!(a.classList.contains('nav-link') || a.classList.contains('header-title-link'))) return;
    const href = a.getAttribute('href') || '';
    if (!href.startsWith('/')) return;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
    e.preventDefault();
    if (location.pathname !== href) history.pushState({}, '', href);
    applyRoute(href);
  });
  window.addEventListener('popstate', () => applyRoute(location.pathname));

  // ---- Stale-tab guard ----
  // The app is a single-page app: navigating inside it never re-downloads
  // index.html, so an open tab can silently run code from an old deploy. We
  // snapshot the served index.html ETag at boot, then re-check on a timer and
  // on every route change; when it differs, a "Refresh now" banner appears.
  // Declared before the first applyRoute() call so checkForUpdate() (invoked
  // from applyRoute) never hits the temporal dead zone.
  let _loadedEtag = null;
  let _updateBannerShown = false;
  async function _fetchIndexEtag() {
    try {
      const r = await fetch('/index.html', { method: 'HEAD', cache: 'no-store' });
      return r.headers.get('etag') || r.headers.get('last-modified') || null;
    } catch (_) { return null; }
  }
  async function checkForUpdate() {
    if (_updateBannerShown) return;
    const cur = await _fetchIndexEtag();
    if (!cur) return;
    if (_loadedEtag == null) { _loadedEtag = cur; return; }
    if (cur !== _loadedEtag) showUpdateBanner();
  }
  function showUpdateBanner() {
    if (_updateBannerShown || document.getElementById('updateBanner')) return;
    _updateBannerShown = true;
    const bar = document.createElement('div');
    bar.id = 'updateBanner';
    bar.innerHTML = '<span>A newer version of this page is available.</span>' +
      '<button type="button" id="updateBannerBtn">Refresh now</button>';
    document.body.appendChild(bar);
    const btn = document.getElementById('updateBannerBtn');
    if (btn) btn.addEventListener('click', () => location.reload());
  }
  try {
    _fetchIndexEtag().then(e => { _loadedEtag = e; });
    setInterval(() => { checkForUpdate().catch(() => {}); }, 90000);
  } catch (_) {}

  applyRoute(location.pathname);
  // Pull initial counts via getCountFromServer (1 read per benchmark).
  loadInitialCounts();
  // Deep link to an archive: ?admin=ramsey-d4sg&archive=2026-04-15T12-34-56
  if (isAdmin) {
    const archiveDeepLink = urlParams.get('archive');
    if (archiveDeepLink) {
      // Defer slightly so projects render first.
      setTimeout(() => openArchiveDetail(archiveDeepLink, null), 50);
    }
  }
